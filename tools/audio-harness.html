<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>FOOTFALL — audio harness</title>
<link rel="icon" href="data:,">
<!--
  Records the whole soundtrack to a file.

  Audio you cannot listen back to is audio you are writing blind, and the
  screenshotter proves nothing about it beyond "no exceptions thrown". This
  drives the real createAudio() through every phase and every effect in order,
  into a MediaStreamDestination, and hands back a webm.
-->
</head>
<body style="font:14px system-ui;padding:20px">
<pre id="log">idle</pre>
<script type="module">
import { createAudio } from '../src/audio.js';

const log = (m) => { document.getElementById('log').textContent += `\n${m}`; };

window.recordAudio = async (plan) => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const probe = new AC();
  const tap = probe.createMediaStreamDestination();
  // Measure as well as record: a silent file and a loud one look identical
  // from the outside, and "it did not throw" is not "it made a sound".
  const analyser = probe.createAnalyser();
  analyser.fftSize = 2048;
  const audio = createAudio({ context: probe, destination: tap });
  // Tee the same stream into an analyser: a silent file and a loud one look
  // identical from the outside.
  const src = probe.createMediaStreamSource(tap.stream);
  src.connect(analyser);

  const rec = new MediaRecorder(tap.stream, { mimeType: 'audio/webm' });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise((res) => { rec.onstop = res; });
  rec.start();

  audio.unlock();
  const buf = new Float32Array(analyser.fftSize);
  const spec = new Float32Array(analyser.frequencyBinCount);
  const levels = [];
  let currentPhase = 'title';
  const meter = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; let peak = 0;
    for (const v of buf) { sum += v * v; peak = Math.max(peak, Math.abs(v)); }
    // Spectral centroid: the single number that says "bright" or "muffled",
    // which is exactly what the phase mix is supposed to be moving.
    analyser.getFloatFrequencyData(spec);
    let num = 0; let den = 0;
    const binHz = probe.sampleRate / analyser.fftSize;
    for (let i = 1; i < spec.length; i++) {
      const mag = 10 ** (spec[i] / 20);
      num += mag * i * binHz;
      den += mag;
    }
    levels.push([Math.sqrt(sum / buf.length), peak, den > 0 ? num / den : 0, currentPhase]);
  }, 100);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (const step of plan) {
    if (step.phase) { audio.setPhase(step.phase); currentPhase = step.phase; log(`phase ${step.phase}`); }
    if (step.frenzy != null) audio.setFrenzy(step.frenzy);
    if (step.call) { audio[step.call](...(step.args || [])); log(`fx ${step.call}`); }
    await wait(step.ms || 500);
  }

  clearInterval(meter);
  rec.stop();
  await done;
  audio.stop();

  const blob = new Blob(chunks, { type: 'audio/webm' });
  const b64 = await new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });

  // Also hand back a plain WAV. Opus in a webm is fine in a browser and a
  // coin toss everywhere else, and the point of recording it is that somebody
  // can listen.
  const decoded = await probe.decodeAudioData(await blob.arrayBuffer());
  const wavB64 = encodeWav(decoded);
  const rms = levels.map((l) => l[0]);
  const peaks = levels.map((l) => l[1]);
  // Per phase, so "same song, different mix" is something measured rather than
  // something claimed.
  const byPhase = {};
  for (const [r, , cen, ph] of levels) {
    (byPhase[ph] ||= { n: 0, rms: 0, cen: 0 });
    byPhase[ph].n++; byPhase[ph].rms += r; byPhase[ph].cen += cen;
  }
  for (const k of Object.keys(byPhase)) {
    byPhase[k].rms /= byPhase[k].n;
    byPhase[k].cen /= byPhase[k].n;
  }
  return {
    wavB64,
    byPhase,
    b64,
    bytes: blob.size,
    silentFrames: rms.filter((v) => v < 0.0008).length,
    frames: rms.length,
    meanRms: rms.reduce((a, b) => a + b, 0) / Math.max(1, rms.length),
    maxRms: Math.max(...rms),
    maxPeak: Math.max(...peaks),
    clipped: peaks.filter((v) => v >= 0.999).length,
  };
};
/** Mono 16-bit PCM. Small enough to hand back through the bridge. */
function encodeWav(buf) {
  const n = buf.length;
  const chans = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
  const out = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, sv) => { for (let i = 0; i < sv.length; i++) out.setUint8(o + i, sv.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * 2, true);
  out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    let v = 0;
    for (const ch of chans) v += ch[i];
    v = Math.max(-1, Math.min(1, v / chans.length));
    out.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
  }
  let bin = '';
  const bytes = new Uint8Array(out.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

log('ready');
</script>
</body>
</html>
