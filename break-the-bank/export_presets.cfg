; Export targets for Break the Bank.
;
; Every desktop preset embeds the PCK, so each build is one self-contained file
; with no sidecar data and nothing to fetch at launch. Content, audio and fonts
; all live inside it — the audio cues are synthesised at runtime rather than
; streamed, so a first launch offline behaves exactly like any other.

