name: Break the Bank

on:
  push:
    paths:
      - "break-the-bank/**"
      - ".github/workflows/godot.yml"
  pull_request:
    paths:
      - "break-the-bank/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"
  GDUNIT_VERSION: "v5.0.5"
  PROJECT_DIR: break-the-bank

jobs:
  simulate:
    name: Headless tests and balance batch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install GdUnit4
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MikeSchulze/gdUnit4/archive/refs/tags/${GDUNIT_VERSION}.zip" -o /tmp/gdunit.zip
          unzip -q /tmp/gdunit.zip -d /tmp/gdunit
          mv /tmp/gdunit/gdUnit4-*/addons/gdUnit4 "${PROJECT_DIR}/addons/gdUnit4"

      # The first headless run builds the .godot/ import cache; it is expected to
      # report missing imports, so its exit code is not the signal we check.
      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --import --quit-after 200 || true

      # GdUnit4 refuses to start under --headless without this flag (exit 103).
      # These suites never touch InputEvent, which is the only thing it guards.
      - name: Run test suites
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode --continue -a tests

      - name: Run balance batch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p reports
          godot --headless --path . --script res://tools/casino_lab/run_lab.gd -- \
            --runs=5000 --seed=1 --out=res://reports/balance_report.json

      # An audio asset with no licence row is a release blocker, not a warning.
      - name: Audit audio licences
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --path . --script res://tools/audio/audit.gd -- --strict

      - name: Upload balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: ${{ env.PROJECT_DIR }}/reports/balance_report.json
          if-no-files-found: warn

  static-check:
    name: GDScript parse check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # project.godot promotes untyped declarations to errors, so a clean
      # headless boot is the strict-typing gate.
      # A const initialised with a packed-array constructor is not a constant
      # expression: the class fails to load, and only code that touches it
      # notices. Check every script, not just what the main scene reaches.
      - name: Parse every script
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          godot --headless --import --quit-after 200 || true
          failed=0
          while IFS= read -r script; do
            rel="${script#./}"
            if godot --headless --check-only --script "res://$rel" 2>&1 | grep -qE "Parse Error|Failed to load script"; then
              echo "::error file=${PROJECT_DIR}/$rel::script fails to parse"
              failed=1
            fi
          done < <(find scripts tools tests -name '*.gd')
          exit $failed

      - name: Boot the project headless
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --import --quit-after 200 || true
          godot --headless --check-only --script scripts/simulation/sim_engine.gd
          godot --headless --quit-after 30 2>&1 | tee boot.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" boot.log; then
            echo "::error::script errors during headless boot"
            exit 1
          fi

  package:
    name: Package playable builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # The export templates are the platform runtimes each build is wrapped
      # around. Cached because they are a 1.2 GB download.
      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL "$url" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # An APK has to be signed to install at all. Godot signs with the debug
      # keystore, which needs the JDK and the Android SDK's build-tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Generate the debug keystore
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      # Godot reads the SDK path and keystore from editor settings, not the
      # project, so they are written into a throwaway editor profile here.
      - name: Point Godot at the Android toolchain
        run: |
          set -euo pipefail
          settings_dir="$HOME/.config/godot"
          mkdir -p "$settings_dir"
          cat > "$settings_dir/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --import --quit-after 200 || true

      - name: Build every target
        working-directory: ${{ env.PROJECT_DIR }}
        run: tools/package/build.sh

      # A zero-byte or missing output means the export silently failed; the
      # build script already checks that, so this is the shape check.
      - name: Check the builds are real
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          for f in dist/linux/BreakTheBank.x86_64 dist/windows/BreakTheBank.exe \
                   dist/android/BreakTheBank.apk dist/macos/BreakTheBank.zip \
                   dist/web/index.wasm dist/web/index.pck; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
            echo "ok  $(du -h "$f" | cut -f1)  $f"
          done
          unzip -l dist/android/BreakTheBank.apk | grep -q "META-INF" \
            || { echo "::error::APK is unsigned"; exit 1; }

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: breakthebank-desktop
          path: |
            ${{ env.PROJECT_DIR }}/dist/linux/BreakTheBank.x86_64
            ${{ env.PROJECT_DIR }}/dist/windows/BreakTheBank.exe
            ${{ env.PROJECT_DIR }}/dist/macos/BreakTheBank.zip

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: breakthebank-android
          path: ${{ env.PROJECT_DIR }}/dist/android/BreakTheBank.apk

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: breakthebank-web
          path: ${{ env.PROJECT_DIR }}/dist/web
