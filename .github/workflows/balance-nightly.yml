# The nightly balance batch: 10,000 runs against the shipped bands.
#
# The push workflow judges a 5,000-run batch on every commit. This one runs the
# full 10,000 at a fixed seed every night, keeps the report, and fails — which
# is the alarm — when the game has moved outside resources/rules/balance_bands.tres.
# It compares against the previous night's report where one is kept, so the log
# says how far the numbers moved and not only where they are.
#
# GitHub only schedules workflows from the default branch, so this runs on a
# timer once the game has merged; until then, run it by hand from the Actions
# tab with "Run workflow", which works on any branch.
name: Balance nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs in the batch"
        default: "10000"
        required: false

env:
  GODOT_VERSION: "4.4.1"
  PROJECT_DIR: break-the-bank

jobs:
  batch:
    name: 10k batch and gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --import --quit-after 200 || true

      # Last night's report, if the cache still has it, so the gate can print
      # the delta. A cache miss only costs the delta line.
      - name: Restore the previous report
        id: previous
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT_DIR }}/reports/previous_report.json
          key: balance-nightly-previous-${{ github.run_id }}
          restore-keys: balance-nightly-previous-

      - name: Run the batch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p reports
          godot --headless --path . --script res://tools/casino_lab/run_lab.gd -- \
            --runs=${{ github.event.inputs.runs || '10000' }} --seed=1 \
            --out=res://reports/balance_report.json

      - name: Gate the batch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          previous=""
          if [ -f reports/previous_report.json ]; then
            previous="--previous=res://reports/previous_report.json"
          fi
          godot --headless --path . --script res://tools/casino_lab/gate.gd -- \
            --report=res://reports/balance_report.json $previous

      - name: Keep tonight's report for tomorrow's delta
        if: always()
        run: cp "${PROJECT_DIR}/reports/balance_report.json" "${PROJECT_DIR}/reports/previous_report.json"

      - name: Save the report for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT_DIR }}/reports/previous_report.json
          key: balance-nightly-previous-${{ github.run_id }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-nightly-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/reports/balance_report.json
          if-no-files-found: warn
