st hit|marginalis)"],"tier":"core"},{"text":"Holds a position without being polemical","cues":["(I think|my view|although|however|on balance|there is (a )?(case|argument)|complicat)"],"tier":"core"},{"text":"Says what psychologists can actually DO about it","cues":["(we can|psychologists (can|could)|evidence|evaluat|advocat|design|redesign|target|reach)"],"tier":"core"},{"text":"Connects to the psychological evidence on the social determinants of distress","cues":["(social determinant|poverty|housing|inequalit|material|debt|deprivation|marmot)"],"tier":"advanced"}],"followups":["What might that mean for a trainee?","What can clinical psychology do in the face of austerity?","How do we overcome the challenges to implementing the evidence base?","What will the impact be to psychology if we don't find time to do research?","What did you feel was the most important aspect of the Berwick report, and how would you disseminate it?"],"failure":"Vague dismay about cuts and waiting lists. The TIPS document from a successful candidate advises having an opinion 'that's not too strong' — a position you can defend, held with some complexity.","shape":"Name one policy you actually know → the mechanism by which it changes clinical work → who bears the cost → your position, held with complexity → what psychologists can do about it. Prepare TWO: one UK-wide, one specific to your course's nation. For Cardiff, know that Wales has its own strategy and legislation and that 'what's different about Wales' is asked repeatedly."},{"id":"diversity","label":"Difference, diversity and inequality","why":"Exeter 2012 asks what diversity means and what it implies for the profession; Birmingham 2018 asks about diversity and difference including deafness; Plymouth 2013 asks for an example of adapting practice, and how your own values and background affect your work; South Wales asks a diversity question from a service user panellist.","mode":"3min","concepts":["cultural_humility","structural_racism","access_inequality","equity_equality","intersectionality","adaptation","power_relations"],"listen":[{"text":"Moves beyond 'culture matters' to a specific mechanism","cues":["(mechanism|specifically|for example|because|the way (that|in which)|what (that|this) means in practice)"],"tier":"core"},{"text":"Names structural factors, not only individual attitudes","cues":["(structural|institution|access|pathway|referral|detention|system|poverty|racism|barrier)"],"tier":"core"},{"text":"Distinguishes cultural humility from cultural competence","cues":["(humilit|not (about )?(knowing|expertise)|the person is the expert|lifelong|competence)"],"tier":"core"},{"text":"Reflects on their OWN position and its effects","cues":["(my (own )?(background|position|assumptions|privilege|whiteness|class)|how I (am|might be) (seen|read)|what I bring)"],"tier":"core"},{"text":"Gives a concrete adaptation with a rationale","cues":["(adapt|changed|interpret|format|pace|setting|involved|different)","because|so that|since"],"tier":"core"},{"text":"Names equity rather than equality","cues":["(equit|according to need|same (service|offer) (is|does) not)"],"tier":"advanced"},{"text":"Considers intersection rather than single categories","cues":["(intersect|both|multiple|combination|not just|as well as being)"],"tier":"advanced"}],"followups":["What implications does this have for clinical psychology?","How do you think your values and background may affect your practice?","What does stigma mean to you, and how would your values address this?","How do you work with difference and diversity?","A clinician interprets a patient's disengagement as poor motivation. What alternative contextual explanations would you consider?"],"failure":"Warm generality. 'Everyone is an individual and I'd be curious about their culture' passes for an answer but distinguishes nobody. The move that lands is naming a specific structural mechanism and one concrete thing you would do differently.","shape":"One specific mechanism (who gets referred, who gets detained, who drops out, and why) → structural rather than attitudinal → my own position and its effects → one concrete adaptation with its rationale → equity rather than equality. Have a real example of adapting your own practice ready."},{"id":"motivation","label":"Why clinical psychology, and why you","why":"Asked everywhere. Birmingham 2019 asks how personal experiences, positive AND negative, led you here. Exeter 2013 and 2012 ask directly. South Wales asks what you would add to your application form. Cardiff asks what experience makes you ready to train.","mode":"3min","concepts":["scientist_practitioner","reflective_practice","mdt"],"listen":[{"text":"Gives something specific rather than a vocation narrative","cues":["(specific|for example|when I|there was|a (client|patient|person)|in my (role|job))"],"tier":"core"},{"text":"Connects to what clinical psychology actually is, in its breadth","cues":["(formulation|research|evidence|systems|consultation|breadth|not just therapy|scientist)"],"tier":"core"},{"text":"Handles personal experience with boundaried openness where they choose to use it","cues":["(personal|my own|family|experience of)"],"tier":"advanced"},{"text":"Shows they know what they are letting themselves in for","cues":["(difficult|demanding|hard|challenge|not (easy|glamorous)|realistic|cost)"],"tier":"core"},{"text":"Says what they would bring, not only what they want","cues":["(I bring|I would (bring|contribute|offer)|what I (have|can offer))"],"tier":"core"},{"text":"Course-specific: connects to THIS course's ethos, research or model","cues":["(this course|here|your (course|programme|department)|research (here|interest)|why (cardiff|ucl|uea|wales))"],"tier":"core"}],"followups":["Why this course?","Why do you want to train in Wales?","How have your personal experiences, both positive and negative, led you to clinical psychology?","What experience have you got which makes you ready to train?","The application form can be constricting — what would you like to add?","How would you juggle the demands and manage the pressures of the course?"],"failure":"The origin story with no specificity, or the answer that could be given to any of the four courses. Cardiff asks 'why Wales' explicitly; a generic answer there is very visible.","shape":"One specific thing that happened, briefly → what it made you understand about the work → what you have since learned about the breadth of the role → what you would bring → why THIS course specifically. Write the last section separately for each of your four courses."},{"id":"group_task","label":"Group discussion tasks","why":"Coventry splits candidates into groups to discuss set clinical topics before a panel including a service user. Exeter shows a video of a service user's experience of depression — WITH that person in the room — and asks the group questions in turn. You are assessed on how you work with others, not on being right.","mode":"3min","concepts":["mdt","service_user_involvement","power_relations","validation"],"listen":[{"text":"Brings others in, especially anyone who has not spoken","cues":["(bring (them|others) in|what do you think|invite|hasn't (spoken|said)|others|space for)"],"tier":"core"},{"text":"Builds on what someone else said rather than restarting","cues":["(building on|picking up|as (x|someone) said|adding to|that made me think)"],"tier":"core"},{"text":"Disagrees without dismissing","cues":["(I see it differently|another way|although|I wonder whether|not sure I agree|but also)"],"tier":"core"},{"text":"Addresses the service user in the room as a person, not a case","cues":["(you|your experience|ask (you|them)|directly|thank you for)"],"tier":"core"},{"text":"Contributes substance, not only process management","cues":["(I think|my view|the evidence|research|because)"],"tier":"core"},{"text":"Watches the time and the task","cues":["(time|we should|move on|cover|the question was|come back to)"],"tier":"advanced"}],"followups":["Why do you think I found couples therapy more helpful than individual therapy?","What do you think my experience of having suicidal thoughts was?","What would someone experiencing depression for the first time understand by the term 'recovery'?","Why do you think I have not got better despite lots of therapy and medication? How do you think that would feel?","The role of service users in developing clinical psychology training programmes.","The need for personal therapy during training — is it essential?"],"failure":"Two opposite failures: dominating, and disappearing. A third, specific to the Exeter format — talking ABOUT the service user in the room in the third person while they sit there.","shape":"Speak early so you are not silent, then make your next contribution one that brings someone else in. If a service user is present and the question is about their experience, address them directly and ask rather than theorise. Exeter's write-up notes candidates were 'encouraged to fulfil your potential' — the panel wants everyone to speak, so helping that happen is scored positively."},{"id":"roleplay_prep","label":"Role-play","why":"Glasgow gives four possible colleague scenarios a week ahead — deliberately designed so no career path is advantaged — and states the aim explicitly: establish the circumstances and understand the colleague's reaction. There is NO expectation you resolve the problem. Southampton has you play a college counsellor meeting a student with exam stress, assessing engagement and brief formulation. Cardiff role-plays joining a new MDT.","mode":"3min","concepts":["therapeutic_alliance","validation","use_of_self","dual_relationship","rupture_repair"],"listen":[{"text":"Does not try to solve the problem","cues":["(not (my job|to (fix|solve))|resist|understand first|explore|before (fixing|advising))"],"tier":"core"},{"text":"Opens the space rather than interrogating","cues":["(open question|tell me|what('s| is) (been )?(happening|going on)|how (has|have)|where (would|do) you want)"],"tier":"core"},{"text":"Reflects content AND feeling back","cues":["(sounds|it seems|I('m| am) hearing|that must|reflect|so what (you're|you are) saying)"],"tier":"core"},{"text":"Validates before moving on","cues":["(makes sense|understandab|no wonder|of course|anyone (would|might)|not surprising)"],"tier":"core"},{"text":"Stays with the person's experience rather than the facts of the incident","cues":["(how (that|it) (felt|was|landed)|for you|your (reaction|experience)|what (that|it) was like)"],"tier":"core"},{"text":"Checks rather than assumes","cues":["(have I got|is that right|does that fit|am I understanding|correct me)"],"tier":"core"},{"text":"Manages own reaction and role boundary — a peer, not a therapist","cues":["(colleague|peer|equal|not (their|your) (therapist|supervisor)|role|boundar)"],"tier":"advanced"},{"text":"Closes by asking what would be useful, rather than prescribing it","cues":["(what would (be )?(help|useful)|what do you want|where (do|would) you want to (take|go)|would it help)"],"tier":"advanced"}],"followups":["What was the presenting issue for the client?","How could you see the intervention moving forward with this client?","Was there anything about your performance you felt could be improved? What? How?","How did you find that?"],"failure":"Rushing to advice. Under pressure candidates fill silence with suggestions, which is precisely what Glasgow's brief says is NOT required. The second failure is treating a peer as a patient.","shape":"Open → listen → reflect content and feeling → validate → stay with their experience not the incident → check your understanding → ask what would help. Say almost nothing in the first ninety seconds beyond open questions. Southampton's write-up is reassuring on this: 'once the conversation started I actually forgot I was being observed'."},{"id":"uncertainty","label":"Not knowing","why":"The TIPS document from a successful candidate is unambiguous: 'Don't worry if you don't know the answer — openly reflect on your difficulties and acknowledge any limitations openly. State what you would do to find out.' This is a scored competency, not a fallback.","mode":"3min","concepts":["scientist_practitioner","supervision","reflective_practice","hypothesis_testing"],"listen":[{"text":"Says plainly that they do not know, without collapsing","cues":["(I don't know|I'm not (sure|certain)|I haven't (come across|encountered)|that's not something I)"],"tier":"core"},{"text":"Identifies what they DO know that is relevant","cues":["(what I do know|I do know|related|similar|from what I understand|I can say)"],"tier":"core"},{"text":"Offers a reasoned provisional hypothesis, flagged as such","cues":["(my (initial )?(hypothesis|guess|thinking)|I would (imagine|expect|wonder)|provisional|tentativ|might be)"],"tier":"core"},{"text":"States what information would resolve it","cues":["(I would (want|need) to know|would find out|depends on|the question is whether|more information)"],"tier":"core"},{"text":"Names a concrete route to finding out","cues":["(supervis|read|literature|guideline|nice|bps|consult|colleague|ask)"],"tier":"core"},{"text":"Does not bluff","cues":["^(?!.*\\b(obviously|clearly|definitely|certainly)\\b)"],"tier":"advanced"}],"followups":["What don't you know?","What would you do to find out?","So how would you proceed in the meantime?","What would change your mind?"],"failure":"Bluffing. Panels can tell, and a fabricated answer costs more than the gap it was hiding. The other failure is over-apologising and losing the rest of the interview to the one question.","shape":"'I don't know' → 'what I do know that's relevant is…' → 'my provisional thinking would be…' → 'what I'd want to find out is…' → 'and I'd do that by…'. Practise this until it is fluent, because delivered well it demonstrates exactly the professional stance the courses are selecting for. The TIPS document also suggests asking to come back to a question at the end."}],"questions":[{"id":"q001","text":"How does your current role prepare you to train to be a clinical psychologist?","course":"Cardiff","year":2013,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q002","text":"What skills do you have that prepare you to train to be a clinical psychologist?","course":"Cardiff","year":2013,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q003","text":"How would you engage with a service user? What barriers and problems might you encounter?","course":"Cardiff","year":2013,"panel":"personal","theme":"engagement","mode":"3min"},{"id":"q004","text":"What ways do England and Wales differ, NHS-wise? What might this mean for a trainee?","course":"Cardiff","year":2013,"panel":"personal","theme":"policy_context","mode":"3min"},{"id":"q005","text":"How might you check a carer is engaged with a service user's care plan?","course":"Cardiff","year":2013,"panel":"personal","theme":"service_user","mode":"3min"},{"id":"q006","text":"A carer calls to say her husband, who has had a stroke, is not eating or drinking. What would you do?","course":"Cardiff","year":2013,"panel":"personal","theme":"risk_live","mode":"vignette"},{"id":"q007","text":"What are the advantages of involving a service user in training?","course":"Cardiff","year":2013,"panel":"personal","theme":"service_user","mode":"3min"},{"id":"q008","text":"How might a clinical psychologist support someone with physical health problems? What are the limitations in the literature on this?","course":"Cardiff","year":2013,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q009","text":"If you had unlimited funds, what research question would you address?","course":"Cardiff","year":2013,"panel":"academic","theme":"research_design","mode":"3min"},{"id":"q010","text":"Talk about a piece of research or audit you have done. Strengths and limitations?","course":"Cardiff","year":2013,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q011","text":"Talk about a psychological model you have used with a client. Now talk about a different model you could use with the same client. Is there anything else that could have affected this work?","course":"Cardiff","year":2013,"panel":"clinical","theme":"model_switch","mode":"3min"},{"id":"q012","text":"You are working with a medical colleague who is a strong proponent of genetics. How would you persuade him about psychological approaches?","course":"Cardiff","year":2013,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q013","text":"What are the advantages of formulation?","course":"Cardiff","year":2013,"panel":"clinical","theme":"professional_identity","mode":"60s"},{"id":"q014","text":"Tell us about a disagreement you had with a colleague. What do you think they thought your role was?","course":"Cardiff","year":2016,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q015","text":"If I came to you and said I was unhappy or distressed by my diagnosis, what would you do?","course":"Cardiff","year":2016,"panel":"clinical","theme":"engagement","mode":"vignette"},{"id":"q016","text":"With reference to the written test — what values underpinned your answers?","course":"Cardiff","year":2016,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q017","text":"If I was a carer for a person with dementia, how would you show me you respected and valued my viewpoint? How would you make sure I trusted you?","course":"Cardiff","year":2016,"panel":"personal","theme":"service_user","mode":"vignette"},{"id":"q018","text":"Aneurin Bevan wrote about the NHS. What are three things you think are worth fighting for?","course":"Cardiff","year":2016,"panel":"personal","theme":"policy_context","mode":"3min"},{"id":"q019","text":"In what way have your experiences prepared you for training?","course":"Cardiff","year":2016,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q020","text":"How do you think working in rural and urban areas would help you be a better psychologist?","course":"Cardiff","year":2016,"panel":"personal","theme":"diversity","mode":"3min"},{"id":"q021","text":"Why do you think the developmental approach in psychology is important?","course":"Cardiff","year":2016,"panel":"academic","theme":"professional_identity","mode":"3min"},{"id":"q022","text":"The Samaritans reported a rise in young male suicides in rural areas. How would you find out why? How would you design your research if you already had your hypothesis?","course":"Cardiff","year":2016,"panel":"academic","theme":"research_design","mode":"vignette"},{"id":"q023","text":"You can help 4 people to an 80% improvement, or 8 people to 40%. Discuss.","course":"Cardiff","year":2016,"panel":"academic","theme":"ethics_clash","mode":"3min"},{"id":"q024","text":"Tell me about your weakness in research.","course":"Cardiff","year":2012,"panel":"academic","theme":"research_own","mode":"60s"},{"id":"q025","text":"Much is written about positive psychology — what do you think the implications are for clinical psychologists?","course":"Cardiff","year":2012,"panel":"academic","theme":"professional_identity","mode":"3min"},{"id":"q026","text":"Role-play: you are a clinical psychologist in a brand new learning disabilities multidisciplinary team. What would the clinical psychologist bring to the team?","course":"Cardiff","year":2012,"panel":"clinical","theme":"professional_identity","mode":"roleplay"},{"id":"q027","text":"What is the difference between working as a clinical psychologist in Wales as opposed to England?","course":"Cardiff","year":2012,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q028","text":"Talk about the letter-writing exercise. How did you feel it went? On reflection what would you do better, and what would you change?","course":"Cardiff","year":2012,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q029","text":"What can a clinical psychologist do to support a carer?","course":"Cardiff","year":2012,"panel":"personal","theme":"service_user","mode":"3min"},{"id":"q030","text":"What are the benefits and difficulties you would perceive of having service users and patients involved in services, service design or clinical training?","course":"Cardiff","year":2012,"panel":"personal","theme":"service_user","mode":"3min"},{"id":"q031","text":"What are your beliefs and values about service user involvement?","course":"Cardiff","year":2012,"panel":"personal","theme":"service_user","mode":"3min"},{"id":"q032","text":"A carer of a patient with the first signs of degenerative dementia contacts you because the patient is refusing to go to a neurological testing appointment for diagnosis. How would you handle that situation?","course":"Cardiff","year":2012,"panel":"personal","theme":"ethics_clash","mode":"vignette"},{"id":"q033","text":"Talk about a paper you have read recently that has influenced your practice, and how this could be applied in the wider sense of the profession.","course":"Cardiff","year":2012,"panel":"academic","theme":"critical_appraisal","mode":"3min"},{"id":"q034","text":"How would you ensure the study was worthwhile?","course":"Birmingham","year":2019,"panel":"written","theme":"research_design","mode":"3min"},{"id":"q035","text":"You are designing a research study to evaluate a cognitive-behavioural intervention for children and young people experiencing anxiety. What design would you use?","course":"Birmingham","year":2019,"panel":"written","theme":"research_design","mode":"vignette"},{"id":"q036","text":"How would you find out if it had been effective or ineffective?","course":"Birmingham","year":2019,"panel":"written","theme":"research_design","mode":"3min"},{"id":"q037","text":"What other factors would you consider?","course":"Birmingham","year":2019,"panel":"written","theme":"research_design","mode":"3min"},{"id":"q038","text":"How would you find out the scientific merit of a randomised controlled trial for a psychological therapy?","course":"Birmingham","year":2019,"panel":"academic","theme":"critical_appraisal","mode":"3min"},{"id":"q039","text":"Consider links between childhood adverse events and adult wellbeing. Name three psychological theories and how they exert their influence.","course":"Birmingham","year":2019,"panel":"academic","theme":"model_switch","mode":"3min"},{"id":"q040","text":"There are many reasons people want to train as a clinical psychologist. How have your personal experiences, both positive and negative, led you to clinical psychology?","course":"Birmingham","year":2019,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q041","text":"What does stigma mean to you, and how would your values address this as a clinical psychologist?","course":"Birmingham","year":2019,"panel":"personal","theme":"diversity","mode":"3min"},{"id":"q042","text":"A friend tells you they are worried about you and they think you seem to be struggling. What do you say or do?","course":"Birmingham","year":2019,"panel":"personal","theme":"reflective_personal","mode":"vignette"},{"id":"q043","text":"What can clinical psychology offer for university students with stress?","course":"Birmingham","year":2019,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q044","text":"You have picked up a referral to work with an unaccompanied child seeking asylum, placed in a foster home. The family have expressed concerns as the child is behaving aggressively. What factors do you consider?","course":"Birmingham","year":2019,"panel":"clinical","theme":"model_switch","mode":"vignette"},{"id":"q045","text":"Name a psychological model. [Then, only after you answer:] Now name a DIFFERENT psychological model and explain how you would use it to formulate with a client experiencing depression or anxiety.","course":"Birmingham","year":2019,"panel":"clinical","theme":"model_switch","mode":"3min"},{"id":"q046","text":"How have you used CBT before with a client?","course":"Birmingham","year":2018,"panel":"clinical","theme":"clinical_case","mode":"3min"},{"id":"q047","text":"You've been seeing a client for some time and are starting to feel stuck. What factors might you consider?","course":"Birmingham","year":2018,"panel":"clinical","theme":"stuck","mode":"3min"},{"id":"q048","text":"A client messaged you on social media saying they're feeling suicidal. What would you do?","course":"Birmingham","year":2018,"panel":"clinical","theme":"risk_live","mode":"vignette"},{"id":"q049","text":"How do you deal with diversity and differences, including deafness?","course":"Birmingham","year":2018,"panel":"personal","theme":"diversity","mode":"3min"},{"id":"q050","text":"Do you think psychologists need therapy?","course":"Birmingham","year":2018,"panel":"personal","theme":"reflective_personal","mode":"3min"},{"id":"q051","text":"Can you tell me how your experiences have shaped you?","course":"Birmingham","year":2018,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q052","text":"Detail a piece of research you've been heavily involved in — literature, methods, results, discussion.","course":"Birmingham","year":2018,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q053","text":"What is experience sampling methodology, and what are its strengths and weaknesses?","course":"Birmingham","year":2018,"panel":"academic","theme":"research_design","mode":"3min"},{"id":"q054","text":"Can you define abnormality, what factors it may affect, and the implications?","course":"Birmingham","year":2018,"panel":"academic","theme":"professional_identity","mode":"3min"},{"id":"q055","text":"How would you perform a systematic literature review if looking into the effectiveness of mindfulness-based interventions for anxiety?","course":"Coventry & Warwick","year":2018,"panel":"academic","theme":"systematic_review","mode":"3min"},{"id":"q056","text":"How would you measure the quality of the literature?","course":"Coventry & Warwick","year":2018,"panel":"academic","theme":"systematic_review","mode":"3min"},{"id":"q057","text":"Can you talk about a piece of research you have been involved in — design, strengths, limitations?","course":"Coventry & Warwick","year":2018,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q058","text":"Can you talk about an article you have read that has influenced you?","course":"Coventry & Warwick","year":2018,"panel":"academic","theme":"critical_appraisal","mode":"3min"},{"id":"q059","text":"[Handed an abstract: an RCT of CBT and/or befriending control for older women with anxiety, 1–2 minutes to read.] What are the strengths of this study? Limitations? What can you tell us about the effect size?","course":"Coventry & Warwick","year":2018,"panel":"academic","theme":"critical_appraisal","mode":"vignette"},{"id":"q060","text":"What type of research do you prefer?","course":"Coventry & Warwick","year":2018,"panel":"academic","theme":"research_own","mode":"60s"},{"id":"q061","text":"What has brought you to clinical psychology?","course":"Coventry & Warwick","year":2018,"panel":"clinical","theme":"motivation","mode":"3min"},{"id":"q062","text":"If you were to receive a 360-degree appraisal containing feedback about you from your colleagues and supervisor, what would it say?","course":"Coventry & Warwick","year":2018,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q063","text":"What qualities and skills do you feel are important as a leader? Which of these do you have, and what would you need to work on in training?","course":"Coventry & Warwick","year":2018,"panel":"clinical","theme":"leadership","mode":"3min"},{"id":"q064","text":"Can you talk about a time you felt out of your depth?","course":"Coventry & Warwick","year":2018,"panel":"clinical","theme":"stuck","mode":"3min"},{"id":"q065","text":"[After a video of siblings disagreeing about placing their mother in a care home:] What did you think and feel watching this? Who could you relate to more?","course":"Coventry & Warwick","year":2018,"panel":"clinical","theme":"reflective_personal","mode":"vignette"},{"id":"q066","text":"[After a 10-minute recorded therapy session:] What do you think the client is feeling and experiencing? What do you think the therapist is feeling and experiencing? Write out a formulation of the client's difficulties that a layman would understand.","course":"Coventry & Warwick","year":2018,"panel":"written","theme":"formulation_layperson","mode":"vignette"},{"id":"q067","text":"The role of service users in developing clinical psychology training programmes.","course":"Coventry & Warwick","year":2018,"panel":"group","theme":"service_user","mode":"group"},{"id":"q068","text":"The need for personal therapy during training. Is it essential?","course":"Coventry & Warwick","year":2018,"panel":"group","theme":"reflective_personal","mode":"group"},{"id":"q069","text":"Can you talk about a piece of research you have completed — the findings, strengths and limitations, and what you would do differently with hindsight?","course":"Glasgow","year":2018,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q070","text":"[Vignette on reducing substance use behaviours in mental health settings:] What type of research? How would you design your research question? What are the ethical considerations?","course":"Glasgow","year":2018,"panel":"academic","theme":"research_design","mode":"vignette"},{"id":"q071","text":"Can you talk about a paper or article you have learned lessons from, and how you can share these?","course":"Glasgow","year":2018,"panel":"academic","theme":"critical_appraisal","mode":"3min"},{"id":"q072","text":"What are the key skills and knowledge needed as a clinical psychologist? How has your experience prepared you for this?","course":"Glasgow","year":2018,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q073","text":"Can you talk about a government policy and how this impacts on clinical psychology — for example, austerity?","course":"Glasgow","year":2018,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q074","text":"[Reading a BPS statement about respect and integrity:] Can you tell us about a time you have shown respect and integrity?","course":"Glasgow","year":2018,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q075","text":"A colleague has received negative feedback about their timekeeping from your line manager and is unhappy about it. Establish the circumstances and understand their reaction. You are not expected to resolve the problem.","course":"Glasgow","year":2018,"panel":"roleplay","theme":"roleplay_prep","mode":"roleplay"},{"id":"q076","text":"A colleague could not attend a team meeting and has just heard that the team leader re-allocated one of their tasks. They are unhappy about this.","course":"Glasgow","year":2018,"panel":"roleplay","theme":"roleplay_prep","mode":"roleplay"},{"id":"q077","text":"A colleague has been asked to attend an overnight meeting at short notice by your line manager. They feel unable to say no and are worried about giving a poor impression.","course":"Glasgow","year":2018,"panel":"roleplay","theme":"roleplay_prep","mode":"roleplay"},{"id":"q078","text":"A colleague has received feedback from their manager which has affected their decision to apply for a new post. They are uncertain whether to apply and worried about rejection.","course":"Glasgow","year":2018,"panel":"roleplay","theme":"roleplay_prep","mode":"roleplay"},{"id":"q079","text":"Why do you want to be a clinical psychologist?","course":"Exeter","year":2012,"panel":"clinical","theme":"motivation","mode":"60s"},{"id":"q080","text":"How do you think the new Health and Social Care Bill will affect services? And the role of clinical psychology?","course":"Exeter","year":2012,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q081","text":"What does diversity mean? What implications does this have for clinical psychology?","course":"Exeter","year":2012,"panel":"clinical","theme":"diversity","mode":"3min"},{"id":"q082","text":"What do you understand by resilience? Talk about a time your resilience was high. Talk about a time your resilience was low.","course":"Exeter","year":2012,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q083","text":"What do you think service users expect from clinicians?","course":"Exeter","year":2012,"panel":"clinical","theme":"service_user","mode":"3min"},{"id":"q084","text":"Our research interests here are neuropsychology and low mood. How do you think you would fit in here with this?","course":"Exeter","year":2012,"panel":"academic","theme":"motivation","mode":"3min"},{"id":"q085","text":"What do you think leadership is? What skills do you think you would need to be a good leader?","course":"Exeter","year":2012,"panel":"clinical","theme":"leadership","mode":"3min"},{"id":"q086","text":"What was your IV and your DV? What were the problems of the research? What are the theoretical implications? How would you extend this research?","course":"Exeter","year":2012,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q087","text":"How would you go about investigating the impact of parental intervention on the anxiety levels of the child? What measures would you use? What statistics would you consider, and why?","course":"Exeter","year":2012,"panel":"academic","theme":"research_design","mode":"vignette"},{"id":"q088","text":"[Scenario: the mother of a teenage boy you have seen for a year rings, distressed — he has disappeared and may be with an uncle she describes as irresponsible. You have a session with the boy later that day.] How do you manage this? [Then: at the appointment he is in the waiting room with a man in his twenties.] How do you manage this? If, despite your best efforts, the man raised his voice and made others uncomfortable, how might this make you feel?","course":"Exeter","year":2012,"panel":"clinical","theme":"risk_live","mode":"vignette"},{"id":"q089","text":"How would you juggle the demands and manage the pressures of the course?","course":"Exeter","year":2012,"panel":"clinical","theme":"motivation","mode":"3min"},{"id":"q090","text":"If a colleague on the course had failed an assessment and was thinking of quitting to go travelling, and asked your advice, what would you say?","course":"Exeter","year":2012,"panel":"clinical","theme":"roleplay_prep","mode":"vignette"},{"id":"q091","text":"[Video of a service user's experience of depression, with that person in the room:] Why do you think I found couples therapy more helpful than individual therapy? What do you think my experience of having suicidal thoughts was? What would someone experiencing depression for the first time understand by 'recovery'? Why do you think I have not got better despite lots of therapy and medication — and how do you think that would feel?","course":"Exeter","year":2013,"panel":"group","theme":"group_task","mode":"group"},{"id":"q092","text":"Tell us about a piece of completed research you have undertaken. What were the strengths and limitations? What would you do differently? What was the theory underlying your research?","course":"Exeter","year":2013,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q093","text":"[Ethical scenario, chosen from three, read beforehand: a colleague contacts you for advice because a client they are seeing for depression has disclosed that he assisted his mother's suicide.] What do you think the issues are for you, your colleague, and the client? What would you do? [Then: the client is now caring for a terminally ill father with much guilt about his mother.] [Then: the client's sister turns up angry, wanting to complain about you.]","course":"Exeter","year":2013,"panel":"clinical","theme":"ethics_clash","mode":"vignette"},{"id":"q094","text":"How do you experience stress? How do you manage stress?","course":"Exeter","year":2013,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q095","text":"Talk about a problem you experienced. How did you manage it? How did you feel?","course":"Exeter","year":2013,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q096","text":"You and a friend both get onto clinical psychology training. Your friend struggles, feels stressed and wants to drop out. What would you say to them?","course":"Exeter","year":2013,"panel":"clinical","theme":"roleplay_prep","mode":"vignette"},{"id":"q097","text":"Talk about an experience of multidisciplinary team working. What skills did you need?","course":"Exeter","year":2013,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q098","text":"Describe a piece of academic or service-related research you have been involved in. Discuss the implications, outcomes and challenges of relating this to the modern-day NHS.","course":"Exeter","year":2011,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q099","text":"Talk about a time you have shown resilience in your personal or professional life. What did you learn? What skills did you need?","course":"Exeter","year":2011,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q100","text":"What is your understanding of the scientist-practitioner model? Talk about a time you have used it. Do you have any criticisms of the model?","course":"Exeter","year":2011,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q101","text":"Describe a time you have been criticised when you did not agree with the criticism. What did you do? What did you learn from it?","course":"Exeter","year":2011,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q102","text":"Talk about a paper, publication or book you have read recently. How would it affect the role of a clinical psychologist?","course":"Exeter","year":2011,"panel":"academic","theme":"critical_appraisal","mode":"3min"},{"id":"q103","text":"Do you think you have influenced somebody? Talk about a time you have influenced somebody.","course":"Exeter","year":2011,"panel":"clinical","theme":"leadership","mode":"3min"},{"id":"q104","text":"[Scenario: developing training for inpatient staff working with learning disability populations, including a focus group with patients and carers.] How would you prepare for this work? What issues may come up for you, staff, patients and carers? What psychological theories or knowledge would you draw on? How would you evaluate the training?","course":"Plymouth","year":2013,"panel":"clinical","theme":"professional_identity","mode":"vignette"},{"id":"q105","text":"[Having read a BPS document on community approaches to care:] What would the role of the clinical psychologist be within this project? What are the strengths and potential barriers to working in this way?","course":"Plymouth","year":2013,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q106","text":"Talk about a challenging time or experience. How did you manage this? What skills did you need?","course":"Plymouth","year":2013,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q107","text":"Give an example of adapting your practice to the needs of a diverse population. How do you think your values and background may affect practice?","course":"Plymouth","year":2013,"panel":"clinical","theme":"diversity","mode":"3min"},{"id":"q108","text":"[Scenario: a consultant asks you as a trainee to design a study exploring the efficacious components of an intervention in an older adult service.] Who would you consult with before beginning? What methodology would you use? What are the limitations of this approach? How would you communicate your results?","course":"Plymouth","year":2013,"panel":"academic","theme":"research_design","mode":"vignette"},{"id":"q109","text":"What is practice-based evidence?","course":"Plymouth","year":2013,"panel":"academic","theme":"professional_identity","mode":"60s"},{"id":"q110","text":"What do you understand by reflection? Give an example of reflective practice within your practice.","course":"Plymouth","year":2013,"panel":"clinical","theme":"reflective_personal","mode":"3min"},{"id":"q111","text":"Talk about a clinical case you have worked on. What theory underlies it? What are the critiques of that theory?","course":"Plymouth","year":2013,"panel":"clinical","theme":"clinical_case","mode":"3min"},{"id":"q112","text":"[Vignette, 15 minutes' preparation: you are leading a team creating psychological support for carers of people with dementia.] What would your first steps be? Who would you consult? What form would your intervention take? What are your hopes and fears for this intervention? Are there any ethical implications?","course":"Plymouth","year":2014,"panel":"clinical","theme":"professional_identity","mode":"vignette"},{"id":"q113","text":"Describe a situation where you felt there was a clash of ethics. How did you deal with this? What did you learn?","course":"Plymouth","year":2014,"panel":"clinical","theme":"ethics_clash","mode":"3min"},{"id":"q114","text":"[Having read the Berwick report (2013):] What did you feel was the most important aspect of this report? How would you disseminate this point to the service you work for?","course":"Plymouth","year":2014,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q115","text":"[Research vignette: a well-regarded bereavement support unit for families who have lost a child or sibling. You could explore the cycle of change during therapy, the interactions with the clinician, the group dynamics of the family, or the milestones of each service user.] Who would you discuss these ideas with first? Which area would you focus on and why? What method would you use? What sample size? What are the potential implications of this type of research?","course":"Plymouth","year":2014,"panel":"academic","theme":"research_design","mode":"vignette"},{"id":"q116","text":"Talk about a piece of research you have been involved in. What would you do differently? What are the limitations? What are the implications?","course":"Southampton","year":2012,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q117","text":"At Southampton we value self-management and self-learning. Can you give examples from your practice that demonstrate self-initiative? What are the pros and cons of working in this way, and the difficulties?","course":"Southampton","year":2012,"panel":"academic","theme":"reflective_personal","mode":"3min"},{"id":"q118","text":"Talk about a clinical piece of work you undertook under supervision.","course":"Southampton","year":2012,"panel":"clinical","theme":"clinical_case","mode":"3min"},{"id":"q119","text":"How would you build a therapeutic relationship with a client?","course":"Southampton","year":2012,"panel":"clinical","theme":"engagement","mode":"3min"},{"id":"q120","text":"How do you self-manage your time in a busy clinical environment?","course":"Southampton","year":2012,"panel":"clinical","theme":"reflective_personal","mode":"60s"},{"id":"q121","text":"Talk about a time you received academic feedback and how this has influenced your practice.","course":"Southampton","year":2013,"panel":"academic","theme":"reflective_personal","mode":"3min"},{"id":"q122","text":"Clinical psychologists have to work with many different professionals. Can you give examples of this, and what helped?","course":"Southampton","year":2013,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q123","text":"The therapeutic relationship is a significant part of interventions. How would you build a relationship with someone who is silent?","course":"Southampton","year":2013,"panel":"clinical","theme":"engagement","mode":"3min"},{"id":"q124","text":"Describe a piece of clinical work you have had with a client. What did you do? How did you plan the intervention? Were there any hurdles? What psychological theory is this linked to?","course":"Southampton","year":2015,"panel":"clinical","theme":"clinical_case","mode":"3min"},{"id":"q125","text":"Describe a time you have felt there was a clash of ethical interests.","course":"Southampton","year":2015,"panel":"clinical","theme":"ethics_clash","mode":"3min"},{"id":"q126","text":"Describe an example of appropriate use of clinical supervision.","course":"Southampton","year":2015,"panel":"clinical","theme":"supervision_use","mode":"3min"},{"id":"q127","text":"Describe a piece of research you have undertaken. Why did you choose this method? What informed this choice? What would you have done differently in hindsight? How could you operationalise these changes? In what way would this have improved the research? What psychological theory does this work support?","course":"Southampton","year":2015,"panel":"academic","theme":"research_own","mode":"3min"},{"id":"q128","text":"[Role-play: you are a college counsellor about to see a student struggling with exam stress. No intervention is expected — this is about engagement and brief assessment and formulation.] Afterwards: what was the presenting issue? How could you see the intervention moving forward? Was there anything about your performance you felt could be improved?","course":"Southampton","year":2015,"panel":"roleplay","theme":"roleplay_prep","mode":"roleplay"},{"id":"q129","text":"The application form can be quite constricting. What would you like to add to your application?","course":"South Wales","year":2015,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q130","text":"Why do you want to train in Wales? Why this course?","course":"South Wales","year":2015,"panel":"personal","theme":"motivation","mode":"3min"},{"id":"q131","text":"What do you think the written task was trying to assess?","course":"South Wales","year":2015,"panel":"personal","theme":"reflective_personal","mode":"3min"},{"id":"q132","text":"What's the difference between having a supervisor and a mentor?","course":"South Wales","year":2015,"panel":"personal","theme":"supervision_use","mode":"60s"},{"id":"q133","text":"It can be distressing for people to come and see a clinical psychologist. How would you handle other people's distress?","course":"South Wales","year":2015,"panel":"personal","theme":"engagement","mode":"3min"},{"id":"q134","text":"How do you work with difference and diversity?","course":"South Wales","year":2015,"panel":"personal","theme":"diversity","mode":"3min"},{"id":"q135","text":"Who can clinical psychology support more — service users or carers?","course":"South Wales","year":2015,"panel":"personal","theme":"service_user","mode":"3min"},{"id":"q136","text":"What is a clinical psychologist's role in integrating care?","course":"South Wales","year":2015,"panel":"personal","theme":"professional_identity","mode":"3min"},{"id":"q137","text":"What can clinical psychology do in the face of austerity?","course":"South Wales","year":2015,"panel":"personal","theme":"policy_context","mode":"3min"},{"id":"q138","text":"Tell us about your current role. What skills do you think a clinical psychologist needs?","course":"South Wales","year":2015,"panel":"clinical","theme":"professional_identity","mode":"3min"},{"id":"q139","text":"What psychological theory are you most drawn to, and why?","course":"South Wales","year":2015,"panel":"clinical","theme":"model_switch","mode":"3min"},{"id":"q140","text":"What will the impacts be to psychology if we don't find time to do research?","course":"South Wales","year":2015,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q141","text":"How do we overcome the challenges to implementing the evidence base?","course":"South Wales","year":2015,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q142","text":"Think about something you have seen in the media recently. How would you choose to report it, and can you link it to a psychological theory?","course":"South Wales","year":2015,"panel":"clinical","theme":"policy_context","mode":"3min"},{"id":"q143","text":"How do you demonstrate your value?","course":"South Wales","year":2015,"panel":"clinical","theme":"professional_identity","mode":"3min"}]},"formulation":{"version":1,"vignettes":[{"id":"v_asylum","title":"Unaccompanied child seeking asylum","source":"Birmingham 2019, clinical interview (verbatim scenario)","text":"You have picked up a referral to work with a 14-year-old unaccompanied child seeking asylum, who has been placed in a foster home. The foster family have expressed concerns as the child is behaving aggressively — shouting, slamming doors, and on one occasion pushing past a foster carer to leave the house at night. He has been in the placement eleven weeks. He speaks some English. He has not talked about his journey or his family.","ask":"Formulate. Then formulate again from a different model. What does each lens illuminate, and what does it miss?","models":[{"model":"Trauma / PTMF","mech":"Threat responses that were adaptive in the original context persist in a context that resembles it. The question is not what is wrong with him but what happened to him, what he had to do to survive, and what power was operating.","form":"Aggression here is most parsimoniously read as a threat response in a hyper-aroused nervous system, in a young person who has survived events he has not been able to speak about and who remains in a situation of profound ongoing threat — an unresolved asylum claim, no family, no control over where he lives or with whom. Slamming doors and leaving at night may be attempts to restore some agency and escape routes in a house where he cannot predict what happens next. Not speaking about the journey may be protective rather than avoidant: disclosure has consequences in an asylum process, and he may have been instructed not to speak.","adds":"Puts the behaviour in its context, makes it intelligible rather than pathological, and foregrounds that his powerlessness is real and current, not merely remembered.","misses":"Can under-specify the mechanism, and risks explaining everything by trauma so that ordinary adolescence, cultural difference and the specific dynamics of this household become invisible.","intervention":"Stabilisation and safety before any processing: predictability, agency over small daily decisions, psychoeducation about threat responses shared with the foster carers, and advocacy on the asylum claim — which may be the single most therapeutic act available.","test":"If this is threat-driven, arousal should track proximity to reminders and to asylum process events, and aggression should reduce as predictability and control increase — without any processing of the trauma itself. If aggression is unrelated to those, look elsewhere."},{"model":"Attachment / developmental","mech":"Internal working models built in one caregiving environment govern expectation and help-seeking in the next. A child who has learned that adults cannot be relied upon will test rather than trust.","form":"He has lost every attachment figure and is being asked to accept care from strangers, in a language he half-speaks, at an age when identity and belonging are the central developmental tasks. Accepting care carries risk: if he lets these people matter and they too disappear, the loss compounds. Aggression may function to keep the foster carers at a manageable distance, and to test whether they will reject him — which, if they do, confirms the model and is at least predictable.","adds":"Explains the specific target of the behaviour — it is directed at the carers, not at school or peers — and predicts the placement breakdown risk that everyone is worried about.","misses":"Risks locating the difficulty inside the child's history and minimising the current, entirely real threat of the asylum process, or reading culturally normative independence as avoidant attachment.","intervention":"Work with the foster carers on holding the relationship through rejection without withdrawing, understanding the behaviour as a test rather than as a verdict on them; keep the placement stable; build one predictable relationship at a time.","test":"If this is relational testing, the aggression should be most intense with the carers he is beginning to depend on, and should intensify around separations, absences and changes of routine, rather than being uniform across settings."},{"model":"Systemic","mech":"The problem is in the pattern between people, not inside one of them. Each response is both a reaction to and a stimulus for the other's.","form":"A loop is plausible here: he leaves the house at night; the carers become frightened and impose more restriction; restriction reduces his already minimal control and increases his need to demonstrate agency; he escalates; they restrict further. Both parties are acting reasonably from their own position — they are responsible for a vulnerable minor, he is trying to survive — and the pattern maintains itself. There is a wider system too: social care, the Home Office, school and the interpreter each carry a position, and the foster carers may be receiving contradictory instructions about what they can permit.","adds":"Locates the problem where the intervention can actually reach it, and stops the referral question ('fix the child') from being accepted uncritically.","misses":"Can miss the individual's internal experience, and — if applied naively — risks a symmetry that is inappropriate when one party has vastly less power than the other.","intervention":"Work with the household, not the child alone: map the sequence with the carers, find the point in the loop that is easiest to interrupt, negotiate what agency he can genuinely be given, and convene the wider network so it speaks with one voice.","test":"If this is a maintaining loop, changing the carers' response at one point should shift the sequence without any direct work with him. If the behaviour is unchanged by that, the loop is not carrying it."},{"model":"CBT","mech":"Appraisal drives response, and the behavioural consequence feeds back to confirm the appraisal.","form":"A specific cognitive-behavioural account would be: an appraisal of imminent threat or of being trapped ('if I stay I cannot get out'), producing intense arousal and an escape or fight response; leaving the house terminates the arousal, which negatively reinforces it; the carers' subsequent restriction confirms the appraisal that he is not safe and not in control, strengthening the belief. Any safety behaviours — sleeping dressed, staying near the door, not eating with the family — would maintain the belief by preventing disconfirmation.","adds":"Names a precise mechanism and generates testable predictions, which makes it the most falsifiable of these accounts.","misses":"Requires shared language, a degree of trust and a capacity for meta-cognitive work that may be unavailable at eleven weeks in a second language; and it can look like locating the problem in his thinking when the danger is real.","intervention":"Not formal cognitive work yet. Arousal management and psychoeducation about the body's threat response, delivered concretely; then, only once safety and language allow, graded testing of specific predictions about the household.","test":"If this account holds, arousal should be preceded by identifiable triggers and appraisals that he can eventually report, and reducing safety behaviours should reduce belief conviction. If he cannot identify any triggers and the arousal is continuous, a trauma or attachment account fits better."},{"model":"ACT","mech":"Suffering is compounded by struggle against internal experience; the aim is workable action in the direction of what matters, with discomfort present.","form":"He may be spending most of his available energy on controlling unbearable internal states — memories, grief, terror, guilt about those left behind — and aggression and leaving may both be forms of experiential avoidance that work in the short term and cost him the placement in the long term. The question is what he wants his life here to be for, which is nearly impossible to ask of someone whose future is being decided by someone else.","adds":"Sidesteps the need to process trauma content, which may be premature and unsafe, and moves toward what he wants rather than what is wrong with him.","misses":"Values work presupposes a degree of agency over one's future that an unaccompanied minor in the asylum system does not have; asking about values while his claim is undecided may be experienced as absurd or cruel.","intervention":"Small, concrete committed actions in domains he can actually control — education, football, learning English, contact with a community — held as valued directions rather than as coping.","test":"If avoidance is central, then any increase in willingness to have difficult internal experience should widen his behavioural repertoire even before distress reduces. If distress reduces but behaviour does not change, the account is incomplete."}],"compare":"Notice that all five accounts predict aggression, and that they differ chiefly in WHERE they locate the mechanism — in the nervous system, in the relationship, in the pattern between people, in appraisal, or in avoidance. In interview, the strong answer does not choose the 'right' one; it says what each buys you and what would distinguish them. Here the trauma and systemic accounts have the strongest immediate claim, because both point to interventions that do not require him to talk, and because the powerlessness in his situation is real rather than perceived. Note also the safeguarding thread: a 14-year-old leaving the house at night is at risk of exploitation, and that has to be held alongside the formulation, not after it.","difficulty":4},{"id":"v_protective_parent","title":"The protective parent","source":"The brief's own example; the pattern behind Exeter 2012 and Cardiff research vignettes","text":"A 9-year-old girl has become increasingly anxious about school over two terms. She now refuses two or three mornings a week. Her mother has reduced her own working hours to be available, drives her in rather than letting her take the bus with friends, and stays in the car park for the first hour. The mother says she cannot bear to see her daughter distressed. The school has started sending work home. The girl says she feels sick in the mornings and that her mother worries too much.","ask":"Formulate this from a CBT perspective and then from a systemic perspective. What does the systemic lens add?","models":[{"model":"CBT","mech":"Threat appraisal drives avoidance; avoidance is negatively reinforced and prevents disconfirmation.","form":"She appraises school as threatening — the content matters and is not yet known, whether social, performance or separation-related. Anticipation produces autonomic arousal that she experiences as nausea, which she then reads as evidence that she is ill and cannot go, confirming the appraisal. Not going terminates the arousal immediately, which negatively reinforces refusal. Her mother's accommodation — the lift, the presence in the car park, the work sent home — functions as a family-level safety behaviour: each removes an opportunity to discover that she could have coped, and the more effectively it relieves distress today the more strongly it is reinforced for both of them.","adds":"Names the precise mechanism by which help maintains the problem, and generates a graded intervention with testable predictions.","misses":"Treats the mother's behaviour as an accommodation variable rather than as meaningful in its own right, and can leave the family feeling blamed for having tried to help.","intervention":"Graded return to school with a hierarchy negotiated with school and family, systematic reduction of accommodations one at a time, behavioural experiments testing specific predictions ('if I go in on the bus, I will be sick and have to come home'), and psychoeducation for the mother on why relief today costs tomorrow.","test":"If avoidance is maintaining it, anxiety should reduce across repeated exposures without avoidance, and reducing one accommodation should not produce catastrophic deterioration. If distress escalates and stays escalated, something else is operating — bullying, a learning difficulty, something at home."},{"model":"Systemic","mech":"Circular causality: each person's response is both a reaction to and a trigger for the other's, so the pattern maintains itself without a first cause.","form":"The sequence is recursive: the girl shows distress; her mother, who cannot bear it, moves closer and takes over; her proximity communicates that the situation is genuinely dangerous and that her daughter cannot manage it alone; the daughter's confidence falls and her distress rises; her mother moves closer still. Each is behaving lovingly and each escalates the other. Beyond the dyad: what does the mother's own history make of a distressed child, is there a father or partner with a different view producing a split between a 'soft' and a 'firm' parent, what is the school communicating by sending work home, and what has changed in the family in the last two terms that nobody has mentioned?","adds":"Explains why the intervention will fail if directed only at the child, and makes the mother's behaviour meaningful — she is not an obstacle, she is in a loop that makes sense from where she stands.","misses":"Can under-specify the individual mechanism that CBT names precisely, and can lose the girl's own internal experience in a description of the system.","intervention":"Work with the pattern in the room: map the sequence with both of them, ask circular questions ('when your mum waits in the car park, what does your daughter conclude?'; 'who worries most, and who notices first?'), find the smallest change to the sequence that either could make, and convene school so it is not a third party acting on its own theory.","test":"If the loop is carrying it, changing the mother's response alone should shift the daughter's behaviour without any direct work with the daughter. That is a strong and testable prediction — and it is the one that distinguishes the systemic account from the CBT one."},{"model":"ACT","mech":"Struggle with internal experience narrows life; the mother's agenda has become the elimination of her daughter's distress.","form":"The mother's stated position — 'I cannot bear to see her distressed' — is the formulation. Her behaviour is organised around the removal of an internal experience of her own, and each accommodation works briefly and costs her working hours, her daughter's independence and her own life. The daughter is learning the same rule: that discomfort is intolerable and must be removed rather than carried.","adds":"Reframes the target from the child's anxiety to the family's relationship with discomfort, which is often the more workable target and lands less blamefully.","misses":"May be too abstract for a 9-year-old, and risks sounding like an instruction to tolerate distress that has not yet been understood.","intervention":"Work with the mother on willingness — what kind of parent she wants to be, and whether protecting her daughter from all distress serves that — while building the daughter's willingness through play-based defusion and small valued actions.","test":"If experiential avoidance is central, then the mother's willingness to tolerate her own distress should permit accommodation reduction, and the daughter's functioning should improve before her anxiety does."},{"model":"Attachment / developmental","mech":"Proximity-seeking under threat is the system working as designed; the question is what has activated it and whether it can be deactivated.","form":"At nine, autonomy from parents and belonging with peers are the central developmental tasks, and this pattern is arresting both. Something may have activated the attachment system two terms ago — an illness, a loss, a separation, a frightening event — and the mother's hypervigilance may reflect her own experience of loss or of being unprotected. The nausea may be genuine somatic distress rather than a cognition.","adds":"Directs attention to what changed two terms ago, which nobody in the referral has explained, and to the mother's own history.","misses":"Risks a historical explanation that does not generate a next step, and can pathologise a proportionate parental response to a real problem at school.","intervention":"Understand the activating event; work with the mother on her own experience separately from the joint work; support graded separation with a secure base rather than by removing support abruptly.","test":"If the attachment system has been activated by a specific event, there should be an identifiable point of change, and the pattern should extend to other separations — sleepovers, being left with relatives — not only to school."}],"compare":"This is the exact pairing the brief flags and the highest-yield preparation you can do, because CBT and systemic accounts of the same case are what Cardiff, Birmingham and Southampton all ask for. The clean answer to 'what does the systemic lens add?' is: it makes the mother's behaviour meaningful rather than merely unhelpful, and it predicts that changing HER response alone will shift the daughter's behaviour — a prediction the CBT account does not make in the same form. What it loses is the precision of the accommodation mechanism and the girl's own appraisal, which is what the CBT account names best. Say both, and say what would distinguish them empirically.","difficulty":3},{"id":"v_lowmood","title":"Low mood, anger and rejection","source":"Coventry & Warwick 2018, recorded therapy session used in the written exercise","text":"You watch a ten-minute recorded session. A woman in her thirties describes feeling low, angry, and rejected. She says people judge her, that her family have 'given up' on her, and that she sometimes thinks about hurting herself when it gets bad. She is dismissive of previous therapy — 'I've done all this before' — and at one point says the therapist probably thinks she is difficult too.","ask":"What is the client experiencing? What is the therapist experiencing? Write a formulation a layperson would understand.","models":[{"model":"CBT","mech":"Core beliefs about the self and others generate appraisals that are confirmed by the interpersonal behaviour they produce.","form":"A belief of the order 'I am unacceptable / people will reject me' generates hypervigilance to signs of rejection, so ambiguous behaviour from others is read as judgement. Anger is both a response to perceived rejection and a form of protection: it gets in first. But the anger and the pre-emptive dismissal ('you probably think I'm difficult too') tend to produce distance in others, which she then experiences as the rejection she expected. The belief is confirmed by its own consequences.","adds":"Names a self-fulfilling cycle precisely, including how it will operate in the therapy room.","misses":"Individualises what may be a proportionate response to real and repeated experiences of being dismissed, including by services.","intervention":"Make the cycle explicit and collaborative, including its live operation between the two of you; behavioural experiments testing predictions about others' responses; work at belief level once the alliance can hold it.","test":"If this is belief-driven, she should predict rejection in specific situations in advance, and disconfirming evidence should reduce conviction. If she can accurately identify who has actually dismissed her, the belief may be well calibrated rather than distorted."},{"model":"CFT","mech":"Shame and self-criticism arise from a chronically activated threat system and an underdeveloped soothing system; self-criticism feels safe and compassion feels threatening.","form":"Shame about the self as fundamentally unacceptable is the affect underneath both the anger and the withdrawal. Her threat system is dominant: she scans for judgement, and attacks first because attack is safer than exposure. Anger is a threat-system protective strategy that works — it keeps people at a distance where they cannot confirm the shame. Warmth from a therapist is not neutral here; it is threatening, because it invites the exposure she is defended against, which may be why she is dismissive of therapy.","adds":"Explains the specific texture of the presentation — the anger, the pre-emptive dismissal, the resistance to warmth — better than a purely cognitive account, and predicts the alliance difficulty.","misses":"Requires a longer arc and can feel abstract early on; risks the therapist offering compassion that is experienced as threat.","intervention":"Psychoeducation about the three systems, delivered non-blamefully ('this is not your fault, and it is how brains work'); careful attention to fear of compassion; soothing rhythm and safe-place work before any self-compassion practice.","test":"If shame is central, warmth should reliably increase distress or dismissal in the short term, and the fear-of-compassion pattern should be identifiable and nameable with her."},{"model":"Psychodynamic","mech":"Relational templates are re-enacted in the therapeutic relationship, and the therapist's response is data.","form":"'You probably think I'm difficult too' brings the pattern into the room and invites the therapist to take a position. If the therapist becomes defensive, over-reassuring or subtly rejecting, the template is confirmed and the enactment complete. Her countertransference pull is likely to be toward feeling deskilled, criticised, or wanting to prove she is different from everyone else — and noticing that pull is more informative than any history she reports.","adds":"Uses the live relationship as the richest data available, and explains why the previous therapies failed in a way the other models do not.","misses":"Risks over-interpretation and, delivered clumsily, can feel like being told her reaction is about someone else.","intervention":"Attend to the relationship above content; notice and think about the pull rather than acting on it; name the process tentatively ('I notice I want to convince you I'm different — I wonder if that happens with others'); take countertransference to supervision.","test":"If a template is being re-enacted, the same dynamic should be traceable across her account of family, services and previous therapists, and naming it in the room should shift something."},{"model":"PTMF / contextual","mech":"What has happened to you, how did it affect you, what sense did you make of it, and what did you have to do to survive.","form":"Rather than asking what is wrong with her, ask what happened. 'People judge me' may be an accurate report: she may have been judged, by family, by services, and by previous therapists who found her difficult. Anger is then an entirely intelligible response to repeated invalidation and to the operation of power, including the power of professionals to define her as the problem. Her dismissal of therapy may be well-earned experience rather than resistance. Self-harm may function as regulation of unbearable affect, or as communication where words have not been heard.","adds":"Reframes 'difficult' as a description of what services have done to her rather than of who she is — and 'difficult patient' is precisely the attribution the recorded session is likely to elicit in candidates.","misses":"Offers less immediate purchase on mechanism, and cannot on its own tell you what to do next session.","intervention":"Validate first and at length; be explicit about power and about what you can and cannot offer; give her control over pace and content; be honest about what previous services got wrong rather than defending them.","test":"If invalidation is central, then sustained validation should reduce the anger before any technique is introduced — which is a strong, observable and quickly testable prediction."}],"compare":"For the therapist's experience — which Coventry asks explicitly — the honest answer is likely to include feeling deskilled, mildly criticised, and pulled toward either defending previous therapy or over-promising that this time will be different. Saying that plainly, and saying that you would take it to supervision as information rather than acting on it, is a strong answer. Note that Coventry then asks for a formulation a layperson would understand: that means her words, no jargon, a cycle described in ordinary language, something that makes her response understandable rather than faulty, and an explicit 'does that fit?'.","difficulty":4},{"id":"v_id_residential","title":"Behaviour that challenges in residential care","source":"Cardiff 2016 written task setting; Birmingham 2018 population","text":"You are the psychologist for a residential home for adults with intellectual disabilities. Staff have referred a 34-year-old man who has begun hitting out at staff during personal care. It started about six weeks ago. Staff describe him as 'attention-seeking' and say he 'knows exactly what he is doing'. He has limited verbal communication. Two long-standing staff left the home two months ago and agency staff are covering. Incident records show most incidents occur in the morning, and three different staff have been involved.","ask":"Formulate. What would you do, and what would you not do?","models":[{"model":"Behavioural / functional analysis","mech":"Behaviour is maintained by its consequences; topographically identical behaviours may serve different functions.","form":"The behaviour is communication, and the analysis has to establish what it achieves. Morning clustering and the personal care context point toward escape from an aversive event as the most likely function — negative reinforcement, since hitting out ends or delays the care. Alternatives to test: pain (dental, constipation, musculoskeletal — very commonly missed in this population and consistent with a six-week onset), a sensory aversion to a specific aspect of care, or a change in how care is delivered by unfamiliar agency staff who do not know his routine or his signals.","adds":"Generates a precise, testable account and directs assessment before intervention.","misses":"Says nothing about his experience or his relationships, and in unskilled hands 'function' becomes a way of talking about a person as a system of contingencies.","intervention":"ABC recording across settings and staff before any intervention; medical review to exclude pain FIRST; antecedent-level change — same staff, predictable sequence, communication of each step, offering control over order and timing.","test":"If escape-maintained, incidents should reduce when care is made predictable and he is given control over its sequence, without any consequence-based programme. If they persist unchanged, look harder at pain."},{"model":"Systemic / staff-team","mech":"The unit of analysis is the home, not the man. Staff attributions drive staff behaviour, which drives his.","form":"Two familiar staff left; agency staff arrived who do not know him, his signals or his routine; care became less predictable and less attuned; he protested in the only way available; staff — being unfamiliar and anxious — became more task-focused and quicker, which made care more aversive; he escalated. The attribution 'attention-seeking' and 'knows what he is doing' is doing work in this loop: it licenses a response that is firmer and less curious, and it protects staff from the more painful thought that he is distressed and they are the cause.","adds":"Explains the timing, which the individual formulation alone does not, and identifies the intervention target that will actually move — the staff group.","misses":"Can be experienced as blaming staff, who are under-resourced and frightened, and who need containment before they can hear a reformulation.","intervention":"Team formulation as the primary intervention; support the staff group's own distress before challenging their attributions; consistency of staffing as a clinical prescription; supervision and reflective practice for the team.","test":"If staff-mediated, incidents should cluster by staff member and by shift pattern, and should reduce with consistency of staffing alone. The incident records already contain the data to check this."},{"model":"Attachment / trauma-informed","mech":"Loss and unpredictability activate threat; personal care is a context of profound vulnerability.","form":"Two people who knew him well disappeared two months ago, and nobody appears to have thought about that as a bereavement. He may have had no explanation he could understand and no way to ask. Personal care requires him to permit strangers to touch his body — with a plausible history of institutional care, and a population with markedly elevated rates of abuse. Hitting out during intimate care in a man who cannot say no verbally has an obvious alternative reading.","adds":"Raises the safeguarding question that a purely behavioural formulation can miss entirely, and dignifies the loss.","misses":"Speculative without evidence, and can lead to trauma explanations that are unfalsifiable and unactionable.","intervention":"Safeguarding consideration held explicitly and appropriately; work on the loss in accessible ways — photographs, a goodbye that did not happen; consent and choice built into every step of care as a matter of routine.","test":"If loss or threat is central, distress should be evident beyond care contexts — sleep, appetite, withdrawal, seeking the departed staff — not confined to personal care."},{"model":"PBS / contextual","mech":"Behaviour change is achieved by changing the environment and teaching skills, not by managing consequences; quality of life is the outcome.","form":"The formulation integrates the above into a plan whose primary outcome is his quality of life, not the incident count. The risk in this referral is that success gets defined as fewer incidents, which can be achieved by restricting him — and that is a worse outcome achieved more quickly.","adds":"Keeps the outcome honest and guards against restrictive practice being adopted as a solution.","misses":"Requires organisational commitment that a single psychologist may not be able to secure.","intervention":"A PBS plan built with staff and, as far as possible, with him and his family: antecedent strategies, teaching a functionally equivalent communication response, and reactive strategies that are least restrictive and explicitly time-limited.","test":"Track quality of life and engagement alongside incidents. If incidents fall while engagement and activity also fall, the plan is restricting him rather than helping him."}],"compare":"What you would NOT do is the part that distinguishes candidates. You would not accept the referral question as framed. 'Attention-seeking' is an attribution, not a formulation, and it predicts a staff response that makes things worse — the strong move is to say that curiously rather than correctingly, because the staff group is frightened and under-resourced. You would not intervene before excluding pain, which is the single most commonly missed cause of new behaviour change in this population. And you would not deliver individual therapy as your primary response: this is Cardiff's non-1:1 question in clinical form, and the leverage is in the environment and the team.","difficulty":4},{"id":"v_dementia_carer","title":"The carer who calls","source":"Cardiff 2012 and 2013 (both years put a version of this to candidates)","text":"A woman rings your service. Her husband, who has early signs of a degenerative dementia, is refusing to attend the neurology appointment for diagnostic testing. She is distressed and says she does not know what to do. She asks you to talk to him, or to tell her what to say. Her husband is not
