function hex2rgb(h) {
  h = (h || '').trim().replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h || '888888', 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;
}
function seqColor(pct) {
  const st = ['--seq-1','--seq-2','--seq-3','--seq-4','--seq-5','--seq-6','--seq-7'];
  if (pct <= 0) return 'var(--bg-2)';
  const i = Math.min(6, Math.floor(pct / 100 * 6.99));
  return getComputedStyle(document.documentElement).getPropertyValue(st[i]).trim() || '#3987e5';
}

function buildAtlas(domain) {
  const cv = $('#atlas'); if (!cv) return;
  const tip = $('#atlastip');
  const nodes = DATA.concepts.nodes.filter(n => domain === 'all' || n.domain === domain);
  const ids = new Set(nodes.map(n => n.id));
  const links = [];
  nodes.forEach(n => {
    (n.parents || []).forEach(p => { if (ids.has(p)) links.push([n.id, p, 1]); });
    (n.related || []).forEach(r => { if (ids.has(r) && n.id < r) links.push([n.id, r, 0.45]); });
  });

  const deg = {};
  links.forEach(([a, b]) => { deg[a] = (deg[a] || 0) + 1; deg[b] = (deg[b] || 0) + 1; });

  const W = cv.clientWidth || 900, H = Math.max(440, Math.min(650, W * 0.52));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Three domain lobes. Separating the domains is not decoration: the whole
  // point of the map is to show which of the three is dark.
  const PAD = 46;
  const doms = ['research','clinical','professional'];
  const present = doms.filter(d => nodes.some(n => n.domain === d));
  const lobe = {};
  present.forEach((d, i) => {
    if (present.length === 1) { lobe[d] = { x: W/2, y: H/2 }; return; }
    const a = -Math.PI/2 + (i / present.length) * Math.PI * 2;
    lobe[d] = { x: W/2 + Math.cos(a) * W * 0.29, y: H/2 + Math.sin(a) * H * 0.27 };
  });

  // deterministic seeded start so the map is stable between visits
  const P = {};
  nodes.forEach(n => {
    let h = 0; for (let k = 0; k < n.id.length; k++) h = (h * 31 + n.id.charCodeAt(k)) | 0;
    const a = (Math.abs(h) % 3600) / 3600 * Math.PI * 2;
    const r = 24 + (Math.abs(h >> 7) % 1000) / 1000 * 110;
    const L = lobe[n.domain] || { x: W/2, y: H/2 };
    P[n.id] = { x: L.x + Math.cos(a) * r, y: L.y + Math.sin(a) * r, vx:0, vy:0 };
  });

  /* The layout is deterministic (seeded start, fixed iteration count), so it
     only has to be solved once per domain filter and canvas width. Recomputing
     it on every visit cost ~283ms of blocked main thread for nothing. */
  const cacheKey = (domain || 'all') + '@' + W + 'x' + H + ':' + nodes.length;
  ATLAS_CACHE = ATLAS_CACHE || {};
  const cached = ATLAS_CACHE[cacheKey];
  if (cached) {
    nodes.forEach(n => { if (cached[n.id]) { P[n.id].x = cached[n.id].x; P[n.id].y = cached[n.id].y; } });
  } else {
  const ITER = 420;
  for (let iter = 0; iter < ITER; iter++) {
    const cool = 1 - iter / ITER;
    for (let i = 0; i < nodes.length; i++) {
      const a = P[nodes[i].id];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = P[nodes[j].id];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx*dx + dy*dy;
        if (d2 > 34000 || d2 === 0) continue;
        const d = Math.sqrt(d2), f = 620 / d2;
        const ux = dx / d * f, uy = dy / d * f;
        a.vx += ux; a.vy += uy; b.vx -= ux; b.vy -= uy;
      }
    }
    links.forEach(([x, y, wgt]) => {
      const a = P[x], b = P[y];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const f = (d - 72) * 0.014 * wgt;
      const ux = dx / d * f, uy = dy / d * f;
      a.vx += ux; a.vy += uy; b.vx -= ux; b.vy -= uy;
    });
    nodes.forEach(n => {
      const p = P[n.id], L = lobe[n.domain] || { x: W/2, y: H/2 };
      p.vx += (L.x - p.x) * 0.014; p.vy += (L.y - p.y) * 0.014;
      p.x += p.vx * cool; p.y += p.vy * cool;
      p.vx *= 0.76; p.vy *= 0.76;
      p.x = Math.max(PAD, Math.min(W - PAD, p.x));
      p.y = Math.max(PAD, Math.min(H - PAD, p.y));
    });
  }
  const store = {};
  nodes.forEach(n => { store[n.id] = { x: P[n.id].x, y: P[n.id].y }; });
  ATLAS_CACHE[cacheKey] = store;
  }

  const css = getComputedStyle(document.documentElement);
  const domCol = { research: css.getPropertyValue('--d-research').trim(),
                   clinical: css.getPropertyValue('--d-clinical').trim(),
                   professional: css.getPropertyValue('--d-professional').trim() };
  const inkDim = css.getPropertyValue('--ink-3').trim();
  const unseenCol = css.getPropertyValue('--bg-2').trim();
  const surfaceCol = css.getPropertyValue('--card').trim();
  const chipBg = css.getPropertyValue('--card').trim();
  // link ink follows the theme: dark strokes on a light ground, light on dark
  const darkUI = document.documentElement.getAttribute('data-theme') === 'dark';
  const linkRGB = darkUI ? '150,170,210' : '70,90,130';
  const now = Date.now();
  let hover = null, t = 0;

  function radius(n) { return 3.4 + Math.min(7, (deg[n.id] || 0) * 0.62) + (n.tier === 1 ? 2 : n.tier === 2 ? 0.8 : 0); }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // lobe captions sit above each cluster's real extent, not over its nodes
    present.forEach(d => {
      const pts = nodes.filter(n => n.domain === d).map(n => P[n.id]);
      if (!pts.length) return;
      const cx = pts.reduce((a, q) => a + q.x, 0) / pts.length;
      const top = Math.min.apply(null, pts.map(q => q.y));
      ctx.font = '700 10.5px "Instrument Sans", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = domCol[d];
      ctx.globalAlpha = .7;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '1.5px';
      ctx.fillText(d.toUpperCase(), cx, Math.max(15, top - 24));
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.globalAlpha = 1;
    });
    ctx.lineWidth = 1;
    links.forEach(([a, b, wgt]) => {
      const pa = P[a], pb = P[b];
      const ma = mastery(a, now), mb = mastery(b, now);
      const lit = (ma + mb) / 200;
      ctx.strokeStyle = `rgba(${linkRGB},${(darkUI ? 0.05 : 0.07) + lit * 0.17})`;
      if (hover && (a === hover || b === hover)) ctx.strokeStyle = `rgba(${linkRGB},.55)`;
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    });
    nodes.forEach(n => {
      const p = P[n.id], m = mastery(n.id, now), r = radius(n);
      const isHover = hover === n.id;
      if (m > 0) {
        const pulse = 1 + Math.sin(t / 30 + p.x) * 0.03 * (m / 100);
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.9 * (m / 100) * pulse, 0, 7);
        ctx.fillStyle = domCol[n.domain] + '18'; ctx.fill();
      }
      // One channel per variable: hue carries the domain, intensity carries
      // mastery. A blue mastery ramp inside a blue domain lobe encodes nothing.
      ctx.beginPath(); ctx.arc(p.x, p.y, r * (isHover ? 1.35 : 1), 0, 7);
      ctx.fillStyle = mixHex(surfaceCol, domCol[n.domain], 0.08 + (m / 100) * 0.92);
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = m > 0 ? domCol[n.domain] : mixHex(surfaceCol, domCol[n.domain], 0.34);
      ctx.stroke();
    });
    // labels last, with a coarse occupancy grid so they never pile up
    const CW = 92, CH = 20, taken = new Set();
    const order = nodes.slice().sort((a, b) =>
      (b.id === hover ? 1e6 : 0) - (a.id === hover ? 1e6 : 0) ||
      (a.tier - b.tier) || ((deg[b.id]||0) - (deg[a.id]||0)));
    ctx.textAlign = 'center';
    order.forEach(n => {
      const m = mastery(n.id, now), isHover = hover === n.id;
      if (!(isHover || (n.tier === 1 && (deg[n.id] || 0) >= 3) || m >= 55)) return;
      const p = P[n.id], r = radius(n), ly = p.y - r - 6;
      const gx = Math.round(p.x / CW), gy = Math.round(ly / CH);
      const keys = [gx + ':' + gy, (gx+1) + ':' + gy, (gx-1) + ':' + gy];
      if (!isHover && keys.some(k => taken.has(k))) return;
      keys.forEach(k => taken.add(k));
      const lbl = n.label.length > 20 ? n.label.slice(0, 18) + '…' : n.label;
      ctx.font = (isHover ? '600 ' : '500 ') + '10.5px "Instrument Sans", system-ui, sans-serif';
      if (isHover) {
        const wgt = ctx.measureText(lbl).width;
        ctx.fillStyle = chipBg;
        ctx.fillRect(p.x - wgt/2 - 6, ly - 11, wgt + 12, 15);
      }
      ctx.fillStyle = isHover ? css.getPropertyValue('--ink').trim() : inkDim;
      ctx.fillText(lbl, p.x, ly);
    });
    t++;
  }
  draw();
  /* The pulse is ambient motion, so it is off for anyone who asked for less
     of it — and it stops when the tab is hidden rather than repainting a
     force-directed graph at 14fps into a backgrounded window forever. */
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still) {
    let iv = setInterval(draw, 70);
    TIMERS.push(iv);
    const vis = () => {
      if (document.hidden) { clearInterval(iv); iv = null; }
      else if (!iv && $('#atlas') === cv) { iv = setInterval(draw, 70); TIMERS.push(iv); }
    };
    document.addEventListener('visibilitychange', vis);
    TIMERS.push({ __off: () => document.removeEventListener('visibilitychange', vis) });
  }

  function hit(mx, my) {
    let best = null, bd = 16;
    nodes.forEach(n => {
      const p = P[n.id], d = Math.hypot(p.x - mx, p.y - my);
      if (d < Math.max(bd, radius(n) + 6) && d < bd) { bd = d; best = n; }
    });
    return best;
  }
  cv.onmousemove = e => {
    const r = cv.getBoundingClientRect();
    const n = hit(e.clientX - r.left, e.clientY - r.top);
    hover = n ? n.id : null;
    cv.style.cursor = n ? 'pointer' : 'grab';
    if (n) {
      const m = mastery(n.id, now), rec = S.c[n.id];
      tip.style.opacity = '1';
      tip.style.left = Math.min(r.width - 320, e.clientX - r.left + 14) + 'px';
      tip.style.top = (e.clientY - r.top + 14) + 'px';
      tip.innerHTML = `<b>${esc(n.label)}</b>
        <div class="pz">${esc(n.precision.slice(0, 190))}${n.precision.length > 190 ? '…' : ''}</div>
        <div style="margin-top:7px;display:flex;gap:12px;align-items:center">
          <span class="lbl">${m > 0 ? band(m)[2] : 'Not yet met'}</span>
          <span class="dnum" style="font-size:15px">${m}</span>
          ${rec && rec.d ? `<span class="lbl">${LEVELS[rec.d]}</span>` : ''}
        </div>`;
    } else tip.style.opacity = '0';
  };
  cv.onmouseleave = () => { hover = null; tip.style.opacity = '0'; };
  cv.onclick = e => {
    const r = cv.getBoundingClientRect();
    const n = hit(e.clientX - r.left, e.clientY - r.top);
    if (n) showConcept(n.id);
  };
  /* Touch had no path into the map at all: the tooltip was hover-only and the
     tap target was a few pixels wide. A tap now highlights and names the node,
     and a second tap on the same node opens it. */
  let tapped = null;
  cv.addEventListener('touchstart', e => {
    const t = e.touches[0]; if (!t) return;
    const r = cv.getBoundingClientRect();
    const n = hit(t.clientX - r.left, t.clientY - r.top);
    if (!n) { hover = null; tip.style.opacity = '0'; tapped = null; draw(); return; }
    e.preventDefault();
    if (tapped === n.id) { showConcept(n.id); tapped = null; return; }
    tapped = n.id; hover = n.id; draw();
    announce(n.label + '. ' + (mastery(n.id, now) > 0 ? band(mastery(n.id, now))[2] : 'not yet met') +
             '. Tap again to open.');
    tip.style.opacity = '1';
    tip.style.left = Math.min(r.width - 320, t.clientX - r.left + 14) + 'px';
    tip.style.top = (t.clientY - r.top + 14) + 'px';
    tip.innerHTML = `<b>${esc(n.label)}</b><div class="pz">${esc(n.precision.slice(0, 150))}…</div>`;
  }, { passive: false });
}

/* ---------------------------------------------------------- LEDGER */
function vLedger(stage) {
  const w = el('div', { class:'wrap stg' });
  w.appendChild(el('h1', { text:'The Ledger' }));
  w.appendChild(el('p', { style:'color:var(--ink-2);margin:8px 0 22px;max-width:68ch',
    text:'Every error, kept. The list is only useful when it shrinks, so it is ordered by what will cost you most: errors you were confident about, then errors that keep recurring, then everything else.' }));

  if (!S.errors.length) {
    w.appendChild(el('div', { class:'empty' }, [
      el('h3', { text:'Nothing recorded yet' }),
      el('p', { text:'Errors appear here as you make them. That is the point of them.' }),
    ]));
    stage.appendChild(w); return;
  }

  const clusters = misconceptionClusters(5);
  if (clusters.length) {
    w.appendChild(el('div', { class:'divider' }, [el('span', { class:'lbl', text:'Shared misconceptions' })]));
    const p = el('div', { class:'card', style:'margin-bottom:14px' });
    p.appendChild(el('p', { style:'font-size:13px;color:var(--ink-2);margin-bottom:12px',
      text:'These concepts sit underneath more than one of your errors. Teaching the node is worth more than correcting the instances.' }));
    p.appendChild(plate(clusters.map(c => prow({
      lead: dotEl(c.node.domain),
      name: c.node.label,
      sub: Math.round(c.n) + ' errors trace back here',
      val: c.m,
      onclick: () => showConcept(c.cid),
    }))));
    w.appendChild(p);
  }

  const byType = {};
  S.errors.forEach(e => { if (e.type) byType[e.type] = (byType[e.type] || 0) + 1; });
  if (Object.keys(byType).length) {
    w.appendChild(el('div', { class:'divider' }, [el('span', { class:'lbl', text:'How you go wrong' })]));
    const p = el('div', { class:'card', style:'margin-bottom:14px' });
    const total = Object.values(byType).reduce((a, b) => a + b, 0);
    ERROR_TYPES.forEach(([id, nm]) => {
      const n = byType[id] || 0; if (!n) return;
      const row = el('div', { style:'margin-bottom:11px' });
      row.innerHTML = `<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
          <span>${nm}</span><span class="dnum" style="color:var(--ink-3)">${n}</span></div>
        <div class="meter"><i style="width:${n/total*100}%"></i></div>`;
      p.appendChild(row);
    });
    w.appendChild(p);
  }

  w.appendChild(el('div', { class:'divider' }, [el('span', { class:'lbl', text:'The errors' })]));
  const sorted = S.errors.slice().sort((a, b) => (b.conf - a.conf) || (b.ts - a.ts));
  sorted.slice(0, 60).forEach(e => {
    const item = ITEM[e.id];
    const d = el('details', { class:'disc', style:'margin-bottom:8px' });
    const cs = (e.concepts || []).map(c => (CONCEPT[c] || {}).label).filter(Boolean).slice(0, 2).join(', ');
    d.innerHTML = `<summary>
        <span style="flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.stem || cs)}</span>
        ${e.conf >= 4 ? '<span class="pill" style="border-color:var(--warning);color:var(--warning)">confident</span>' : ''}
        <span class="lbl">${relTime(e.ts)}</span></summary>`;
    const dc = el('div', { class:'dc' });
    if (cs) dc.appendChild(el('p', { class:'lbl', style:'margin-bottom:8px', text: cs }));
    if (item) {
      dc.appendChild(el('p', { style:'font-size:13.5px;color:var(--ink-2)', text: item.teach }));
      if (item.precision) {
        const pr = el('div', { class:'precision' });
        pr.innerHTML = `<div class="lbl">Say it exactly like this</div><p>${esc(item.precision)}</p>`;
        dc.appendChild(pr);
      }
    }
    (e.concepts || []).slice(0, 3).forEach(cid => {
      const n = CONCEPT[cid]; if (!n) return;
      dc.appendChild(el('button', { class:'btn ghost', style:'margin:10px 8px 0 0', text: n.label + ' →',
        onclick: () => showConcept(cid) }));
    });
    d.appendChild(dc);
    w.appendChild(d);
  });
  stage.appendChild(w);
}

/* ---------------------------------------------------------- concept card */
function showConcept(id) {
  const n = CONCEPT[id]; if (!n) return;
  const m = mastery(id), rec = S.c[id];
  const body = el('div');

  const top = el('div', { style:'display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px' });
  top.innerHTML = `<div><div class="lbl">Mastery</div>
      <div class="dnum" style="font-size:36px;line-height:1;color:${band(m)[3]}">${m}</div></div>
    <div><div class="lbl">Depth reached</div>
      <div style="font-size:15px;font-weight:600;margin:5px 0 6px">${rec && rec.d ? LEVELS[rec.d] : 'not yet met'}</div>
      <div class="rungs ${n.domain}">${[1,2,3,4,5].map(i => `<i class="${i <= ((rec && rec.d) || 0) ? 'on' : ''}"></i>`).join('')}</div></div>
    <div style="flex:1 1 140px"><div class="lbl">${band(m)[2]}</div>
      <div class="meter" style="margin-top:7px"><i style="width:${m}%;background:${band(m)[3]}"></i></div></div>`;
  body.appendChild(top);

  const p = el('div', { class:'card', style:'margin-bottom:12px;border-color:color-mix(in srgb,var(--good) 34%,transparent)' });
  p.innerHTML = `<div class="lbl" style="color:var(--good)">The precise formulation</div>
    <p style="margin-top:7px;font-size:14.5px;line-height:1.6">${esc(n.precision)}</p>`;
  body.appendChild(p);

  if (n.notThis && n.notThis.length) {
    const q = el('div', { class:'flag' });
    q.innerHTML = `<div class="lbl">It is NOT</div>` +
      n.notThis.map(x => `<div style="margin-top:5px">✕ ${esc(x)}</div>`).join('');
    body.appendChild(q);
  }

  const rel = (n.parents || []).concat(n.related || []).filter((v, i, a) => a.indexOf(v) === i);
  if (rel.length) {
    body.appendChild(el('div', { class:'lbl', style:'margin:16px 0 8px', text:'Sits next to' }));
    const row = el('div', { class:'tagrow' });
    rel.forEach(r => {
      const rn = CONCEPT[r]; if (!rn) return;
      const b = el('button', { class:'pill act' },
        [el('span', { class:'dot ' + rn.domain }), el('span', { text: rn.label }),
         el('span', { style:'color:var(--ink-3)', text: mastery(r) })]);
      b.addEventListener('click', () => showConcept(r));
      row.appendChild(b);
    });
    body.appendChild(row);
  }

  const related = DATA.items.items.filter(it => it.concepts.includes(id));
  if (related.length) {
    const b = el('button', { class:'btn pri lg', style:'margin-top:20px',
      text: `Drill this — ${related.length} item${related.length===1?'':'s'}`,
      onclick: () => { closeModal(); SESSION = { items: shuffle(related), idx:0, right:0, started:Date.now(), answers:[], minutes:10 }; go('drill'); } });
    body.appendChild(b);
  }
  openModal(n.label, body, n.domain);
}

/* ---------------------------------------------------------- confirm
   The two destructive moments used to hand the learner to the browser's own
   confirm() — the one point in the product where it stopped looking like
   itself, and the one point where losing work was on the table. */
function confirmDialog(o) {
  closeModal();               // a decision outranks anything already on screen
  const body = el('div');
  body.appendChild(el('p', { style:'font-size:15.5px;line-height:1.6;margin:0 0 4px', text: o.text }));
  if (o.note) body.appendChild(el('p', { class:'src', style:'margin-top:10px', text: o.note }));
  const row = el('div', { class:'row wrap', style:'margin-top:22px;gap:10px' });
  row.appendChild(el('button', { class:'btn', text: o.cancel || 'Cancel', onclick: closeModal }));
  row.appendChild(el('div', { class:'spacer', style:'flex:1 1 auto' }));
  if (o.third) row.appendChild(el('button', { class:'btn', text: o.third,
    onclick: () => { o.onThird && o.onThird(); } }));
  row.appendChild(el('button', { class: 'btn ' + (o.danger ? 'no' : 'pri'), text: o.confirm || 'Continue',
    onclick: () => { closeModal(); setTimeout(() => o.onConfirm && o.onConfirm(), 60); } }));
  body.appendChild(row);
  openModal(o.title, body);
}

/* ---------------------------------------------------------- modal
   A dialog that is always in the document is always in the accessibility
   tree, and `aria-modal="true"` on it tells a screen reader that everything
   else on the page is inert. So the element is genuinely hidden when closed,
   Tab is trapped inside it while open, and focus returns to whatever opened
   it. */
const FOCUSABLE = 'a[href], button:not(:disabled), input:not(:disabled), ' +
                  'select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])';
let MODAL_RETURN = null;

function trapTab(e) {
  if (e.key !== 'Tab') return;
  const m = $('#modal');
  if (!m.classList.contains('on')) return;
  const items = $$(FOCUSABLE, m).filter(n => n.offsetParent !== null);
  if (!items.length) { e.preventDefault(); return; }
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function openModal(title, body, domain) {
  const m = $('#modal');
  MODAL_RETURN = document.activeElement;
  m.innerHTML = '';
  const h = el('div', { class:'mh' });
  const heading = el('h2', { id:'modaltitle', style:'display:flex;align-items:center;gap:9px' },
    [domain ? el('span', { class:'dot ' + domain, 'aria-hidden':'true' }) : null, el('span', { text: title })]);
  h.appendChild(el('div', { style:'display:flex;justify-content:space-between;align-items:flex-start;gap:14px' }, [
    heading,
    el('button', { class:'iconbtn', text:'✕', 'aria-label':'Close dialog', onclick: closeModal }),
  ]));
  m.appendChild(h);
  const b = el('div', { class:'mb' });
  b.appendChild(body);
  m.appendChild(b);
  m.setAttribute('aria-labelledby', 'modaltitle');
  m.removeAttribute('hidden');
  m.classList.add('on'); $('#scrim').classList.add('on');
  document.addEventListener('keydown', trapTab, true);
  requestAnimationFrame(() => {
    const first = $$(FOCUSABLE, m).filter(n => n.offsetParent !== null)[0];
    (first || m).focus();
  });
}

function closeModal() {
  const m = $('#modal');
  if (!m.classList.contains('on')) return;
  m.classList.remove('on'); $('#scrim').classList.remove('on');
  document.removeEventListener('keydown', trapTab, true);
  // wait for the fade-out before removing it from the tree
  setTimeout(() => { if (!m.classList.contains('on')) { m.setAttribute('hidden', ''); m.innerHTML = ''; } }, 240);
  if (MODAL_RETURN && document.contains(MODAL_RETURN)) MODAL_RETURN.focus();
  MODAL_RETURN = null;
}

/* ============================================================
   BOOT — shell wiring, command palette, settings, keyboard
   ============================================================ */

function buildShell() {
  const tabs = $('#tabs');
  tabs.innerHTML = '';
  MODES.forEach(([id, nm]) => {
    const b = el('button', { class:'tab', 'data-v':id, role:'tab', 'aria-selected':'false',
                             'aria-controls':'stage', tabindex:'-1',
                             text:nm, onclick: () => go(id) });
    tabs.appendChild(b);
  });
  /* The tablist pattern requires arrow-key traversal with a single tab stop,
     otherwise the roles promise a keyboard behaviour that is not there. */
  tabs.addEventListener('keydown', e => {
    const items = $$('.tab', tabs);
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % items.length;
    else if (e.key === 'ArrowLeft') n = (i - 1 + items.length) % items.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = items.length - 1;
    if (n === null) return;
    e.preventDefault();
    items[n].focus();
    go(items[n].dataset.v);
  });
  $('#brandlink').addEventListener('click', () => go('today'));
  $('#cmdbtn').addEventListener('click', openPalette);
  $('#setbtn').addEventListener('click', openSettings);
  $('#streak').addEventListener('click', () => go('progress'));
  if (S.streak.n) countUp($('#streakn'), S.streak.n, 620);
  $('#scrim').addEventListener('click', closeModal);
  Act.init();
}

/* ---------------------------------------------------------- command palette
   Grouped, with the actions the engine can take at the top. Typing filters
   across every paper, case, theme and concept in the build. */
function paletteItems() {
  const out = [];
  const A = (t, s, ic, fn) => out.push({ t, s, ic, g:'Actions', go: fn });
  A('Start a session', PLAN_MIN + ' min · adaptive', 'drill', () => startDrill(PLAN_MIN));
  A('Start a 12-minute session', 'adaptive', 'clock', () => startDrill(12));
  A('Start a 25-minute session', 'adaptive', 'clock', () => startDrill(25));
  A('Start a 45-minute session', 'adaptive', 'clock', () => startDrill(45));
  A('Toggle theme', S.theme === 'dark' ? 'to light' : 'to dark', 'theme', toggleTheme);
  A('Settings', 'date, courses, your data', 'gear', openSettings);
  A('Keyboard shortcuts', 'and how to turn the single-key ones off', 'go', showShortcuts);

  MODES.forEach(([id, nm, desc]) => out.push({ t: nm, s: desc, ic:'go', g:'Go to', go: () => go(id) }));
  out.push({ t:'The Atlas', s:'concept map', ic:'atlas', g:'Go to', go: () => go('atlas') });
  out.push({ t:'The Ledger', s:'your errors', ic:'ledger', g:'Go to', go: () => go('ledger') });
  SURFACES.forEach(([id, nm, mk, dom, blurb]) => out.push({ t: nm, s: blurb.split('.')[0], ic: mk, g:'Go to', go: () => go(id) }));

  DATA.written.exercises.forEach(e => out.push({
    t: e.title, s:`${e.course} ${e.year} · ${e.minutes} min`, ic:'bench', g:'Written papers',
    go: () => { EXAM = null; go('papers'); benchStart($('#stage'), e.id); } }));
  DATA.interview.themes.forEach(t => out.push({ t: t.label, s:'interview theme', ic:'panel', g:'Interview themes',
    go: () => { go('panel'); showTheme(t.id); } }));
  DATA.formulation.vignettes.forEach(v => out.push({ t: v.title, s: v.source, ic:'studio', g:'Cases',
    go: () => go('studio', v.id) }));
  DATA.roleplay.scenarios.forEach(r => out.push({ t: r.title, s: r.source, ic:'room', g:'Role-plays',
    go: () => { RP = { s:r, turn:0, score:0, max:0, log:[] }; go('room'); } }));
  DATA.concepts.nodes.forEach(n => out.push({ t: n.label, s: n.domain + ' · ' + (CLUSTER_LABEL[n.cluster] || n.cluster),
    ic:'atlas', g:'Concepts', go: () => showConcept(n.id) }));
  return out;
}
let PAL = null;
function openPalette() {
  PAL = paletteItems();
  const input = el('input', { type:'text', class:'cmdinput', role:'combobox', 'aria-expanded':'true',
                             'aria-controls':'cmdlist', 'aria-autocomplete':'list',
                             'aria-label':'Search actions, papers, themes, cases and concepts',
                             placeholder:'Search actions, papers, themes, cases, concepts…' });
  const list = el('div', { class:'cmdlist', id:'cmdlist', role:'listbox',
                           'aria-label':'Results' });
  let sel = 0, shown = [];

  function render(q) {
    const ql = q.toLowerCase().trim();
    shown = (ql ? PAL.filter(x => (x.t + ' ' + (x.s || '')).toLowerCase().includes(ql)) : PAL).slice(0, 60);
    sel = 0; list.innerHTML = '';
    let group = null;
    shown.forEach((x, i) => {
      if (x.g !== group) { group = x.g; list.appendChild(el('div', { class:'cmdgroup', text: group })); }
      const r = el('div', { class:'cmditem' + (i === 0 ? ' on' : ''), 'data-i':i,
                            id:'cmdopt' + i, role:'option',
                            'aria-selected': i === 0 ? 'true' : 'false',
                            onclick: () => { closeModal(); x.go(); } });
      r.innerHTML = `<span class="ci">${icon(x.ic || 'go', 16)}</span>
        <span class="ct">${esc(x.t)}</span><span class="h">${esc(x.s || '')}</span>`;
      list.appendChild(r);
    });
    if (!shown.length) list.appendChild(el('div', { class:'empty', style:'padding:34px', text:'Nothing matches' }));
    input.setAttribute('aria-activedescendant', shown.length ? 'cmdopt0' : '');
    announce(shown.length ? `${shown.length} result${shown.length === 1 ? '' : 's'}` : 'Nothing matches');
  }
  function move(d) {
    sel = Math.max(0, Math.min(shown.length - 1, sel + d));
    $$('.cmditem', list).forEach(r => {
      const isOn = +r.dataset.i === sel;
      r.classList.toggle('on', isOn);
      r.setAttribute('aria-selected', isOn ? 'true' : 'false');
    });
    const on = $('.cmditem.on', list);
    if (on) { on.scrollIntoView({ block:'nearest' }); input.setAttribute('aria-activedescendant', on.id); }
  }
  input.addEventListener('input', () => render(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter' && shown[sel]) { closeModal(); shown[sel].go(); }
  });

  const foot = el('div', { class:'cmdfoot' });
  foot.innerHTML = `<span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>`;

  const m = $('#modal');
  MODAL_RETURN = document.activeElement;
  m.innerHTML = '';
  m.setAttribute('aria-label', 'Command palette');
  m.removeAttribute('aria-labelledby');
  m.append(input, list, foot);
  m.removeAttribute('hidden');
  m.classList.add('on'); $('#scrim').classList.add('on');
  document.addEventListener('keydown', trapTab, true);
  render('');
  setTimeout(() => input.focus(), 60);
}

function toggleTheme() {
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
  save();
  if (VIEW === 'atlas') go('atlas');
  toast(S.theme === 'dark' ? 'Dark' : 'Light');
}

/* ---------------------------------------------------------- settings */
function exportProgress() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob),
                      download: 'dclinpsy-progress-' + new Date().toISOString().slice(0, 10) + '.json' });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Progress exported');
}

function openSettings() {
  const body = el('div');

  body.appendChild(el('div', { class:'lbl', style:'margin-bottom:8px', text:'Interview date' }));
  body.appendChild(el('p', { class:'src', style:'margin-bottom:11px',
    text:'This changes the scheduler. Inside 45 days review intervals tighten; inside 14 they halve, and sessions shift from acquiring material to retrieving it fast.' }));
  const dt = el('input', { type:'date', value: S.interviewDate || '' });
  dt.addEventListener('change', () => { S.interviewDate = dt.value || null; save(); if (VIEW === 'today') go('today'); });
  body.appendChild(dt);

  body.appendChild(el('div', { class:'lbl', style:'margin:24px 0 8px', text:'Your courses' }));
  const cw = el('div', { class:'card flat' });
  cw.innerHTML = `<p style="font-size:14px;color:var(--ink-2);margin:0 0 10px">
    <b>Cardiff · UCL · UEA</b>, with a fourth slot open. Cardiff is the only one of the three represented in the past-paper corpus, so Cardiff-specific guidance here is evidence-based and the rest is general. Verify every course's current selection process on its own site — these change year to year.</p>
    <p style="font-size:14px;color:var(--ink-2);margin:0">The corpus also covers Birmingham, Coventry &amp; Warwick, Exeter, Glasgow, Plymouth, Southampton and South Wales. Those papers are worth doing whatever your four are: the reasoning they test is common to all of them.</p>`;
  body.appendChild(cw);

  body.appendChild(el('div', { class:'lbl', style:'margin:24px 0 8px', text:'Preferences' }));
  const prefs = el('div', { class:'row wrap' });
  prefs.appendChild(segEl([['light','Light'], ['dark','Dark']], S.theme || 'light',
    v => { if (S.theme !== v) toggleTheme(); }));
  prefs.appendChild(segEl([[false,'Silent'], [true,'Sounds']], !!S.sound,
    v => { S.sound = v; save(); if (v) tick(880, .08, .05); }));
  body.appendChild(prefs);

  body.appendChild(el('div', { class:'lbl', style:'margin:24px 0 8px', text:'Your data' }));
  body.appendChild(el('p', { class:'src', style:'margin-bottom:11px',
    text:'Everything is stored in this browser only. Nothing is sent anywhere. Clearing site data erases your progress, so export it if you care about it.' }));
  const data = el('div', { class:'row wrap' });
  data.appendChild(el('button', { class:'btn sm', text:'Export', onclick: exportProgress }));
  const imp = el('input', { type:'file', accept:'.json', style:'display:none' });
  imp.addEventListener('change', () => {
    const f = imp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { S = Object.assign(blankState(), JSON.parse(r.result)); save(); closeModal(); go('today'); toast('Progress restored'); }
      catch (e) { toast('Could not read that file'); }
    };
    r.readAsText(f);
  });
  data.append(el('button', { class:'btn sm', text:'Import', onclick: () => imp.click() }), imp);
  data.appendChild(el('button', { class:'btn sm ghost', text:'Reset everything', onclick: () => {
    confirmDialog({
      title: 'Erase all progress?',
      text: 'Every answer, every scheduled review, your calibration record and your error ledger. ' +
            'This cannot be undone.',
      note: 'Export first if there is any chance you want it back — the file restores everything.',
      cancel: 'Keep my progress',
      third: 'Export first',
      danger: true,
      confirm: 'Erase everything',
      onThird: exportProgress,
      onConfirm: () => { S = blankState(); save(); go('today'); toast('Progress erased'); },
    });
  }}));
  body.appendChild(data);

  const cal = calibration();
  const stats = el('div', { class:'card flat', style:'margin-top:24px' });
  stats.innerHTML = `<div class="lbl">In this build</div>
    <p class="src" style="margin-top:8px">
      ${DATA.concepts.nodes.length} concepts · ${DATA.items.items.length} drill items ·
      ${DATA.written.exercises.length} written papers (${DATA.written.exercises.reduce((a,e)=>a+e.questions.reduce((b,q)=>b+q.rubric.length,0),0)} marking points) ·
      ${DATA.interview.questions.length} verbatim interview questions ·
      ${DATA.formulation.vignettes.length} multi-model cases · ${DATA.roleplay.scenarios.length} role-plays.<br><br>
      You have answered ${cal.n} confidence-rated item${cal.n === 1 ? '' : 's'} across ${Object.keys(S.c).length} concept${Object.keys(S.c).length === 1 ? '' : 's'}.</p>`;
  body.appendChild(stats);

  openModal('Settings', body);
}

/* ---------------------------------------------------------- first run
   One sentence and a way in. The three mechanics that used to be explained
   here — confidence, the depth ladder, adjudicated marking — are taught at
   the moment they first apply instead, where they mean something. */
function intro() {
  const body = el('div');
  body.innerHTML = `
    <p style="font-size:17px;line-height:1.55;margin-bottom:6px">
      Built from real material: past interview questions from eight courses, five written
      papers, and one official marking scheme.</p>
    <p class="src" style="margin-top:14px">Everything stays in this browser. Nothing is sent anywhere.</p>`;
  const b = el('button', { class:'btn pri lg wide', style:'margin-top:20px',
    text: 'Start the diagnostic — 12 items',
    onclick: () => { S.seenIntro = true; save(); closeModal(); startDrill(12); } });
  body.appendChild(b);
  const later = el('button', { class:'btn ghost wide', style:'margin-top:8px', text:'Look around first',
    onclick: () => { S.seenIntro = true; save(); closeModal(); } });
  body.appendChild(later);
  openModal('DClinPsy Trainer', body);
}

/* ---------------------------------------------------------- teaching moments
   Each fires once, the first time the thing it explains is on screen. This is
   what replaces the wall of text: the explanation arrives with the control. */
function coach(id, title, text) {
  S.coached = S.coached || {};
  if (S.coached[id]) return false;
  /* Never replace a dialog that is already open — a teaching prompt must not
     stomp a confirmation the learner is in the middle of answering. Leave it
     unmarked so it fires the next time the control appears. */
  if ($('#modal').classList.contains('on')) return false;
  S.coached[id] = Date.now(); save();
  const body = el('div');
  body.appendChild(el('p', { style:'font-size:15.5px;line-height:1.6;margin:0', text }));
  const b = el('button', { class:'btn pri wide', style:'margin-top:18px', text:'Got it',
                           onclick: closeModal });
  body.appendChild(b);
  openModal(title, body);
  return true;
}
const COACH = {
  confidence: ['Rate your confidence first',
    'Every item asks how sure you are before you answer. Being sure and wrong is the most ' +
    'important signal here — those items come back the same day, ahead of everything else.'],
  depth: ['Depth is earned level by level',
    'Recognising something never counts as mastering it. A concept only advances when you ' +
    'pass an item at that level, and a failed transfer item takes depth back.'],
  marking: ['You mark it, not the matcher',
    'Your text is scanned against each rubric point, then you confirm or override every tick. ' +
    'The matcher is literal and you are not — and that comparison is the exercise.'],
};
function coachOn(id) { const c = COACH[id]; return c ? coach(id, c[0], c[1]) : false; }

/* ---------------------------------------------------------- keyboard */
function showShortcuts() {
  const rows = [
    ['⌘K / Ctrl K', 'Command palette — every mode, paper, theme, case and concept'],
    ['?',           'This list'],
    ['1 – 5',       'Rate confidence on the open item'],
    ['A – F',       'Pick an answer'],
    ['↵',           'Continue past a result'],
    ['Esc',         'Close a dialog, or leave a session'],
    ['← →',         'Move between the three tabs when one is focused'],
  ];
  const body = el('div');
  const t = el('div', { class:'plate' });
  rows.forEach(([k, what]) => {
    const r = el('div', { class:'prow' });
    r.innerHTML = `<span style="flex:none;min-width:104px"><kbd>${esc(k)}</kbd></span>
      <span class="pmain"><span class="pname" style="font-weight:500">${esc(what)}</span></span>`;
    t.appendChild(r);
  });
  body.appendChild(t);
  const foot = el('div', { class:'row', style:'margin-top:18px;gap:12px' });
  foot.appendChild(el('span', { class:'src', style:'flex:1 1 auto',
    text: S.noHotkeys ? 'Single-key shortcuts are off. ⌘K and Esc still work.'
                      : 'Single-key shortcuts act only while an item is open.' }));
  foot.appendChild(el('button', { class:'btn sm',
    text: S.noHotkeys ? 'Turn single-key shortcuts on' : 'Turn single-key shortcuts off',
    onclick: () => { S.noHotkeys = !S.noHotkeys; save(); closeModal(); setTimeout(showShortcuts, 80); } }));
  body.appendChild(foot);
  openModal('Keyboard', body);
}

function keys() {
  document.addEventListener('keydown', e => {
    const t = e.target;
    const typing = !!(t && t.matches && t.matches('input, textarea, select'));
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape') {
      if ($('#modal').classList.contains('on')) { closeModal(); return; }
      if (SESSION && VIEW === 'drill') { quitDrill(); return; }
      return;
    }
    if (e.key === '?' && !typing) { e.preventDefault(); showShortcuts(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    /* Single-character shortcuts can be turned off (WCAG 2.1.4). They only
       ever act on an open item, but a switch user driving speech input needs
       to be able to stop them firing at all. */
    if (S.noHotkeys) return;
    // 1-5 sets confidence while an item is open
    if (/^[1-5]$/.test(e.key)) {
      const pip = $$('#actbar .pip')[+e.key - 1];
      if (pip) { e.preventDefault(); pip.click(); return; }
    }
    // a-f picks a choice
    if (/^[a-f]$/i.test(e.key)) {
      const i = e.key.toLowerCase().charCodeAt(0) - 97;
      const ch = $$('.choices > .choice:not(.locked)')[i];
      if (ch) { e.preventDefault(); ch.click(); }
    }
  });
}

/* ---------------------------------------------------------- go */
function boot() {
  load();
  document.documentElement.setAttribute('data-theme', S.theme || 'light');
  buildIndex();
  buildShell();
  keys();
  /* An answer given in the last 220ms before the tab closes used to be lost
     with the pending debounce. */
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('popstate', () => applyRoute(true));
  window.addEventListener('hashchange', () => applyRoute(true));
  applyRoute();
  if (!S.seenIntro) setTimeout(intro, 460);
  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (VIEW === 'atlas') go('atlas'); }, 240);
  });
}
document.addEventListener('DOMContentLoaded', boot);
