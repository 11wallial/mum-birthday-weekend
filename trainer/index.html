["a measure of validity","a measure of test-retest stability"],"parents":["reliability"],"related":["measurement_error"]},{"id":"kappa","label":"Cohen's kappa","domain":"research","cluster":"measurement","tier":2,"precision":"Inter-rater agreement corrected for agreement expected by chance; values around .41–.60 are moderate, .61–.80 substantial.","notThis":["a percentage agreement","a correlation between raters"],"parents":["reliability"],"related":["reliability"]},{"id":"validity","label":"Validity","domain":"research","cluster":"measurement","tier":1,"precision":"The extent to which a measure captures the construct it claims to — face (looks right), content (covers the domain), construct (behaves as theory predicts), criterion (agrees with a standard, concurrently or predictively).","notThis":["whether the measure gives the same answer twice","whether the study was well conducted"],"parents":[],"related":["reliability","internal_validity","external_validity"]},{"id":"internal_validity","label":"Internal validity","domain":"research","cluster":"measurement","tier":1,"precision":"The degree to which the design supports the claim that the intervention, rather than something else, produced the observed change.","notThis":["whether the findings apply elsewhere"],"parents":["validity"],"related":["external_validity","confounding","rct"]},{"id":"external_validity","label":"External validity / generalisability","domain":"research","cluster":"measurement","tier":1,"precision":"The degree to which findings extend beyond the sampled participants, settings and procedures; governed principally by whether the sample is representative of the population of interest, not by its size.","notThis":["achieved by having a large sample","the same as ecological validity"],"parents":["validity"],"related":["internal_validity","sampling","ecological_validity"]},{"id":"ecological_validity","label":"Ecological validity","domain":"research","cluster":"measurement","tier":3,"precision":"Whether the conditions of measurement resemble the real-world context to which inference is intended.","notThis":[],"parents":["external_validity"],"related":[]},{"id":"measurement_error","label":"Measurement error","domain":"research","cluster":"measurement","tier":1,"precision":"The discrepancy between an observed score and the true score; random error attenuates observed associations, systematic error biases them in a direction.","notThis":["a mistake made by the researcher","always random"],"parents":["reliability"],"related":["regression_to_mean","reliable_change","attenuation"]},{"id":"attenuation","label":"Attenuation","domain":"research","cluster":"measurement","tier":3,"precision":"The downward bias in an observed correlation produced by unreliability in either measure.","notThis":[],"parents":["measurement_error"],"related":["correlation"]},{"id":"floor_ceiling","label":"Floor and ceiling effects","domain":"research","cluster":"measurement","tier":2,"precision":"Compression of scores at the bottom or top of a scale's range, which conceals real change and truncates variance.","notThis":["a small sample problem"],"parents":[],"related":["measurement_error"]},{"id":"sampling","label":"Sampling and recruitment","domain":"research","cluster":"bias","tier":1,"precision":"How participants come to be in the study determines to whom the findings can apply; convenience and self-selected samples systematically differ from the target population.","notThis":["a large sample removes sampling problems"],"parents":[],"related":["selection_bias","external_validity"]},{"id":"selection_bias","label":"Selection bias","domain":"research","cluster":"bias","tier":1,"precision":"Systematic difference between those included and the population, or between arms at baseline, such that the comparison is confounded from the outset.","notThis":["choosing the wrong statistical test","the same as attrition"],"parents":["sampling"],"related":["allocation_concealment","attrition","confounding"]},{"id":"attrition","label":"Attrition / dropout","domain":"research","cluster":"bias","tier":1,"precision":"Loss of participants after entry. It matters not because numbers fall but because those who leave differ systematically from those who remain, so the completed sample is no longer the randomised one.","notThis":["a problem only if the sample becomes small","solved by recruiting more people"],"parents":["selection_bias"],"related":["itt","missing_data","longitudinal"]},{"id":"missing_data","label":"Missing data","domain":"research","cluster":"bias","tier":2,"precision":"Handled by understanding the mechanism — missing completely at random, at random, or not at random; last-observation-carried-forward assumes no further change and biases toward the null, multiple imputation is generally preferable.","notThis":["deleting incomplete cases is neutral"],"parents":["attrition"],"related":["itt"]},{"id":"performance_bias","label":"Performance bias","domain":"research","cluster":"bias","tier":3,"precision":"Systematic differences in the care or attention provided to arms beyond the intended intervention.","notThis":[],"parents":["blinding"],"related":["detection_bias"]},{"id":"detection_bias","label":"Detection bias","domain":"research","cluster":"bias","tier":2,"precision":"Systematic difference in how outcomes are ascertained between arms, most often when assessors know allocation; self-report by unblinded participants is especially exposed.","notThis":["the same as performance bias"],"parents":["blinding"],"related":["performance_bias","blinding"]},{"id":"recall_bias","label":"Recall bias","domain":"research","cluster":"bias","tier":3,"precision":"Differential accuracy of retrospective reporting between those with and without the outcome.","notThis":[],"parents":["case_control"],"related":[]},{"id":"demand_characteristics","label":"Demand characteristics & expectancy","domain":"research","cluster":"bias","tier":2,"precision":"Participants' inference about what is wanted, and their expectation of benefit, shaping responses independently of the active ingredient.","notThis":["deliberate faking"],"parents":[],"related":["common_factors","blinding"]},{"id":"confounding","label":"Confounding","domain":"research","cluster":"bias","tier":1,"precision":"A third variable associated with both exposure and outcome, and not on the causal path, which generates or distorts an apparent association.","notThis":["any variable you did not measure","the same as a mediator"],"parents":[],"related":["causation","mediation","covariate","rct"]},{"id":"covariate","label":"Covariates and statistical control","domain":"research","cluster":"bias","tier":3,"precision":"Measured variables adjusted for in analysis; adjustment can only address confounders that were measured, and measured imperfectly it under-adjusts.","notThis":["adjustment makes an observational study equivalent to a trial"],"parents":["confounding"],"related":["regression"]},{"id":"regression_to_mean","label":"Regression to the mean","domain":"research","cluster":"bias","tier":1,"precision":"The statistical tendency for extreme scores, selected because they are extreme, to be closer to the mean on re-measurement — because part of the original extremity was measurement error or transient state. It creates apparent improvement in any group selected for high scores, with no intervention at all.","notThis":["people naturally get better over time","a real treatment effect that is small"],"parents":["measurement_error"],"related":["control_group","natural_history"]},{"id":"natural_history","label":"Natural history / spontaneous remission","domain":"research","cluster":"bias","tier":2,"precision":"The course a condition takes without intervention, which an uncontrolled pre-post design cannot separate from treatment effect.","notThis":["the same as regression to the mean"],"parents":[],"related":["regression_to_mean","control_group"]},{"id":"causation","label":"Causal inference","domain":"research","cluster":"bias","tier":1,"precision":"Supported by temporal precedence, association, and elimination of plausible alternative explanations. Design, not statistical sophistication, is what licenses a causal claim.","notThis":["a strong correlation shows causation","regression establishes causation"],"parents":["correlation"],"related":["confounding","rct","experiment_vs_observation","bradford_hill"]},{"id":"bradford_hill","label":"Bradford Hill considerations","domain":"research","cluster":"bias","tier":3,"precision":"Viewpoints used to weigh causality from observational evidence — strength, consistency, temporality, dose-response, plausibility, coherence, experiment, analogy, specificity.","notThis":[],"parents":["causation"],"related":[]},{"id":"mediation","label":"Mediation","domain":"research","cluster":"bias","tier":1,"precision":"A mediator lies on the causal pathway and explains HOW or WHY an effect occurs: X changes M, and M changes Y.","notThis":["a variable that changes the strength of an effect","the same as a moderator","any variable that correlates with both"],"parents":["regression"],"related":["moderation","confounding","mechanism"]},{"id":"moderation","label":"Moderation","domain":"research","cluster":"bias","tier":1,"precision":"A moderator changes the strength or direction of the relationship between X and Y — it answers FOR WHOM or UNDER WHAT CONDITIONS, and is tested as an interaction.","notThis":["a variable on the causal pathway","the same as a mediator"],"parents":["regression"],"related":["mediation","interaction"]},{"id":"incidence","label":"Incidence","domain":"research","cluster":"epi","tier":1,"precision":"The rate of NEW cases arising in a defined population over a defined period.","notThis":["the total number of people with the condition","the same as prevalence"],"parents":[],"related":["prevalence","cohort"]},{"id":"prevalence","label":"Prevalence","domain":"research","cluster":"epi","tier":1,"precision":"The proportion of a population with the condition at a point or over a period — existing and new cases together. It is a function of incidence and duration, so a treatment that prolongs life raises prevalence.","notThis":["the number of new cases","the same as incidence"],"parents":[],"related":["incidence","cross_sectional"]},{"id":"absolute_relative_risk","label":"Absolute vs relative risk","domain":"research","cluster":"epi","tier":2,"precision":"Relative risk expresses the ratio between groups and can look dramatic when baseline risk is tiny; absolute risk difference expresses the change in actual events and drives clinical relevance. NNT is its reciprocal.","notThis":["relative risk is the more clinically useful figure"],"parents":[],"related":["effect_size","clinical_significance"]},{"id":"saturation","label":"Data saturation","domain":"research","cluster":"qualitative","tier":2,"precision":"The point in qualitative sampling at which further data generate no new codes or dimensions; a claim requiring evidence, not an assertion, and contested in IPA where sample size is set idiographically.","notThis":["the point where you have enough participants for power"],"parents":["qualitative_designs"],"related":["reflexivity"]},{"id":"reflexivity","label":"Reflexivity","domain":"research","cluster":"qualitative","tier":1,"precision":"The researcher's systematic examination of how their position, assumptions and relationship to the data shape what is produced — recorded and evidenced, not merely declared.","notThis":["being objective","acknowledging bias in one sentence"],"parents":["qualitative_designs"],"related":["trustworthiness","epistemology"]},{"id":"trustworthiness","label":"Trustworthiness criteria","domain":"research","cluster":"qualitative","tier":2,"precision":"Credibility, transferability, dependability and confirmability — the qualitative counterparts to validity and reliability, evidenced through audit trail, triangulation, credibility checks and thick description.","notThis":["reliability and validity applied unchanged"],"parents":["qualitative_designs"],"related":["triangulation","reflexivity"]},{"id":"triangulation","label":"Triangulation","domain":"research","cluster":"qualitative","tier":3,"precision":"Convergence across data sources, methods, analysts or theories used to strengthen interpretation, not to prove a single truth.","notThis":[],"parents":["trustworthiness"],"related":["mixed_methods"]},{"id":"epistemology","label":"Epistemological position","domain":"research","cluster":"qualitative","tier":2,"precision":"The stated assumption about what the data can represent — realist, critical realist, or social constructionist — which must be coherent with the method chosen and the claims made.","notThis":["a methodological preference"],"parents":["qualitative_designs"],"related":["reflexivity"]},{"id":"formulation","label":"Formulation","domain":"clinical","cluster":"formulation","tier":1,"precision":"A provisional, shared, theory-driven account of how a person's difficulties developed and what maintains them, which generates testable predictions and directs intervention — and is revised as evidence accumulates.","notThis":["a summary of the person's history","a diagnosis expressed in psychological language","a fixed conclusion reached at assessment"],"parents":[],"related":["five_ps","maintenance_cycle","cbt_model","systemic","hypothesis_testing"]},{"id":"five_ps","label":"The 5 Ps","domain":"clinical","cluster":"formulation","tier":1,"precision":"Predisposing, precipitating, perpetuating, protective and presenting factors — a structuring device for a formulation, not a formulation in itself, because it organises content without specifying mechanism.","notThis":["a psychological model","sufficient on its own as a formulation"],"parents":["formulation"],"related":["maintenance_cycle"]},{"id":"maintenance_cycle","label":"Maintenance mechanisms","domain":"clinical","cluster":"formulation","tier":1,"precision":"The self-perpetuating loops that keep a difficulty going in the present — most commonly short-term relief that reinforces a behaviour whose long-term consequence sustains the problem.","notThis":["the cause of the problem","the same as predisposing factors"],"parents":["formulation"],"related":["safety_behaviours","avoidance","negative_reinforcement","circular_causality"]},{"id":"hypothesis_testing","label":"Formulation as hypothesis","domain":"clinical","cluster":"formulation","tier":1,"precision":"A formulation earns its status by making predictions that could prove it wrong — what should be observed if it is right, what would make it less plausible, and what would require revision.","notThis":["a formulation is right if the client agrees","the more comprehensive the formulation the better"],"parents":["formulation"],"related":["scientist_practitioner","formulation"]},{"id":"cbt_model","label":"Cognitive behavioural model","domain":"clinical","cluster":"models","tier":1,"precision":"Appraisal of a situation drives emotional and physiological response and behaviour; the behaviour's consequences feed back to confirm the appraisal. Disorder-specific models specify which appraisal and which maintaining behaviour.","notThis":["thinking positively","challenging irrational thoughts"],"parents":["formulation"],"related":["safety_behaviours","avoidance","behavioural_experiment","core_beliefs","exposure","behavioural_activation"]},{"id":"core_beliefs","label":"Core and intermediate beliefs","domain":"clinical","cluster":"models","tier":2,"precision":"Core beliefs are absolute statements about self, others and world; intermediate beliefs are the rules, attitudes and assumptions that translate them into everyday appraisals.","notThis":["the same as automatic thoughts"],"parents":["cbt_model"],"related":["schema"]},{"id":"schema","label":"Schema-level work","domain":"clinical","cluster":"models","tier":3,"precision":"Longstanding, self-perpetuating patterns addressed when symptom-level intervention is insufficient, using experiential as well as cognitive methods.","notThis":[],"parents":["core_beliefs"],"related":[]},{"id":"safety_behaviours","label":"Safety behaviours","domain":"clinical","cluster":"models","tier":1,"precision":"Actions taken to prevent a feared catastrophe which prevent disconfirmation of the feared appraisal, so the person attributes safety to the behaviour rather than to the absence of danger.","notThis":["the same as avoidance","coping strategies that should be encouraged"],"parents":["cbt_model"],"related":["avoidance","exposure","behavioural_experiment"]},{"id":"avoidance","label":"Avoidance and negative reinforcement","domain":"clinical","cluster":"models","tier":1,"precision":"Escape or avoidance reduces distress immediately, which negatively reinforces the behaviour and guarantees its repetition while removing the opportunity to learn that the feared outcome does not occur.","notThis":["a character weakness","removed by encouragement alone"],"parents":["cbt_model"],"related":["negative_reinforcement","exposure","safety_behaviours"]},{"id":"negative_reinforcement","label":"Negative reinforcement","domain":"clinical","cluster":"models","tier":1,"precision":"The strengthening of a behaviour by the removal of an aversive state — the mechanism behind avoidance, reassurance-seeking, self-harm as affect regulation, and much staff behaviour in services.","notThis":["punishment","a reward for good behaviour"],"parents":[],"related":["avoidance","operant"]},{"id":"operant","label":"Operant learning","domain":"clinical","cluster":"models","tier":2,"precision":"Behaviour is shaped by its consequences — positive and negative reinforcement increase it, punishment and extinction decrease it — with schedule and immediacy determining strength.","notThis":["only relevant to children or learning disability"],"parents":[],"related":["negative_reinforcement","functional_analysis"]},{"id":"functional_analysis","label":"Functional analysis","domain":"clinical","cluster":"models","tier":2,"precision":"Analysis of antecedents, behaviour and consequences to identify the function a behaviour serves, on the premise that topographically identical behaviours may serve different functions.","notThis":["describing the behaviour in detail","identifying the diagnosis"],"parents":["operant"],"related":["behaviour_chain","pbs"]},{"id":"exposure","label":"Exposure and inhibitory learning","domain":"clinical","cluster":"models","tier":1,"precision":"Repeated contact with feared stimuli without the feared outcome builds new safety learning that competes with the original fear memory; modern accounts prioritise expectancy violation and variability over habituation and anxiety reduction within a session.","notThis":["getting used to it until anxiety drops","flooding"],"parents":["cbt_model"],"related":["safety_behaviours","behavioural_experiment"]},{"id":"behavioural_experiment","label":"Behavioural experiment","domain":"clinical","cluster":"models","tier":1,"precision":"A planned test in which a specific prediction derived from the formulation is stated in advance, tested in reality, and the result reviewed against the prediction — the most potent method of belief change in CBT.","notThis":["an exposure task","an activity assignment"],"parents":["cbt_model"],"related":["exposure","hypothesis_testing"]},{"id":"behavioural_activation","label":"Behavioural activation","domain":"clinical","cluster":"models","tier":1,"precision":"Systematically re-engaging with activity guided by values and function rather than mood, on the rationale that withdrawal reduces access to positive reinforcement and so maintains low mood; activity precedes rather than follows motivation.","notThis":["encouraging the person to keep busy","doing things that feel pleasant"],"parents":["cbt_model"],"related":["operant","avoidance"]},{"id":"act","label":"Acceptance and Commitment Therapy","domain":"clinical","cluster":"models","tier":1,"precision":"Targets psychological inflexibility through six processes — acceptance, defusion, present-moment contact, self-as-context, values and committed action — asking not whether a thought is accurate but what happens when it governs behaviour.","notThis":["a mindfulness intervention","accepting that things cannot change"],"parents":[],"related":["defusion","values","experiential_avoidance","cbt_model"]},{"id":"defusion","label":"Cognitive defusion","domain":"clinical","cluster":"models","tier":2,"precision":"Changing the relationship to a thought so it is experienced as a thought rather than as a literal truth, without attempting to change its content.","notThis":["thought challenging","distraction"],"parents":["act"],"related":["act"]},{"id":"experiential_avoidance","label":"Experiential avoidance","domain":"clinical","cluster":"models","tier":2,"precision":"Attempts to alter the form or frequency of unwanted internal experiences, which narrow behaviour and restrict valued living even when momentarily effective.","notThis":["behavioural avoidance only"],"parents":["act"],"related":["avoidance","values"]},{"id":"values","label":"Values and committed action","domain":"clinical","cluster":"models","tier":2,"precision":"Chosen qualities of ongoing action that give direction — distinguished from goals, which can be completed — used to organise behaviour in the presence of discomfort.","notThis":["goals","things the person enjoys"],"parents":["act"],"related":["behavioural_activation"]},{"id":"dbt","label":"Dialectical Behaviour Therapy","domain":"clinical","cluster":"models","tier":1,"precision":"Built on a biosocial theory in which emotional vulnerability transacts over time with an invalidating environment; treatment holds the dialectic of radical acceptance and change across skills, individual therapy, coaching and consultation.","notThis":["skills training for emotion regulation","a treatment for personality disorder"],"parents":[],"related":["validation","behaviour_chain","distress_tolerance","biosocial"]},{"id":"biosocial","label":"Biosocial theory","domain":"clinical","cluster":"models","tier":2,"precision":"Pervasive emotion dysregulation arises from the transaction between biological emotional vulnerability and an environment that invalidates the communication of private experience — a transaction, not an additive risk model.","notThis":["a diathesis-stress model","blaming the family"],"parents":["dbt"],"related":["validation"]},{"id":"validation","label":"Validation","domain":"clinical","cluster":"models","tier":1,"precision":"Communicating that a response makes sense given the person's history and current context, at increasing levels up to radical genuineness — which is not agreement, and not reassurance.","notThis":["telling the person they are right","being sympathetic"],"parents":["dbt"],"related":["biosocial","therapeutic_alliance"]},{"id":"behaviour_chain","label":"Chain analysis","domain":"clinical","cluster":"models","tier":2,"precision":"Second-by-second reconstruction of vulnerability factors, prompting event, links and consequences around a target behaviour, to locate solvable points in the chain.","notThis":["asking why the person did it"],"parents":["dbt"],"related":["functional_analysis"]},{"id":"distress_tolerance","label":"Distress tolerance","domain":"clinical","cluster":"models","tier":3,"precision":"Skills for surviving crisis without making it worse, distinguished from emotion regulation skills that aim to change the emotion.","notThis":[],"parents":["dbt"],"related":[]},{"id":"cft","label":"Compassion Focused Therapy","domain":"clinical","cluster":"models","tier":1,"precision":"Addresses shame and self-criticism using an evolutionary model of three affect-regulation systems — threat, drive and soothing — where a chronically activated threat system and an underdeveloped soothing system make self-criticism feel safe and compassion feel threatening.","notThis":["being kind to yourself","positive self-talk"],"parents":[],"related":["shame","therapeutic_alliance"]},{"id":"shame","label":"Shame and self-criticism","domain":"clinical","cluster":"models","tier":2,"precision":"Shame concerns the self as globally defective and drives concealment and withdrawal; guilt concerns an action and drives repair. The distinction changes what the intervention must target.","notThis":["shame and guilt are interchangeable"],"parents":["cft"],"related":["cft"]},{"id":"systemic","label":"Systemic practice","domain":"clinical","cluster":"models","tier":1,"precision":"Locates difficulty in patterns of interaction and meaning between people rather than within an individual, attending to circularity, feedback, roles, alliances, boundaries and wider context.","notThis":["family therapy","involving the family in the session"],"parents":[],"related":["circular_causality","hypothesising","reflecting_team","narrative","context"]},{"id":"circular_causality","label":"Circular vs linear causality","domain":"clinical","cluster":"models","tier":1,"precision":"Linear causality asks what caused what; circular causality describes recursive sequences in which each person's response is both a reaction to and a stimulus for the other's, so the pattern maintains itself without a first cause.","notThis":["mutual blame","saying everyone is equally responsible"],"parents":["systemic"],"related":["maintenance_cycle","systemic"]},{"id":"hypothesising","label":"Systemic hypothesising and neutrality","domain":"clinical","cluster":"models","tier":2,"precision":"The team generates multiple provisional relational hypotheses and holds curiosity across all positions, using circular and reflexive questions to introduce difference rather than to gather facts.","notThis":["staying neutral about abuse or risk","having no view"],"parents":["systemic"],"related":["circular_causality"]},{"id":"reflecting_team","label":"Reflecting processes","domain":"clinical","cluster":"models","tier":3,"precision":"Making the team's thinking audible to the family so that multiple descriptions become available and the family can select what fits.","notThis":[],"parents":["systemic"],"related":[]},{"id":"narrative","label":"Narrative practice","domain":"clinical","cluster":"models","tier":2,"precision":"Separates the person from the problem through externalising language and thickens alternative accounts by tracing unique outcomes into a preferred story.","notThis":["positive reframing","denying the problem"],"parents":["systemic"],"related":["systemic"]},{"id":"context","label":"Contextual levels","domain":"clinical","cluster":"models","tier":2,"precision":"Individual, family, service, community and societal levels each carry constraints and resources; a formulation that omits the level at which the problem is generated will misdirect the intervention.","notThis":["adding a sentence about culture"],"parents":["systemic"],"related":["social_determinants","ptmf"]},{"id":"psychodynamic","label":"Psychodynamic thinking","domain":"clinical","cluster":"models","tier":1,"precision":"Attends to processes outside awareness, early relational templates and defensive manoeuvres, using the relationship in the room as data about relationships outside it.","notThis":["blaming the mother","interpreting dreams"],"parents":[],"related":["transference","defence","attachment"]},{"id":"transference","label":"Transference and countertransference","domain":"clinical","cluster":"models","tier":1,"precision":"Transference is the patterning of the therapeutic relationship by earlier relational templates; countertransference is the therapist's total emotional response, which when noticed and thought about becomes information rather than interference.","notThis":["the therapist's personal problems","liking or disliking the client"],"parents":["psychodynamic"],"related":["use_of_self","supervision"]},{"id":"defence","label":"Defences","domain":"clinical","cluster":"models","tier":2,"precision":"Automatic mental operations that manage unbearable affect or conflict — denial, projection, splitting, intellectualisation, reaction formation — understood as protective in origin.","notThis":["deliberate resistance","lying"],"parents":["psychodynamic"],"related":["transference"]},{"id":"attachment","label":"Attachment","domain":"clinical","cluster":"models","tier":1,"precision":"Repeated experience of caregiver availability builds internal working models of self and others that shape expectation, affect regulation and help-seeking, including from services — organised strategies (secure, avoidant, ambivalent) being adaptations to particular caregiving environments rather than deficits.","notThis":["a fixed childhood type that determines adult relationships","a diagnosis"],"parents":["psychodynamic"],"related":["developmental","trauma"]},{"id":"ptmf","label":"Power Threat Meaning Framework","domain":"clinical","cluster":"models","tier":2,"precision":"An alternative to diagnostic classification asking what has happened to you, how it affected you, what sense you made of it, and what you had to do to survive — foregrounding the operation of power and reframing symptoms as threat responses.","notThis":["a therapy model","a rejection of all biological factors"],"parents":[],"related":["context","social_determinants","trauma","formulation"]},{"id":"trauma","label":"Trauma-informed practice","domain":"clinical","cluster":"models","tier":1,"precision":"Organises services and interventions around the likelihood of trauma histories, prioritising safety, trustworthiness, choice, collaboration and empowerment, and asking what happened rather than what is wrong.","notThis":["delivering trauma-focused therapy","asking everyone about abuse"],"parents":[],"related":["ptmf","attachment","retraumatisation"]},{"id":"retraumatisation","label":"Re-traumatisation in systems","domain":"clinical","cluster":"models","tier":3,"precision":"The reproduction of dynamics of powerlessness and coercion by services themselves — restriction, unpredictability, being disbelieved.","notThis":[],"parents":["trauma"],"related":[]},{"id":"developmental","label":"Developmental perspective","domain":"clinical","cluster":"models","tier":2,"precision":"Reading presentation against expected developmental tasks and capacities, so that the same behaviour carries different meaning at different ages and in different developmental contexts.","notThis":["only relevant to child services"],"parents":[],"related":["attachment","cyp"]},{"id":"cyp","label":"Children & young people context","domain":"clinical","cluster":"models","tier":2,"precision":"Work is nested in family, school and statutory systems, the referrer is rarely the client, and consent, confidentiality and goals must be negotiated across several parties at once.","notThis":["therapy with a smaller adult"],"parents":["developmental"],"related":["systemic","safeguarding","gillick"]},{"id":"common_factors","label":"Common factors","domain":"clinical","cluster":"models","tier":2,"precision":"Alliance, expectancy, therapist effects and structure account for a substantial share of outcome variance across models — which is why an active comparator, not TAU, is required to attribute change to a specific technique.","notThis":["proof that models do not matter"],"parents":[],"related":["therapeutic_alliance","control_group"]},{"id":"therapeutic_alliance","label":"Therapeutic alliance","domain":"clinical","cluster":"clinical_skills","tier":1,"precision":"The bond, plus agreement on goals and on tasks. Rupture is expected rather than exceptional, and repair — noticing, naming and exploring it without defensiveness — predicts outcome more than the absence of rupture.","notThis":["rapport","the client liking the therapist"],"parents":[],"related":["rupture_repair","common_factors","validation"]},{"id":"rupture_repair","label":"Rupture and repair","domain":"clinical","cluster":"clinical_skills","tier":2,"precision":"Withdrawal or confrontation markers in the relationship, addressed directly and metacommunicatively, converting a threat to the work into the work itself.","notThis":["apologising"],"parents":["therapeutic_alliance"],"related":["use_of_self"]},{"id":"use_of_self","label":"Use of self","domain":"clinical","cluster":"clinical_skills","tier":2,"precision":"Deliberate deployment of one's own responses — noticing what the interaction evokes and using it as hypothesis about the person's wider relational world, rather than acting on it.","notThis":["self-disclosure","being warm"],"parents":["transference"],"related":["reflective_practice","rupture_repair"]},{"id":"risk_assessment","label":"Risk assessment","domain":"clinical","cluster":"risk","tier":1,"precision":"Structured professional judgement combining static and dynamic factors, current thoughts, intent, plan, means, timeframe and protective factors into a formulation of when and under what circumstances risk rises — not a prediction, and not a score.","notThis":["predicting who will harm themselves","completing a risk tool","counting risk factors"],"parents":[],"related":["risk_formulation","safety_plan","static_dynamic","suicide_risk"]},{"id":"static_dynamic","label":"Static vs dynamic risk factors","domain":"clinical","cluster":"risk","tier":1,"precision":"Static factors (history of attempts, age, sex, past violence) index long-run base rate and cannot change; dynamic factors (hopelessness, intoxication, access to means, isolation, recent loss) are the intervention targets.","notThis":["dynamic factors are the ones that are hard to measure"],"parents":["risk_assessment"],"related":["risk_formulation"]},{"id":"risk_formulation","label":"Risk formulation","domain":"clinical","cluster":"risk","tier":1,"precision":"A narrative account of the circumstances under which this person's risk escalates and what interrupts it, which converts a list of factors into a plan.","notThis":["a risk rating of low, medium or high"],"parents":["risk_assessment"],"related":["safety_plan","formulation"]},{"id":"suicide_risk","label":"Suicidality","domain":"clinical","cluster":"risk","tier":1,"precision":"Assessed by asking directly and specifically about ideation, intent, plan, means, preparatory acts, timeframe and previous attempts; asking does not increase risk, and denial of intent in the presence of high dynamic risk does not exclude it.","notThis":["asking about suicide plants the idea","no plan means low risk"],"parents":["risk_assessment"],"related":["safety_plan","self_harm"]},{"id":"self_harm","label":"Self-harm","domain":"clinical","cluster":"risk","tier":1,"precision":"Most often functions as affect regulation or communication rather than as an attempt to die, though it is among the strongest predictors of eventual suicide; function must be formulated before it can be addressed.","notThis":["attention seeking","always a suicide attempt"],"parents":["risk_assessment"],"related":["suicide_risk","functional_analysis","dbt"]},{"id":"safety_plan","label":"Safety planning","domain":"clinical","cluster":"risk","tier":1,"precision":"A collaboratively written, person-specific sequence — warning signs, internal coping, people and settings that distract, people to contact, professionals, and means restriction — replacing the no-suicide contract, which has no evidence base.","notThis":["a contract not to self-harm","giving crisis line numbers"],"parents":["risk_formulation"],"related":["means_restriction"]},{"id":"means_restriction","label":"Means restriction","domain":"clinical","cluster":"risk","tier":2,"precision":"Reducing access to lethal means during periods of elevated risk, effective because much suicidal crisis is short-lived and method-substitution is incomplete.","notThis":["ineffective because people will find another way"],"parents":["safety_plan"],"related":[]},{"id":"safeguarding","label":"Safeguarding","domain":"clinical","cluster":"ethics","tier":1,"precision":"The duty to act where a child or adult at risk may be experiencing abuse or neglect, which overrides ordinary confidentiality, follows local procedure, and is a referral for assessment rather than an accusation requiring proof.","notThis":["only relevant when you are certain","something to decide alone"],"parents":[],"related":["confidentiality","cyp","escalation"]},{"id":"confidentiality","label":"Confidentiality and its limits","domain":"clinical","cluster":"ethics","tier":1,"precision":"Information is shared on a need-to-know basis with the minimum necessary disclosed; limits — risk to self or others, safeguarding, court order — should be stated at the outset rather than invoked as a surprise.","notThis":["absolute unless the client agrees","broken whenever risk is mentioned"],"parents":[],"related":["safeguarding","capacity","information_governance"]},{"id":"information_governance","label":"Information governance","domain":"professional","cluster":"ethics","tier":3,"precision":"Caldicott principles and data protection duties governing what is recorded, who may see it and how long it is kept.","notThis":[],"parents":["confidentiality"],"related":[]},{"id":"capacity","label":"Mental capacity","domain":"clinical","cluster":"ethics","tier":1,"precision":"Decision-specific and time-specific: a person lacks capacity if an impairment of mind or brain means they cannot understand, retain, weigh, or communicate a decision. Capacity is presumed, unwise decisions do not indicate its absence, and all practicable support must be given first.","notThis":["a global judgement about a person","absent because the decision seems unwise","determined by diagnosis"],"parents":[],"related":["best_interests","mca","dols"]},{"id":"mca","label":"Mental Capacity Act 2005","domain":"clinical","cluster":"ethics","tier":1,"precision":"Five principles: presumption of capacity; all practicable steps to support decision-making; unwise decisions do not equal incapacity; acts for those lacking capacity must be in their best interests; and the least restrictive option must be chosen.","notThis":["a mechanism for detaining people","applies to all decisions once someone is judged to lack capacity"],"parents":["capacity"],"related":["best_interests","dols","mha"]},{"id":"best_interests","label":"Best interests","domain":"clinical","cluster":"ethics","tier":1,"precision":"A structured decision for someone lacking capacity that must consider their past and present wishes, beliefs and values, consult those close to them, avoid assumptions based on age or condition, and take the least restrictive route.","notThis":["what the clinician judges medically best","what the family wants"],"parents":["mca"],"related":["dols","capacity"]},{"id":"dols","label":"Deprivation of liberty safeguards","domain":"clinical","cluster":"ethics","tier":2,"precision":"Authorisation required where a person who lacks capacity is under continuous supervision and control and not free to leave — the acid test — in a setting arranged by the state.","notThis":["needed whenever someone is in hospital","the same as detention under the Mental Health Act"],"parents":["mca"],"related":["mha","best_interests"]},{"id":"mha","label":"Mental Health Act 1983/2007","domain":"clinical","cluster":"ethics","tier":1,"precision":"Governs detention and treatment for mental disorder: s2 for assessment up to 28 days, s3 for treatment up to 6 months, s5(2) doctor's holding power and s5(4) nurse's, s136 police power in a public place, s117 the joint duty to provide free aftercare following s3.","notThis":["overrides the Mental Capacity Act in all situations","requires the person to lack capacity"],"parents":[],"related":["mca","dols","least_restrictive"]},{"id":"least_restrictive","label":"Least restrictive practice","domain":"clinical","cluster":"ethics","tier":2,"precision":"Choosing the option that achieves the purpose with the smallest interference with rights and freedom of action, and reviewing it as circumstances change.","notThis":["avoiding restriction altogether"],"parents":[],"related":["mca","mha","positive_risk"]},{"id":"gillick","label":"Gillick competence & Fraser guidelines","domain":"clinical","cluster":"ethics","tier":2,"precision":"Gillick competence is a child's capacity to consent to treatment where they have sufficient understanding and intelligence; Fraser guidelines specifically concern contraceptive and sexual health advice.","notThis":["the two terms are interchangeable","determined by age alone"],"parents":["capacity"],"related":["cyp","confidentiality"]},{"id":"positive_risk","label":"Positive risk-taking","domain":"clinical","cluster":"ethics","tier":2,"precision":"Supporting a person to pursue valued activity with acknowledged risk, having assessed, formulated, documented and shared the reasoning — defensible practice rather than defensive practice.","notThis":["accepting risk without a plan","avoiding all risk"],"parents":["least_restrictive"],"related":["risk_formulation","documentation"]},{"id":"dual_relationship","label":"Boundaries and dual relationships","domain":"professional","cluster":"ethics","tier":2,"precision":"Role clarity protects the person and the work; boundary crossings are managed by naming them, thinking about function, and taking them to supervision rather than deciding alone.","notThis":["never having any contact outside sessions"],"parents":[],"related":["supervision","social_media_boundary"]},{"id":"social_media_boundary","label":"Digital and social media boundaries","domain":"professional","cluster":"ethics","tier":2,"precision":"Contact through personal channels is not a therapeutic medium, is not monitored, and cannot carry risk; the response is to acknowledge, redirect to the agreed route, ensure immediate safety, and address the frame in the next session.","notThis":["ignoring the message","responding clinically through the same channel"],"parents":["dual_relationship"],"related":["risk_assessment","documentation"]},{"id":"documentation","label":"Record keeping","domain":"professional","cluster":"ethics","tier":2,"precision":"Contemporaneous, factual, proportionate records that show the reasoning behind decisions — including risks considered and rejected — because the record is the evidence that judgement was exercised.","notThis":["writing down everything the client said"],"parents":[],"related":["positive_risk","information_governance"]},{"id":"scientist_practitioner","label":"Scientist-practitioner model","domain":"professional","cluster":"professional","tier":1,"precision":"The clinician applies research evidence to practice, uses empirical methods to evaluate their own work, and generates research from clinical questions — treating each case as a testable formulation rather than only consuming published evidence.","notThis":["doing research as well as clinical work","following NICE guidance"],"parents":[],"related":["reflective_practice","practice_based_evidence","hypothesis_testing","evidence_based_practice"]},{"id":"reflective_practice","label":"Reflective practice","domain":"professional","cluster":"professional","tier":1,"precision":"Systematic examination of one's own responses, assumptions and contribution to what happened, resulting in a change that can be described — distinguished from description of events by the presence of that change.","notThis":["thinking about how a session went","describing what you learned"],"parents":[],"related":["scientist_practitioner","supervision","use_of_self"]},{"id":"practice_based_evidence","label":"Practice-based evidence","domain":"professional","cluster":"professional","tier":1,"precision":"Systematic data generated in routine services — outcome monitoring, session-by-session measures, service evaluation — used to inform practice, complementing evidence-based practice by addressing whether treatments work here, for these people.","notThis":["clinical experience","the opposite of evidence-based practice"],"parents":[],"related":["evidence_based_practice","service_evaluation","routine_outcome"]},{"id":"evidence_based_practice","label":"Evidence-based practice","domain":"professional","cluster":"professional","tier":1,"precision":"The integration of best available research evidence, clinical expertise, and the person's values and preferences — three components, not one.","notThis":["following the manual","doing what NICE recommends"],"parents":[],"related":["practice_based_evidence","nice"]},{"id":"routine_outcome","label":"Routine outcome monitoring","domain":"professional","cluster":"professional","tier":2,"precision":"Session-by-session measurement used to detect non-response early and change course, which improves outcomes principally for those deteriorating.","notThis":["collecting data for the service's targets"],"parents":["practice_based_evidence"],"related":["reliable_change"]},{"id":"nice","label":"NICE guidance","domain":"professional","cluster":"professional","tier":2,"precision":"Recommendations derived from evidence of clinical and cost effectiveness which inform rather than dictate; deviation is legitimate when formulated, reasoned and documented.","notThis":["mandatory rules","a complete account of the evidence"],"parents":["evidence_based_practice"],"related":["stepped_care"]},{"id":"supervision","label":"Supervision","domain":"professional","cluster":"professional","tier":1,"precision":"Serves normative, formative and restorative functions; used well it brings the difficult material — uncertainty, error, strong reactions — rather than a summary of what went well.","notThis":["reporting on cases","line management"],"parents":[],"related":["reflective_practice","transference","escalation"]},{"id":"consultation","label":"Consultation","domain":"professional","cluster":"professional","tier":1,"precision":"Indirect work in which psychological understanding is offered to those who hold the relationship with the person, extending reach beyond direct therapy and often changing the system rather than the individual.","notThis":["giving advice","supervision of another profession"],"parents":[],"related":["mdt","team_formulation","systemic"]},{"id":"team_formulation","label":"Team formulation","domain":"professional","cluster":"professional","tier":2,"precision":"Facilitated group development of a shared psychological account of a person's difficulties, which reliably shifts staff attributions and reduces blame independently of any change in the person.","notThis":["presenting your formulation to the team"],"parents":["consultation"],"related":["formulation","mdt"]},{"id":"mdt","label":"Multidisciplinary working","domain":"professional","cluster":"professional","tier":1,"precision":"Distinct professional contributions coordinated around a shared plan, where the psychologist's specific contributions are formulation, evidence appraisal, and attention to process — held without constructing hierarchies between professions.","notThis":["everyone doing a bit of everything","psychology leading the team"],"parents":[],"related":["consultation","leadership","team_formulation"]},{"id":"leadership","label":"Clinical leadership","domain":"professional","cluster":"professional","tier":1,"precision":"Influence exercised without necessarily holding authority — shaping how a service thinks, advocating for the psychological perspective, developing others, and taking responsibility for the quality of care beyond one's own caseload.","notThis":["being in charge","managing staff"],"parents":[],"related":["service_development","mdt","advocacy"]},{"id":"service_development","label":"Service development","domain":"professional","cluster":"professional","tier":2,"precision":"Identifying an unmet need with data, designing a proportionate response with stakeholders, piloting, evaluating and building in sustainability from the outset.","notThis":["setting up a new group"],"parents":["leadership"],"related":["service_evaluation","coproduction"]},{"id":"coproduction","label":"Co-production","domain":"professional","cluster":"professional","tier":1,"precision":"Sharing power with people with lived experience across design, delivery and evaluation, from the point where the question is framed — distinguished from consultation, where a plan already exists and views are sought on it.","notThis":["asking service users for feedback","having a service user on the panel"],"parents":[],"related":["service_user_involvement","service_development","power_relations"]},{"id":"service_user_involvement","label":"Service user and carer involvement","domain":"professional","cluster":"professional","tier":1,"precision":"Involvement in selection, teaching, service design and research, which changes what is asked as well as what is answered; done poorly it is tokenistic, unpaid and consultative after the fact.","notThis":["good practice that improves satisfaction scores"],"parents":["coproduction"],"related":["carers","power_relations"]},{"id":"carers","label":"Working with carers","domain":"clinical","cluster":"professional","tier":1,"precision":"Carers hold information, sustain the person, and have needs and rights of their own including a statutory assessment; supporting them is not a breach of the person's confidentiality, since listening and giving general information require no disclosure.","notThis":["you cannot speak to a carer without consent","the carer's needs are secondary"],"parents":[],"related":["confidentiality","systemic","context"]},{"id":"advocacy","label":"Advocacy","domain":"professional","cluster":"professional","tier":3,"precision":"Speaking to power on behalf of, or better alongside, those whose position in a system makes them unheard.","notThis":[],"parents":["leadership"],"related":["power_relations"]},{"id":"escalation","label":"Escalation and consultation of concern","domain":"professional","cluster":"professional","tier":1,"precision":"Raising a concern through the agreed route — supervisor, safeguarding lead, duty, professional body — promptly, with the facts recorded, on the principle that the decision to act does not rest with one person alone.","notThis":["reporting a colleague","a last resort"],"parents":[],"related":["supervision","safeguarding","whistleblowing"]},{"id":"whistleblowing","label":"Raising concerns about practice","domain":"professional","cluster":"professional","tier":2,"precision":"Protected disclosure where patient safety is at stake, following the Freedom to Speak Up route, and required rather than optional when internal escalation fails.","notThis":["disloyalty to the team"],"parents":["escalation"],"related":["duty_of_candour"]},{"id":"duty_of_candour","label":"Duty of candour","domain":"professional","cluster":"professional","tier":3,"precision":"The obligation to be open with people when something has gone wrong in their care, including an apology and an account of what will be done.","notThis":[],"parents":["whistleblowing"],"related":[]},{"id":"stepped_care","label":"Stepped care & NHS Talking Therapies","domain":"professional","cluster":"systems","tier":2,"precision":"Least intensive appropriate intervention first with systematic review and stepping up on non-response; efficient at population level and criticised for step-one attrition, restricted access for complexity, and outcome targets that shape referral.","notThis":["a waiting list system","always starting with self-help regardless of presentation"],"parents":[],"related":["nice","access_inequality"]},{"id":"community_framework","label":"Community Mental Health Framework","domain":"professional","cluster":"systems","tier":3,"precision":"The policy shift dissolving the CMHT/IAPT boundary into place-based, integrated primary and community provision organised around PCNs.","notThis":[],"parents":[],"related":["stepped_care"]},{"id":"access_inequality","label":"Inequalities in access","domain":"professional","cluster":"edi","tier":1,"precision":"Access is not equal across groups: referral pathways, detention rates, coercion, drop-out and outcome differ by ethnicity, deprivation and disability in ways not explained by need — a property of services, not of the people who use them.","notThis":["some communities are harder to engage","a matter of raising awareness"],"parents":[],"related":["social_determinants","structural_racism","equity_equality"]},{"id":"structural_racism","label":"Racism and mental health services","domain":"professional","cluster":"edi","tier":1,"precision":"Documented differentials — higher rates of detention and community treatment orders, lower rates of referral to talking therapy, more coercive pathways — arising from institutional processes rather than individual prejudice alone.","notThis":["explained by different rates of illness","solved by cultural awareness training"],"parents":["access_inequality"],"related":["cultural_humility","power"]},{"id":"social_determinants","label":"Social determinants","domain":"professional","cluster":"edi","tier":1,"precision":"Poverty, insecure housing, unemployment, debt, discrimination, adverse childhood experience and social isolation are causal contributors to distress, not background context — which places material and social intervention inside the psychologist's remit.","notThis":["factors that make therapy harder","outside the scope of psychology"],"parents":[],"related":["ptmf","access_inequality","context"]},{"id":"equity_equality","label":"Equity vs equality","domain":"professional","cluster":"edi","tier":1,"precision":"Equality distributes the same resource to everyone; equity distributes according to need in order to equalise outcome. Offering an identical service to unequal starting positions preserves the inequality.","notThis":["two words for fairness"],"parents":[],"related":["access_inequality","social_determinants"]},{"id":"intersectionality","label":"Intersectionality","domain":"professional","cluster":"edi","tier":2,"precision":"Positions of disadvantage interact rather than add, producing experiences that cannot be predicted from any single category considered alone.","notThis":["having several protected characteristics"],"parents":[],"related":["power_relations","cultural_humility"]},{"id":"cultural_humility","label":"Cultural humility","domain":"professional","cluster":"edi","tier":1,"precision":"A stance of lifelong self-examination and redress of power imbalance, in which the person is the authority on their own context — distinguished from cultural competence, which implies a body of knowledge about groups that can be acquired and completed.","notThis":["knowing about different cultures","asking about someone's background"],"parents":[],"related":["structural_racism","power_relations","intersectionality"]},{"id":"power_relations","label":"Power in the therapeutic relationship","domain":"professional","cluster":"edi","tier":1,"precision":"Operates through role, institutional authority, knowledge, language, access to records, and the capacity to define what counts as a problem — present whether or not it is acknowledged.","notThis":["something to be given away","not an issue if the therapist is warm"],"parents":[],"related":["cultural_humility","coproduction","ptmf"]},{"id":"interpreters","label":"Working with interpreters","domain":"clinical","cluster":"edi","tier":3,"precision":"Briefed and debriefed, addressed as a third party in the room with implications for confidentiality and alliance, and never a family member for clinical content.","notThis":[],"parents":["cultural_humility"],"related":[]},{"id":"adaptation","label":"Adapting interventions","domain":"clinical","cluster":"edi","tier":2,"precision":"Surface adaptation changes materials and examples; deep adaptation changes the model's explanatory framework to fit the person's understanding of distress — and the evidence favours the latter.","notThis":["translating the worksheets"],"parents":[],"related":["cultural_humility","cbt_model"]},{"id":"pbs","label":"Positive behaviour support","domain":"clinical","cluster":"models","tier":3,"precision":"Function-led, values-based framework used particularly in intellectual disability, combining functional assessment with environmental redesign and skill teaching in place of restrictive practice.","notThis":[],"parents":["functional_analysis"],"related":["least_restrictive"]},{"id":"ethics_approval","label":"Research ethics governance","domain":"research","cluster":"design","tier":2,"precision":"Ethics committee review addresses consent, capacity, risk, confidentiality and burden; HRA approval governs NHS research. Genuine ethical issues in a study are specific to its design, not generic statements about anonymity.","notThis":["anonymising the data","getting people to sign a form"],"parents":[],"related":["service_evaluation","consent"]},{"id":"consent","label":"Informed consent in research","domain":"research","cluster":"design","tier":1,"precision":"Requires capacity, adequate information, voluntariness and the ability to withdraw; consent given by a proxy — a staff member, a relative — is not the participant's consent, and dependency on the person seeking it undermines voluntariness.","notThis":["a signed form","obtainable from a carer for a competent adult"],"parents":["ethics_approval"],"related":["capacity","ethics_approval"]},{"id":"acceptability","label":"Acceptability and feasibility","domain":"research","cluster":"design","tier":2,"precision":"Whether people will take up, tolerate and complete an intervention — evidenced by uptake, attrition and qualitative account, and logically prior to efficacy.","notThis":["whether the intervention works"],"parents":["pilot_feasibility"],"related":["attrition"]},{"id":"contamination","label":"Contamination","domain":"research","cluster":"design","tier":3,"precision":"Diffusion of the intervention into the control condition, which biases the estimate toward the null.","notThis":[],"parents":["cluster_rct"],"related":[]},{"id":"risk_of_bias","label":"Risk of bias","domain":"research","cluster":"bias","tier":2,"precision":"The domain-by-domain judgement of how far a study's result may depart from the truth — randomisation, deviations from intervention, missing outcome data, measurement, selective reporting.","notThis":["a study's overall quality score"],"parents":["quality_appraisal"],"related":["selection_bias","detection_bias","attrition"]},{"id":"precision_estimate","label":"Precision","domain":"research","cluster":"inference","tier":3,"precision":"How narrowly the effect is estimated, indexed by the confidence interval and driven by sample size and variability — distinct from accuracy, which concerns bias.","notThis":[],"parents":["confidence_interval"],"related":["sample_size"]},{"id":"sample_size","label":"Sample size determination","domain":"research","cluster":"inference","tier":2,"precision":"Set a priori by the smallest effect of interest, the desired power, alpha and expected attrition — not by convention or convenience.","notThis":["the more participants the better regardless","determined after seeing the data"],"parents":["power"],"related":["underpowered","precision_estimate"]},{"id":"baseline","label":"Baseline and phases","domain":"research","cluster":"design","tier":3,"precision":"A stable pre-intervention series against which change is judged in single-case designs; instability at baseline undermines any subsequent inference.","notThis":[],"parents":["single_case"],"related":[]},{"id":"mechanism","label":"Mechanism of change","domain":"research","cluster":"inference","tier":2,"precision":"The specified process through which an intervention produces its effect, tested by measuring the putative mediator and showing that change in it precedes and accounts for change in outcome.","notThis":["the theory behind the therapy"],"parents":["mediation"],"related":["mediation","common_factors"]}]},"items":{"version":1,"items":[{"id":"pp16_1","kind":"mcq","concepts":["p_value","null_hypothesis"],"level":"recall","stem":"Which indicates the strongest evidence to reject the null hypothesis?","options":[{"id":"a","text":"p = 0.027","correct":false,"why":"Below .05, so conventionally significant — but weaker evidence than .001."},{"id":"b","text":"p = 0.734","correct":false,"why":"No evidence against the null."},{"id":"c","text":"p = 0.001","correct":true,"why":"The smallest p-value: these data would be least likely under the null."},{"id":"d","text":"p = 1.000","correct":false,"why":"The data are exactly what the null predicts."}],"teach":"Smaller p means the observed data would be more surprising if the null were true. It does not mean a larger or more important effect — that is what effect size is for. A p of .001 from a trial of 4,000 people can accompany a change nobody would notice.","precision":"The p-value is the probability of data at least this extreme IF the null were true.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":1,"time":30,"context":null},{"id":"pp16_2","kind":"mcq","concepts":["cross_sectional"],"level":"recall","stem":"Research that collects data at a single time-point is known as:","options":[{"id":"a","text":"Cross-sectional design","correct":true,"why":"One time point, so prevalence and association but no temporal order."},{"id":"b","text":"Within-subjects design","correct":false,"why":"That describes participants contributing to more than one condition."},{"id":"c","text":"Repeated measures design","correct":false,"why":"The opposite — measurement on multiple occasions."},{"id":"d","text":"An ABA design","correct":false,"why":"A single-case design with phases across time."}],"teach":"The distractors are all repeated-measurement designs. The examiner is testing whether you hear 'single time-point' as the defining feature. Cross-sectional data cannot establish which variable came first, which is why cross-sectional evidence of association is so often over-read as causal.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":1,"time":30,"context":null,"precision":null},{"id":"pp16_3","kind":"mcq","concepts":["assumptions","ttest_independent"],"level":"recall","stem":"Which assumption needs to be satisfied for a t-test to be valid?","options":[{"id":"a","text":"All data were collected by the same researcher","correct":false,"why":"Not a statistical assumption."},{"id":"b","text":"The data are skewed","correct":false,"why":"The reverse of the requirement."},{"id":"c","text":"The data have an underlying normal distribution","correct":true,"why":"Strictly, the sampling distribution of the mean — which normality of the data secures."},{"id":"d","text":"There are more than 10 participants in the study","correct":false,"why":"No fixed threshold; a t-test is defined for small n."}],"teach":"Say 'approximately normal' and, if you want the precise version, 'normality of the sampling distribution of the mean'. With larger samples the central limit theorem makes the test robust to non-normal raw data — which is why 'the data must be perfectly normal' is a mark-losing overstatement. Independence of observations is the assumption whose violation cannot be repaired.","precision":"Independence, approximate normality, and homogeneity of variance — with independence the least repairable.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":2,"time":40,"context":null},{"id":"pp16_4","kind":"multi","concepts":["causation","clinical_significance","control_group","iv_dv"],"level":"discriminate","stem":"Which of the following statements are TRUE? (Select all that apply.)","options":[{"id":"a","text":"Correlations do not determine causality","correct":true,"why":"Correct: association is necessary but not sufficient."},{"id":"b","text":"Clinical significance is no different than statistical significance","correct":false,"why":"They are independent. A trivial change can be statistically significant in a large sample."},{"id":"c","text":"Control groups always receive no interventions","correct":false,"why":"TAU, attention-matched and active comparators are all control conditions that involve intervention."},{"id":"d","text":"In an experiment, the independent variable is manipulated by the experimenter","correct":true,"why":"That manipulation is what distinguishes experimental from observational designs."}],"teach":"This is an all-or-nothing item in the real paper — you score only if you select every correct option and no incorrect one. Note that option C is the one candidates most often get wrong: in psychological trials the comparator is almost never 'nothing', and which comparator was used determines what the trial can claim.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":2,"time":50,"context":null,"precision":null},{"id":"pp16_5","kind":"multi","concepts":["variable_types"],"level":"recall","stem":"The outcome score on a standardised IQ test is an example of: (Select all that apply.)","options":[{"id":"a","text":"Categorical data","correct":false,"why":"IQ is not an unordered category."},{"id":"b","text":"Interval data","correct":true,"why":"Equal intervals by construction, with no true zero."},{"id":"c","text":"Qualitative data","correct":false,"why":"It is numeric."},{"id":"d","text":"Quantitative data","correct":true,"why":"It is a numeric quantity."}],"teach":"Two answers. Level of measurement (interval) and data type (quantitative) are different classifications, and the item tests whether you hold both at once. Note the subtlety: IQ has no true zero, so it is interval rather than ratio — you cannot say one person has twice the intelligence of another.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":2,"time":40,"context":null,"precision":null},{"id":"pp16_6","kind":"mcq","concepts":["iv_dv"],"level":"recognise","stem":"In research the outcome variable is also known as:","options":[{"id":"a","text":"The Independent Variable","correct":false,"why":"That is what is manipulated or classified."},{"id":"b","text":"The Dependent Variable","correct":true,"why":"It depends on the IV — it is what you measure."},{"id":"c","text":"The Predictor Variable","correct":false,"why":"A predictor sits on the IV side in non-experimental work."},{"id":"d","text":"The Extraneous Variable","correct":false,"why":"An uncontrolled variable that may affect the outcome."}],"teach":"Keep the two vocabularies apart. Experimental work: independent → dependent. Non-experimental work: predictor → outcome. Using 'predictor' does not license a causal claim, however much the word implies one.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":1,"time":25,"context":null,"precision":null},{"id":"pp16_7","kind":"mcq","concepts":["null_hypothesis"],"level":"recognise","stem":"Which of these is the null hypothesis?","options":[{"id":"a","text":"There is an effect","correct":false,"why":"That is the alternative hypothesis."},{"id":"b","text":"There is no effect","correct":true,"why":"The formal proposition of no difference or no association."},{"id":"c","text":"The effect cannot be observed","correct":false,"why":"A statement about measurement, not about the population."},{"id":"d","text":"We don't know if there is an effect","correct":false,"why":"That is the state of ignorance the test addresses, not the hypothesis."}],"teach":"Note that we never 'accept' the null. Failure to reject it means the data were not sufficiently surprising — which is compatible with there being no effect and with the study being too small to detect one. 'No evidence of effect' is not 'evidence of no effect'.","precision":"We reject or fail to reject the null; we never prove it.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":1,"time":25,"context":null},{"id":"pp16_8","kind":"mcq","concepts":["validity"],"level":"recall","stem":"Face validity is:","options":[{"id":"a","text":"How much you agree with a response","correct":false,"why":"Not a psychometric property."},{"id":"b","text":"A way of making a diagnosis","correct":false,"why":"Unrelated."},{"id":"c","text":"The extent that a measure appears valid","correct":true,"why":"Whether it looks right, to a lay reader or respondent."},{"id":"d","text":"The level of agreement that exists between researchers","correct":false,"why":"That is inter-rater reliability."}],"teach":"Face validity is the weakest form — it concerns appearance only. It still matters practically, because a measure that looks irrelevant to respondents damages engagement and completion. Do not confuse it with content validity, which asks whether the items cover the whole construct.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":2,"time":35,"context":null,"precision":null},{"id":"pp16_9","kind":"mcq","concepts":["power","sample_size"],"level":"recall","stem":"Statistical power is used to determine:","options":[{"id":"a","text":"How many participants you need in a study","correct":true,"why":"An a priori power calculation converts the smallest effect of interest into a target sample size."},{"id":"b","text":"The correct statistical test","correct":false,"why":"That follows from the design and variable types."},{"id":"c","text":"The likelihood of a Type 1 Error","correct":false,"why":"That is alpha. Power concerns Type II error: power = 1 − beta."},{"id":"d","text":"The number of tests needed to get a significant result","correct":false,"why":"That describes p-hacking."}],"teach":"Power sits on the Type II side of the ledger. The four quantities — effect size, alpha, power, sample size — are locked together: fix any three and the fourth follows. That is the whole logic of a power calculation, and it is why 'we recruited as many as we could' is not a sample size justification.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":2,"time":40,"context":null,"precision":null},{"id":"pp16_10","kind":"multi","concepts":["consent","ethics_approval"],"level":"recall","stem":"Participant information sheets should include: (Select all that apply.)","options":[{"id":"a","text":"The purpose of the study","correct":true,"why":"Required for informed consent."},{"id":"b","text":"The researcher's personal mobile number","correct":false,"why":"A boundary violation; contact is through an institutional route."},{"id":"c","text":"A statement that participation is voluntary","correct":true,"why":"Voluntariness is a condition of valid consent."},{"id":"d","text":"The reasons why people have been asked to participate","correct":true,"why":"Participants must understand why they specifically were approached."}],"teach":"Informed consent has four components: capacity, adequate information, voluntariness, and the right to withdraw without consequence. The distractor tests professional boundaries, not statistics — selection tests routinely blend the two.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":1,"time":40,"context":null,"precision":null},{"id":"pp16_11","kind":"mcq","concepts":["interaction","rm_anova"],"level":"apply","stem":"Which one of the following demonstrates that the change in QoL scores over time significantly differed between the two groups?","options":[{"id":"a","text":"A significant main effect of group","correct":false,"why":"That says the groups differ on average across both time points — it could arise from a baseline difference alone."},{"id":"b","text":"A significant main effect of time","correct":false,"why":"That says scores changed overall, collapsing across groups — both groups improving would produce it."},{"id":"c","text":"A significant group by time interaction","correct":true,"why":"Differential change over time is, by definition, an interaction."},{"id":"d","text":"All of these effects being non-significant","correct":false,"why":"That would indicate no differential change."}],"teach":"This is the single highest-yield statistical idea in psychological trials. 'Did the groups change differently?' is always an interaction question. A main effect of time tells you everyone improved — which is exactly what regression to the mean, natural history and expectancy would also produce. The interaction is the only term that isolates differential change.","precision":"Differential change over time between groups = the group × time interaction.","context":"An RCT compared a new therapy for psychosis with a treatment-as-usual (TAU) control. Quality of life (QoL) was the primary outcome, higher scores indicating better QoL. The QoL data met the necessary assumptions and were analysed using ANOVA with the factors time (pre vs post) and group (new therapy vs TAU). Mean QoL before intervention was 35 (new therapy) and 34 (TAU). After intervention the new-therapy group scored 75 and the TAU group 33.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":3,"time":60},{"id":"pp16_12","kind":"mcq","concepts":["ttest_independent","post_hoc","test_selection"],"level":"apply","stem":"Which follow-up test could you use to confirm that the QoL scores for the intervention group differ from those for the control group, at the post-intervention time point?","options":[{"id":"a","text":"Cohen's kappa","correct":false,"why":"An index of inter-rater agreement, not a group comparison."},{"id":"b","text":"An independent samples t-test","correct":true,"why":"Two unrelated groups, one continuous outcome, at one time point."},{"id":"c","text":"A Wilcoxon signed rank test for matched pairs","correct":false,"why":"For related samples, and non-parametric — the stem states assumptions were met."},{"id":"d","text":"A paired sample t-test","correct":false,"why":"The two groups contain different people; they are not paired."}],"teach":"Walk the chain rather than pattern-matching: outcome is continuous → assumptions met → two groups → different people in each → independent-samples t-test. Candidates who reach for 'paired' are anchoring on the pre-post structure of the design instead of reading which comparison is actually being made.","context":"An RCT compared a new therapy for psychosis with a treatment-as-usual (TAU) control. Quality of life (QoL) was the primary outcome, higher scores indicating better QoL. The QoL data met the necessary assumptions and were analysed using ANOVA with the factors time (pre vs post) and group (new therapy vs TAU). Mean QoL before intervention was 35 (new therapy) and 34 (TAU). After intervention the new-therapy group scored 75 and the TAU group 33.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":3,"time":60,"precision":null},{"id":"pp16_13","kind":"mcq","concepts":["common_factors","causation","mechanism"],"level":"discriminate","stem":"Assuming that the correct test shows that this difference is significant, it is reasonable to conclude that:","options":[{"id":"a","text":"The specific techniques used in the new therapy reduce QoL","correct":false,"why":"The direction is wrong — QoL rose — and specificity is not established."},{"id":"b","text":"The generic factors present in the new therapy (e.g. therapeutic alliance) reduce QoL","correct":false,"why":"Wrong direction again."},{"id":"c","text":"The new therapy seems effective, but it is not clear which components of it improve QoL","correct":true,"why":"A TAU comparator cannot separate specific technique from alliance, attention and expectancy."},{"id":"d","text":"The generic factors present in the new therapy improve QoL","correct":false,"why":"Attributes the effect to common factors specifically — equally unwarranted."}],"teach":"The comparator determines the claim. Against TAU you can say the package works; you cannot say which ingredient did the work. To attribute the effect to a specific technique you need an active comparator matched for attention, credibility and therapist contact. This single point converts an average interview answer into a strong one.","precision":"TAU controls for time and natural change; only an active comparator isolates specific technique.","context":"An RCT compared a new therapy for psychosis with a treatment-as-usual (TAU) control. Quality of life (QoL) was the primary outcome, higher scores indicating better QoL. The QoL data met the necessary assumptions and were analysed using ANOVA with the factors time (pre vs post) and group (new therapy vs TAU). Mean QoL before intervention was 35 (new therapy) and 34 (TAU). After intervention the new-therapy group scored 75 and the TAU group 33.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":4,"time":70},{"id":"pp16_14","kind":"mcq","concepts":["effect_size","meta_analysis"],"level":"discriminate","stem":"When presenting their findings the authors also report the 'effect size'. The main reason they include this is:","options":[{"id":"a","text":"To allow the findings to be included in subsequent meta-analyses","correct":true,"why":"Of the four options, the only defensible one — pooling requires a standardised effect."},{"id":"b","text":"To indicate the direction of the effect","correct":false,"why":"Direction is already given by the means."},{"id":"c","text":"To highlight the level of statistical significance of the effect","correct":false,"why":"That is the p-value's job; effect size is deliberately independent of it."},{"id":"d","text":"To help tease apart the influence of generic and specific factors","correct":false,"why":"That is a design question, not an analysis one."}],"teach":"Worth noticing how this item behaves. The textbook reason to report an effect size is to convey magnitude independently of sample size — and that option is not offered. When no option matches your first answer, do not abandon your reasoning: eliminate. B, C and D are each demonstrably false, so A survives. That is the skill the item actually rewards, and it transfers directly to interview questions where the framing is not the one you prepared.","context":"An RCT compared a new therapy for psychosis with a treatment-as-usual (TAU) control. Quality of life (QoL) was the primary outcome, higher scores indicating better QoL. The QoL data met the necessary assumptions and were analysed using ANOVA with the factors time (pre vs post) and group (new therapy vs TAU). Mean QoL before intervention was 35 (new therapy) and 34 (TAU). After intervention the new-therapy group scored 75 and the TAU group 33.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":4,"time":60,"precision":null},{"id":"pp16_15","kind":"mcq","concepts":["external_validity","sampling"],"level":"discriminate","stem":"In order for the findings of this study to be generalised to other people with psychosis, the most important thing is that:","options":[{"id":"a","text":"A sufficiently large sample has been used to provide adequate power","correct":false,"why":"Size buys precision, not representativeness. A large biased sample is still biased."},{"id":"b","text":"The sample is sufficiently representative of people with psychosis","correct":true,"why":"Generalisability is governed by who was sampled, not how many."},{"id":"c","text":"The measure of QoL has good test re-test reliability","correct":false,"why":"A measurement property; necessary but not what limits generalisation."},{"id":"d","text":"The participants were not taking medication during the RCT","correct":false,"why":"Would reduce representativeness, since most people with psychosis take medication."}],"teach":"Sample size and sample representativeness answer different questions, and candidates conflate them constantly. Size → prec
