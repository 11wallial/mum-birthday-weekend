/* ---------------------------------------------------------- PROGRESS */
function vProgress(stage) {
  const w = el('div', { class:'wrap stg' });
  const rd = readiness(), cal = calibration(), mv = recentMovement(7);
  w.appendChild(pageHead(null, 'Progress',
    'Depth is earned level by level. Recognising something never counts as mastering it, and a failed transfer item takes depth back.', true));

  /* readiness — the one number, with the weighting stated rather than hidden */
  const s0 = section('Readiness', { note:'0.62 × mean of domains + 0.38 × weakest' });
  const mean = Math.round((rd.research + rd.clinical + rd.professional) / 3);
  const top = el('div', { class:'row', style:'gap:24px;align-items:center;margin-bottom:4px' });
  top.appendChild(ringEl(rd.overall, 96, 9, band(rd.overall)[3], rd.overall, '', mean));
  const rt = el('div', { style:'flex:1 1 auto' });
  rt.innerHTML = `<div style="font-weight:600;font-size:20px;letter-spacing:-.03em;margin-bottom:4px">${band(rd.overall)[2]}</div>
    <div class="src">The solid arc is your readiness. The faint one behind it is the plain average of the three domains, <b>${mean}</b> — the distance between them is what the weakest-domain weighting costs you.</div>`;
  top.appendChild(rt);
  s0.appendChild(top);
  ['research','clinical','professional'].forEach(d => s0.appendChild(domainRow(d, rd[d], mv[d])));
  s0.appendChild(el('div', { class:'meta', style:'margin-top:16px',
    html: `<b>${dueCount()}</b> due<span class="sep">·</span><b>${unseenCount()}</b> not yet seen<span class="sep">·</span><b>${Object.keys(S.c).length}</b> of ${DATA.concepts.nodes.length} concepts met` }));
  w.appendChild(s0);

  /* calibration */
  const s1 = section('Calibration', { note:'the gap between how sure you were and whether you were right' });
  if (cal.score === null) {
    s1.appendChild(el('p', { class:'src',
      text:'No data yet. Every item asks how sure you are before you answer; the gap between that and the outcome is what gets scored here.' }));
  } else {
    const head = el('div', { class:'row', style:'gap:20px;align-items:flex-start;margin-bottom:16px' });
    const n = el('div', { class:'statline', style:'flex:none' });
    n.innerHTML = `<span class="dnum v" style="color:${band(cal.score)[3]}">${cal.score}</span><span class="u">/ 100</span>`;
    head.appendChild(n);
    head.appendChild(el('p', { class:'src', style:'flex:1 1 auto;max-width:44ch',
      text:'The goal is calibrated confidence, not maximum confidence. Being sure and wrong costs more than being unsure and right.' }));
    s1.appendChild(head);
    s1.appendChild(plate([
      prow({ name:'Sure and wrong', sub:'Highest priority — the belief felt settled', val: cal.hcw }),
      prow({ name:'Unsure and right', sub:'Knowledge you have but do not trust', val: cal.lcr }),
      prow({ name:'Rated answers', val: cal.n }),
    ]));
  }
  w.appendChild(s1);

  /* movement — real events, not a synthetic delta */
  const anyMv = ['research','clinical','professional'].some(d => mv[d].up || mv[d].dn);
  if (anyMv) {
    const s2 = section('Movement', { note:'last 7 days' });
    s2.appendChild(plate(['research','clinical','professional'].map(d => {
      const m = mv[d];
      const tone = m.up > m.dn ? 'up' : m.dn > m.up ? 'dn' : 'fl';
      const word = tone === 'up' ? 'gaining' : tone === 'dn' ? 'losing ground' : 'holding';
      return prow({ lead: dotEl(d), name: d[0].toUpperCase() + d.slice(1),
        sub: `${m.up} concept${m.up === 1 ? '' : 's'} advanced a level · ${m.dn} error${m.dn === 1 ? '' : 's'}`,
        tail: el('span', { class:'mv ' + tone, text: word }) });
    })));
    w.appendChild(s2);
  }

  /* weakest held — with the depth ladder drawn, not just a percentage */
  const weak = weakConcepts(8);
  if (weak.length) {
    const s3 = section('Weakest held', { note:'depth demonstrated, not questions answered' });
    s3.appendChild(plate(weak.map(x => prow({
      lead: dotEl(x.n.domain), name: x.n.label,
      sub: (x.rec && x.rec.hcw ? `sure and wrong ×${x.rec.hcw} · ` : '') + (LEVELS[(x.rec && x.rec.d) || 0] || 'unseen'),
      tail: rungsEl((x.rec && x.rec.d) || 0, x.n.domain),
      val: x.m, onclick: () => showConcept(x.n.id) }))));
    w.appendChild(s3);
  }

  const s4 = section('Deeper');
  const links = el('div', { class:'grid g2' });
  [['atlas', 'The Atlas', 'atlas', 'A live map of ' + DATA.concepts.nodes.length + ' concepts. Nodes brighten as you demonstrate depth, and dim hubs with many links are the highest-leverage targets.'],
   ['ledger', 'The Ledger', 'ledger', S.errors.length + ' recorded errors, classified, ordered by what will cost you most.']]
   .forEach(([id, nm, mk, blurb]) => {
    const b = el('button', { class:'tile', onclick: () => go(id) });
    b.innerHTML = `<span class="tmk">${icon(mk)}</span><h3>${nm}</h3><p>${esc(blurb)}</p>`;
    links.appendChild(b);
  });
  s4.appendChild(links);
  w.appendChild(s4);
  stage.appendChild(w);
}


/* ============================================================
   DRILL
   ============================================================ */
let SESSION = null;

function startDrill(minutes) {
  const n = Math.max(6, Math.round(minutes * 0.85));
  const items = buildSession(n);
  if (!items.length) { toast('Nothing to drill right now — try the papers or the Panel'); return; }
  SESSION = { items, idx:0, right:0, started:Date.now(), answers:[], minutes, wasWins: S.wins.length };
  go('drill');
}

function quitDrill() {
  const midway = SESSION && SESSION.answers.length && SESSION.idx < SESSION.items.length;
  if (!midway) { SESSION = null; go('today'); return; }
  const left = SESSION.items.length - SESSION.idx;
  confirmDialog({
    title: 'Leave this session?',
    text: `${left} item${left === 1 ? '' : 's'} left. Everything you have already answered is saved, ` +
          'and the scheduler has it — nothing is lost by stopping here.',
    cancel: 'Keep going',
    confirm: 'Leave',
    onConfirm: () => { SESSION = null; go('today'); },
  });
}

function vDrill(stage) {
  if (!SESSION) { go('practice', undefined, { replace: true }); return; }
  if (SESSION.idx >= SESSION.items.length) return drillDone(stage);

  focusMode(true);
  const item = SESSION.items[SESSION.idx];

  const bar = el('div', { id:'sessbar' });
  const pct = SESSION.idx / SESSION.items.length * 100;
  bar.innerHTML = `<button class="x" title="Leave" aria-label="Leave this session">✕</button>
    <div class="track" role="progressbar" aria-label="Session progress"
         aria-valuemin="0" aria-valuemax="${SESSION.items.length}" aria-valuenow="${SESSION.idx}"><i></i></div>
    <span class="lbl" style="flex:none">${SESSION.idx + 1}/${SESSION.items.length}</span>`;
  $('.x', bar).addEventListener('click', quitDrill);
  stage.appendChild(bar);
  /* The bar is a new element on every item, so it had nothing to animate from
     and arrived as a jump. Start it where the last one finished and let the
     width transition carry it — the one place in the drill where motion means
     something. */
  const track = $('.track i', bar);
  track.style.width = (SESSION.lastPct || 0) + '%';
  requestAnimationFrame(() => requestAnimationFrame(() => { track.style.width = pct + '%'; }));
  SESSION.lastPct = pct;

  const w = el('div', { class:'wrap' });
  const node = CONCEPT[item.concepts[0]] || {};
  const tags = el('div', { class:'tagrow', style:'margin-bottom:18px' });
  tags.innerHTML = `<span class="pill on"><span class="dot ${node.domain || 'research'}"></span>${esc(node.label || '')}</span>
    <span class="pill">${esc(item.level)}</span>
    ${item.source ? '<span class="pill">from a real paper</span>' : ''}`;
  w.appendChild(tags);

  const host = el('div');
  w.appendChild(host);
  stage.appendChild(w);

  /* go('drill') rebuilds the stage for every item, which dropped focus to the
     document body each time and made a keyboard user re-tab from the top on
     every question. Put focus on the new question instead, and say where we
     are. */
  requestAnimationFrame(() => {
    const stem = $('.qstem, .qctx', host);
    if (stem) {
      stem.setAttribute('tabindex', '-1');
      stem.classList.add('focus-quiet');
      stem.focus({ preventScroll: true });
    }
    announce(`Question ${SESSION.idx + 1} of ${SESSION.items.length}. ${
      (item.stem || '').slice(0, 160)}`);
  });

  renderItem(host, item, res => {
    SESSION.answers.push(res);
    if (res.correct) SESSION.right++;
    SESSION.idx++;
    if (res.hiConfWrong && SESSION.items.length < 60) {
      SESSION.items.splice(Math.min(SESSION.items.length, SESSION.idx + 4), 0, item);
    }
    go('drill', undefined, { replace: true });
  });
}

function drillDone(stage) {
  focusMode(false); Act.hide();
  const secs = (Date.now() - SESSION.started) / 1000;
  const n = SESSION.answers.length;
  const pct = n ? Math.round(SESSION.right / n * 100) : 0;
  if (n && !SESSION.logged) {
    S.log.unshift({ ts: Date.now(), mode:'drill', n, pct, secs });
    if (S.log.length > 200) S.log.pop();
    save(); SESSION.logged = true;
  }
  const newWins = S.wins.slice(0, Math.max(0, S.wins.length - SESSION.wasWins));
  const hcw = SESSION.answers.filter(a => a.hiConfWrong);

  const w = el('div', { class:'wrap narrow stg', style:'padding-top:56px' });
  const head = el('div', { class:'row', style:'gap:22px;align-items:center;margin-bottom:28px' });
  head.appendChild(ringEl(pct, 84, 8, band(pct)[3], pct + '%', ''));
  const ht = el('div', { style:'flex:1 1 auto' });
  ht.innerHTML = `<h1 style="font-size:24px">${pct >= 80 ? 'Strong session.' : pct >= 50 ? 'Session complete.' : 'Useful session.'}</h1>
    <p class="src" style="margin-top:6px;max-width:38ch">${
      pct >= 80 ? 'Hold that. The scheduler will push these further out and bring you harder versions.'
    : pct >= 50 ? 'The errors are the valuable part — they are already scheduled to come back.'
                : 'A low score early is information, not a verdict. The engine now knows where to aim.'}</p>`;
  head.appendChild(ht);
  w.appendChild(head);

  w.appendChild(plate([
    prow({ name:'Answered', val: n }),
    prow({ name:'Correct', val: SESSION.right + ' of ' + n }),
    prow({ name:'Time', val: fmtTime(secs) }),
  ]));

  if (newWins.length) {
    setTimeout(() => coachOn('depth'), 520);
    const s1 = section("What you can now do that you couldn't");
    s1.appendChild(plate(newWins.slice(0, 6).map(win => {
      const node = CONCEPT[win.cid];
      return prow({ lead: dotEl(node ? node.domain : 'research'), name: win.text });
    })));
    w.appendChild(s1);
  }

  if (hcw.length) {
    const c = el('div', { class:'flag', style:'margin-top:28px;background:var(--warning-soft);border-left-color:var(--warning)' });
    c.innerHTML = `<div class="lbl" style="color:var(--warning);margin-bottom:5px">Highest priority</div>
      You were confident and wrong on <b>${hcw.length}</b> item${hcw.length === 1 ? '' : 's'}. That combination matters more than the score: it means the belief felt settled. Those are scheduled to return today.`;
    w.appendChild(c);
  }

  const btns = el('div', { class:'row', style:'margin-top:32px;flex-wrap:wrap' });
  btns.appendChild(el('button', { class:'btn lg ghost', text:'Done', onclick: () => { SESSION = null; go('today'); } }));
  btns.appendChild(el('div', { class:'spacer', style:'flex:1 1 auto' }));
  btns.appendChild(el('button', { class:'btn pri lg', text:'Another session', onclick: () => startDrill(SESSION.minutes) }));
  w.appendChild(btns);
  stage.appendChild(w);
}

/* ---------------------------------------------------------- item renderers */
function renderItem(host, item, done) {
  const t0 = Date.now();
  ({ mcq: renderChoice, multi: renderChoice, contrast: renderContrast,
     ladder: renderLadder }[item.kind] || renderChoice)(host, item, t0, done);
}

/* the confidence control that lives in the action bar */
const CONF_LABEL = ['Guessing', 'Doubtful', 'Even', 'Fairly sure', 'Certain'];

function confControl(onPick) {
  setTimeout(() => coachOn('confidence'), 420);
  const wrap = el('div', { class:'confwrap' });
  wrap.appendChild(el('span', { class:'cl', id:'conflbl', text:'Sure?' }));
  /* A radiogroup, so the choice is announced as "Fairly sure, 4 of 5" rather
     than as the digit on the button face. */
  const pips = el('div', { class:'pips', role:'radiogroup', 'aria-labelledby':'conflbl' });
  for (let i = 1; i <= 5; i++) {
    pips.appendChild(el('button', { class:'pip', text:i, role:'radio', 'aria-checked':'false',
      'aria-label': `${CONF_LABEL[i-1]} — ${i} of 5`, title: CONF_LABEL[i-1],
      onclick: e => {
        $$('.pip', pips).forEach(b => { b.classList.remove('on'); b.setAttribute('aria-checked','false'); });
        e.currentTarget.classList.add('on');
        e.currentTarget.setAttribute('aria-checked','true');
        announce('Confidence: ' + CONF_LABEL[i-1]);
        onPick(i);
      }}));
  }
  wrap.appendChild(pips);
  return wrap;
}

function renderChoice(host, item, t0, done) {
  const multi = item.kind === 'multi';
  let conf = null, picked = new Set(), locked = false;

  if (item.context) host.appendChild(el('div', { class:'qctx', text: item.context }));
  host.appendChild(el('div', { class:'qstem', text: item.stem }));
  if (multi) host.appendChild(el('div', { class:'qhint',
    text:'Select all that apply. In the real paper this scores only if every correct option — and no incorrect one — is selected.' }));

  /* Selection was visual only: .sel carried no state a screen reader could
     read. Single-answer items are a radiogroup, select-all items are toggle
     buttons, and both announce the letter with the option text. */
  const box = el('div', { class:'choices', role: multi ? 'group' : 'radiogroup',
                          'aria-label': multi ? 'Select all that apply' : 'Answer options' });
  const setSel = (node, on) => {
    node.classList.toggle('sel', on);
    node.setAttribute(multi ? 'aria-pressed' : 'aria-checked', String(on));
  };
  item.options.forEach((o, i) => {
    const letter = String.fromCharCode(65 + i);
    const b = el('button', { class:'choice', 'data-id':o.id,
                             role: multi ? undefined : 'radio',
                             'aria-label': letter + '. ' + o.text }, [
      el('span', { class:'key', text: letter, 'aria-hidden':'true' }),
      el('span', { class:'ctx' }, [el('span', { text: o.text })]),
    ]);
    b.setAttribute(multi ? 'aria-pressed' : 'aria-checked', 'false');
    b.addEventListener('click', () => {
      if (locked) return;
      if (multi) { const on = !picked.has(o.id); on ? picked.add(o.id) : picked.delete(o.id); setSel(b, on); }
      else {
        picked = new Set([o.id]);
        $$('.choice', box).forEach(x => setSel(x, x === b));
      }
      sync();
    });
    box.appendChild(b);
  });
  host.appendChild(box);

  const checkBtn = el('button', { class:'btn pri lg', text:'Check', disabled:'', onclick: reveal });
  Act.row([confControl(v => { conf = v; sync(); })], [checkBtn]);
  function sync() { checkBtn.disabled = !(conf !== null && picked.size); }

  function reveal() {
    if (locked || conf === null || !picked.size) return;
    locked = true;
    const correctIds = item.options.filter(o => o.correct).map(o => o.id);
    const correct = correctIds.length === picked.size && correctIds.every(id => picked.has(id));
    const secs = (Date.now() - t0) / 1000;

    $$('.choice', box).forEach(b => {
      const o = item.options.find(x => x.id === b.dataset.id);
      b.classList.add('locked'); b.classList.remove('sel');
      b.setAttribute('aria-disabled', 'true');
      b.removeAttribute('aria-checked'); b.removeAttribute('aria-pressed');
      b.removeAttribute('role');
      const chose = picked.has(o.id);
      b.setAttribute('aria-label',
        `${b.getAttribute('aria-label')} — ${o.correct ? 'correct answer' : 'incorrect'}` +
        (chose ? ', you chose this' : ''));
      if (o.correct) b.classList.add('ok');
      else if (chose) b.classList.add('bad');
      else b.classList.add('faded');
      if (o.why && (o.correct || picked.has(o.id))) $('.ctx', b).appendChild(el('span', { class:'why', text: o.why }));
    });

    const rec = recordAnswer(item, correct, conf, secs);
    showVerdict(item, correct, rec, secs, () => done({ correct, conf, secs, hiConfWrong: rec.hiConfWrong, id:item.id }));
  }
}

function renderContrast(host, item, t0, done) {
  let conf = null, locked = false;
  const answers = {};
  host.appendChild(el('div', { class:'qstem', text: item.stem }));

  const cols = el('div', { class:'sortcols' });
  cols.appendChild(el('div', { class:'h', text: item.left }));
  cols.appendChild(el('div', { class:'h', text: item.right }));
  host.appendChild(cols);

  const list = el('div', { class:'choices' });
  const probes = shuffle(item.probes);
  probes.forEach((p, i) => {
    const row = el('div', { class:'sortrow' });
    const L = el('button', { class:'sidebtn', text:'◀', 'aria-pressed':'false',
                             'aria-label': `Put "${p.text}" under ${item.left}` });
    const R = el('button', { class:'sidebtn', text:'▶', 'aria-pressed':'false',
                             'aria-label': `Put "${p.text}" under ${item.right}` });
    row.append(L, el('span', { class:'t', text: p.text }), R);
    [[L,'L'],[R,'R']].forEach(([btn, side]) => btn.addEventListener('click', () => {
      if (locked) return;
      answers[i] = side;
      L.classList.toggle('on', side === 'L'); R.classList.toggle('on', side === 'R');
      L.setAttribute('aria-pressed', String(side === 'L'));
      R.setAttribute('aria-pressed', String(side === 'R'));
      row.classList.toggle('pickL', side === 'L'); row.classList.toggle('pickR', side === 'R');
      sync();
    }));
    list.appendChild(row);
    row._probe = p;
  });
  host.appendChild(list);

  const checkBtn = el('button', { class:'btn pri lg', text:'Check', disabled:'', onclick: reveal });
  Act.row([confControl(v => { conf = v; sync(); })], [checkBtn]);
  function sync() { checkBtn.disabled = !(conf !== null && Object.keys(answers).length === probes.length); }

  function reveal() {
    if (locked) return; locked = true;
    let right = 0;
    $$('.sortrow', list).forEach((row, i) => {
      const ok = answers[i] === row._probe.side;
      if (ok) { right++; row.classList.add('ok'); }
      else {
        row.classList.add('bad');
        const which = row._probe.side === 'L' ? item.left : item.right;
        row.appendChild(el('span', { class:'src', style:'flex-basis:100%;padding-left:52px', text:'→ ' + which }));
      }
    });
    const correct = right === probes.length;
    const secs = (Date.now() - t0) / 1000;
    const sc = el('div', { class:'card tight', style:'margin-top:14px' });
    sc.innerHTML = `<div class="lbl">Sorted correctly</div>
      <div class="dnum" style="font-size:26px;margin-top:3px">${right} <span style="font-size:15px;color:var(--ink-3)">/ ${probes.length}</span></div>`;
    host.appendChild(sc);
    const rec = recordAnswer(item, correct, conf, secs);
    showVerdict(item, correct, rec, secs, () => done({ correct, conf, secs, hiConfWrong: rec.hiConfWrong, id:item.id }));
  }
}

function renderLadder(host, item, t0, done) {
  let conf = null, rung = 0, wrong = 0, live = false;
  host.appendChild(el('div', { class:'qctx', text: item.stem }));
  const hint = el('div', { class:'qhint', style:'margin-top:0',
    text:'Walk the chain. Each step follows from the one before it — rate your confidence to begin.' });
  host.appendChild(hint);
  const track = el('div');
  host.appendChild(track);

  // step one is on screen from the start; confidence unlocks it
  next();
  Act.row([confControl(v => {
    conf = v; live = true;
    hint.textContent = 'Walk the chain. Each step follows from the one before it.';
    $$('.choice', track).forEach(c => { c.classList.remove('faded'); c.setAttribute('aria-disabled','false'); });
    Act.hide();
    announce('Steps unlocked. Choose the first step.');
  })], []);

  function next() {
    if (rung >= item.rungs.length) return finish();
    const r = item.rungs[rung];
    const blk = el('div', { class:'card', style:'margin-bottom:12px' });
    blk.appendChild(el('div', { class:'lbl', text:'Step ' + (rung + 1) + ' of ' + item.rungs.length }));
    blk.appendChild(el('div', { style:'font-size:18px;font-weight:600;letter-spacing:-.015em;margin:7px 0 14px;line-height:1.35', text: r.q }));
    const opts = el('div', { class:'choices' });
    r.options.forEach((o, i) => {
      const letter = String.fromCharCode(65 + i);
      const b = el('button', { class:'choice' + (live ? '' : ' faded'),
                               'aria-label': letter + '. ' + o.text,
                               'aria-disabled': live ? 'false' : 'true',
                               style:'box-shadow:none;border-color:var(--line)' }, [
        el('span', { class:'key', text: letter, 'aria-hidden':'true' }),
        el('span', { class:'ctx' }, [el('span', { text: o.text })]),
      ]);
      b.addEventListener('click', () => {
        if (!live || b.classList.contains('locked')) {
          if (!live) toast('Rate your confidence first');
          return;
        }
        const all = $$('.choice', opts);
        all.forEach((x, xi) => {
          x.classList.add('locked');
          x.setAttribute('aria-disabled', 'true');
          const oo = r.options[xi];
          if (oo.correct) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('faded');
          if (oo.why && (oo.correct || x === b)) $('.ctx', x).appendChild(el('span', { class:'why', text: oo.why }));
        });
        if (!o.correct) wrong++;
        rung++;
        setTimeout(() => { next(); scrollEnd(); }, 560);
      });
      opts.appendChild(b);
    });
    blk.appendChild(opts);
    track.appendChild(blk);
    if (rung > 0) scrollEnd();
  }

  function finish() {
    const correct = wrong === 0;
    const secs = (Date.now() - t0) / 1000;
    const a = el('div', { class:'callout', style:'margin:14px 0' });
    a.innerHTML = `<div class="lbl">The analysis</div><p>${esc(item.answer)}</p>`;
    track.appendChild(a);
    const rec = recordAnswer(item, correct, conf, secs);
    showVerdict(item, correct, rec, secs, () => done({ correct, conf, secs, hiConfWrong: rec.hiConfWrong, id:item.id }));
  }
}

/* the action bar becomes the teaching surface */
function showVerdict(item, correct, rec, secs, onNext) {
  const body = el('div');
  const h = el('div', { class:'verdict-h ' + (correct ? 'good' : 'bad') });
  h.innerHTML = `<span class="badge">${correct ? '✓' : '✕'}</span>
    <span class="t">${correct ? 'Correct' : 'Not quite'}</span>
    <span class="meta">${fmtTime(secs)}${item.time ? ' · target ' + fmtTime(item.time) : ''}</span>`;
  body.appendChild(h);

  if (rec.hiConfWrong) {
    body.appendChild(el('p', { style:'color:var(--warning);font-weight:600;font-size:14.5px;margin-bottom:10px',
      text:'You were confident. That makes this the most valuable error in the session — it comes back before you leave.' }));
  }
  body.appendChild(el('div', { class:'teachtext', text: item.teach }));

  if (item.precision) {
    const p = el('div', { class:'precision' });
    p.innerHTML = `<div class="lbl">Say it exactly like this</div><p>${esc(item.precision)}</p>`;
    body.appendChild(p);
  }

  if (!correct) {
    const nots = [];
    item.concepts.forEach(cid => {
      const n = CONCEPT[cid];
      if (n && n.notThis && n.notThis.length) nots.push([n.label, n.notThis]);
    });
    if (nots.length) {
      const d = el('div', { class:'nots' });
      d.appendChild(el('div', { class:'lbl', style:'margin-bottom:4px', text: nots[0][0] + ' is NOT' }));
      nots[0][1].forEach(x => d.appendChild(el('div', { class:'n', text: x })));
      body.appendChild(d);
    }

    const box = el('div', { style:'margin-top:16px' });
    box.appendChild(el('div', { class:'lbl', style:'margin-bottom:8px', text:'What actually went wrong?' }));
    const row = el('div', { class:'tagrow' });
    ERROR_TYPES.forEach(([id, nm, hint]) => {
      const t = el('button', { class:'pill act', title: hint, text: nm });
      t.addEventListener('click', () => {
        $$('.pill.act', row).forEach(x => x.classList.remove('on'));
        t.classList.add('on');
        const e = S.errors.find(x => x.id === item.id && !x.type);
        if (e) { e.type = id; save(); }
      });
      row.appendChild(t);
    });
    box.appendChild(row);
    body.appendChild(box);
  }

  if (item.source) body.appendChild(el('p', { class:'src', style:'margin-top:14px', text:'Source: ' + item.source }));

  /* Advance exactly once, by whichever route the learner takes, and take the
     key handler with us. Previously this listener was removed only when Enter
     fired, so advancing with the mouse left it bound: the listeners stacked and
     one later Enter ran all of them, skipping unseen items and recording
     answers nobody gave. */
  let spent = false;
  function advance() {
    if (spent) return;
    spent = true;
    document.removeEventListener('keydown', onKey);
    VERDICT_OFF = null;
    onNext();
  }
  function onKey(e) {
    if (e.key !== 'Enter') return;
    const t = e.target;
    if (t && t.matches && t.matches('textarea, input, select')) return;
    e.preventDefault();
    advance();
  }

  const btn = el('button', { class: 'btn lg ' + (correct ? 'ok' : 'no'), text:'Continue', onclick: advance });
  Act.result(correct ? 'good' : 'bad', body, btn);
  if (correct) tick(880, .08, .05); else tick(300, .12, .045);

  document.addEventListener('keydown', onKey);
  VERDICT_OFF = () => { spent = true; document.removeEventListener('keydown', onKey); };

  /* The verdict is the moment the learner is waiting on, so it takes focus
     and is announced once — as a sentence, not as a re-read of the panel. */
  requestAnimationFrame(() => btn.focus({ preventScroll: true }));
  announce((correct ? 'Correct. ' : 'Not quite. ') +
           (rec.hiConfWrong ? 'You were confident. ' : '') +
           (item.teach || '').slice(0, 240));
  scrollEnd();
  return advance;
}

function scrollEnd() {
  requestAnimationFrame(() => {
    const st = $('#stage');
    st.scrollTo({ top: st.scrollHeight, behavior: 'smooth' });
  });
}

   VIEWS — Papers, Panel, Studio, Room, Atlas, Ledger

/* ------------------------------------------------- PAPERS (written papers)
   The view functions keep their original vBench* names; only the surface's
   user-facing name and route changed. */
let EXAM = null;

function vBench(stage, exId) {
  if (EXAM && EXAM.phase !== 'done') return benchRun(stage);
  if (exId) return benchStart(stage, exId);
  const w = el('div', { class:'wrap stg' });
  w.appendChild(pageHead(null, 'Papers',
    "Real written papers, run to their real clock. When the time is up the paper closes, exactly as it does on the day. Afterwards your text is matched against the marking scheme point by point — and you confirm or override every award, because comparing your own answer to a marker's list is where most of the learning is.", true));
  if (matchMedia('(max-width: 680px)').matches) {
    const n = el('div', { class:'card', style:'margin-bottom:20px;border-left:3px solid var(--warning)' });
    n.innerHTML = `<div class="lbl" style="color:var(--warning)">Better on a larger screen</div>
      <p style="margin-top:7px;font-size:13.5px;color:var(--ink-2)">These are timed essays of several
      hundred words, marked on presentation as well as content. You can read the papers and the marking
      schemes here, but write them somewhere you would actually be willing to write them.</p>`;
    w.appendChild(n);
  }
  const sec = section('Papers', { note:'timed, then marked against the scheme' });
  sec.appendChild(plate(DATA.written.exercises.map(ex => {
    const prev = S.written[ex.id];
    return prow({
      name: ex.title,
      sub: `${ex.course} ${ex.year} · ${ex.minutes} min · ${ex.questions.length} question${ex.questions.length===1?'':'s'} · ${ex.totalMarks} marks`,
      tail: prev ? el('span', { class:'meta', html:`last <b>${prev.score}/${prev.max}</b>` }) : null,
      onclick: () => benchStart(stage, ex.id) });
  })));
  w.appendChild(sec);
  stage.appendChild(w);
}

function benchStart(stage, exId) {
  const ex = DATA.written.exercises.find(e => e.id === exId);
  EXAM = { ex, phase:'brief', answers:{}, awarded:{}, started:0, qi:0 };
  benchRun(stage);
}

function benchRun(stage) {
  stage.innerHTML = '';
  const ex = EXAM.ex;
  if (EXAM.phase === 'brief') {
    const w = el('div', { class:'wrap stg' });
    w.appendChild(el('div', { class:'lbl', text: ex.course + ' · ' + ex.year }));
    w.appendChild(el('h1', { style:'margin:6px 0 14px', text: ex.title }));
    w.appendChild(el('p', { class:'serif', style:'color:var(--ink-2);margin-bottom:18px', text: ex.brief }));
    const p = el('div', { class:'card', style:'margin-bottom:20px' });
    p.innerHTML = `<div class="lbl">Provenance</div><p class="src" style="margin-top:7px;font-style:normal">${esc(ex.provenance)}</p>`;
    w.appendChild(p);
    const warn = el('div', { class:'card', style:'margin-bottom:22px;border-color:color-mix(in srgb,var(--warning) 30%,transparent)' });
    warn.innerHTML = `<div class="lbl" style="color:var(--warning)">${ex.minutes} minutes, then it closes</div>
      <p style="margin-top:7px;font-size:13.5px;color:var(--ink-2)">Do it under the clock or the practice is worth much less. You can move between questions freely. There is no spellcheck in the real Birmingham test, and presentation is marked.</p>`;
    w.appendChild(warn);
    w.appendChild(el('div', { style:'display:flex;gap:10px;flex-wrap:wrap' }, [
      el('button', { class:'btn pri lg', text:'Begin — start the clock', onclick: () => { EXAM.phase='run'; EXAM.started=Date.now(); go('papers', undefined, { replace: true }); } }),
      el('button', { class:'btn lg', text:'Untimed', onclick: () => { EXAM.phase='run'; EXAM.started=Date.now(); EXAM.untimed=true; go('papers', undefined, { replace: true }); } }),
      el('button', { class:'btn ghost lg', text:'Back', onclick: () => { EXAM=null; go('papers', undefined, { replace: true }); } }),
    ]));
    stage.appendChild(w);
    return;
  }

  if (EXAM.phase === 'run') {
    focusMode(true);
    const bar = el('div', { id:'exambar' });
    const inner = el('div', { style:'max-width:812px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap' });
    const tEl = el('div', { class:'timer', text: fmtTime(ex.minutes * 60) });
    inner.appendChild(tEl);
    inner.appendChild(el('div', { class:'lbl', text: EXAM.untimed ? 'untimed' : 'remaining' }));
    inner.appendChild(el('div', { class:'spacer', style:'flex:1' }));
    inner.appendChild(el('button', { class:'btn', text:'Finish & mark', onclick: benchFinish }));
    bar.appendChild(inner);
    const tb = el('div', { class:'timerbar', style:'margin-top:10px;max-width:812px;margin-left:auto;margin-right:auto' });
    tb.innerHTML = '<i></i>';
    bar.appendChild(tb);
    stage.appendChild(bar);

    if (!EXAM.untimed) {
      const total = ex.minutes * 60;
      const iv = setInterval(() => {
        const left = total - (Date.now() - EXAM.started) / 1000;
        tEl.textContent = fmtTime(left);
        $('i', tb).style.width = Math.max(0, left / total * 100) + '%';
        const cls = left < 60 ? 'out' : left < 300 ? 'warn' : '';
        tEl.className = 'timer ' + cls; tb.className = 'timerbar ' + cls;
        if (left <= 0) { clearInterval(iv); toast('Time. Paper closed.'); benchFinish(); }
      }, 500);
      TIMERS.push(iv);
    }

    const w = el('div', { class:'wrap' });
    // stimulus
    const paper = el('div', { class:'paper' });
    ex.stimulus.forEach(s => paper.appendChild(renderStim(s)));
    w.appendChild(paper);
    // questions
    ex.questions.forEach((q, i) => {
      const blk = el('div', { style:'margin-bottom:26px' });
      const hd = el('div', { style:'display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:8px' });
      hd.innerHTML = `<div class="lbl">Question ${i+1}</div><div class="lbl">${q.marks} marks</div>`;
      blk.appendChild(hd);
      blk.appendChild(el('div', { class:'qstem', style:'font-size:15.5px;margin-bottom:10px', text: q.prompt }));
      const ta = el('textarea', { placeholder:'Write in full sentences.', rows:8 });
      ta.value = EXAM.answers[q.id] || '';
      ta.addEventListener('input', () => { EXAM.answers[q.id] = ta.value; wc.textContent = (ta.value.match(/\S+/g)||[]).length + ' words'; });
      blk.appendChild(ta);
      const wc = el('div', { class:'lbl', style:'margin-top:6px;text-align:right', text: ((EXAM.answers[q.id]||'').match(/\S+/g)||[]).length + ' words' });
      blk.appendChild(wc);
      w.appendChild(blk);
    });
    w.appendChild(el('button', { class:'btn pri lg', style:'margin-top:8px', text:'Finish & mark', onclick: benchFinish }));
    stage.appendChild(w);
    return;
  }

  benchMark(stage);
}

function renderStim(s) {
  if (s.t === 'h') return el('h4', { text: s.v });
  if (s.t === 'note') return el('p', { class:'note', text: s.v });
  if (s.t === 'table') {
    const wrap = el('div', { class:'tblwrap' });
    const t = el('table', { class:'dt' });
    if (s.caption) t.appendChild(el('caption', { text: s.caption }));
    const th = el('thead'), tr = el('tr');
    s.head.forEach(h => tr.appendChild(el('th', { text: h })));
    th.appendChild(tr); t.appendChild(th);
    const tb = el('tbody');
    s.rows.forEach(r => { const x = el('tr'); r.forEach(c => x.appendChild(el('td', { text: c }))); tb.appendChild(x); });
    t.appendChild(tb); wrap.appendChild(t);
    const out = el('div');
    out.appendChild(wrap);
    if (s.note) out.appendChild(el('p', { class:'note', style:'margin-top:-8px', text: s.note }));
    return out;
  }
  return el('p', { text: s.v });
}

function benchFinish() {
  clearTimers();
  EXAM.elapsed = (Date.now() - EXAM.started) / 1000;
  EXAM.phase = 'mark';
  // auto-detect against every rubric point, then let the learner adjudicate
  EXAM.ex.questions.forEach(q => {
    const res = scoreText(EXAM.answers[q.id] || '', q.rubric, q.traps);
    EXAM.awarded[q.id] = res.hits;
    EXAM.trapsFired = EXAM.trapsFired || {};
    EXAM.trapsFired[q.id] = res.traps;
  });
  go('papers');
}

function benchMark(stage) {
  const ex = EXAM.ex;
  focusMode(false);
  setTimeout(() => coachOn('marking'), 500);
  const w = el('div', { class:'wrap stg' });
  w.appendChild(el('div', { class:'lbl', text: ex.course + ' · ' + ex.year }));
  w.appendChild(el('h1', { style:'margin:6px 0 4px', text:'Marking' }));

  const scoreLine = el('div', { class:'card', style:'margin:18px 0 24px' });
  w.appendChild(scoreLine);
  const note = el('p', { style:'font-size:13px;color:var(--ink-2);margin-bottom:22px;max-width:70ch' });
  note.innerHTML = 'Ticks were placed automatically by matching your text against each rubric point. <b>The matcher is literal and you are not.</b> Read each point, and click the tick to award or remove it yourself — that adjudication is the exercise. Points you made in different words still count.';
  w.appendChild(note);

  function recompute() {
    let got = 0, max = 0;
    ex.questions.forEach(q => { const t = rubricTotals(q.rubric, EXAM.awarded[q.id] || {}); got += t.got; max += t.max; });
    const pct = max ? Math.round(got / max * 100) : 0;
    scoreLine.innerHTML = `<div style="display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap">
      <div><div class="lbl">Score</div><div class="dnum" style="font-size:40px;line-height:1">${got}<span style="font-size:19px;color:var(--ink-3)">/${max}</span></div></div>
      <div><div class="lbl">Percentage</div><div class="dnum" style="font-size:40px;line-height:1;color:${band(pct)[3]}">${pct}%</div></div>
      <div><div class="lbl">Time taken</div><div class="dnum" style="font-size:22px;line-height:1.6">${fmtTime(EXAM.elapsed)}</div></div>
      <div style="flex:1 1 160px"><div class="lbl">${band(pct)[2]}</div>
        <div class="meter" style="margin-top:7px"><i style="width:${pct}%;background:${band(pct)[3]}"></i></div></div>
    </div>`;
    S.written[ex.id] = { ts: Date.now(), score: got, max, pct, elapsed: EXAM.elapsed };
    save();
  }

  ex.questions.forEach((q, i) => {
    const blk = el('div', { style:'margin-bottom:34px' });
    const hd = el('div', { style:'display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:8px' });
    const t = rubricTotals(q.rubric, EXAM.awarded[q.id] || {});
    hd.innerHTML = `<div class="lbl">Question ${i+1}</div><div class="lbl" id="qs${i}">${t.got} / ${t.max}</div>`;
    blk.appendChild(hd);
    blk.appendChild(el('div', { class:'qstem', style:'font-size:15px;margin-bottom:12px', text: q.prompt }));

    const yours = el('details', { class:'disc' });
    yours.innerHTML = `<summary>Your answer (${((EXAM.answers[q.id]||'').match(/\S+/g)||[]).length} words)</summary>`;
    const yc = el('div', { class:'dc' });
    yc.appendChild(el('p', { class:'serif', style:'white-space:pre-wrap;color:var(--ink-2)',
      text: EXAM.answers[q.id] || '(nothing written)' }));
    yours.appendChild(yc);
    blk.appendChild(yours);

    if (q.guidance) {
      const g = el('div', { class:'card', style:'margin-top:10px' });
      g.innerHTML = `<div class="lbl">What this question is actually testing</div><p style="margin-top:6px;font-size:13.5px;color:var(--ink-2)">${esc(q.guidance)}</p>`;
      blk.appendChild(g);
    }

    (EXAM.trapsFired[q.id] || []).forEach(tr => {
      const t2 = el('div', { class:'flag' });
      t2.innerHTML = `<div class="lbl">Flagged in your answer</div>${esc(tr.msg)}`;
      blk.appendChild(t2);
    });

    const rub = el('div', { class:'rub' });
    q.rubric.forEach(r => {
      const on = !!(EXAM.awarded[q.id] || {})[r.id];
      const row = el('div', { class:'rubpt' + (on ? ' hit' : '') + (r.tier === 'advanced' ? ' adv' : '') });
      const tick = el('button', { class:'tick', text:'✓', role:'checkbox',
        'aria-checked': String(on),
        'aria-label': `Award ${r.weight} mark${r.weight === 1 ? '' : 's'}: ${r.text}`,
        title:'Award or remove this point' });
      tick.addEventListener('click', () => {
        const now = !EXAM.awarded[q.id][r.id];
        EXAM.awarded[q.id][r.id] = now;
        row.classList.toggle('hit', now);
        tick.setAttribute('aria-checked', String(now));
        const tt = rubricTotals(q.rubric, EXAM.awarded[q.id]);
        $('#qs' + i).textContent = tt.got + ' / ' + tt.max;
        announce(`${now ? 'Awarded' : 'Removed'}. Question ${i + 1}: ${tt.got} of ${tt.max}.`);
        recompute();
      });
      row.append(tick, el('span', { class:'tx', text: r.text }), el('span', { class:'wt', text: r.weight }));
      rub.appendChild(row);
    });
    blk.appendChild(rub);

    const model = el('details', { class:'disc' });
    model.innerHTML = `<summary>A strong answer</summary>`;
    const mc = el('div', { class:'dc' });
    mc.appendChild(el('p', { class:'serif', style:'white-space:pre-wrap', text: q.model }));
    model.appendChild(mc);
    blk.appendChild(model);
    w.appendChild(blk);
  });

  if (ex.debrief) {
    const d = el('div', { class:'card', style:'margin-bottom:20px;border-color:color-mix(in srgb,var(--accent) 36%,transparent)' });
    d.innerHTML = `<div class="lbl" style="color:var(--accent)">What this paper is really testing</div>
      <p style="margin-top:8px;font-size:14px">${esc(ex.debrief)}</p>`;
    w.appendChild(d);
  }
  w.appendChild(el('div', { style:'display:flex;gap:10px;flex-wrap:wrap' }, [
    el('button', { class:'btn pri', text:'Back to the papers', onclick: () => { EXAM = null; go('papers'); } }),
    el('button', { class:'btn', text:'Retake this paper', onclick: () => benchStart(stage, ex.id) }),
  ]));
  stage.appendChild(w);
  recompute();
}

/* ---------------------------------------------------------- PANEL (interview) */
let PANEL = null;

function vPanel(stage, arg) {
  if (PANEL) return panelRun(stage);
  const w = el('div', { class:'wrap stg' });
  w.appendChild(pageHead(null, 'The Panel',
    'Every question here was actually asked. Answer out loud, against the clock. Afterwards you get what the panel is listening for, the follow-up they push with, and the failure mode most candidates fall into.', true));

  const filt = section('Run a set', { note:'answered aloud, timed' });
  const btns = el('div', { style:'display:flex;gap:8px;flex-wrap:wrap' });
  [['Mixed panel — 5 questions', () => startPanel(shuffle(DATA.interview.questions).slice(0, 5))],
   ['Clinical panel', () => startPanel(shuffle(DATA.interview.questions.filter(q => q.panel === 'clinical')).slice(0, 5))],
   ['Academic panel', () => startPanel(shuffle(DATA.interview.questions.filter(q => q.panel === 'academic')).slice(0, 5))],
   ['Personal / professional', () => startPanel(shuffle(DATA.interview.questions.filter(q => q.panel === 'personal')).slice(0, 5))],
   ['Cardiff only', () => startPanel(shuffle(DATA.interview.questions.filter(q => q.course === 'Cardiff')).slice(0, 6))],
   ['Rapid fire — 60 seconds each', () => startPanel(shuffle(DATA.interview.questions).slice(0, 8), '60s')],
  ].forEach(([nm, fn], i) => btns.appendChild(el('button', { class:'btn' + (i ? '' : ' pri'), text:nm, onclick:fn })));
  filt.appendChild(btns);
  w.appendChild(filt);

  const bt = section('By theme', { note:'what each one is really testing' });
  const themeCount = {};
  DATA.interview.questions.forEach(q => themeCount[q.theme] = (themeCount[q.theme] || 0) + 1);
  bt.appendChild(plate(DATA.interview.themes.slice()
    .sort((a,b) => (themeCount[b.id]||0) - (themeCount[a.id]||0))
    .map(t => prow({
      name: t.label,
      sub: t.why.slice(0, 150) + (t.why.length > 150 ? '…' : ''),
      tail: el('span', { class:'meta', text: (themeCount[t.id]||0) + ' q' }),
      onclick: () => showTheme(t.id) }))));
  w.appendChild(bt);
  stage.appendChild(w);
}

function startPanel(qs, forceMode) {
  if (!qs.length) { toast('No questions match'); return; }
  PANEL = { qs, idx:0, forceMode, results:[] };
  go('panel');
}

function panelRun(stage) {
  if (PANEL.idx >= PANEL.qs.length) return panelSummary(stage);
  focusMode(true);
  const q = PANEL.qs[PANEL.idx];
  const theme = DATA.interview.themes.find(t => t.id === q.theme);
  const mode = PANEL.forceMode || q.mode;
  const secs = mode === '60s' ? 60 : 180;

  const bar = el('div', { id:'sessbar' });
  bar.innerHTML = `<button class="x" title="Leave">✕</button>
    <div class="track"><i></i></div>
    <span class="lbl" style="flex:none">${PANEL.idx + 1}/${PANEL.qs.length}</span>`;
  $('.x', bar).addEventListener('click', () => { PANEL = null; go('panel'); });
  stage.appendChild(bar);
  requestAnimationFrame(() => { $('.track i', bar).style.width = (PANEL.idx / PANEL.qs.length * 100) + '%'; });

  const w = el('div', { class:'wrap centred' });
  const tags = el('div', { class:'tagrow', style:'margin-bottom:20px' });
  tags.innerHTML = `<span class="pill on">${esc(q.course)} ${q.year}</span>
    <span class="pill">${esc(q.panel)}</span>
    <span class="pill">${mode === '60s' ? '60 seconds' : '3 minutes'}</span>`;
  w.appendChild(tags);

  // the question is the hero: this is somebody asking you something
  const ask = el('div', { class:'askq' });
  ask.innerHTML = `<span class="q">“</span><p>${esc(q.text)}</p>`;
  w.appendChild(ask);

  const clock = el('div', { class:'clockwrap' });
  const tEl = el('div', { class:'timer bigclock', text: fmtTime(secs) });
  clock.appendChild(tEl);
  const tb = el('div', { class:'timerbar', style:'margin-top:14px' });
  tb.innerHTML = '<i></i>';
  clock.appendChild(tb);
  clock.appendChild(el('p', { class:'src', style:'margin-top:12px;text-align:center',
    text:'Answer out loud. Reading a good answer is not the same skill as producing one under a clock.' }));
  w.appendChild(clock);

  const trBox = el('div', { class:'card', style:'margin-top:18px;display:none' });
  trBox.innerHTML = `<div class="lbl">Live transcript</div>`;
  const trText = el('p', { class:'serif', style:'margin-top:8px;color:var(--ink-2);min-height:2em' });
  trBox.appendChild(trText);
  w.appendChild(trBox);
  stage.appendChild(w);

  let running = false, left = secs, iv = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, transcript = '';

  const startBtn = el('button', { class:'btn pri lg', text:'Start' });
  const doneBtn  = el('button', { class:'btn lg', text:'Finished', disabled:'' });
  const micBtn = SR ? el('button', { class:'btn sm ghost', html: icon('panel', 15) + ' Transcribe' }) : null;
  if (micBtn) micBtn.addEventListener('click', () => {
    try {
      rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = 'en-GB';
      rec.onresult = e => {
        let t = '';
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
        transcript = t; trText.textContent = t;
      };
      rec.onerror = () => toast('Transcription unavailable — self-scoring still works');
      rec.start(); trBox.style.display = 'block'; micBtn.remove();
      toast('Listening. Your speech stays in this browser.');
    } catch (err) { toast('Transcription unavailable in this browser'); }
  });
  Act.row([micBtn], [doneBtn, startBtn]);

  startBtn.addEventListener('click', () => {
    if (running) return;
    running = true; startBtn.disabled = true; doneBtn.disabled = false;
    iv = setInterval(() => {
      left--; tEl.textContent = fmtTime(left);
      $('i', tb).style.width = Math.max(0, left / secs * 100) + '%';
      const cls = left <= 10 ? 'out' : left <= 30 ? 'warn' : '';
      tEl.className = 'timer bigclock ' + cls; tb.className = 'timerbar ' + cls;
      if (left === 30 || left === 10) tick(660, .07, .04);
      if (left <= 0) { clearInterval(iv); tick(420, .3, .06); toast('Time.'); finish(); }
    }, 1000);
    TIMERS.push(iv);
  });
  doneBtn.addEventListener('click', finish);

  function finish() {
    running = false; clearInterval(iv);
    try { if (rec) rec.stop(); } catch (e) {}
    if ($('#panelfb')) return;
    w.classList.remove('centred');   // feedback is long; stop centring
    w.appendChild(panelFeedback(q, theme, secs - left, transcript, () => { PANEL.idx++; go('panel'); }));
    scrollEnd(w);
  }
}

function panelFeedback(q, theme, spent, transcript, onNext) {
  focusMode(false);   // the timed part is over — give the navigation back
  Act.hide();
  const wrap = el('div', { id:'panelfb', style:'margin-top:24px' });
  const auto = transcript ? scoreText(transcript, theme.listen.map((l, i) => ({ id:'l'+i, cues:l.cues, weight:1, text:l.text })), []) : null;
  const awarded = {};
  theme.listen.forEach((l, i) => awarded['l'+i] = auto ? auto.hits['l'+i] : false);

  const head = el('div', { class:'card', style:'margin-bottom:14px' });
  const scoreEl = el('div');
  head.appendChild(scoreEl);
  wrap.appendChild(head);

  const intro = el('p', { style:'font-size:13px;color:var(--ink-2);margin-bottom:14px' });
  intro.innerHTML = transcript
    ? 'Ticks below were placed by matching your transcript. Adjust any that are wrong — speech recognition is rough and the matcher is literal.'
    : 'Score yourself honestly against what the panel is listening for. Tick only what you actually said out loud.';
  wrap.appendChild(intro);

  const rub = el('div', { class:'rub' });
  theme.listen.forEach((l, i) => {
    const id = 'l' + i;
    const row = el('div', { class:'rubpt' + (awarded[id] ? ' hit' : '') + (l.tier === 'advanced' ? ' adv' : '') });
    const tick2 = el('button', { class:'tick', text:'✓', role:'checkbox',
      'aria-checked': String(!!awarded[id]),
      'aria-label': 'I said this: ' + l.text });
    tick2.addEventListener('click', () => {
      awarded[id] = !awarded[id];
      row.classList.toggle('hit', awarded[id]);
      tick2.setAttribute('aria-checked', String(awarded[id]));
      recompute();
    });
    row.append(tick2, el('span', { class:'tx', text: l.text }));
    rub.appendChild(row);
  });
  wrap.appendChild(rub);

  function recompute() {
    const got = Object.values(awarded).filter(Boolean).length, max = theme.listen.length;
    const pct = Math.round(got / max * 100);
    scoreEl.innerHTML = `<div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap">
      <div><div class="lbl">Moves hit</div><div class="dnum" style="font-size:34px;line-height:1">${got}<span style="font-size:16px;color:var(--ink-3)">/${max}</span></div></div>
      <div><div class="lbl">Time used</div><div class="dnum" style="font-size:20px;line-height:1.7">${fmtTime(spent)}</div></div>
      <div style="flex:1 1 150px"><div class="lbl">${band(pct)[2]}</div>
        <div class="meter" style="margin-top:7px"><i style="width:${pct}%;background:${band(pct)[3]}"></i></div></div></div>`;
    S.panel[q.id] = { ts: Date.now(), got, max, spent }; save();
  }
  recompute();

  if (transcript) {
    const d = el('details', { class:'disc' });
    d.innerHTML = '<summary>Your transcript</summary>';
    const dc = el('div', { class:'dc' });
    dc.appendChild(el('p', { class:'serif', style:'color:var(--ink-2)', text: transcript }));
    d.appendChild(dc); wrap.appendChild(d);
  }

  const shape = el('div', { class:'card', style:'margin-top:14px;border-color:color-mix(in srgb,var(--accent) 34%,transparent)' });
  shape.innerHTML = `<div class="lbl" style="color:var(--accent)">The shape of a strong answer</div>
    <p style="margin-top:8px;font-size:14px">${esc(theme.shape)}</p>`;
  wrap.appendChild(shape);

  const fail = el('div', { class:'flag', style:'margin-top:12px' });
  fail.innerHTML = `<div class="lbl">The common failure</div>${esc(theme.failure)}`;
  wrap.appendChild(fail);

  const fu = el('div', { class:'card', style:'margin-top:12px' });
  fu.innerHTML = `<div class="lbl">They will push with</div>`;
  const list = el('div', { style:'margin-top:9px;display:grid;gap:7px' });
  shuffle(theme.followups).slice(0, 4).forEach(f => list.appendChild(
    el('p', { class:'serif', style:'margin:0;font-size:15px', text: '“' + f + '”' })));
  fu.appendChild(list);
  const pressBtn = el('button', { class:'btn', style:'margin-top:13px', text:'Answer one now — 60 seconds' });
  pressBtn.addEventListener('click', () => {
    pressBtn.disabled = true;
    const f = pick(theme.followups);
    const box = el('div', { class:'card', style:'margin-top:12px;border-color:var(--warning)' });
    const t = el('div', { class:'timer', style:'font-size:30px' , text:'1:00' });
    box.innerHTML = `<div class="lbl" style="color:var(--warning)">Pressure follow-up</div>
      <p class="serif" style="font-size:17px;margin:8px 0 12px">“${esc(f)}”</p>`;
    box.appendChild(t);
    fu.appendChild(box);
    let l = 60;
    const iv = setInterval(() => { l--; t.textContent = fmtTime(l); if (l <= 0) { clearInterval(iv); t.className = 'timer out'; tick(420,.3,.06); } }, 1000);
    TIMERS.push(iv);
    scrollEnd(wrap);
  });
  fu.appendChild(pressBtn);
  wrap.appendChild(fu);

  wrap.appendChild(el('button', { class:'btn pri lg wide', style:'margin-top:20px',
    text: 'Next question', onclick: onNext }));
  return wrap;
}

function roomRun(stage) {
  stage.innerHTML = '';
  focusMode(true);
  const s = RP.s;
  const w = el('div', { class:'wrap' });
  w.appendChild(backLink('All scenarios', () => { RP = null; go('room'); }));

  const brief = el('div', { class:'card', style:'margin-bottom:20px' });
  brief.innerHTML = `<div class="lbl">Your brief</div>
    <p style="margin-top:7px;font-size:13.5px;color:var(--ink-2)">${esc(s.brief)}</p>
    <p style="margin-top:9px;font-size:12.5px;color:var(--ink-3)"><b>${esc(s.character)}</b> · ${esc(s.setting)}</p>`;
  w.appendChild(brief);

  const script = el('div');
  w.appendChild(script);

  // opening
  script.appendChild(turnEl('them', s.character.split(',')[0], s.opening));
  RP.log.forEach(entry => {
    script.appendChild(turnEl('you', 'You', entry.said));
    const fb = el('div', { class:'fbnote ' + (entry.s > 0 ? 'pos' : entry.s < 0 ? 'neg' : '') });
    fb.innerHTML = `<b>${entry.s > 0 ? '+' : ''}${entry.s}</b> · ${esc(entry.f)}`;
    script.appendChild(fb);
    if (entry.next) script.appendChild(turnEl('them', s.character.split(',')[0], entry.next));
  });

  if (RP.turn >= s.turns.length) return roomEnd(stage, w, script);

  const t = s.turns[RP.turn];
  if (RP.turn > 0 || RP.log.length === 0) {
    // the character's line for this turn is shown once
  }
  if (RP.log.length === 0) script.appendChild(turnEl('them', s.character.split(',')[0], t.says));
  else if (!RP.log[RP.log.length - 1].next) script.appendChild(turnEl('them', s.character.split(',')[0], t.says));

  const opts = el('div', { class:'choices', style:'margin-top:18px' });
  shuffle(t.options).forEach(o => {
    const b = el('button', { class:'choice' }, [
      el('span', { class:'key', text:'›' }),
      el('span', {}, [el('span', { text: o.t })]),
    ]);
    b.addEventListener('click', () => {
      const nextTurn = s.turns[RP.turn + 1];
      RP.log.push({ said:o.t, s:o.s, f:o.f, d:o.d, next: nextTurn ? nextTurn.says : null });
      RP.score += o.s;
      RP.max += 3;
      RP.turn++;
      go('room', undefined, { replace: true });
    });
    opts.appendChild(b);
  });
  w.appendChild(opts);
  stage.appendChild(w);
  requestAnimationFrame(() => scrollEnd(w));
}

function turnEl(who, name, text) {
  const t = el('div', { class:'turn' + (who === 'you' ? ' you' : '') });
  t.innerHTML = `<div class="av">${who === 'you' ? 'You' : name.slice(0,1)}</div>
    <div class="sp"><div class="who">${esc(who === 'you' ? 'You' : name)}</div>
    <div class="tx">${esc(text)}</div></div>`;
  return t;
}

function roomEnd(stage, w, script) {
  focusMode(false);
  const s = RP.s;
  const pct = Math.round(Math.max(0, RP.score) / RP.max * 100);
  const prev = S.rp[s.id];
  if (!prev || RP.score > prev.score) S.rp[s.id] = { ts: Date.now(), score: RP.score, max: RP.max };
  save();

  const dims = {};

  const res = el('div', { class:'card', style:'margin-top:22px' });
  res.innerHTML = `<div style="display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap">
      <div><div class="lbl">Process score</div><div class="dnum" style="font-size:38px;line-height:1;color:${band(pct)[3]}">${RP.score}<span style="font-size:17px;color:var(--ink-3)">/${RP.max}</span></div></div>
      <div style="flex:1 1 180px"><div class="lbl">${band(pct)[2]}</div>
        <div class="meter" style="margin-top:7px"><i style="width:${pct}%;background:${band(pct)[3]}"></i></div></div>
    </div>`;
  const dimRow = el('div', { class:'tagrow', style:'margin-top:16px' });
  Object.entries(dims).forEach(([d, n]) => dimRow.appendChild(
    el('span', { class:'pill' + (['fix','close','self'].includes(d) ? '' : ' on'),
                 text: (DATA.roleplay.dims[d] || d) + ' ×' + n })));
  res.appendChild(dimRow);
  w.appendChild(res);

  const db = el('div', { class:'card', style:'margin-top:14px;border-color:color-mix(in srgb,var(--accent) 34%,transparent)' });
  db.innerHTML = `<div class="lbl" style="color:var(--accent)">Debrief</div>
    <p style="margin-top:8px;font-size:14px;line-height:1.62">${esc(s.debrief)}</p>`;
  w.appendChild(db);

  w.appendChild(el('div', { style:'display:flex;gap:10px;margin-top:18px;flex-wrap:wrap' }, [
    el('button', { class:'btn pri', text:'Run it again', onclick: () => { RP = { s, turn:0, score:0, max:0, log:[] }; go('room'); } }),
    el('button', { class:'btn', text:'Other scenarios', onclick: () => { RP = null; go('room'); } }),
  ]));
  stage.appendChild(w);
  requestAnimationFrame(() => scrollEnd(w));
}
