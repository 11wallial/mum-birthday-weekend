<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DClinPsy Trainer</title>
<meta name="description" content="A preparation engine for UK Doctorate in Clinical Psychology selection, built from real past papers and one official marking scheme.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DClinPsy Trainer — design system

   ONE COLOUR RULE, held everywhere:

     Neutrals carry the interface.  Colour is only ever data or outcome.

   · Chrome, structure and the primary action are warm ink on warm paper.
     There is no decorative accent hue anywhere in this file. A violet
     button, a tinted icon chip or a "brand" colour on a label would all
     break the rule.
   · The three DOMAIN hues (research / clinical / professional) appear only
     where they encode which domain something belongs to — dots, meters,
     depth rungs, Atlas nodes. Never on chrome, never as decoration.
   · The three STATUS hues (correct / incorrect / attention) appear only
     where they encode an outcome. Never as a category colour.

   The consequence: selection reads as neutral and outcome reads as
   coloured, so the two can never be confused, and nothing on a page is
   coloured for want of a better idea.

   TYPE — two faces, four display steps.
   Instrument Sans for the interface; Newsreader for clinical and exam
   material, so "the app" and "the thing you are reading" never blur.
   Display sizes carry negative tracking that scales with size.

   ELEVATION — three layered steps. Shadows are stacked (contact + ambient
   + cast) rather than a single blur, so a raised surface reads as lit
   rather than as a floating rectangle.

   MOTION — four durations, three curves, defined as tokens. Entrances use
   an expo-out; anything that should feel physical uses the spring.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  color-scheme: light;

  /* ---- ground & surfaces. Warm, not Tailwind-slate neutral ---- */
  --bg:        #FBFAF8;
  --bg-2:      #F2EFEA;
  --card:      #FFFFFF;
  --card-2:    #F8F6F3;
  --line:      #E9E5DE;
  --line-2:    #D7D1C7;
  /* control boundaries carry meaning where no label does (inputs, ticks,
     pips), so they are held to 3:1. Decorative hairlines use --line. */
  --field-line: #88847E;

  /* ---- ink. Warm near-black, never pure ---- */
  --ink:       #1A1815;
  --ink-2:     #57534B;
  --ink-3:     #6D6860;

  /* ---- the primary action. Ink, not a hue. See the colour rule. ---- */
  --accent:      #1A1815;
  --accent-deep: #000000;
  --accent-soft: #F2EFEA;
  --accent-ink:  #FBFAF8;

  /* ---- DOMAIN: data only ---- */
  --d-research:      #2a78d6;
  --d-clinical:      #DA6030;
  --d-professional:  #179769;
  --d-research-soft:     #EAF2FC;
  --d-clinical-soft:     #FDEFE9;
  --d-professional-soft: #E7F7F1;

  /* ---- STATUS: outcome only ---- */
  --good:      #0D7843;
  --good-deep: #0B6B3B;
  --good-soft: #E9F5ED;
  --warning:   #8F5F09;
  --warning-soft: #FBF2E0;
  --serious:   #C2621F;
  --wrong:      #C0362D;
  --wrong-deep: #9E2A23;
  --wrong-soft: #FBEDEB;

  /* sequential ramp — mastery magnitude */
  --seq-1: #DDE7F6; --seq-2: #B7D3F6; --seq-3: #86b6ef;
  --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;

  /* ---- spacing: strict 4px grid, no arbitrary values ---- */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  /* ---- radius: four values ---- */
  --r-s: 10px; --r-m: 14px; --r-l: 20px; --r-pill: 999px;

  /* ---- elevation: layered, contact + ambient + cast ---- */
  --sh-1: 0 1px 1px rgba(26,24,21,.04),
          0 2px 4px rgba(26,24,21,.03);
  --sh-2: 0 1px 1px rgba(26,24,21,.04),
          0 3px 6px rgba(26,24,21,.04),
          0 8px 20px rgba(26,24,21,.05);
  --sh-3: 0 1px 2px rgba(26,24,21,.05),
          0 6px 14px rgba(26,24,21,.07),
          0 20px 44px rgba(26,24,21,.09);
  --sh-up: 0 -1px 1px rgba(26,24,21,.04),
           0 -3px 8px rgba(26,24,21,.04),
           0 -14px 34px rgba(26,24,21,.07);
  /* a hairline of light along the top of a raised surface */
  --edge: inset 0 1px 0 rgba(255,255,255,.9);

  /* ---- type ---- */
  --sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;

  /* ---- motion ---- */
  --m-fast: 120ms;
  --m-base: 200ms;
  --m-slow: 340ms;
  --m-page: 460ms;
  --e-out:    cubic-bezier(.16, 1, .3, 1);      /* expo-out: entrances */
  --e-spring: cubic-bezier(.34, 1.26, .5, 1);   /* overshoot: things that move */
  --e-both:   cubic-bezier(.65, 0, .35, 1);     /* symmetric: state changes */
  /* legacy aliases, kept so no rule silently loses its easing */
  --ease: var(--e-out);
  --spring: var(--e-spring);
  --t-fast: var(--m-fast); --t-mid: var(--m-base);

  --bar-h: 56px;
  --act-h: 80px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:      #131210;
  --bg-2:    #1E1C19;
  --card:    #1B1917;
  --card-2:  #232120;
  --line:    #302D29;
  --line-2:  #45413A;
  --field-line: #6E6B66;
  --ink:     #F3F0EB;
  --ink-2:   #A9A29A;
  --ink-3:   #8D8881;

  --accent:      #F3F0EB;
  --accent-deep: #FFFFFF;
  --accent-soft: #262320;
  --accent-ink:  #131210;

  --d-research:      #4a95e8;
  --d-clinical:      #ef7c4e;
  --d-professional:  #2bbd87;
  --d-research-soft:     #15263C;
  --d-clinical-soft:     #2F1E17;
  --d-professional-soft: #112B25;

  --good:      #35B872;  --good-deep: #2AA063;  --good-soft: #13291C;
  --warning:   #E0A63A;  --warning-soft: #2B2416;
  --serious:   #E08A4E;
  --wrong:     #E4726B;  --wrong-deep: #C9564E; --wrong-soft: #2E1B19;

  --seq-1: #1E3050; --seq-2: #22436E; --seq-3: #2A5A96;
  --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4; --seq-7: #cde2fb;

  --sh-1: 0 1px 1px rgba(0,0,0,.4),
          0 2px 4px rgba(0,0,0,.3);
  --sh-2: 0 1px 1px rgba(0,0,0,.4),
          0 3px 6px rgba(0,0,0,.34),
          0 8px 20px rgba(0,0,0,.34);
  --sh-3: 0 1px 2px rgba(0,0,0,.44),
          0 6px 14px rgba(0,0,0,.4),
          0 20px 44px rgba(0,0,0,.5);
  --sh-up: 0 -1px 1px rgba(0,0,0,.4),
           0 -3px 8px rgba(0,0,0,.34),
           0 -14px 34px rgba(0,0,0,.44);
  --edge: inset 0 1px 0 rgba(255,255,255,.06);
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'ss01' 1;             /* Instrument Sans alternates */
  overflow: hidden;
  height: 100vh; height: 100dvh;
}
::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }

/* ---------------------------------------------------------- type scale
   Four display steps and two utility steps. Tracking tightens as size
   grows — the ratio is roughly -0.001em per point above 15px — so large
   text reads as set rather than as body copy scaled up. */
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.038em; line-height: 1.1;  text-wrap: balance; }
h2 { font-size: 23px; font-weight: 600; letter-spacing: -0.028em; line-height: 1.16; }
h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.014em; }
h4 { font-size: 15px; font-weight: 600; letter-spacing: -0.008em; }
p  { margin: 0 0 .75em; }
p:last-child { margin-bottom: 0; }
a { color: var(--accent); }
strong, b { font-weight: 600; color: var(--ink); }
em { font-style: italic; }

.display { font-size: 46px; font-weight: 600; letter-spacing: -0.046em; line-height: 1.04; }
.dnum { font-variant-numeric: tabular-nums; letter-spacing: -0.04em; font-weight: 600; }
.lbl {
  font-size: 10.5px; font-weight: 620; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-3);
}
.serif { font-family: var(--serif); font-size: 17px; line-height: 1.62; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.lead { font-size: 16px; line-height: 1.55; color: var(--ink-2); max-width: 56ch; }

/* inline metadata — dot-separated, quiet, never a row of chips */
.meta {
  font-size: 13px; color: var(--ink-3); font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.meta b { color: var(--ink-2); font-weight: 600; }
.meta .sep { opacity: .5; margin: 0 var(--s2); }
.src { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }

/* ---------------------------------------------------------- shell */
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

#top {
  height: var(--bar-h); flex: none; display: flex; align-items: center; gap: var(--s4);
  padding: 0 var(--s5); background: var(--card);
  border-bottom: 1px solid var(--line); position: relative; z-index: 40;
  transition: transform .3s var(--ease), opacity var(--t-mid) var(--ease);
}
.brand {
  display: flex; align-items: center; gap: var(--s2); flex: none; border: 0;
  background: none; cursor: pointer; padding: 0; color: inherit;
}
.brand .mk {
  width: 22px; height: 22px; flex: none; color: var(--accent);
}
.brand .mk svg { width: 22px; height: 22px; display: block; }
.brand .wm { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.brand .wm b { font-size: 14.5px; font-weight: 600; letter-spacing: -0.028em; }
.brand .wm i {
  font-style: normal; font-size: 8.5px; font-weight: 600; letter-spacing: .19em;
  color: var(--ink-3); margin-top: 2px;
}

nav#tabs { display: flex; gap: var(--s1); min-width: 0; overflow-x: auto; scrollbar-width: none; }
nav#tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: transparent; color: var(--ink-3);
  font: inherit; font-size: 14px; font-weight: 600; padding: var(--s2) var(--s3);
  border-radius: var(--r-s); cursor: pointer; white-space: nowrap;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.tab:hover { color: var(--ink); background: var(--bg-2); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; background: var(--bg-2); }

.spacer { flex: 1 1 auto; }

.metric {
  display: inline-flex; align-items: center; gap: var(--s1); height: 30px; padding: 0 var(--s2);
  border-radius: var(--r-s); background: transparent; border: 0; cursor: pointer;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.metric:hover { background: var(--bg-2); color: var(--ink); }
.metric:hover .ic { color: var(--ink-2); }
.metric .ic { width: 14px; height: 14px; flex: none; color: var(--ink-3); }
.metric .ic svg { width: 14px; height: 14px; display: block; }

.iconbtn {
  width: 30px; height: 30px; display: grid; place-items: center; flex: none;
  border: 0; border-radius: var(--r-s); background: transparent;
  color: var(--ink-3); cursor: pointer; font-size: 13px; font-weight: 600;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.iconbtn:hover { background: var(--bg-2); color: var(--ink); }

#stage { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 700px; margin: 0 auto; padding: var(--s7) var(--s5) var(--s8); }
.wrap.wide { max-width: 980px; }
/* Today runs wider than the reading surfaces and pairs its two review
   sections, so the screen has a composition rather than one centred column. */
.wrap.today { max-width: 860px; }
.pair { display: grid; gap: var(--s5) var(--s6); margin-top: var(--s7); }
.pair > .section { margin-top: 0; }
@media (min-width: 900px) { .pair { grid-template-columns: 1fr 1fr; } }
.wrap.narrow { max-width: 580px; }
#stage.hasact .wrap { padding-bottom: calc(var(--act-h) + var(--s7)); }

/* focus mode: the chrome leaves while you work */
body.focus #top { transform: translateY(calc(-1 * var(--bar-h))); opacity: 0; pointer-events: none; }
body.focus #app { --bar-h: 0px; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3.5px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------------------------------------------------- buttons
   Flat. One primary per screen. Press is a 2% scale, not a 4px drop. */
.btn {
  appearance: none; font: inherit; font-size: 14.5px; font-weight: 600;
  padding: 10px 18px; border-radius: var(--r-s); cursor: pointer;
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  transition: transform var(--m-fast) var(--e-spring), background var(--m-fast) var(--e-both),
              border-color var(--m-fast) var(--e-both), opacity var(--m-fast) var(--e-both),
              box-shadow var(--m-base) var(--e-out);
}
.btn:hover { background: var(--card-2); border-color: var(--ink-3); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn:disabled:hover { background: var(--card); border-color: var(--line-2); }

.btn.pri {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,.12);
}
.btn.pri:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.pri:disabled:hover { background: var(--accent); border-color: var(--accent); }

.btn.ok { background: var(--good); color: #fff; border-color: var(--good); }
.btn.ok:hover { background: var(--good-deep); border-color: var(--good-deep); }
.btn.no { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.btn.no:hover { background: var(--wrong-deep); border-color: var(--wrong-deep); }

.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); font-weight: 600; }
.btn.ghost:hover { background: var(--bg-2); border-color: transparent; color: var(--ink); }

.btn.lg { font-size: 15.5px; padding: 13px 24px; border-radius: var(--r-s); }
.btn.sm { font-size: 13px; padding: 6px 12px; border-radius: var(--r-s); }
.btn.wide { width: 100%; }
.btn .arw { transition: transform var(--t-mid) var(--ease); }
.btn:hover .arw { transform: translateX(3px); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
/* On an ink-filled control the ink ring would vanish, so invert it there. */
.btn.pri:focus-visible, .btn.ok:focus-visible, .btn.no:focus-visible,
.pip.on:focus-visible, .pill.act.on:focus-visible,
.sidebtn.on:focus-visible, .rubpt.hit .tick:focus-visible,
.choice.sel .key:focus-visible {
  outline-color: var(--accent-ink); outline-offset: -4px;
}

/* visible only to assistive technology */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: fixed; top: -60px; left: var(--s3); z-index: 100;
  background: var(--card); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: var(--r-s); padding: 10px 16px; font-weight: 600; font-size: 14px;
  text-decoration: none; box-shadow: var(--sh-2);
  transition: top var(--m-base) var(--e-out);
}
.skip:focus { top: var(--s3); }
/* The drill stem takes focus on each item so a keyboard user is not returned
   to the top of the document every question. It is a destination, not a
   control, so it is announced without being ringed — drawing a focus ring
   around the question on every item would be noise, not feedback. */
[tabindex="-1"]:focus { outline: none; }
.focus-quiet:focus, .focus-quiet:focus-visible { outline: none; box-shadow: none; }

/* segmented control — choosing a mode, not three competing calls to action.
   The thumb slides between options rather than the highlight snapping. */
.seg {
  display: inline-flex; padding: 3px; background: var(--bg-2);
  border-radius: var(--r-s); flex: none; position: relative;
}
.seg .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 0; width: 0;
  background: var(--card); border-radius: 8px; box-shadow: var(--sh-1);
  transition: transform var(--m-slow) var(--e-spring), width var(--m-slow) var(--e-spring);
  pointer-events: none;
}
.seg button {
  appearance: none; border: 0; background: transparent; font: inherit; font-size: 13px;
  font-weight: 500; color: var(--ink-3); padding: 6px 13px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;
  position: relative; z-index: 1;
  transition: color var(--m-base) var(--e-both);
}
.seg button:hover { color: var(--ink-2); }
.seg button.on { color: var(--ink); font-weight: 600; }

/* the single way back */
.backlink {
  display: inline-flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4);
  background: none; border: 0; padding: 4px 0; cursor: pointer; font: inherit;
  font-size: 13.5px; font-weight: 600; color: var(--ink-3);
  transition: color var(--t-fast) var(--ease);
}
.backlink:hover { color: var(--ink); }
.backlink .bk { display: block; transform: rotate(180deg); transition: transform var(--t-mid) var(--ease); }
.backlink .bk svg { display: block; }
.backlink:hover .bk { transform: rotate(180deg) translateX(3px); }

.pagehead { margin-bottom: var(--s5); }
.pagehead .lbl { display: block; margin-bottom: var(--s2); }
.pagehead h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.028em; }
.pagehead.big h1 { font-size: 31px; letter-spacing: -0.032em; }
.pagehead .sub { font-size: 15px; color: var(--ink-2); margin-top: var(--s1); max-width: 60ch; }

/* ---------------------------------------------------------- structure
   A section is a quiet label, an optional trailing action, and content.
   This is what replaces stacking cards to signal grouping. */
.section { margin-top: var(--s7); }
.section:first-child { margin-top: 0; }
.sechead {
  display: flex; align-items: baseline; gap: var(--s3);
  padding-bottom: var(--s3); margin-bottom: var(--s4);
  border-bottom: 1px solid var(--line);
}
.sechead .lbl { flex: none; }
.sechead .note { font-size: 12.5px; color: var(--ink-3); }
.sechead .act {
  margin-left: auto; flex: none; font-size: 13px; font-weight: 500; color: var(--ink-2);
  background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0;
}
.sechead .act:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* a plate holds rows divided by hairlines — one container, many items */
.plate {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m);
  overflow: hidden;
}
.plate > * + * { border-top: 1px solid var(--line); }
.prow {
  display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left;
  padding: var(--s4) var(--s4); background: none; border: 0; font: inherit; color: inherit;
  transition: background var(--t-fast) var(--ease);
}
button.prow { cursor: pointer; }
button.prow:hover { background: var(--card-2); }
.prow .pmain { flex: 1 1 auto; min-width: 0; }
.prow .pname { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.prow .psub { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; margin-top: 2px; }
.prow .pval { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.prow > .meta, .prow > .mv, .prow > .rungs, .prow > .pill { flex: none; }
.prow .rlead {
  flex: none; width: 20px; height: 20px; color: var(--ink-3);
  display: grid; place-items: center;
}
.prow .rlead svg { width: 19px; height: 19px; display: block; }
button.prow:hover .rlead { color: var(--ink-2); }
.prow .chev { flex: none; color: var(--ink-3); font-size: 16px; line-height: 1; transition: transform var(--t-mid) var(--ease), color var(--t-fast); }
button.prow:hover .chev { color: var(--ink-3); transform: translateX(2px); }

/* the older card primitive, flattened: a border, not a float */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: var(--s5);
}
.card.flat { border-color: var(--line); }
.card.pad-l { padding: var(--s6); }
.card.tight { padding: var(--s3) var(--s4); }
.card.bare { background: none; border: 0; padding: 0; }

.tint-research     { background: var(--d-research-soft); border-color: transparent; }
.tint-clinical     { background: var(--d-clinical-soft); border-color: transparent; }
.tint-professional { background: var(--d-professional-soft); border-color: transparent; }
.tint-accent       { background: var(--accent-soft); border-color: transparent; }

.grid { display: grid; gap: var(--s3); }
.grid.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.row { display: flex; align-items: center; gap: var(--s3); }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.mt { margin-top: var(--s4); }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.research { background: var(--d-research); }
.dot.clinical { background: var(--d-clinical); }
.dot.professional { background: var(--d-professional); }

/* pills, quieted to metadata weight */
.pill {
  display: inline-flex; align-items: center; gap: var(--s1); font-size: 12px; font-weight: 600;
  padding: 3px 9px; border-radius: var(--r-s); background: transparent;
  border: 1px solid var(--line); color: var(--ink-3); white-space: nowrap;
}
.pill.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.on { background: var(--bg-2); border-color: var(--line-2); color: var(--ink); }
.pill.warn { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
.pill.act {
  background: var(--card); border-color: var(--line-2); color: var(--ink-2);
  cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px;
  transition: all var(--t-fast) var(--ease);
}
.pill.act:hover { border-color: var(--ink-3); color: var(--ink); }
.pill.act.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tagrow { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* ---------------------------------------------------------- launch
   The one place on Today that gets weight. Neutral surface; the accent
   is spent on a single button and a hairline rule. */
.launch {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l);
  padding: var(--s6);
  box-shadow: var(--sh-3), var(--edge);
  position: relative; overflow: hidden;
}
/* a barely-there wash so the hero action does not sit at the same visual
   weight as the secondary surfaces below it */
.launch::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(168deg,
    color-mix(in srgb, var(--ink) 3.5%, transparent) 0%,
    transparent 42%);
}
.launch > * { position: relative; }
.launch .lbl { color: var(--ink-2); }
.launch h2 { margin: var(--s2) 0 var(--s2); }
.launch p { color: var(--ink-2); font-size: 14.5px; max-width: 62ch; margin: 0; }
.launch .lfoot {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  margin-top: var(--s5);
}
.launch .lfoot .spacer { min-width: var(--s2); }

/* the plan: what the next session actually contains, and why */
.planline {
  display: flex; align-items: center; gap: var(--s3); padding: 9px 0;
  border-top: 1px dashed var(--line);
}
.planline:first-child { border-top: 0; padding-top: var(--s3); }
.planline .n {
  width: 18px; flex: none; font-size: 11px; font-weight: 600; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.planline .pl-t { flex: 1 1 auto; font-size: 14px; font-weight: 600; min-width: 0; }
.planline .pl-w { flex: none; font-size: 12px; color: var(--ink-3); }

/* ---------------------------------------------------------- surface tiles
   No coloured icon chips. A stroke glyph in the domain hue, a name, a line
   of copy, and quiet metadata. Hover lifts by one pixel. */
.tile {
  display: flex; flex-direction: column; align-items: stretch;
  width: 100%; text-align: left; cursor: pointer; font: inherit;
  border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--s4) var(--s5) var(--s5);
  background: var(--card); color: var(--ink); position: relative;
  transition: transform var(--m-base) var(--e-out), box-shadow var(--m-base) var(--e-out),
              border-color var(--m-base) var(--e-both);
}
.tile:hover { transform: translateY(-1px); box-shadow: var(--sh-1); border-color: var(--line-2); }
.tile:active { transform: translateY(0); }
.tile .tmk { display: block; margin-bottom: var(--s3); height: 20px; color: var(--ink-3); }
.tile:hover .tmk { color: var(--ink-2); }
.tile .tmk svg { width: 20px; height: 20px; display: block; }
.tile h3 { margin-bottom: var(--s1); }
.tile p { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin: 0; }
.tile .tfoot { margin-top: auto; padding-top: var(--s3); }

/* the primary surface — wider, a row rather than a box */
.tile.feature { flex-direction: row; align-items: center; gap: var(--s5); padding: var(--s5); }
.tile.feature .tmk { margin: 0; flex: none; color: var(--ink-2); }
.tile.feature .tbody { flex: 1 1 auto; min-width: 0; display: block; }
.tile.feature .tbody .tfoot { margin-top: var(--s3); padding-top: 0; }
.tile.feature .tgo { flex: none; }

/* ---------------------------------------------------------- meters */
.meter { height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.meter > i {
  display: block; height: 100%; border-radius: 99px; width: 0; background: var(--ink-3);
  transition: width 1s var(--e-out);
}
.meter.research > i { background: var(--d-research); }
.meter.clinical > i { background: var(--d-clinical); }
.meter.professional > i { background: var(--d-professional); }
.meter.thin { height: 4px; }

/* depth ladder — five rungs, filled to the level actually demonstrated */
.rungs { display: flex; gap: 3px; align-items: center; }
.rungs i {
  display: block; width: 15px; height: 5px; border-radius: 2px; background: var(--bg-2);
}
.rungs i.on { background: var(--ink-2); }
.rungs.research i.on { background: var(--d-research); }
.rungs.clinical i.on { background: var(--d-clinical); }
.rungs.professional i.on { background: var(--d-professional); }

.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-linecap: round; }
.ring .trk { stroke: var(--bg-2); }
.ring .val  { transition: stroke-dashoffset 1.1s var(--e-out); }
.ring .ghost { transition: stroke-dashoffset 1.1s var(--e-out) .12s; }
.ring .mid { position: absolute; text-align: center; line-height: 1.05; }

.statline { display: flex; align-items: baseline; gap: var(--s2); }
.statline .v { font-size: 30px; }
.statline .u { font-size: 13px; color: var(--ink-3); font-weight: 600; }

/* movement — up, down or flat, with the direction stated in words too */
.mv { display: inline-flex; align-items: center; gap: var(--s1); font-size: 13px; font-weight: 600; }
.mv.up { color: var(--good); }
.mv.dn { color: var(--wrong); }
.mv.fl { color: var(--ink-3); }

/* ---------------------------------------------------------- session bar */
#sessbar {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  padding: var(--s4) var(--s5) var(--s3); display: flex; align-items: center; gap: var(--s3);
}
#sessbar .track { flex: 1 1 auto; height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
#sessbar .track > i {
  display: block; height: 100%; border-radius: 99px; background: var(--accent);
  width: 0; transition: width .5s var(--ease);
}
#sessbar .x {
  width: 28px; height: 28px; border: 0; background: transparent; color: var(--ink-3);
  font-size: 17px; cursor: pointer; border-radius: var(--r-s); flex: none; line-height: 1;
  transition: background var(--t-fast), color var(--t-fast);
}
#sessbar .x:hover { background: var(--bg-2); color: var(--ink); }

/* ---------------------------------------------------------- the question */
.qctx {
  font-family: var(--serif); font-size: 17px; line-height: 1.62; color: var(--ink-2);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: var(--s4) var(--s5); margin-bottom: var(--s5);
}
.qstem {
  font-size: 23px; line-height: 1.32; font-weight: 600; letter-spacing: -0.024em;
  margin-bottom: var(--s5); text-wrap: pretty;
}
.qhint { font-size: 13px; color: var(--ink-3); margin: calc(-1 * var(--s3)) 0 var(--s5); }

.choices { display: grid; gap: var(--s2); }
.choice {
  display: flex; gap: var(--s3); align-items: flex-start; text-align: left; width: 100%;
  padding: var(--s3) var(--s4); border-radius: var(--r-m); border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer; font: inherit; font-size: 15px;
  line-height: 1.45;
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease), transform .1s var(--ease);
}
.choice:hover:not(.locked) { border-color: var(--line-2); background: var(--card-2); }
.choice:active:not(.locked) { transform: scale(.995); }
.choice .key {
  width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center;
  border: 1px solid var(--field-line); font-size: 11.5px; font-weight: 600; color: var(--ink-3);
  margin-top: 2px; transition: all var(--t-fast) var(--ease); background: transparent;
}
.choice .ctx { flex: 1 1 auto; }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice.ok { border-color: var(--good); background: var(--good-soft); box-shadow: inset 0 0 0 1px var(--good); }
.choice.ok .key { background: var(--good); border-color: var(--good); color: #fff; }
.choice.bad { border-color: var(--wrong); background: var(--wrong-soft); box-shadow: inset 0 0 0 1px var(--wrong); }
.choice.bad .key { background: var(--wrong); border-color: var(--wrong); color: #fff; }
.choice.locked { cursor: default; }
.choice.faded { opacity: .45; }
.choice .why {
  display: block; font-size: 13px; color: var(--ink-2); margin-top: var(--s2); line-height: 1.5;
  animation: fadein .3s var(--ease) backwards;
}
@keyframes fadein { from { opacity: 0; transform: translateY(-2px); } }

/* contrast sorter */
.sortcols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-bottom: var(--s3); }
.sortcols .h {
  text-align: center; font-size: 12.5px; font-weight: 600; padding: var(--s2) var(--s3);
  border-radius: var(--r-s); background: var(--bg-2); color: var(--ink-2); line-height: 1.3;
}
.sortrow {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3);
  border-radius: var(--r-m); background: var(--card); border: 1px solid var(--line);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.sortrow.pickL { box-shadow: inset 3px 0 0 var(--accent); border-color: var(--line-2); }
.sortrow.pickR { box-shadow: inset -3px 0 0 var(--accent); border-color: var(--line-2); }
.sortrow.ok { border-color: var(--good); background: var(--good-soft); }
.sortrow.bad { border-color: var(--wrong); background: var(--wrong-soft); }
.sortrow .t { flex: 1 1 auto; font-size: 14px; line-height: 1.4; }
.sidebtn {
  width: 36px; height: 30px; flex: none; border-radius: 8px; border: 1px solid var(--field-line);
  background: var(--card-2); color: var(--ink-3); font: inherit; font-weight: 600; font-size: 13px;
  cursor: pointer; transition: all var(--t-fast) var(--ease);
}
.sidebtn:hover { border-color: var(--ink-3); color: var(--ink); }
.sidebtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------------------------------------------------------- action bar */
#actbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--card); box-shadow: var(--sh-up);
  transform: translateY(110%); transition: transform var(--m-slow) var(--e-out), background var(--m-base) var(--e-both);
  max-height: 62vh; display: flex; flex-direction: column;
  border-top: 1px solid var(--line);
}
#actbar.up { transform: translateY(0); }
#actbar.good { background: var(--good-soft); border-top-color: color-mix(in srgb, var(--good) 26%, transparent); }
#actbar.bad  { background: var(--wrong-soft); border-top-color: color-mix(in srgb, var(--wrong) 26%, transparent); }
#actbar .inner {
  max-width: 700px; margin: 0 auto; width: 100%; padding: var(--s3) var(--s5);
  display: flex; align-items: center; gap: var(--s4); flex: none;
}
#actbar .scroller { overflow-y: auto; max-height: calc(62vh - 80px); }
#actbar .scroller .inner { display: block; padding-top: var(--s5); padding-bottom: var(--s1); }

.verdict-h { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
.verdict-h .badge {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; color: #fff; flex: none; animation: pop .34s var(--spring) backwards;
}
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.verdict-h.good .badge { background: var(--good); }
.verdict-h.bad .badge { background: var(--wrong); }
.verdict-h .t { font-size: 17px; font-weight: 600; letter-spacing: -0.024em; }
.verdict-h.good .t { color: var(--good-deep); }
.verdict-h.bad .t { color: var(--wrong-deep); }
.verdict-h .meta { margin-left: auto; }
.teachtext { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
.teachtext strong { color: var(--ink); }

.precision {
  margin-top: var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r-s);
  background: var(--card); border: 1px solid var(--line);
  border-left: 3px solid var(--warning);
}
.precision .lbl { color: var(--warning); margin-bottom: var(--s1); }
.precision p { color: var(--ink); font-size: 14.5px; margin: 0; font-weight: 600; }

.nots { margin-top: var(--s3); }
.nots .n {
  display: flex; gap: var(--s2); font-size: 13px; color: var(--ink-2); margin-top: var(--s1); line-height: 1.45;
}
.nots .n::before { content: '✕'; color: var(--wrong); flex: none; font-weight: 600; font-size: 11px; margin-top: 3px; }

/* confidence pips */
.confwrap { display: flex; align-items: center; gap: var(--s2); flex: none; }
.confwrap .cl { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
.pips { display: flex; gap: var(--s1); }
.pip {
  width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--field-line);
  background: var(--card); color: var(--ink-3); font: inherit; font-weight: 600; font-size: 12.5px;
  cursor: pointer; transition: all var(--t-fast) var(--ease); padding: 0;
}
.pip:hover { border-color: var(--ink-3); color: var(--ink); }
.pip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------------------------------------------------------- exam paper */
.paper {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: var(--s5) var(--s6); margin-bottom: var(--s5);
}
.paper h4 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin-bottom: var(--s3); letter-spacing: -0.01em; }
.paper p { font-family: var(--serif); font-size: 16.5px; line-height: 1.66; color: var(--ink-2); }
.paper .note { font-size: 13px; color: var(--ink-3); font-style: italic; font-family: var(--sans); }
.tblwrap { overflow-x: auto; margin: var(--s5) 0; border-radius: var(--r-s); border: 1px solid var(--line); }
table.dt { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.dt caption { text-align: left; padding: var(--s3) var(--s4) var(--s2); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
table.dt th, table.dt td { padding: var(--s2) var(--s4); text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
table.dt th:first-child, table.dt td:first-child { text-align: left; }
table.dt th { color: var(--ink-3); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

/* rubric */
.rub { display: grid; gap: var(--s1); margin-top: var(--s3); }
.rubpt {
  display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4);
  border-radius: var(--r-s); background: var(--card); border: 1px solid var(--line);
  transition: all var(--t-mid) var(--ease);
}
.rubpt.hit { border-color: var(--good); background: var(--good-soft); }
.rubpt .tick {
  width: 24px; height: 24px; flex: none; border-radius: 7px; border: 1px solid var(--field-line);
  display: grid; place-items: center; cursor: pointer; font-size: 12px; color: transparent;
  margin-top: 1px; transition: all var(--t-fast) var(--ease); background: transparent; padding: 0;
}
.rubpt .tick:hover { border-color: var(--good); }
.rubpt.hit .tick { background: var(--good); border-color: var(--good); color: #fff; }
.rubpt .tx { flex: 1 1 auto; font-size: 14.5px; line-height: 1.5; }
.rubpt .wt { flex: none; font-size: 12px; color: var(--ink-3); font-weight: 600; margin-top: 3px; }
.rubpt.adv .tx::after {
  content: 'ADVANCED'; font-size: 9px; letter-spacing: .1em; color: var(--accent);
  margin-left: var(--s2); vertical-align: 1px; font-weight: 600;
}

.flag {
  margin-top: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-s);
  background: var(--wrong-soft); border-left: 3px solid var(--wrong);
  font-size: 14px; line-height: 1.55; color: var(--ink);
}
.flag .lbl { color: var(--wrong); margin-bottom: var(--s1); }

.callout {
  padding: var(--s4) var(--s5); border-radius: var(--r-m); background: var(--card);
  border: 1px solid var(--line); border-left: 3px solid var(--accent);
}
.callout .lbl { color: var(--accent); margin-bottom: var(--s2); }
.callout p { font-size: 14.5px; line-height: 1.6; margin: 0; }

/* the interview question, as somebody asking it */
.askq { position: relative; padding: var(--s1) 0 0 var(--s7); margin-bottom: var(--s6); }
.askq .q {
  position: absolute; left: 0; top: -12px; font-family: var(--serif);
  font-size: 60px; line-height: 1; color: var(--line-2);
}
.askq p {
  font-family: var(--serif); font-size: 26px; line-height: 1.36; font-weight: 500;
  color: var(--ink); margin: 0; text-wrap: pretty;
}
.clockwrap { text-align: center; padding: var(--s2) 0 var(--s1); }
.clockwrap .timer { font-size: 56px; line-height: 1; }

/* one question, centred in the space it has — the Panel shows nothing else */
.wrap.centred {
  min-height: calc(100dvh - var(--act-h) - 108px);
  display: flex; flex-direction: column; justify-content: center;
}
.wrap.centred > .tagrow { position: absolute; top: var(--s8); }

/* ---------------------------------------------------------- timers */
.timer {
  font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.04em; font-size: 22px;
}
.timer.warn { color: var(--warning); }
.timer.out { color: var(--wrong); }
.timerbar { height: 4px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.timerbar > i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 1s linear, background .4s; border-radius: 99px; }
.timerbar.warn > i { background: var(--warning); }
.timerbar.out > i { background: var(--wrong); }

#exambar { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: var(--s4) var(--s5) var(--s3); }

/* ---------------------------------------------------------- transcript */
.turn { display: flex; gap: var(--s3); margin-bottom: var(--s5); }
.turn .av {
  width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 600; background: var(--bg-2); color: var(--ink-2);
}
.turn.you .av { background: var(--accent); color: var(--accent-ink); }
.turn .sp { flex: 1 1 auto; }
.turn .sp .who { font-size: 11px; color: var(--ink-3); margin-bottom: var(--s1); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.turn .sp .tx {
  font-family: var(--serif); font-size: 16.5px; line-height: 1.58;
  background: var(--card); border: 1px solid var(--line); padding: var(--s3) var(--s4);
  border-radius: var(--r-m); border-top-left-radius: var(--s1);
}
.turn.you .sp .tx {
  font-family: var(--sans); font-size: 15px; background: var(--accent-soft); border-color: transparent;
  border-top-left-radius: var(--r-m); border-top-right-radius: var(--s1);
}
.fbnote {
  margin-top: var(--s2); font-size: 13px; line-height: 1.5; padding: var(--s2) var(--s3);
  border-radius: var(--r-s); background: var(--card); border: 1px solid var(--line);
  color: var(--ink-2); border-left: 3px solid var(--line-2);
}
.fbnote.pos { border-left-color: var(--good); }
.fbnote.neg { border-left-color: var(--wrong); }
.fbnote b { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------- atlas */
#atlas { display: block; width: 100%; border-radius: var(--r-m); background: var(--card); border: 1px solid var(--line); cursor: grab; }
#atlas:active { cursor: grabbing; }
.atlasbusy {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m);
  color: var(--ink-3); font-size: 13px; font-weight: 600; z-index: 5;
  min-height: 440px;
}
#atlastip {
  position: absolute; pointer-events: none; opacity: 0; z-index: 30;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-s);
  padding: var(--s3) var(--s4); max-width: 330px;
  box-shadow: var(--sh-3); transition: opacity var(--t-fast) var(--ease); font-size: 13px;
}
#atlastip b { display: block; font-size: 14px; margin-bottom: var(--s1); }
#atlastip .pz { color: var(--ink-2); line-height: 1.45; }

/* ---------------------------------------------------------- misc */
.divider { display: flex; align-items: baseline; gap: var(--s3); margin: var(--s7) 0 var(--s4); padding-bottom: var(--s3); border-bottom: 1px solid var(--line); }
.divider .lbl { flex: none; }

details.disc { border-radius: var(--r-s); background: var(--card); border: 1px solid var(--line); margin-top: var(--s2); overflow: hidden; }
details.disc > summary {
  cursor: pointer; padding: var(--s3) var(--s4); font-size: 14px; font-weight: 600; list-style: none;
  display: flex; align-items: center; gap: var(--s2); color: var(--ink-2);
}
details.disc > summary::-webkit-details-marker { display: none; }
details.disc > summary::before { content: '›'; transition: transform var(--t-mid) var(--ease); font-size: 16px; color: var(--ink-3); }
details.disc[open] > summary::before { transform: rotate(90deg); }
details.disc[open] > summary { color: var(--ink); border-bottom: 1px solid var(--line); }
details.disc .dc { padding: var(--s4); }

.empty { text-align: center; padding: var(--s8) var(--s5); color: var(--ink-3); }
.empty .em { color: var(--ink-3); margin-bottom: var(--s3); }
.empty .em svg { width: 32px; height: 32px; display: inline-block; }
.empty h3 { color: var(--ink); margin-bottom: var(--s1); font-size: 18px; }
.empty p { max-width: 40ch; margin: 0 auto; }

textarea, input[type=text], input[type=number], input[type=date], select {
  font: inherit; width: 100%; background: var(--card); color: var(--ink);
  border: 1px solid var(--field-line); border-radius: var(--r-s); padding: 11px var(--s3);
  resize: vertical; outline: none;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
textarea { font-size: 15.5px; line-height: 1.62; min-height: 160px; font-family: var(--sans); }
textarea:focus, input:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent);
}

/* modal */
#scrim {
  position: fixed; inset: 0; z-index: 90; background: rgba(14,18,26,.4);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity var(--t-mid) var(--ease);
}
#scrim.on { opacity: 1; pointer-events: auto; }
#modal {
  position: fixed; z-index: 91; left: 50%; top: 50%; transform: translate(-50%,-49%);
  width: min(620px, calc(100vw - var(--s5))); max-height: 80vh; overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: var(--sh-3);
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-mid) var(--ease), transform var(--t-mid) var(--ease);
}
#modal.on { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); }
#modal .mh { padding: var(--s5) var(--s5) 0; }
#modal .mb { padding: var(--s4) var(--s5) var(--s5); }

/* command palette */
.cmdinput { border: 0; background: transparent; padding: var(--s4) var(--s5); font-size: 16px; border-radius: 0; border-bottom: 1px solid var(--line); }
.cmdinput:focus { box-shadow: none; border-color: var(--line); }
.cmdlist { max-height: 420px; overflow-y: auto; padding: var(--s2); }
.cmdgroup {
  font-size: 10.5px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase;
  color: var(--ink-3); padding: var(--s3) var(--s3) var(--s1);
}
.cmditem {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3);
  border-radius: var(--r-s); cursor: pointer; font-size: 14px;
}
.cmditem .ci { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
.cmditem .ci svg { width: 16px; height: 16px; display: block; }
.cmditem .ct { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmditem.on { background: var(--bg-2); }
.cmditem.on .ci { color: var(--accent); }
.cmditem .h { color: var(--ink-3); font-size: 12px; margin-left: auto; flex: none; }
.cmdfoot {
  display: flex; gap: var(--s4); padding: var(--s2) var(--s5); border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink-3);
}
kbd {
  font: inherit; font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--field-line); background: var(--bg-2); color: var(--ink-2);
}

/* A failed write is not a toast: it stays until it is fixed or acknowledged. */
#savewarn {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 96;
  background: var(--wrong-soft); border-top: 2px solid var(--wrong);
  color: var(--ink); font-size: 13.5px; line-height: 1.5;
  padding: var(--s3) var(--s5); display: flex; align-items: center; gap: var(--s4);
  flex-wrap: wrap; box-shadow: var(--sh-up);
}
#savewarn b { color: var(--wrong-deep); }
#savewarn .btn { flex: none; margin-left: auto; }

#toasts { position: fixed; bottom: var(--s5); left: 50%; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: var(--s2); align-items: center; pointer-events: none; }
.toast {
  background: var(--ink); color: var(--bg); border-radius: var(--r-s);
  padding: var(--s2) var(--s4); font-size: 13.5px; font-weight: 600; box-shadow: var(--sh-3);
  animation: tin .3s var(--ease); max-width: 90vw;
}
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }

/* entrance stagger — short, ease-out, no bounce */
.stg > * { animation: rise var(--m-page) var(--e-out) backwards; }
.stg > *:nth-child(1){animation-delay:.01s} .stg > *:nth-child(2){animation-delay:.05s}
.stg > *:nth-child(3){animation-delay:.09s} .stg > *:nth-child(4){animation-delay:.13s}
.stg > *:nth-child(5){animation-delay:.17s} .stg > *:nth-child(6){animation-delay:.21s}
.stg > *:nth-child(7){animation-delay:.25s} .stg > *:nth-child(8){animation-delay:.29s}
.stg > *:nth-child(9){animation-delay:.33s} .stg > *:nth-child(10){animation-delay:.37s}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  #actbar { transition: none; }
}

/* ---------------------------------------------------------- pointer targets
   WCAG 2.2 SC 2.5.8 sets 24x24 as the floor; a finger wants 44. Rather than
   inflating the visual design for everyone, small controls grow an invisible
   hit area on coarse pointers only. The ink stays exactly where it was. */
.pip, .tick, .iconbtn, .sidebtn, .seg button, .pill.act, .metric, #sessbar .x {
  position: relative;
}
@media (pointer: coarse) {
  .pip::after, .tick::after, .iconbtn::after, .sidebtn::after,
  .seg button::after, .pill.act::after, .metric::after, #sessbar .x::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; min-width: 100%; min-height: 100%;
    transform: translate(-50%, -50%);
  }
  /* rows and choices are already tall enough; these are the small ones */
  .rubpt { padding-top: var(--s3); padding-bottom: var(--s3); }
}

/* ---------------------------------------------------------- responsive */
@media (max-width: 900px) {
  .grid.g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 680px) {
  :root { --bar-h: 52px; --act-h: 74px; }
  body { font-size: 14.5px; }
  h1 { font-size: 25px; }
  .display { font-size: 32px; }
  .wrap { padding: var(--s5) var(--s4) var(--s7); }
  .grid.g2, .grid.g3 { grid-template-columns: 1fr; }
  #top { padding: 0 var(--s3); gap: var(--s2); }
  .brand .wm { display: none; }
  .tab { padding: var(--s2) var(--s2); font-size: 13.5px; }
  .qstem { font-size: 20px; }
  .section { margin-top: var(--s6); }
  .divider { margin-top: var(--s6); }
  .launch { padding: var(--s4) var(--s4) var(--s4) calc(var(--s4) - 3px); }
  .tile.feature { flex-direction: column; align-items: flex-start; gap: var(--s3); }
  .tile.feature .tgo { width: 100%; }
  .tile.feature .tgo .btn { width: 100%; }
  .launch .lfoot { flex-direction: column; align-items: stretch; }
  .launch .lfoot .seg { align-self: flex-start; }
  .launch .lfoot .btn.pri { width: 100%; }
  #actbar .inner { padding: var(--s3) var(--s4); gap: var(--s3); }
  /* On a phone the verdict panel at 76vh crowded out the item it was
     explaining. The action ROW stays a bar; the RESULT becomes a sheet that
     owns the screen, with the continue button pinned where the thumb is. */
  #actbar { max-height: 62vh; }
  #actbar.good, #actbar.bad {
    top: 0; max-height: none; height: 100dvh;
    border-top: 0; border-radius: 0;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #actbar.good .scroller, #actbar.bad .scroller {
    max-height: none; flex: 1 1 auto;
  }
  #actbar.good > .inner:last-child, #actbar.bad > .inner:last-child {
    border-top: 1px solid var(--line);
    padding-bottom: calc(var(--s3) + env(safe-area-inset-bottom, 0px));
  }
  #actbar.good .btn, #actbar.bad .btn { width: 100%; }
  #actbar.good > .inner:last-child .spacer,
  #actbar.bad > .inner:last-child .spacer { display: none; }
  .confwrap .cl { display: none; }
  .pip { width: 26px; height: 26px; }
  .btn.lg { font-size: 15px; padding: 12px 20px; }
  .sortcols { gap: var(--s1); }
  .sortcols .h { font-size: 12px; padding: var(--s2); }
  .paper { padding: var(--s4); }
  #sessbar { padding: var(--s3) var(--s4) var(--s2); }
  .card { padding: var(--s4); }
  .askq { padding-left: var(--s5); }
  .askq p { font-size: 21px; }
  .askq .q { font-size: 44px; top: -8px; }
}
@media (max-width: 470px) {
  #top { gap: var(--s1); padding: 0 var(--s2); }
  .tab { padding: var(--s2) 7px; font-size: 13px; }
  .prow { padding: var(--s3); }
}
@media (max-width: 380px) {
  #cmdbtn { display: none; }
}

</style>

<script id="trainer-data" type="application/json">{"concepts":{"version":1,"nodes":[{"id":"null_hypothesis","label":"Null hypothesis","domain":"research","cluster":"inference","tier":1,"precision":"The formal proposition of no effect or no difference in the population, held as true for the purpose of calculating how surprising the observed data would be.","notThis":["the hypothesis you expect to be false","the opposite of what you predict","a statement that the effect cannot be observed"],"parents":[],"related":["p_value","type1","type2"]},{"id":"p_value","label":"p-value","domain":"research","cluster":"inference","tier":1,"precision":"The probability of obtaining data at least as extreme as those observed, IF the null hypothesis were true.","notThis":["the probability that the null hypothesis is true","the probability the result occurred by chance","the probability the finding will replicate","the size or the importance of the effect"],"parents":["null_hypothesis"],"related":["alpha","type1","confidence_interval","effect_size","clinical_significance"]},{"id":"alpha","label":"Alpha / significance level","domain":"research","cluster":"inference","tier":1,"precision":"The pre-set threshold for the long-run false-positive rate the researcher is willing to accept, conventionally .05.","notThis":["the probability the study is wrong","a measure of how large the effect is"],"parents":["p_value"],"related":["type1","multiple_comparisons"]},{"id":"type1","label":"Type I error","domain":"research","cluster":"inference","tier":1,"precision":"Rejecting a null hypothesis that is in fact true — concluding there is an effect when there is none. Its long-run rate is set by alpha.","notThis":["missing a real effect","a mistake in the data entry","the same thing as a small p-value"],"parents":["alpha"],"related":["type2","multiple_comparisons","power"]},{"id":"type2","label":"Type II error","domain":"research","cluster":"inference","tier":1,"precision":"Failing to reject a null hypothesis that is in fact false — missing a real effect. Its rate is beta; power = 1 − beta.","notThis":["finding an effect that is not there","a biased sample"],"parents":["null_hypothesis"],"related":["power","type1","sample_size"]},{"id":"power","label":"Statistical power","domain":"research","cluster":"inference","tier":1,"precision":"The probability that a study will detect an effect of a specified size, given the sample size and alpha, if that effect genuinely exists. Conventionally targeted at .80 or above.","notThis":["the strength of the effect","how convincing the study is","the number of participants"],"parents":["type2"],"related":["sample_size","effect_size","underpowered"]},{"id":"underpowered","label":"Under-powered study","domain":"research","cluster":"inference","tier":2,"precision":"A study with too few participants to reliably detect the effect of interest: it inflates Type II error, and among the significant results it does produce, effect sizes are systematically over-estimated (the winner's curse).","notThis":["a study with a small effect","a study that failed"],"parents":["power"],"related":["type2","effect_size","pilot_feasibility"]},{"id":"confidence_interval","label":"Confidence interval","domain":"research","cluster":"inference","tier":1,"precision":"A range constructed so that, over repeated sampling, 95% of such intervals would contain the true population parameter. Its width indexes precision; whether it crosses the null value maps onto significance.","notThis":["a 95% chance the true value is in this interval","the range in which 95% of participants scored"],"parents":["p_value"],"related":["effect_size","precision_estimate","sample_size"]},{"id":"effect_size","label":"Effect size","domain":"research","cluster":"inference","tier":1,"precision":"A standardised index of the magnitude of a difference or association that is independent of sample size — e.g. Cohen's d, r, odds ratio.","notThis":["whether the result was significant","how important the finding is clinically"],"parents":[],"related":["clinical_significance","meta_analysis","confidence_interval","p_value"]},{"id":"clinical_significance","label":"Clinical vs statistical significance","domain":"research","cluster":"inference","tier":1,"precision":"Statistical significance says an effect is unlikely under the null; clinical significance asks whether the change is large enough to matter in the person's life. They are independent: a trivial change can be significant in a large sample, and an important change non-significant in a small one.","notThis":["clinical significance is just a large p-value","they are different words for the same idea"],"parents":["effect_size"],"related":["reliable_change","mcid","p_value"]},{"id":"reliable_change","label":"Reliable change index","domain":"research","cluster":"inference","tier":2,"precision":"A statistic testing whether an individual's pre-post change exceeds what would be expected from measurement error alone, computed from the measure's standard error of difference.","notThis":["any improvement on the score","a group-level effect size"],"parents":["clinical_significance"],"related":["mcid","measurement_error"]},{"id":"mcid","label":"Minimal clinically important difference","domain":"research","cluster":"inference","tier":3,"precision":"The smallest change in an outcome that patients or clinicians would identify as meaningful, established empirically rather than assumed.","notThis":["the smallest statistically detectable change"],"parents":["clinical_significance"],"related":["reliable_change"]},{"id":"multiple_comparisons","label":"Multiple comparisons","domain":"research","cluster":"inference","tier":2,"precision":"Running many tests inflates the family-wise probability of at least one false positive; corrections (Bonferroni, Holm, FDR) or pre-specification of a primary outcome control this.","notThis":["a problem only when the sample is small"],"parents":["alpha","type1"],"related":["p_hacking","preregistration"]},{"id":"p_hacking","label":"p-hacking & researcher degrees of freedom","domain":"research","cluster":"inference","tier":3,"precision":"Analytic flexibility exploited, knowingly or not, until a result crosses threshold — optional stopping, outcome switching, subgroup fishing.","notThis":["deliberate fraud only"],"parents":["multiple_comparisons"],"related":["preregistration","publication_bias"]},{"id":"preregistration","label":"Pre-registration","domain":"research","cluster":"inference","tier":3,"precision":"Public, time-stamped specification of hypotheses, outcomes and analysis before data collection, which converts exploratory analyses into declared ones.","notThis":["ethics approval"],"parents":[],"related":["p_hacking","publication_bias"]},{"id":"variable_types","label":"Levels of measurement","domain":"research","cluster":"tests","tier":1,"precision":"Nominal (unordered categories), ordinal (ranked without equal intervals), interval (equal intervals, arbitrary zero), ratio (equal intervals, true zero). The level constrains which analyses are legitimate.","notThis":["all numbers are continuous data","Likert items are always interval"],"parents":[],"related":["test_selection","nonparametric"]},{"id":"iv_dv","label":"Independent vs dependent variable","domain":"research","cluster":"tests","tier":1,"precision":"The independent variable is manipulated or classified by the researcher; the dependent (outcome) variable is measured and predicted. In non-experimental work the parallel terms are predictor and outcome.","notThis":["the IV is the one you measure","predictor and outcome imply causation"],"parents":[],"related":["variable_types","experiment_vs_observation"]},{"id":"test_selection","label":"Test selection logic","domain":"research","cluster":"tests","tier":1,"precision":"The chain that determines analysis: research question → outcome variable type → number of groups or time points → independent or related samples → assumptions met → test → what it can and cannot establish.","notThis":["memorising which test goes with which name","choosing the test after seeing the data"],"parents":["variable_types","iv_dv"],"related":["ttest_independent","ttest_paired","anova","chi_square","correlation","regression","nonparametric","assumptions"]},{"id":"ttest_independent","label":"Independent-samples t-test","domain":"research","cluster":"tests","tier":1,"precision":"Compares the means of one continuous outcome between two unrelated groups.","notThis":["compares two measurements from the same people","compares more than two groups"],"parents":["test_selection"],"related":["ttest_paired","mann_whitney","assumptions"]},{"id":"ttest_paired","label":"Paired-samples t-test","domain":"research","cluster":"tests","tier":1,"precision":"Compares two related measurements — the same participants at two time points, or matched pairs — by testing whether the mean of the difference scores departs from zero.","notThis":["compares two separate groups","is used whenever there are two conditions"],"parents":["test_selection"],"related":["ttest_independent","wilcoxon","rm_anova"]},{"id":"anova","label":"ANOVA","domain":"research","cluster":"tests","tier":1,"precision":"Compares means across three or more levels of a factor, or across factors simultaneously, by partitioning variance. A significant omnibus F indicates a difference somewhere, not where.","notThis":["tells you which groups differ","can only handle one factor"],"parents":["test_selection"],"related":["rm_anova","interaction","post_hoc","kruskal_wallis"]},{"id":"rm_anova","label":"Repeated-measures / mixed ANOVA","domain":"research","cluster":"tests","tier":2,"precision":"Handles designs where the same participants are measured repeatedly; a mixed design combines a within-subjects factor (time) with a between-subjects factor (group).","notThis":["the same as a one-way ANOVA","requires independent observations"],"parents":["anova"],"related":["interaction","sphericity","ttest_paired"]},{"id":"interaction","label":"Interaction effect","domain":"research","cluster":"tests","tier":1,"precision":"Occurs when the effect of one factor depends on the level of another. In a pre-post by group trial, the group-by-time interaction — not either main effect — is the test of differential change.","notThis":["a main effect of group","the average difference between groups"],"parents":["rm_anova"],"related":["moderation","anova"]},{"id":"post_hoc","label":"Post-hoc tests","domain":"research","cluster":"tests","tier":2,"precision":"Follow-up comparisons after a significant omnibus test, with correction for the number of comparisons made.","notThis":["planned contrasts specified in advance"],"parents":["anova"],"related":["multiple_comparisons"]},{"id":"chi_square","label":"Chi-square","domain":"research","cluster":"tests","tier":1,"precision":"Tests association between categorical variables by comparing observed against expected cell frequencies; requires adequate expected counts.","notThis":["compares means","works on continuous outcomes"],"parents":["test_selection"],"related":["variable_types","fisher_exact"]},{"id":"fisher_exact","label":"Fisher's exact test","domain":"research","cluster":"tests","tier":3,"precision":"The exact alternative to chi-square when expected cell counts are small.","notThis":[],"parents":["chi_square"],"related":[]},{"id":"correlation","label":"Correlation","domain":"research","cluster":"tests","tier":1,"precision":"Quantifies the strength and direction of a linear (Pearson) or monotonic (Spearman) association between two variables, on a scale from −1 to +1.","notThis":["shows that one variable causes the other","a correlation of 0 means no relationship of any kind"],"parents":["test_selection"],"related":["causation","regression","confounding"]},{"id":"regression","label":"Regression","domain":"research","cluster":"tests","tier":1,"precision":"Models an outcome from one or more predictors, giving the change in outcome per unit change in a predictor while holding the others constant. Logistic regression models a binary outcome as log-odds.","notThis":["establishes causation because it uses the word predictor","requires an experimental design"],"parents":["correlation"],"related":["mediation","moderation","confounding","multicollinearity"]},{"id":"multicollinearity","label":"Multicollinearity","domain":"research","cluster":"tests","tier":3,"precision":"High intercorrelation among predictors, which destabilises individual coefficients without necessarily harming overall prediction.","notThis":[],"parents":["regression"],"related":[]},{"id":"nonparametric","label":"Non-parametric alternatives","domain":"research","cluster":"tests","tier":2,"precision":"Rank-based tests used when distributional assumptions fail or data are ordinal: Mann-Whitney for two independent groups, Wilcoxon signed-rank for paired data, Kruskal-Wallis for three or more independent groups, Friedman for repeated measures.","notThis":["tests that make no assumptions at all","always the safer choice"],"parents":["assumptions"],"related":["mann_whitney","wilcoxon","kruskal_wallis"]},{"id":"mann_whitney","label":"Mann-Whitney U","domain":"research","cluster":"tests","tier":2,"precision":"Rank-based comparison of two independent groups.","notThis":[],"parents":["nonparametric"],"related":["ttest_independent"]},{"id":"wilcoxon","label":"Wilcoxon signed-rank","domain":"research","cluster":"tests","tier":2,"precision":"Rank-based comparison of two related measurements.","notThis":[],"parents":["nonparametric"],"related":["ttest_paired"]},{"id":"kruskal_wallis","label":"Kruskal-Wallis","domain":"research","cluster":"tests","tier":3,"precision":"Rank-based comparison of three or more independent groups.","notThis":[],"parents":["nonparametric"],"related":["anova"]},{"id":"assumptions","label":"Assumptions of parametric tests","domain":"research","cluster":"tests","tier":1,"precision":"Independence of observations, an approximately normal sampling distribution of the outcome, homogeneity of variance across groups, and — for repeated measures — sphericity. Independence is the assumption whose violation is least repairable.","notThis":["the raw data must be perfectly normal","assumptions matter only in small samples"],"parents":[],"related":["nonparametric","sphericity","test_selection"]},{"id":"sphericity","label":"Sphericity","domain":"research","cluster":"tests","tier":3,"precision":"The requirement in repeated-measures designs that variances of the differences between all pairs of levels are equal; corrected with Greenhouse-Geisser when violated.","notThis":[],"parents":["assumptions"],"related":["rm_anova"]},{"id":"experiment_vs_observation","label":"Experimental vs observational","domain":"research","cluster":"design","tier":1,"precision":"In an experimental design the researcher manipulates the independent variable and controls allocation; in an observational design exposure is not assigned, so causal claims depend on assumptions that cannot be verified.","notThis":["observational means qualitative","experiments are always laboratory-based"],"parents":["iv_dv"],"related":["rct","cohort","case_control","cross_sectional","causation"]},{"id":"rct","label":"Randomised controlled trial","domain":"research","cluster":"design","tier":1,"precision":"Random allocation to conditions distributes both known and unknown confounders across arms in expectation, which is what licenses causal inference about the intervention.","notThis":["the best design for every question","randomisation guarantees the groups are identical"],"parents":["experiment_vs_observation"],"related":["allocation_concealment","blinding","itt","control_group","cluster_rct"]},{"id":"cluster_rct","label":"Cluster RCT","domain":"research","cluster":"design","tier":3,"precision":"Randomises intact groups — wards, schools, practices — rather than individuals, which controls contamination but requires analysis that accounts for clustering.","notThis":["can be analysed as if individuals were randomised"],"parents":["rct"],"related":["contamination"]},{"id":"control_group","label":"Control and comparison conditions","domain":"research","cluster":"design","tier":1,"precision":"Treatment as usual controls for time and natural change but not for attention or expectancy; an active or attention-matched comparator additionally controls for non-specific factors; a waitlist controls for the least and inflates apparent effects.","notThis":["control groups always receive no intervention","TAU and placebo are equivalent"],"parents":["rct"],"related":["common_factors","blinding"]},{"id":"allocation_concealment","label":"Allocation concealment","domain":"research","cluster":"design","tier":2,"precision":"Preventing those enrolling participants from knowing the upcoming allocation, which protects randomisation itself — distinct from blinding, which operates after allocation.","notThis":["the same thing as blinding"],"parents":["rct"],"related":["blinding","selection_bias"]},{"id":"blinding","label":"Blinding / masking","domain":"research","cluster":"design","tier":1,"precision":"Keeping participants, deliverers or assessors unaware of allocation. In psychological trials participants and therapists usually cannot be blinded, so blind outcome assessment is the achievable safeguard against detection bias.","notThis":["impossible in psychological research so it does not matter","double-blind is achievable in psychotherapy trials"],"parents":["rct"],"related":["detection_bias","control_group"]},{"id":"itt","label":"Intention-to-treat analysis","domain":"research","cluster":"design","tier":2,"precision":"Analysing participants in the group to which they were randomised regardless of what they received, preserving the randomisation and giving an unbiased estimate of the effect of offering treatment.","notThis":["analysing only those who completed treatment","the same as per-protocol analysis"],"parents":["rct"],"related":["attrition","missing_data","per_protocol"]},{"id":"per_protocol","label":"Per-protocol analysis","domain":"research","cluster":"design","tier":3,"precision":"Restricting analysis to those who adhered, which breaks randomisation and typically flatters the intervention.","notThis":["the more accurate estimate of true efficacy"],"parents":["itt"],"related":["attrition"]},{"id":"cohort","label":"Cohort study","domain":"research","cluster":"design","tier":2,"precision":"Follows a group defined by exposure status forward in time to observe incidence of outcomes.","notThis":["the same as a case-control study","can establish causation on its own"],"parents":["experiment_vs_observation"],"related":["case_control","longitudinal","incidence"]},{"id":"case_control","label":"Case-control study","domain":"research","cluster":"design","tier":2,"precision":"Starts from outcome status and looks backwards at exposure; efficient for rare outcomes but vulnerable to recall and selection bias, and cannot yield incidence.","notThis":["follows people forwards","gives relative risk directly"],"parents":["experiment_vs_observation"],"related":["cohort","recall_bias"]},{"id":"cross_sectional","label":"Cross-sectional design","domain":"research","cluster":"design","tier":1,"precision":"Collects data at a single time point, giving prevalence and association but no information about temporal order.","notThis":["the same as a within-subjects design","can establish which variable came first"],"parents":["experiment_vs_observation"],"related":["longitudinal","prevalence","causation"]},{"id":"longitudinal","label":"Longitudinal design","domain":"research","cluster":"design","tier":1,"precision":"Measures the same participants on more than one occasion, establishing temporal precedence but exposed to attrition and testing effects.","notThis":["any study with more than one group"],"parents":["experiment_vs_observation"],"related":["cross_sectional","attrition","cohort"]},{"id":"single_case","label":"Single-case experimental design","domain":"research","cluster":"design","tier":2,"precision":"Uses the individual as their own control with repeated measurement across phases — ABA, ABAB, multiple baseline across settings or behaviours — to demonstrate experimental control without a group.","notThis":["a case study","cannot support causal claims"],"parents":["experiment_vs_observation"],"related":["case_study","baseline"]},{"id":"case_study","label":"Case study","domain":"research","cluster":"design","tier":3,"precision":"A detailed uncontrolled description of one case; hypothesis-generating rather than hypothesis-testing.","notThis":["the same as a single-case experimental design"],"parents":[],"related":["single_case"]},{"id":"pilot_feasibility","label":"Pilot and feasibility studies","domain":"research","cluster":"design","tier":1,"precision":"Test whether a definitive trial can be run — recruitment, retention, acceptability, procedures — rather than whether the intervention works. They are not powered for efficacy, so a significance test on outcome is not their purpose.","notThis":["a small study of effectiveness","a study that failed to recruit enough people"],"parents":[],"related":["power","underpowered","acceptability"]},{"id":"qualitative_designs","label":"Qualitative methodologies","domain":"research","cluster":"design","tier":1,"precision":"Thematic analysis (patterns across accounts), IPA (idiographic lived experience of a homogeneous sample), grounded theory (theory generation from data with theoretical sampling), framework analysis (applied policy questions), discourse analysis (how language constructs the object).","notThis":["qualitative research is unstructured","thematic analysis and IPA are interchangeable"],"parents":[],"related":["saturation","reflexivity","trustworthiness","epistemology"]},{"id":"mixed_methods","label":"Mixed methods","domain":"research","cluster":"design","tier":3,"precision":"Combines quantitative and qualitative strands with an explicit rationale for sequence and integration, rather than simply doing both.","notThis":["adding a few open questions to a survey"],"parents":[],"related":["qualitative_designs","triangulation"]},{"id":"service_evaluation","label":"Audit vs service evaluation vs research","domain":"research","cluster":"design","tier":1,"precision":"Audit compares current practice against an existing standard; service evaluation describes what a service is achieving without generating transferable knowledge; research aims to derive generalisable new knowledge and requires ethics committee review. The distinction governs governance route, not rigour.","notThis":["service evaluation is just weaker research","all three need NHS REC approval"],"parents":[],"related":["practice_based_evidence","ethics_approval"]},{"id":"systematic_review","label":"Systematic review","domain":"research","cluster":"design","tier":1,"precision":"A review with a pre-specified question and protocol, an exhaustive reproducible search, explicit inclusion criteria, duplicate screening, formal quality appraisal and structured synthesis — distinguished from a narrative review by reproducibility.","notThis":["a thorough literature review","always includes a meta-analysis"],"parents":[],"related":["prisma","meta_analysis","quality_appraisal","publication_bias"]},{"id":"prisma","label":"PRISMA","domain":"research","cluster":"design","tier":2,"precision":"The reporting standard for systematic reviews, including the flow diagram accounting for every record from identification to inclusion.","notThis":["a quality appraisal tool"],"parents":["systematic_review"],"related":["quality_appraisal"]},{"id":"quality_appraisal","label":"Quality appraisal tools","domain":"research","cluster":"design","tier":2,"precision":"Structured instruments for rating study quality — CASP checklists, Cochrane RoB 2 for trials, GRADE for certainty of a body of evidence.","notThis":["a score that determines whether to include a study"],"parents":["systematic_review"],"related":["prisma","risk_of_bias"]},{"id":"meta_analysis","label":"Meta-analysis","domain":"research","cluster":"design","tier":2,"precision":"Statistical pooling of effect sizes across studies, weighted by precision, with heterogeneity quantified (I²) and explored rather than ignored.","notThis":["averaging the p-values","valid regardless of how different the studies are"],"parents":["systematic_review"],"related":["effect_size","heterogeneity","publication_bias"]},{"id":"heterogeneity","label":"Heterogeneity","domain":"research","cluster":"design","tier":3,"precision":"Variation in true effects across studies beyond chance, quantified by I² and addressed by random-effects models, subgroup analysis or meta-regression.","notThis":[],"parents":["meta_analysis"],"related":[]},{"id":"publication_bias","label":"Publication bias","domain":"research","cluster":"design","tier":2,"precision":"The systematic over-representation of positive findings in the literature, inflating pooled estimates; assessed with funnel plots and related tests.","notThis":["bias introduced by the journal's editor only"],"parents":[],"related":["meta_analysis","preregistration","p_hacking"]},{"id":"reliability","label":"Reliability","domain":"research","cluster":"measurement","tier":1,"precision":"The consistency of a measure — internal consistency across items (Cronbach's alpha), stability over time (test-retest), agreement between raters (Cohen's kappa). Reliability is necessary but not sufficient for validity.","notThis":["whether the measure captures the right construct","the same thing as validity"],"parents":[],"related":["validity","cronbach","kappa","measurement_error"]},{"id":"cronbach","label":"Cronbach's alpha","domain":"research","cluster":"measurement","tier":1,"precision":"An index of internal consistency, conventionally acceptable from about .70; it rises with the number of items and a very high value can indicate redundancy rather than quality.","notThis":
