 open to your service and has not consented to you discussing him.","ask":"How would you handle this? What are the issues?","models":[{"model":"Capacity and ethics","mech":"Capacity is decision-specific and presumed; an unwise decision is not evidence of its absence.","form":"He is refusing a diagnostic appointment. Unless there is reason to think he cannot understand, retain, weigh or communicate this specific decision, that refusal is his to make and must be respected, however distressing for his wife and however much earlier diagnosis might help. Even if capacity were in question for this decision, the route is assessment and best-interests process — not persuasion arranged by a third party. Confidentiality also constrains you: you cannot discuss him without consent. But it does not stop you listening to her, giving general information, or supporting her in her own right, because none of those require disclosure.","adds":"Prevents the most common error — being recruited into managing him on her behalf.","misses":"Risks sounding legalistic to a frightened person if it is the first thing you say.","intervention":"Support her, explicitly and in her own right; be clear and kind about what you can and cannot do and why; offer general information about the condition, about the value of assessment, and about carers' rights including a statutory carer's assessment.","test":"The test of whether you have got this right: has anything been done TO him without his knowledge or consent as a result of this call?"},{"model":"Systemic","mech":"The referral is from one part of the system about another; the pattern between them is the material.","form":"She is asking you to join a coalition. Her fear is entirely understandable — she is watching her husband change and losing control of a future she cannot alter, and getting a diagnosis is one of the few actions available to her. But the more she pushes, the more he may need to refuse in order to retain some authorship over what is happening to him. There is a loop here, and joining her side of it will strengthen it. Worth asking: what does he think is happening? What does a diagnosis mean to each of them — for her, a plan; for him, perhaps the loss of driving, of work, of standing?","adds":"Reframes his refusal as meaningful rather than obstructive, and identifies why persuasion will fail.","misses":"Requires care not to imply she is at fault when she is frightened and exhausted.","intervention":"Be curious with her about the pattern: how it goes when she raises it, what he says, what he might be protecting. Explore what would happen if she stopped raising it for a period.","test":"If the loop is operating, reducing the pressure should change his response — which is a suggestion you can make to her and she can test this week."},{"model":"Carer-focused","mech":"The carer has needs and rights of her own, independent of the person she cares for.","form":"She is a person in distress who has contacted a service, and she is entitled to a response in her own right. She has a statutory right to a carer's assessment. She may be experiencing anticipatory grief, isolation, fear about the future, and guilt about her own frustration with him — none of which require his consent to address.","adds":"Turns a call you cannot act on into a piece of work you can do, and is the answer Cardiff is listening for, given how heavily that course weights carer involvement.","misses":"Does not resolve the presenting request, and she may initially experience it as a deflection.","intervention":"Acknowledge the difficulty of the position she is in; offer or signpost carer support and a carer's assessment; give general information; agree what she will do if his safety becomes a concern.","test":"She should end the call with something concrete for herself, not only an explanation of what you cannot do."}],"compare":"The trap is the request itself: 'talk to him' or 'tell me what to say'. Answering it directly breaches confidentiality and treats a capacitous adult as an object of management. The strong answer holds three things at once — his autonomy, her real distress and her own entitlement to support, and the loop between them that persuasion is feeding. Cardiff asks carer questions in every year sampled, and a carer sits on the panel, so this is a high-frequency scenario for you specifically. If a carer asks it, answer to them.","difficulty":3},{"id":"v_stuck","title":"Twelve sessions and stuck","source":"Birmingham 2018 clinical interview, verbatim question","text":"You have been seeing a man in his forties for twelve sessions for depression. He attends reliably and is polite. He completes what you ask between sessions. His scores have not moved. When you ask how he found the last session he says it was helpful. You leave sessions feeling flat and slightly bored, and you have noticed you check the clock.","ask":"What factors might you consider?","models":[{"model":"Formulation review","mech":"Stuckness is most often a signal that the formulation is wrong or incomplete.","form":"Twelve sessions of compliance without change suggests the hypothesised mechanism may not be the operative one. Is this depression at all, or grief, or an untreated physical cause, or the appropriate response to circumstances that have not changed — an unbearable job, a dying parent, debt, a marriage he has not mentioned? Is something maintaining it that is not in the formulation: alcohol, chronic pain, a partner who is undermining, a secret?","adds":"Directs you back to the highest-yield explanation rather than to a new technique.","misses":"Can become an endless reformulation that avoids the relational question.","intervention":"Reformulate from scratch WITH him, explicitly, including the possibility that you have got it wrong.","test":"If the formulation is wrong, a genuinely open reformulation should produce material that was not previously available."},{"model":"Alliance and process","mech":"Compliance is not engagement, and the therapist's boredom is data.","form":"Politeness, reliable attendance and 'it was helpful' can be a form of accommodation — he may be being a good patient rather than doing the work, possibly because disagreeing with professionals is not safe or not permitted for him. Your flatness and clock-watching are the most useful information you have: if he is producing an interaction that is agreeable and empty, you are experiencing something about how he manages relationships, and quite possibly what others experience with him.","adds":"Uses countertransference as data rather than as a personal failing, which is exactly the move Birmingham's question invites.","misses":"Requires care in how it is raised — clumsily done, it can shame him.","intervention":"Name the process tentatively and non-blamefully: 'I've been wondering whether we've been having quite a polite conversation, and whether there are things that have felt hard to say to me.' Take the boredom to supervision first.","test":"If this is a relational pattern, naming it should produce a live shift in the room — either genuine contact or a visible increase in politeness, and both are informative."},{"model":"Model and fit","mech":"The intervention may be wrong, the timing wrong, or the goal not his.","form":"Whose goal is symptom reduction? He may have come because his GP sent him, or because his wife asked, and may be complying with a task he did not choose. A behavioural account would ask whether the homework is actually being done in a way that contacts reinforcement, or completed as paperwork. It is also worth asking whether a different model — ACT, if the issue is a life narrowed by avoidance, or something interpersonal — fits better than continuing.","adds":"Opens the possibility that continuing is the wrong answer, which candidates rarely say.","misses":"Risks abandoning a workable approach too early.","intervention":"Renegotiate goals from the beginning; consider a change of model, a break, or an honest ending; ask directly what he would want to be different if therapy could not give him anything else.","test":"If the goal is not his, asking directly what HE wants should produce a different answer from the referral question."},{"model":"Outside the room","mech":"Therapy cannot resolve what is being generated outside it.","form":"If his circumstances are genuinely depressing — insecure work, debt, caring, isolation, discrimination — then the absence of change may be an accurate reflection of reality rather than a failure of technique. Twelve sessions of cognitive work will not move a score that is tracking his housing situation.","adds":"Guards against the individualising error and points toward material and social intervention.","misses":"Can become a reason not to look at the relationship.","intervention":"Ask what has and has not changed in his circumstances; consider social prescribing, welfare advice, debt support, or advocacy as legitimate psychological interventions.","test":"If circumstances are driving it, the pattern of scores should track life events rather than therapy content."}],"compare":"The move that lifts this answer is treating your own boredom as the primary data. Most candidates list techniques; the strong answer says 'the most useful information I have is my own flatness, and I would take that to supervision before I did anything else, because it probably tells me something about how he manages relationships.' Then: reformulate, name the process with him, check whose goal we are pursuing, and look outside the room. Note that 'consider ending' belongs in the answer — knowing when to stop is a competence, not a failure.","difficulty":4}]},"roleplay":{"version":1,"dims":{"open":"Opening space","reflect":"Reflecting","validate":"Validating","explore":"Staying with experience","fix":"Advising too early","close":"Closing down","self":"Managing own agenda"},"scenarios":[{"id":"rp_timekeeping","title":"The colleague and the timekeeping feedback","source":"Glasgow 2018 — one of four scenarios given to candidates a week in advance, verbatim","brief":"Your colleague approaches you to discuss a work-related problem. They are of equal status, so there is no power relationship. There is NO expectation that you resolve the problem. Your aim is (a) to establish the circumstances leading to the problem and (b) to establish and understand your colleague's reaction to those circumstances.","setting":"An office in your workplace. Mid-afternoon. You have about eight minutes.","character":"Sam, a colleague of equal status, who has just come from a meeting with your shared line manager.","opening":"Have you got a minute? Sorry — I know you're busy. I've just come out of a meeting with Jo and I'm… I don't really know what to do with it, to be honest.","turns":[{"says":"She's had a go at me about my timekeeping. Apparently I've been late 'a number of times'. She wouldn't even say who'd mentioned it.","options":[{"t":"Have you been late, though?","d":"close","s":-2,"f":"This puts them on trial in the first thirty seconds. Whether they were late is not the task — the brief asks you to establish the circumstances and understand their reaction."},{"t":"That sounds like it landed pretty hard. What happened?","d":"open","s":3,"f":"Names the impact and opens the space. This is exactly what the brief asks for."},{"t":"Jo does that with everyone. I wouldn't take it personally.","d":"close","s":-2,"f":"Reassurance that dismisses the feeling and closes the topic. It also aligns you against a manager on no evidence."},{"t":"Do you want to make a formal complaint?","d":"fix","s":-3,"f":"Solving a problem you have not yet understood, and escalating something they have not asked to escalate."}]},{"says":"It was just… she called me in, sat me down, and said it had been 'raised'. Passive voice, you know? Like I'm supposed to guess who. And I have been late — a few times. My mum's been ill and I've been doing her mornings before work. I didn't want to make a thing of it.","options":[{"t":"You should have told her about your mum. She'd have to make allowances.","d":"fix","s":-2,"f":"Advice, and slightly blaming — 'you should have'. They have just told you something vulnerable and this steps straight over it."},{"t":"So you've been getting your mum up in the mornings, and you didn't tell anyone at work — and now it's come back to you as a complaint.","d":"reflect","s":3,"f":"Reflects both the circumstance and its sting, and holds them together. It also gently makes visible the choice they made without judging it."},{"t":"How is your mum?","d":"explore","s":1,"f":"Kind, and human. Slightly risks moving away from the work problem they came with, but a brief version of this is warm rather than diverting."},{"t":"That's really unfair of her then.","d":"validate","s":0,"f":"Sympathetic, but it takes a side on facts you do not have, and it closes off exploring their own mixed feelings — which are the interesting part."}]},{"says":"Yeah. And the thing is, I'm annoyed with her, but I'm mostly annoyed with myself. I should have just said something. Now it looks like I've been getting away with something.","options":[{"t":"You've got nothing to feel guilty about. You were caring for your mum.","d":"close","s":-1,"f":"Well-meant, but it argues them out of a feeling instead of understanding it, and it can leave them feeling unheard."},{"t":"There's something about how it looks that's bothering you more than the lateness itself.","d":"reflect","s":3,"f":"Picks up the real thread — this is about being seen as someone who gets away with things. This is understanding their reaction, which is what the brief asks for."},{"t":"What do you think stopped you from saying something at the time?","d":"explore","s":3,"f":"Curious, non-judgemental, and goes to the heart of it without telling them what to think."},{"t":"I'd have done the same thing, honestly.","d":"self","s":0,"f":"Normalising, but it turns the conversation toward you. Use sparingly and briefly, if at all."}]},{"says":"I suppose I didn't want to be the person with the problem. Everyone's stretched. And if I'm honest I thought if I said it out loud I might not be able to keep doing it — the job and mum, I mean.","options":[{"t":"That sounds like a lot to be carrying on your own.","d":"validate","s":3,"f":"Validation at the right moment, after they have disclosed the thing underneath. Not agreement, not reassurance — recognition."},{"t":"Do you think you can keep doing both?","d":"explore","s":2,"f":"A real question that follows what they said. Slightly early — the validation lands better first — but it does not close anything down."},{"t":"Have you looked into carer's leave? I think there's a policy.","d":"fix","s":-2,"f":"The information may be useful later. Offered here, it steps over the thing they have just risked saying and turns it into an admin problem."},{"t":"Right, so the practical issue is the mornings.","d":"close","s":-2,"f":"Reduces a personal disclosure to a logistics problem, and misses everything they just told you about not wanting to be the person with the problem."}]},{"says":"I don't know. Probably not forever. [pause] Sorry, I didn't mean to dump all this on you. I just wanted to moan about Jo really.","options":[{"t":"You haven't dumped anything on me. It sounds like there's quite a lot going on beyond Jo.","d":"validate","s":3,"f":"Declines the retreat without pushing, and names what has actually happened in the conversation."},{"t":"No problem. So what are you going to do about Jo?","d":"fix","s":-2,"f":"Accepts the retreat and heads for a solution. The brief explicitly says you are not expected to resolve the problem."},{"t":"Was there something you were hoping to get out of talking it through?","d":"open","s":2,"f":"A good closing move — asking rather than prescribing what would help. Slightly early here, since they have just pulled back."},{"t":"It's fine, everyone needs to vent.","d":"close","s":-1,"f":"Minimises what they said and lets the retreat stand."}]}],"debrief":"Glasgow's brief is unusually explicit and worth taking literally: establish the circumstances, understand the reaction, and do NOT resolve the problem. Almost every negative score above is an attempt to fix, reassure or advise. The other thing to notice is the shape of the conversation — it starts as a complaint about a manager and, if you stay with it, becomes about a caring responsibility and a fear of not coping. That movement only happens if you resist the first three opportunities to solve it. If you find yourself offering the carer's leave policy in minute two, you have taken the role of manager rather than colleague.","difficulty":3},{"id":"rp_examstress","title":"The student with exam stress","source":"Southampton 2015 — verbatim role-play brief","brief":"You are playing a college counsellor. You are about to see a student who is struggling with exam stress. No intervention as such is expected — the purpose is to see how you engage with the client and your brief assessment and formulation skills. About eight minutes.","setting":"A small counselling room at a further education college. First appointment.","character":"Aisha, 19, first year, referred by her tutor after missing two mock exams.","opening":"Hi. Um. My tutor said I had to come. I don't really know what I'm supposed to say.","turns":[{"says":"I mean, it's just exams, isn't it. Everyone's stressed. I don't know why she made a big deal of it.","options":[{"t":"Your tutor was worried enough to refer you. What do you think she noticed?","d":"open","s":3,"f":"Acknowledges the referral route honestly and invites her perspective on it rather than defending the tutor."},{"t":"Exam stress is really common. Let's talk about some techniques.","d":"fix","s":-3,"f":"Accepts her minimisation, skips assessment entirely, and starts intervening in the first minute."},{"t":"It sounds like you'd rather not be here.","d":"reflect","s":3,"f":"Names the elephant in the room, which almost always improves engagement in a mandated referral."},{"t":"Well, you missed two mocks — that's not nothing.","d":"close","s":-2,"f":"Confronts with the evidence before any relationship exists. She will comply or withdraw; neither helps."}]},{"says":"I don't know. I suppose I didn't go to the mocks. I got there — I was outside the hall — and I just couldn't go in. I walked home. I didn't tell anyone.","options":[{"t":"What was happening for you, standing outside that hall?","d":"explore","s":3,"f":"Goes straight to the moment with an open question. This is where the formulation lives."},{"t":"That must have been frightening.","d":"validate","s":2,"f":"Warm and probably accurate, though it names the feeling for her rather than asking. Better after she has described it."},{"t":"Have you had panic attacks before?","d":"close","s":0,"f":"A reasonable question that arrives too soon and in closed form. It hands her a label rather than eliciting her account."},{"t":"OK. So we need to get you back in that hall.","d":"fix","s":-3,"f":"Jumps to the goal before understanding anything, and is likely to be experienced as exactly what she feared."}]},{"says":"My heart was going really fast and I felt sick and I thought I was going to be sick in front of everyone. And then I thought if I go in and I can't do it, that's worse, because then everyone knows.","options":[{"t":"So going in risked everyone seeing you fail — and walking away meant nobody saw.","d":"reflect","s":3,"f":"Reflects the appraisal precisely and hands her the beginning of a formulation in her own terms."},{"t":"Those are physical symptoms of anxiety — your body's alarm system.","d":"fix","s":1,"f":"Accurate psychoeducation, but it arrives before she has finished, and explaining can shut down disclosure."},{"t":"What would 'everyone knowing' mean?","d":"explore","s":3,"f":"Goes underneath the appraisal to the meaning. This is the question that finds the belief."},{"t":"Did you feel better once you'd left?","d":"explore","s":3,"f":"Elegant — establishes the negative reinforcement without any jargon, and she will say yes."}]},{"says":"[quietly] My parents came here so I could do this. My brother didn't finish. If I mess it up… I don't know. It's not really about the exam.","options":[{"t":"It's not really about the exam.","d":"reflect","s":3,"f":"Simple reflection of her own words at the moment they matter most. Says nothing, does everything."},{"t":"That's a lot of pressure to be carrying at nineteen.","d":"validate","s":3,"f":"Validation that names the weight without interpreting it for her."},{"t":"Have you talked to your parents about how you're feeling?","d":"fix","s":-1,"f":"A reasonable question eventually, but here it moves away from her at the exact moment she has moved toward you."},{"t":"So it's about letting your family down.","d":"close","s":0,"f":"Probably right, but stated as a conclusion. She has just said 'I don't know' — she needs room, not an interpretation."}]},{"says":"[looks at the clock] Is that it, then? Do I have to come back?","options":[{"t":"That's yours to decide. What was it like, saying that out loud?","d":"open","s":3,"f":"Gives her control — which matters enormously in a mandated referral — and closes by checking the experience of the session."},{"t":"I think it would really help if you did.","d":"close","s":-1,"f":"Well-intentioned, but it takes the choice from someone whose difficulty is partly about things being decided for her."},{"t":"Yes, we should book six sessions.","d":"fix","s":-3,"f":"Imposes a contract she has not agreed to at the moment she is asking whether she has any choice."},{"t":"You don't have to. But I'd be glad to see you again if you wanted.","d":"validate","s":3,"f":"Autonomy plus an honest offer. Clear, warm, and leaves the door open without pushing her through it."}]}],"debrief":"Southampton then asks three questions: what was the presenting issue, how could the intervention move forward, and what about your performance could be improved. Prepare all three. The presenting issue is not exam stress — it is avoidance maintained by immediate relief, with a fear of visible failure carrying family meaning. For the third question, name something real and specific: 'I explained the physiology slightly too early and she stopped talking for a moment' is a much stronger answer than 'I could have been more empathic'. The candidate who wrote this paper up added a reassurance worth keeping: 'once the conversation started I actually forgot I was being observed'.","difficulty":3},{"id":"rp_carer_call","title":"The carer who wants you to intervene","source":"Cardiff 2012 and 2013 — a version of this appears in both years","brief":"You take a call from the wife of a man with early signs of a degenerative dementia. He is refusing to attend a neurology appointment for diagnostic testing. He is not open to your service and has not consented to you discussing him. Establish what is happening, be clear about what you can and cannot do, and respond to her as someone with needs of her own.","setting":"A telephone call, taken at your desk. You have about seven minutes.","character":"Margaret, 68, married for forty-one years.","opening":"I'm sorry to ring out of the blue. I got your number from the memory clinic. It's about my husband — he won't go to his appointment and I don't know what else to do.","turns":[{"says":"They've booked him in twice now and both times he's refused to get in the car. I've tried everything. Can you talk to him? Or tell me what to say to him?","options":[{"t":"I can't discuss him without his consent, I'm afraid.","d":"close","s":-2,"f":"Correct, and delivered as a door closing on a frightened person in the first minute. The content is right; the timing and framing are wrong."},{"t":"It sounds like you've been trying very hard on your own. Can you tell me a bit about what's been happening?","d":"open","s":3,"f":"Acknowledges her effort and opens the space. You can be clear about the limits shortly — but not before she feels heard."},{"t":"Of course. What would you like me to say to him?","d":"self","s":-3,"f":"Agrees to something you cannot do. He is a capacitous adult who has not consented to your involvement."},{"t":"Has he been assessed as lacking capacity?","d":"close","s":-1,"f":"The right concept, asked in a way that will mean nothing to her and signals you are processing rather than listening."}]},{"says":"He's just being stubborn. He's always been stubborn. He says there's nothing wrong with him and he doesn't need doctors poking about. But there IS something wrong — he got lost coming back from the shop last month.","options":[{"t":"That must have been frightening for you both.","d":"validate","s":3,"f":"Picks up the thing underneath the frustration. She is frightened, and 'stubborn' is easier to say."},{"t":"What do you think it would mean to him, to go and be told?","d":"explore","s":3,"f":"Beautifully placed — invites her to consider his position, which is the beginning of a systemic shift, without asking her to give up her own."},{"t":"Getting lost is a significant sign. He really does need that assessment.","d":"fix","s":-2,"f":"Recruits you onto her side of the very argument that is stuck, and increases the pressure on him."},{"t":"Has he always refused medical appointments?","d":"explore","s":1,"f":"Useful history, but it moves to fact-gathering just as feeling appeared."}]},{"says":"[pause] I hadn't thought about it like that. I suppose he'd have to stop driving. That's his freedom, that is. He drives everywhere. [pause] But I can't just leave it, can I?","options":[{"t":"You're caught between respecting what he wants and being frightened about what happens if nothing's done.","d":"reflect","s":3,"f":"Names the dilemma precisely and does not resolve it for her. This is the heart of the call."},{"t":"No, you can't leave it. There are things that can help if it's caught early.","d":"fix","s":-1,"f":"True, and it takes a side in a dilemma she is only just beginning to hold — and pushes her back into persuading him."},{"t":"What do you think would happen if you stopped raising it for a few weeks?","d":"explore","s":3,"f":"A genuinely systemic intervention offered as a question. It interrupts the loop and gives her something she can actually test."},{"t":"Ultimately it's his decision to make.","d":"close","s":0,"f":"Legally accurate and, said alone at this point, it can land as abandonment. Pair it with something she can do."}]},{"says":"I don't know. I'd feel like I was giving up on him. [quietly] I'm so tired. I'm sorry. I didn't mean to go on.","options":[{"t":"You're not going on. You've been holding this by yourself for a while, by the sound of it.","d":"validate","s":3,"f":"Declines the apology and names her exhaustion. This is the moment the call turns from being about him to being about her."},{"t":"It's completely understandable. Now, about the appointment —","d":"close","s":-3,"f":"A sympathetic noise followed by a return to business. She has just told you she is exhausted."},{"t":"Have you had any support for yourself in all this?","d":"explore","s":3,"f":"Moves to what you can actually offer, at exactly the right moment, and treats her as someone with needs of her own."},{"t":"You should look after yourself too.","d":"fix","s":-1,"f":"An instruction rather than an offer. It sounds caring and gives her one more thing to fail at."}]},{"says":"Not really. My daughter rings. There's not much she can do from Leeds. What can you actually do, then?","options":[{"t":"Let me be honest about that. I can't approach him or discuss him without his agreement — that's his right. But I can talk with you, and you're entitled to support in your own right, including a carer's assessment. Shall I explain what that is?","d":"open","s":3,"f":"Honest, clear, kind, and lands on something concrete for HER. This is the answer Cardiff is listening for."},{"t":"Not a great deal without his consent, I'm afraid.","d":"close","s":-3,"f":"Accurate and useless. She ends the call with nothing."},{"t":"I could see if a GP would do a home visit.","d":"fix","s":-1,"f":"Arranging something about him without his knowledge — the same breach in a different coat."},{"t":"I can send you some information about dementia and about carers' services, and we can talk again.","d":"validate","s":2,"f":"Genuinely useful and appropriate. Slightly less strong than naming the carer's assessment and her entitlement explicitly."}]}],"debrief":"Two things are being tested at once: whether you protect the autonomy of a man who is not your patient, and whether you can nonetheless respond to a distressed woman who is. Candidates tend to fail in one of two directions — being recruited into managing him, or reciting confidentiality at someone who is frightened. The resolution is that listening, giving general information and supporting her in her own right require no disclosure at all. Note the systemic move in turn three: asking what would happen if she stopped raising it is both a real intervention and something she can test this week. Cardiff weights carers heavily and puts a carer on the panel — expect a version of this.","difficulty":3}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('trainer-data').textContent);
/* ============================================================
   ENGINE — learner model, scheduler, scoring
   ============================================================ */
'use strict';

const LEVELS = ['unseen','recognise','recall','apply','discriminate','transfer'];
const LEVEL_N = { recognise:1, recall:2, apply:3, discriminate:4, transfer:5 };
const BANDS = [
  [0,  39, 'Foundational deficit', 'var(--wrong)'],
  [40, 59, 'Emerging',             'var(--serious)'],
  [60, 74, 'Functional but unreliable', 'var(--warning)'],
  [75, 84, 'Competent',            'var(--seq-5)'],
  [85, 94, 'Strong',               'var(--seq-4)'],
  [95, 100,'Selection-ready',      'var(--good)'],
];
const ERROR_TYPES = [
  ['knowledge',    'Knowledge gap',            "I hadn't learned this"],
  ['concept',      'Conceptual misunderstanding', 'I understood it wrongly'],
  ['terminology',  'Terminology confusion',    'I meant the right thing, wrong word'],
  ['question',     'Question-interpretation',  'I answered a different question'],
  ['application',  'Application error',        'I knew it but misapplied it'],
  ['overgeneral',  'Overgeneralisation',       'I pushed a rule too far'],
  ['reasoning',    'Reasoning error',          'My logic slipped'],
  ['careless',     'Careless',                 'I knew it and misread'],
  ['retrieval',    'Retrieval failure',        "I knew it but couldn't get to it"],
];
const DAY = 864e5;

/* ---------------------------------------------------------- state */
const KEY = 'dclinpsy.trainer.v1';
let S;

function blankState() {
  // light-first, but honour a viewer whose OS is set to dark on a genuinely first run
  const prefersDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
  return { v:1, created: Date.now(), interviewDate:null, theme: prefersDark ? 'dark' : 'light', sound:false,
           c:{}, i:{}, cal:[], errors:[], log:[], wins:[], written:{}, panel:{}, rp:{}, formul:{},
           streak:{last:null,n:0}, seenIntro:false, coached:{}, lastMode:'today' };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    S = raw ? Object.assign(blankState(), JSON.parse(raw)) : blankState();
  } catch (e) { S = blankState(); }
}
/* Persistence.

   This used to swallow every write error, so a learner in a private window or
   with a full quota would work for an hour watching progress accumulate on
   screen that was never being stored. A failed write is now surfaced once and
   stays surfaced, because the only recovery is to export.

   The debounce is also flushed when the page is hidden — closing the tab
   within 220ms of an answer used to lose it. */
let saveTimer = null;
let SAVE_BROKEN = false;

function writeState() {
  clearTimeout(saveTimer); saveTimer = null;
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    if (SAVE_BROKEN) { SAVE_BROKEN = false; hideSaveWarning(); }
    return true;
  } catch (e) {
    if (!SAVE_BROKEN) { SAVE_BROKEN = true; showSaveWarning(e); }
    return false;
  }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeState, 220);
}

function flushSave() { if (saveTimer) writeState(); }

function showSaveWarning(err) {
  if (typeof document === 'undefined' || $('#savewarn')) return;
  const full = err && (err.name === 'QuotaExceededError' || err.code === 22);
  const bar = el('div', { id:'savewarn', role:'alert' });
  bar.innerHTML = `<b>Your progress is not being saved.</b> ` +
    (full ? 'This browser\u2019s storage for the page is full.'
          : 'This browser is blocking local storage \u2014 private windows often do.') +
    ` Answers you give now will be lost when you close the tab.`;
  const b = el('button', { class:'btn sm', text:'Export what you have',
                           onclick: () => { try { exportProgress(); } catch (e) {} } });
  bar.appendChild(b);
  document.body.appendChild(bar);
}
function hideSaveWarning() { const b = $('#savewarn'); if (b) b.remove(); }

/* ---------------------------------------------------------- indexes */
const CONCEPT = {}, ITEM = {};
function buildIndex() {
  DATA.concepts.nodes.forEach(n => CONCEPT[n.id] = n);
  DATA.items.items.forEach(it => ITEM[it.id] = it);
}
function conceptsOf(domain) { return DATA.concepts.nodes.filter(n => n.domain === domain); }

/* ---------------------------------------------------------- mastery */
function cRec(id) {
  if (!S.c[id]) S.c[id] = { d:0, s:1, t:0, n:0, r:0, w:0, hcw:0, cal:[] };
  return S.c[id];
}
function retriev(rec, now) {
  if (!rec.t || !rec.n) return 0;
  const days = (now - rec.t) / DAY;
  return Math.pow(0.9, days / Math.max(0.5, rec.s));
}
function mastery(id, now) {
  const rec = S.c[id];
  if (!rec || !rec.n) return 0;
  const R = retriev(rec, now || Date.now());
  const ceiling = (rec.d / 5) * 100;
  const acc = rec.r + rec.w ? rec.r / (rec.r + rec.w) : 0.5;
  return Math.round(Math.max(0, Math.min(100, ceiling * (0.5 + 0.5 * R) * (0.72 + 0.28 * acc))));
}
function band(pct) { return BANDS.find(b => pct >= b[0] && pct <= b[1]) || BANDS[0]; }

function domainScore(domain, now) {
  const ns = conceptsOf(domain);
  if (!ns.length) return 0;
  // tier-1 concepts weigh triple, tier-2 double — coverage of core before breadth
  let num = 0, den = 0;
  ns.forEach(n => { const w = n.tier === 1 ? 3 : n.tier === 2 ? 2 : 1; num += mastery(n.id, now) * w; den += w; });
  return Math.round(num / den);
}
function readiness(now) {
  now = now || Date.now();
  const r = domainScore('research', now), c = domainScore('clinical', now), p = domainScore('professional', now);
  // the weakest domain drags: selection tests all three, and a candidate is
  // filtered by their weakest panel, not their strongest
  const min = Math.min(r, c, p), mean = (r + c + p) / 3;
  return { research:r, clinical:c, professional:p, overall: Math.round(mean * 0.62 + min * 0.38) };
}

/* ---------------------------------------------------------- scheduling */
function targetRetention() {
  const d = daysToInterview();
  if (d === null) return 1;
  if (d <= 14) return 0.5;   // intervals halve: fluency phase
  if (d <= 45) return 0.7;
  return 1;
}
function daysToInterview() {
  if (!S.interviewDate) return null;
  return Math.ceil((new Date(S.interviewDate).getTime() - Date.now()) / DAY);
}
function iRec(id) {
  if (!S.i[id]) S.i[id] = { s:0.7, t:0, n:0, lapse:0, ok:0 };
  return S.i[id];
}
/* grade: 0 wrong · 1 shaky · 2 right · 3 fluent */
function schedule(rec, grade, hiConfWrong) {
  const now = Date.now();
  const R = rec.t ? Math.pow(0.9, ((now - rec.t) / DAY) / Math.max(0.5, rec.s)) : 0.9;
  if (grade === 0) {
    rec.lapse++;
    // a confident error is the highest-value review in the system: it comes back today
    rec.s = hiConfWrong ? 0.02 : Math.max(0.25, rec.s * 0.32);
  } else {
    // spacing effect: the longer you successfully waited, the more stability you gain
    const gain = (1.15 + 0.5 * grade) * (1 + 0.55 * (1 - R));
    rec.s = Math.min(240, Math.max(0.6, rec.s * gain));
  }
  rec.t = now; rec.n++;
  if (grade > 0) rec.ok++;
  rec.due = now + rec.s * targetRetention() * DAY;
  return rec;
}
function itemDue(id, now) {
  const r = S.i[id];
  if (!r || !r.n) return Infinity;      // unseen handled separately
  return r.due || 0;
}
function priority(item, now) {
  const r = S.i[item.id];
  let p = 0;
  if (!r || !r.n) {
    p = 40;                                    // unseen baseline
  } else {
    const overdueDays = (now - (r.due || now)) / DAY;
    if (overdueDays < 0) return -1;            // not due
    p = 55 + Math.min(45, overdueDays * 9);
    if (r.lapse) p += r.lapse * 12;
  }
  // weight by how weak, and how central, the concepts it touches are
  let boost = 0;
  item.concepts.forEach(cid => {
    const node = CONCEPT[cid]; if (!node) return;
    const m = mastery(cid, now);
    boost += (100 - m) * (node.tier === 1 ? 0.34 : node.tier === 2 ? 0.2 : 0.1);
    const rec = S.c[cid];
    if (rec && rec.hcw) boost += rec.hcw * 14;  // confident errors weigh heavily
  });
  p += boost / Math.max(1, item.concepts.length);
  if (item.level === 'transfer') p += 14;       // transfer is the north star
  if (item.level === 'discriminate') p += 8;
  return p;
}

/* build an interleaved session: never more than two consecutive from a cluster */
function buildSession(n, filterFn) {
  const now = Date.now();
  let pool = DATA.items.items.filter(it => !filterFn || filterFn(it));
  const scored = pool.map(it => ({ it, p: priority(it, now) }))
                     .filter(x => x.p >= 0)
                     .sort((a, b) => b.p - a.p);
  const out = [], recent = [];
  const clusterOf = it => (CONCEPT[it.concepts[0]] || {}).cluster || '?';
  while (out.length < n && scored.length) {
    let idx = scored.findIndex(x => {
      const cl = clusterOf(x.it);
      return !(recent.length >= 2 && recent[recent.length-1] === cl && recent[recent.length-2] === cl);
    });
    if (idx < 0) idx = 0;
    const chosen = scored.splice(idx, 1)[0];
    out.push(chosen.it);
    recent.push(clusterOf(chosen.it));
  }
  return out;
}

/* ---------------------------------------------------------- session plan
   The engine already decides what to practise; this makes that decision
   legible before you commit to it. Nothing here is invented for display —
   it is the same queue buildSession() will hand the drill. */
const CLUSTER_LABEL = {
  bias: 'Bias and confounding', clinical_skills: 'Clinical skills', design: 'Study design',
  edi: 'Equality, diversity and inclusion', epi: 'Epidemiology', ethics: 'Ethics',
  formulation: 'Formulation', inference: 'Statistical inference', measurement: 'Measurement',
  models: 'Therapeutic models', professional: 'Professional issues', qualitative: 'Qualitative methods',
  risk: 'Risk', systems: 'Services and systems', tests: 'Test selection',
};
const REASON_TEXT = {
  confident: 'you were sure and wrong here',
  lapsed:    'you have lost this one before',
  due:       'due for review',
  new:       'not yet seen',
};

function itemReason(item) {
  const r = S.i[item.id];
  if (!r || !r.n) return 'new';
  if (r.lapse) return 'lapsed';
  if (item.concepts.some(cid => (S.c[cid] || {}).hcw)) return 'confident';
  return 'due';
}

function sessionPlan(n) {
  const now = Date.now();
  const items = buildSession(n);
  const by = {};
  items.forEach(it => {
    const node = CONCEPT[it.concepts[0]] || {};
    const key = node.cluster || 'other';
    const g = by[key] || (by[key] = {
      key, label: CLUSTER_LABEL[key] || key, domain: node.domain || 'research',
      n: 0, reasons: {}, weakest: 100 });
    g.n++;
    const r = itemReason(it);
    g.reasons[r] = (g.reasons[r] || 0) + 1;
    it.concepts.forEach(cid => { const m = mastery(cid, now); if (m < g.weakest) g.weakest = m; });
  });
  const groups = Object.values(by).sort((a, b) => b.n - a.n);
  groups.forEach(g => { g.reason = Object.entries(g.reasons).sort((a, b) => b[1] - a[1])[0][0]; });
  return { total: items.length, groups };
}

/* movement over a window, from events that actually happened: depth
   advancements up, recorded errors down. Not a synthetic percentage. */
function recentMovement(days) {
  const cut = Date.now() - (days || 7) * DAY;
  const out = { research: { up:0, dn:0 }, clinical: { up:0, dn:0 }, professional: { up:0, dn:0 } };
  (S.wins || []).forEach(w => {
    const nd = CONCEPT[w.cid];
    if (w.ts >= cut && nd && out[nd.domain]) out[nd.domain].up++;
  });
  (S.errors || []).forEach(e => {
    if ((e.ts || 0) < cut) return;
    const seen = {};
    (e.concepts || []).forEach(cid => {
      const nd = CONCEPT[cid];
      if (nd && out[nd.domain] && !seen[nd.domain]) { seen[nd.domain] = 1; out[nd.domain].dn++; }
    });
  });
  return out;
}

/* ---------------------------------------------------------- recording */
function recordAnswer(item, correct, conf, secs) {
  const now = Date.now();
  const hiConfWrong = !correct && conf >= 4;
  const fast = secs <= (item.time || 60);
  const grade = correct ? (conf >= 4 && fast ? 3 : conf >= 3 ? 2 : 1) : 0;

  schedule(iRec(item.id), grade, hiConfWrong);
  S.i[item.id].ok = correct ? (S.i[item.id].ok || 0) : (S.i[item.id].ok || 0);

  const lvl = LEVEL_N[item.level] || 1;
  item.concepts.forEach(cid => {
    const rec = cRec(cid);
    rec.n++;
    if (correct) {
      rec.r++;
      // depth only advances on a genuine pass at that level — recognition can
      // never register as mastery, however often it is repeated
      if (lvl > rec.d) {
        rec.d = lvl;
        pushWin(cid, item.level);
      }
      schedule(rec, grade, false);
    } else {
      rec.w++;
      if (hiConfWrong) rec.hcw++;
      // a transfer failure costs depth: it means the level was not really held
      if (lvl >= 4 && rec.d >= lvl) rec.d = Math.max(1, rec.d - 1);
      schedule(rec, 0, hiConfWrong);
    }
    rec.cal.push([conf, correct ? 1 : 0]);
    if (rec.cal.length > 40) rec.cal.shift();
  });

  S.cal = S.cal || [];
  S.cal.push([conf, correct ? 1 : 0]);
  if (S.cal.length > 500) S.cal.shift();

  if (!correct) {
    S.errors.unshift({ id:item.id, ts:now, concepts:item.concepts, conf,
                       stem:(item.stem||'').slice(0,150), level:item.level, type:null });
    if (S.errors.length > 400) S.errors.pop();
  }
  touchStreak();
  save();
  return { hiConfWrong, grade };
}

function pushWin(cid, level) {
  const node = CONCEPT[cid]; if (!node) return;
  if (level === 'unseen' || level === 'recognise') return;
  const verb = { recall:'can retrieve', apply:'can apply', discriminate:'can discriminate',
                 transfer:'can transfer to unfamiliar problems' }[level];
  S.wins.unshift({ ts: Date.now(), cid, level, text: `${node.label} — ${verb}` });
  if (S.wins.length > 60) S.wins.pop();
}

function touchStreak() {
  const today = new Date().toDateString();
  if (S.streak.last === today) return;
  const y = new Date(Date.now() - DAY).toDateString();
  S.streak.n = (S.streak.last === y) ? S.streak.n + 1 : 1;
  S.streak.last = today;
}

/* ---------------------------------------------------------- calibration */
function calibration() {
  // Brier-style: mean squared gap between stated confidence (as a probability)
  // and outcome, counted once per ANSWER. Reported 0-100, 100 = perfectly calibrated.
  let n = 0, sum = 0, hcw = 0, lcr = 0;
  (S.cal || []).forEach(([conf, ok]) => {
    const p = (conf - 1) / 4;
    sum += (p - ok) ** 2; n++;
    if (conf >= 4 && !ok) hcw++;
    if (conf <= 2 && ok) lcr++;
  });
  if (!n) return { score:null, n:0, hcw:0, lcr:0 };
  return { score: Math.round((1 - sum / n) * 100), n, hcw, lcr };
}

/* ---------------------------------------------------------- free-text scoring */
function cueHit(text, cue) {
  try {
    if (Array.isArray(cue)) return cue.every(p => new RegExp(p, 'i').test(text));
    return new RegExp(cue, 'i').test(text);
  } catch (e) { return false; }
}
function scoreText(text, rubric, traps) {
  const t = (text || '').replace(/\s+/g, ' ');
  const words = (t.match(/\S+/g) || []).length;
  const hits = {};
  (rubric || []).forEach(r => { hits[r.id] = (r.cues || []).some(c => cueHit(t, c)); });
  // Several traps are negative lookaheads for a missing move. Those match an
  // empty string trivially, so a stub answer would be flagged for everything.
  const fired = words >= 20 ? (traps || []).filter(tr => (tr.cues || []).some(c => cueHit(t, c))) : [];
  return { hits, traps: fired, words };
}
function rubricTotals(rubric, awarded) {
  let got = 0, max = 0;
  (rubric || []).forEach(r => { max += r.weight; if (awarded[r.id]) got += r.weight; });
  return { got, max };
}

/* ---------------------------------------------------------- misconception graph */
/* When several errors point at children of one node, teach the parent instead
   of five isolated facts. */
function misconceptionClusters(limit) {
  const count = {};
  S.errors.slice(0, 90).forEach(e => (e.concepts || []).forEach(cid => {
    const node = CONCEPT[cid]; if (!node) return;
    count[cid] = (count[cid] || 0) + 1;
    (node.parents || []).forEach(p => { count[p] = (count[p] || 0) + 0.75; });
  }));
  return Object.entries(count)
    .map(([cid, n]) => ({ cid, n, node: CONCEPT[cid], m: mastery(cid) }))
    .filter(x => x.node && x.n >= 1.5)
    .sort((a, b) => (b.n * (100 - b.m)) - (a.n * (100 - a.m)))
    .slice(0, limit || 6);
}

/* ---------------------------------------------------------- gaps & queue */
function weakConcepts(limit, domain) {
  const now = Date.now();
  return DATA.concepts.nodes
    .filter(n => (!domain || n.domain === domain))
    .map(n => ({ n, m: mastery(n.id, now), rec: S.c[n.id] }))
    .filter(x => x.rec && x.rec.n)
    .sort((a, b) => (a.m - b.m) || (b.rec.hcw - a.rec.hcw))
    .slice(0, limit || 8);
}
function dueCount() {
  const now = Date.now();
  return DATA.items.items.filter(it => { const r = S.i[it.id]; return r && r.n && (r.due || 0) <= now; }).length;
}
function unseenCount() {
  return DATA.items.items.filter(it => !S.i[it.id] || !S.i[it.id].n).length;
}

/* ---------------------------------------------------------- misc utils */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(k => k && e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k));
  return e;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function relTime(ts) {
  const d = Math.floor((Date.now() - ts) / DAY);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 7) return d + ' days ago';
  if (d < 30) return Math.floor(d / 7) + 'w ago';
  return Math.floor(d / 30) + 'mo ago';
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* One polite announcer for the whole app. The action bar used to be a live
   region in its entirety, so every re-render read out the confidence pips,
   the button label and the full teaching text. This says one sentence. */
function announce(msg) {
  const a = $('#announcer');
  if (!a) return;
  a.textContent = '';
  setTimeout(() => { a.textContent = msg; }, 40);
}

function toast(msg, ms) {
  announce(msg);
  const t = el('div', { class:'toast', text: msg });
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, ms || 2600);
}

/* a single quiet tick — used only by the interview countdown, off by default */
let AC = null;
function tick(freq, dur, vol) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.05, AC.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.09));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || 0.09));
  } catch (e) {}
}

const MODES = [
  ['today',    'Today',    'What the engine would have you do now'],
  ['practice', 'Practice', 'Every surface: drill, papers, panels, cases, role-play'],
  ['progress', 'Progress', 'What you hold, and what you keep getting wrong'],
];
let VIEW = 'today', TIMERS = [];
/* The verdict panel binds a document-level key handler. Navigating away must
   unbind it, or it survives into the next screen. */
let VERDICT_OFF = null;
function clearVerdict() { if (VERDICT_OFF) { VERDICT_OFF(); VERDICT_OFF = null; } }

function clearTimers() {
  TIMERS.forEach(t => { if (t && t.__off) t.__off(); else clearInterval(t); });
  TIMERS = [];
}
function focusMode(on) { document.body.classList.toggle('focus', !!on); }

/* ---------------------------------------------------------- action bar */
const Act = {
  el: null,
  init() { this.el = $('#actbar'); },
  /* a simple action row: [left…] [right…] */
  row(left, right) {
    this.el.className = 'up';
    this.el.innerHTML = '';
    const inner = el('div', { class:'inner' });
    (left || []).forEach(n => n && inner.appendChild(n));
    inner.appendChild(el('div', { class:'spacer' }));
    (right || []).forEach(n => n && inner.appendChild(n));
    this.el.appendChild(inner);
    $('#stage').classList.add('hasact');
  },
  /* a result panel: the bar becomes the explanation */
  result(tone, body, button) {
    this.el.className = 'up ' + (tone || '');
    this.el.innerHTML = '';
    const sc = el('div', { class:'scroller' });
    const bi = el('div', { class:'inner' });
    bi.appendChild(body);
    sc.appendChild(bi);
    this.el.appendChild(sc);
    const ai = el('div', { class:'inner' });
    ai.appendChild(el('div', { class:'spacer' }));
    ai.appendChild(button);
    this.el.appendChild(ai);
    $('#stage').classList.add('hasact');
  },
  hide() {
    if (!this.el) return;
    this.el.className = '';
    $('#stage').classList.remove('hasact');
    setTimeout(() => { if (!this.el.classList.contains('up')) this.el.innerHTML = ''; }, 380);
  },
};

/* Which tab owns each screen. Sub-pages used to leave every tab unselected,
   so the navigation could not say where you were. */
const OWNER = {
  today:'today', practice:'practice', progress:'progress',
  drill:'practice', papers:'practice', panel:'practice', studio:'practice', room:'practice',
  atlas:'progress', ledger:'progress',
};
const VIEWS = { today:vToday, practice:vPractice, progress:vProgress, drill:vDrill,
                papers:vBench, panel:vPanel, studio:vStudio, room:vRoom,
                atlas:vAtlas, ledger:vLedger };
/* 'Bench' read as furniture rather than as the written-paper surface. The old
   route still resolves so any link already made keeps working. */
const ROUTE_ALIAS = { bench: 'papers' };
const TITLES = { today:'Today', practice:'Practice', progress:'Progress', drill:'Drill',
                 papers:'Papers', panel:'The Panel', studio:'The Studio', room:'The Room',
                 atlas:'The Atlas', ledger:'The Ledger' };

/* Hash routing. The single go() chokepoint is the whole router: every screen
   gets a URL, the browser's back button works instead of leaving the app, and
   a screen can be linked to. `replace` is used when a view redirects to
   itself so we do not push a history entry the user has to press back twice
   through. */
let ROUTING = false;

function routeOf(view, arg) {
  return '#/' + view + (arg ? '/' + encodeURIComponent(arg) : '');
}

function go(view, arg, opts) {
  opts = opts || {};
  if (ROUTE_ALIAS[view]) view = ROUTE_ALIAS[view];
  if (!VIEWS[view]) view = 'today';
  clearTimers(); clearVerdict(); focusMode(false); Act.hide();
  if (MODES.some(m => m[0] === view)) { VIEW = view; S.lastMode = view; save(); }

  if (!ROUTING && !opts.fromPop) {
    const url = routeOf(view, arg);
    if (location.hash !== url) {
      if (opts.replace) history.replaceState({ view, arg }, '', url);
      else history.pushState({ view, arg }, '', url);
    }
  }
  document.title = (TITLES[view] ? TITLES[view] + ' · ' : '') + 'DClinPsy Trainer';

  const owner = OWNER[view] || view;
  $$('#tabs .tab').forEach(t => {
    const on = t.dataset.v === owner;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
  });

  const stage = $('#stage');
  stage.scrollTop = 0;
  stage.innerHTML = '';
  VIEWS[view](stage, arg);
  refreshTop();
}

/* Read the address bar and render it. Guarded so the render does not push a
   new entry for the state we are already restoring. */
function applyRoute(fromPop) {
  const m = /^#\/([a-z]+)(?:\/(.*))?$/.exec(location.hash || '');
  const raw = m ? (ROUTE_ALIAS[m[1]] || m[1]) : null;
  const view = raw && VIEWS[raw] ? raw : null;
  const arg = m && m[2] ? decodeURIComponent(m[2]) : undefined;
  ROUTING = true;
  try {
    if (!view) go(S.lastMode && MODES.some(x => x[0] === S.lastMode) ? S.lastMode : 'today',
                  undefined, { fromPop: true });
    else go(view, arg, { fromPop: true });
  } finally { ROUTING = false; }
}

function refreshTop() {
  const s = $('#streakn');
  if (s) s.textContent = S.streak.n || 0;
  const f = $('#streak');
  if (f) f.style.display = S.streak.n ? '' : 'none';
}

/* ---------------------------------------------------------- structure helpers */
function pageHead(label, title, sub, big) {
  const h = el('div', { class:'pagehead' + (big ? ' big' : '') });
  if (label) h.appendChild(el('span', { class:'lbl', text: label }));
  h.appendChild(el('h1', { text: title }));
  if (sub) h.appendChild(el('div', { class:'sub', text: sub }));
  return h;
}

function section(label, opts) {
  opts = opts || {};
  const s = el('div', { class:'section' });
  const h = el('div', { class:'sechead' });
  h.appendChild(el('span', { class:'lbl', text: label }));
  if (opts.note) h.appendChild(el('span', { class:'note', text: opts.note }));
  if (opts.act) h.appendChild(el('button', { class:'act', text: opts.act, onclick: opts.onAct }));
  s.appendChild(h);
  return s;
}

function plate(rows) {
  const p = el('div', { class:'plate' });
  (rows || []).forEach(r => r && p.appendChild(r));
  return p;
}

/* one row of a plate. `lead` is an optional node placed before the text. */
function prow(o) {
  const r = el(o.onclick ? 'button' : 'div', { class:'prow' });
  if (o.onclick) r.addEventListener('click', o.onclick);
  if (o.lead) r.appendChild(o.lead);
  const m = el('div', { class:'pmain' });
  m.appendChild(el('div', { class:'pname', text: o.name }));
  if (o.sub) m.appendChild(el('div', { class:'psub', text: o.sub }));
  r.appendChild(m);
  if (o.tail) r.appendChild(o.tail);
  if (o.val != null) r.appendChild(el('div', { class:'pval', text: String(o.val) }));
  if (o.onclick) r.appendChild(el('span', { class:'chev', text:'›' }));
  return r;
}

function dotEl(domain) { return el('span', { class:'dot ' + domain, 'aria-hidden':'true' }); }

/* One way back, used everywhere. Each screen used to invent its own — "← All
   cases" in the Studio, "← Leave" in the Room, nothing at all in the papers and
   the Panel — so the return path changed shape depending where you were. */
function backLink(label, onBack) {
  const b = el('button', { class:'backlink', onclick: onBack });
  b.innerHTML = `<span class="bk" aria-hidden="true">${icon('go', 15)}</span><span>${esc(label)}</span>`;
  return b;
}

/* Segmented control. The thumb is a single element that travels, so changing
   the choice reads as one object moving rather than two highlights swapping. */
function segEl(options, current, onPick) {
  const wrap = el('div', { class:'seg' });
  const thumb = el('i', { class:'thumb' });
  wrap.appendChild(thumb);
  const btns = options.map(([val, label]) => {
    const b = el('button', { text: label, class: val === current ? 'on' : '' });
    b.addEventListener('click', () => {
      if (b.classList.contains('on')) return;
      btns.forEach(x => x.classList.toggle('on', x === b));
      place();
      onPick(val);
    });
    wrap.appendChild(b);
    return b;
  });
  function place() {
    const on = btns.find(b => b.classList.contains('on')) || btns[0];
    if (!on || !on.offsetWidth) return;
    thumb.style.width = on.offsetWidth + 'px';
    thumb.style.transform = `translateX(${on.offsetLeft}px)`;
  }
  requestAnimationFrame(() => {
    // the first placement must not animate in from zero
    const t = thumb.style.transition;
    thumb.style.transition = 'none';
    place();
    requestAnimationFrame(() => { thumb.style.transition = t; });
  });
  return wrap;
}

/* Count a number up to its value. Numbers that matter should arrive, not
   appear — but only where the value is the point of the element. */
function countUp(node, to, ms) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { node.textContent = to; return; }
  const dur = ms || 760, t0 = performance.now();
  function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 4);                 // expo-out, matches --e-out
    node.textContent = Math.round(to * e);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* the depth ladder, drawn — five rungs, filled to the level demonstrated */
function rungsEl(depth, domain) {
  const w = el('div', { class:'rungs ' + (domain || ''), title: LEVELS[depth] || 'unseen' });
  for (let i = 1; i <= 5; i++) w.appendChild(el('i', { class: i <= depth ? 'on' : '' }));
  return w;
}

/* `ghost`, when given, draws a second faint arc behind the value. On the
   readiness ring it is the unweighted mean of the three domains, so the gap
   between the two arcs *is* the weighting — the chart shows you what the
   formula did to you rather than asserting a number. */
function ringEl(pct, size, stroke, colour, label, sub, ghost) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  const w = el('div', { class:'ring', style:`width:${size}px;height:${size}px` });
  const clamp = v => Math.max(0, Math.min(100, v));
  w.innerHTML =
    `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
       <circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"></circle>
       ${ghost != null ? `<circle class="ghost" cx="${size/2}" cy="${size/2}" r="${r}"
               stroke-width="${stroke}" stroke="${colour}" stroke-opacity=".22"
               stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle>` : ''}
       <circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
               stroke="${colour}" stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle>
     </svg>
     <div class="mid">
       <div class="dnum" style="font-size:${Math.round(size*0.3)}px">${label}</div>
       ${sub ? `<div class="lbl" style="font-size:9px;margin-top:1px">${sub}</div>` : ''}
     </div>`;
  requestAnimationFrame(() => {
    const v = $('.val', w);   if (v) v.style.strokeDashoffset = C * (1 - clamp(pct) / 100);
    const g = $('.ghost', w); if (g) g.style.strokeDashoffset = C * (1 - clamp(ghost) / 100);
    const n = $('.dnum', w);
    if (n && /^\d+$/.test(String(label))) countUp(n, +label, 900);
  });
  return w;
}

/* a domain line: name, bar, value, and — when there is history — movement */
function domainRow(d, pct, mv) {
  const row = el('div', { style:'padding:13px 0;border-top:1px solid var(--line)' });
  const arrow = !mv ? '' : mv.up > mv.dn ? `<span class="mv up">↑ ${mv.up} advanced</span>`
    : mv.dn > mv.up ? `<span class="mv dn">↓ ${mv.dn} slipped</span>`
    : (mv.up || mv.dn) ? '<span class="mv fl">→ holding</span>' : '';
  row.innerHTML =
    `<div class="row" style="margin-bottom:7px;gap:8px">
       <span class="dot ${d}"></span>
       <span style="font-weight:600;font-size:14px">${d[0].toUpperCase() + d.slice(1)}</span>
       <span class="spacer"></span>
       ${arrow}
       <span class="dnum" style="font-size:14px;color:var(--ink-2)">${pct}</span>
     </div>
     <div class="meter ${d}"><i></i></div>`;
  requestAnimationFrame(() => { $('i', row).style.width = pct + '%'; });
  return row;
}

/* ---------------------------------------------------------- TODAY */
let PLAN_MIN = 12;

/* The Today headline, written from the queue the engine has actually built.
   It leads with the most valuable thing in the session rather than with a
   greeting: a confident error outranks a due review, which outranks new
   material. Nothing here is decorative — every number is the real one. */
function sessionHeadline(started, due, hcw) {
  if (!started) return {
    title: 'Start with the diagnostic.',
    sub: 'Twelve items across all three domains. After that it stops sampling and starts targeting.' };

  const plan = sessionPlan(Math.max(6, Math.round(PLAN_MIN * 0.85)));
  if (!plan.total) return {
    title: 'Nothing is due.',
    sub: 'Every item is scheduled further out. The papers and the Panel are the better use of this session.' };

  const top = plan.groups[0];
  const others = plan.groups.length - 1;
  const lead = top.label.toLowerCase();
  const spread = others > 0
    ? `${lead}, plus ${others} other area${others === 1 ? '' : 's'}`
    : lead;

  if (hcw) return {
    title: `${hcw} item${hcw === 1 ? '' : 's'} you were sure about and got wrong.`,
    sub: `They come first this session, then ${Math.max(0, plan.total - hcw)} more across ${spread}.` };
  if (due) return {
    title: `${due} item${due === 1 ? '' : 's'} due for review.`,
    sub: `${PLAN_MIN} minutes on ${spread} — interleaved, so no cluster runs twice in a row.` };
  return {
    title: `${PLAN_MIN} minutes on ${lead}.`,
    sub: 'Nothing overdue, so this session brings new material and stretches what you already hold.' };
}

function vToday(stage) {
  const w = el('div', { class:'wrap today stg' });
  const rd = readiness(), d2i = daysToInterview(), due = dueCount();
  const hcw = S.errors.filter(e => e.conf >= 4).length;
  const started = Object.keys(S.c).length > 0;
  const hour = new Date().getHours();

  /* The headline states what this session is, drawn from the real queue. The
     greeting moves to the eyebrow: it was the largest text on the most-visited
     screen and it carried no information. */
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const date = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  const head = sessionHeadline(started, due, hcw);
  w.appendChild(pageHead(date + ' · ' + greet, head.title, head.sub, true));

  w.appendChild(launchPanel(started, due, hcw));

  if (d2i !== null) {
    const phase = d2i <= 14 ? 'Fluency phase — intervals halved, sessions weight retrieval speed and simulation.'
                : d2i <= 45 ? 'Intervals have tightened as the date approaches.'
                : 'Plenty of runway. This is the phase for building depth rather than speed.';
    const m = el('div', { class:'row', style:'margin-top:14px;gap:8px;align-items:baseline' });
    m.innerHTML = `<span class="dnum" style="font-size:15px;color:var(--accent)">${d2i}</span>
      <span class="meta"><b>days to interview.</b> ${esc(phase)}</span>`;
    w.appendChild(m);
  }

  if (started) {
    const s = section('Where you are', { act:'Full breakdown', onAct: () => go('progress') });
    const mean = Math.round((rd.research + rd.clinical + rd.professional) / 3);
    const top = el('div', { class:'row', style:'gap:20px;margin-bottom:4px;align-items:center' });
    top.appendChild(ringEl(rd.overall, 78, 8, band(rd.overall)[3], rd.overall, '', mean));
    const t = el('div', { style:'flex:1 1 auto' });
    t.innerHTML = `<div style="font-weight:600;font-size:17px;margin-bottom:3px;letter-spacing:-.024em">${band(rd.overall)[2]}</div>
      <div class="src">The faint arc is your plain average, ${mean}. Readiness sits ${rd.overall === mean ? 'level with it' : (rd.overall < mean ? 'below' : 'above') + ' it'} because it weights your weakest domain — selection filters on the weakest panel you sit, not the strongest.</div>`;
    top.appendChild(t);
    s.appendChild(top);
    const mv = recentMovement(7);
    ['research','clinical','professional'].forEach(d => s.appendChild(domainRow(d, rd[d], mv[d])));
    w.appendChild(s);
  }

  /* These two read as a pair — what you gained, and what keeps costing you —
     so at wide widths they sit beside each other rather than stacking. */
  const clusters = misconceptionClusters(3);
  if (S.wins.length || clusters.length) {
    const pair = el('div', { class:'pair' });
    if (S.wins.length) {
      const s = section('What changed', { note:'most recent first' });
      s.appendChild(plate(S.wins.slice(0, 5).map(win => {
        const node = CONCEPT[win.cid];
        return prow({ lead: dotEl(node ? node.domain : 'research'), name: win.text,
                      tail: el('span', { class:'meta', text: relTime(win.ts) }) });
      })));
      pair.appendChild(s);
    }
    if (clusters.length) {
      const s = section('Underneath your errors', { note:'mistakes that share a root' });
      s.appendChild(plate(clusters.map(cl => prow({
        lead: dotEl(cl.node.domain), name: cl.node.label,
        sub: `${Math.round(cl.n)} errors trace back here`,
        val: cl.m, onclick: () => showConcept(cl.cid) }))));
      pair.appendChild(s);
    }
    w.appendChild(pair);
  }

  const s = section('Or work on something specific');
  s.appendChild(plate(SURFACES.map(([id, nm, mk, dom, blurb, count]) => prow({
    lead: el('span', { class:'rlead', html: icon(mk) }),
    name: nm, sub: blurb, tail: el('span', { class:'meta', text: count() }),
    onclick: () => go(id) }))));
  w.appendChild(s);
  stage.appendChild(w);
}

/* The launch panel is the one thing on Today with real visual weight, and
   it shows the queue it is about to hand you rather than asserting that it
   knows best. */
function launchPanel(started, due, hcw) {
  const p = el('div', { class:'launch' });
  p.appendChild(el('div', { class:'lbl', text:'Recommended' }));
  /* The page headline already states what this session is, so the panel does
     not restate it — it shows the queue and hands over the controls. */
  p.appendChild(el('p', { style:'margin-top:6px', text: !started
    ? 'The engine watches what you get wrong and how sure you were, then stops sampling and starts targeting.'
    : 'Chosen by what is due, what you got wrong while confident, and which concepts sit lowest.' }));

  const planBox = el('div', { style:'margin-top:16px' });
  p.appendChild(planBox);

  const foot = el('div', { class:'lfoot' });
  foot.appendChild(segEl([[12,'12 min'], [25,'25 min'], [45,'45 min']], PLAN_MIN, m => {
    PLAN_MIN = m;
    drawPlan(planBox, m);
  }));
  foot.appendChild(el('div', { class:'spacer', style:'flex:1 1 auto' }));
  const start = el('button', { class:'btn pri lg', onclick: () => startDrill(PLAN_MIN) });
  start.innerHTML = `Start session <span class="arw">${icon('go', 16)}</span>`;
  foot.appendChild(start);
  p.appendChild(foot);

  drawPlan(planBox, PLAN_MIN);
  return p;
}

function drawPlan(box, minutes) {
  box.innerHTML = '';
  const plan = sessionPlan(Math.max(6, Math.round(minutes * 0.85)));
  if (!plan.total) {
    box.appendChild(el('p', { class:'src', text:'Nothing is queued right now — every item is scheduled further out. The papers and the Panel are the better use of this session.' }));
    return;
  }
  const ph = el('div', { class:'row', style:'margin-bottom:2px;gap:10px' });
  ph.innerHTML = `<span class="lbl">What it will cover</span><span class="spacer"></span>
    <span class="meta">${plan.total} items</span>`;
  box.appendChild(ph);
  plan.groups.slice(0, 4).forEach((g, i) => {
    const r = el('div', { class:'planline' });
    r.innerHTML = `<span class="n">${i + 1}</span>
      <span class="dot ${g.domain}"></span>
      <span class="pl-t">${esc(g.label)}</span>
      <span class="pl-w">${g.n} · ${esc(REASON_TEXT[g.reason])}</span>`;
    box.appendChild(r);
  });
  const rest = plan.groups.slice(4).reduce((a, g) => a + g.n, 0);
  const moreAreas = plan.groups.length - 4;
  if (rest) box.appendChild(el('div', { class:'src', style:'padding-top:8px',
    text: moreAreas === 1 ? `and ${rest} more in one further area`
                          : `and ${rest} more across ${moreAreas} further areas` }));
}
