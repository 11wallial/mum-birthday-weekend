ision and power → internal statistical conclusion validity. Composition → external validity. A trial of 2,000 self-selected, medication-free, English-speaking volunteers generalises worse than a well-sampled trial of 200.","precision":"Generalisability is a property of who was sampled, not of how many.","context":"An RCT compared a new therapy for psychosis with a treatment-as-usual (TAU) control. Quality of life (QoL) was the primary outcome, higher scores indicating better QoL. The QoL data met the necessary assumptions and were analysed using ANOVA with the factors time (pre vs post) and group (new therapy vs TAU). Mean QoL before intervention was 35 (new therapy) and 34 (TAU). After intervention the new-therapy group scored 75 and the TAU group 33.","source":"University of Surrey & Canterbury Christ Church, Selection 2016 written test, Part 1","difficulty":3,"time":60},{"id":"c_med_mod","kind":"contrast","concepts":["mediation","moderation"],"level":"discriminate","stem":"Sort each statement into the column where it belongs.","left":"Mediator (HOW / WHY)","right":"Moderator (FOR WHOM / WHEN)","probes":[{"text":"Lies on the causal pathway between X and Y","side":"L"},{"text":"Changes the strength or direction of the X–Y relationship","side":"R"},{"text":"Tested statistically as an interaction term","side":"R"},{"text":"Must be measured after X and before Y in time","side":"L"},{"text":"Rumination explains why loneliness leads to low mood","side":"L"},{"text":"Therapy works better for people with higher baseline motivation","side":"R"},{"text":"Answers: through what process does the effect occur?","side":"L"},{"text":"Answers: under what conditions does the effect hold?","side":"R"},{"text":"Is a target for intervention if you want to change the mechanism","side":"L"},{"text":"Is a basis for deciding who should be offered the intervention","side":"R"}],"teach":"The one-line discriminator: a mediator is a link in the chain, a moderator is a dial on the chain. Two consequences follow that interviewers probe. First, temporal order — a mediator must be measured between X and Y, so a cross-sectional 'mediation analysis' cannot establish mediation whatever the software reports. Second, a variable can only mediate an effect that exists, so mediation analysis presupposes the effect.","precision":"Mediator = mechanism, on the pathway. Moderator = condition, interacts with the pathway.","difficulty":3,"time":110,"context":null,"source":null},{"id":"c_rel_val","kind":"contrast","concepts":["reliability","validity"],"level":"discriminate","stem":"Sort each statement into the column where it belongs.","left":"Reliability (consistency)","right":"Validity (is it the right thing?)","probes":[{"text":"Cronbach's alpha of .89 across the items","side":"L"},{"text":"Scores correlate .81 with a diagnostic interview","side":"R"},{"text":"Two raters agree on 85% of the codings","side":"L"},{"text":"The scale predicts who is admitted within six months","side":"R"},{"text":"Test-retest correlation of .90 over two weeks","side":"L"},{"text":"The items look relevant to respondents","side":"R"},{"text":"Can be high while the measure captures the wrong construct","side":"L"},{"text":"Cannot exceed what the measure's consistency permits","side":"R"},{"text":"The items cover every facet of the construct","side":"R"}],"teach":"A bathroom scale that reads 4 kg heavy every time is perfectly reliable and invalid. The asymmetry is the examinable point: reliability is necessary but not sufficient for validity, and unreliability places a ceiling on the validity a measure can achieve. This is why a Cronbach's alpha of .40 — as in the Birmingham 2014 exercise — sinks any conclusion drawn from that measure before you even look at its scores.","precision":"Reliability is necessary but not sufficient for validity; unreliability caps validity.","difficulty":2,"time":100,"context":null,"source":null},{"id":"c_inc_prev","kind":"contrast","concepts":["incidence","prevalence"],"level":"discriminate","stem":"Sort each statement into the column where it belongs.","left":"Incidence","right":"Prevalence","probes":[{"text":"New cases arising over a defined period","side":"L"},{"text":"All existing cases at a point in time","side":"R"},{"text":"Rises if a treatment keeps people alive longer without curing them","side":"R"},{"text":"The natural output of a cohort study","side":"L"},{"text":"What a single cross-sectional survey measures","side":"R"},{"text":"Falls if a prevention programme works","side":"L"},{"text":"Approximately incidence multiplied by average duration","side":"R"},{"text":"Unaffected by how long the condition lasts","side":"L"}],"teach":"The trap is 'a rise in prevalence means more people are becoming unwell'. It may instead mean people are staying unwell for longer, or surviving longer, or being identified more. Prevalence ≈ incidence × duration. To make a claim about whether a problem is genuinely growing, you need incidence — and that requires following people over time.","precision":"Incidence = new cases per period. Prevalence = existing cases, a function of incidence and duration.","difficulty":3,"time":90,"context":null,"source":null},{"id":"c_cbt_act","kind":"contrast","concepts":["cbt_model","act","defusion"],"level":"discriminate","stem":"Sort each therapeutic move into the model it belongs to.","left":"CBT","right":"ACT","probes":[{"text":"Examine the evidence for and against the thought","side":"L"},{"text":"Notice the thought as a thought and let it be present","side":"R"},{"text":"Design an experiment to test a specific prediction","side":"L"},{"text":"Ask what happens to your life when this thought is in charge","side":"R"},{"text":"Identify the cognitive distortion in the appraisal","side":"L"},{"text":"Clarify what you want to stand for and act on it now","side":"R"},{"text":"Target the accuracy or helpfulness of the belief","side":"L"},{"text":"Target the person's relationship with the belief","side":"R"},{"text":"Build willingness to have discomfort in service of a value","side":"R"},{"text":"Drop safety behaviours so the feared outcome can disconfirm","side":"L"}],"teach":"The clean contrast: CBT asks 'is this thought accurate or helpful?'; ACT asks 'what happens when this thought runs your behaviour?'. ACT does not dispute content at all. The overlap is real though — both are behavioural, both use exposure-like procedures, and modern CBT uses behavioural experiments rather than disputation. In interview, name the shared behavioural spine and then the divergence in target, and you will be ahead of most candidates.","precision":"CBT targets the content or usefulness of cognition; ACT targets the person's relationship to it.","difficulty":3,"time":110,"context":null,"source":null},{"id":"c_cbt_sys","kind":"contrast","concepts":["cbt_model","systemic","circular_causality"],"level":"discriminate","stem":"A parent becomes increasingly protective as their child's anxiety increases. Sort each statement by the lens it comes from.","left":"CBT lens","right":"Systemic lens","probes":[{"text":"The child's threat appraisal drives avoidance","side":"L"},{"text":"Each person's response is both a reaction to and a trigger for the other's","side":"R"},{"text":"Accommodation removes opportunities for disconfirmation","side":"L"},{"text":"The pattern maintains itself with no identifiable first cause","side":"R"},{"text":"The problem is located in the child's cognitive-behavioural cycle","side":"L"},{"text":"The parent's protectiveness is meaningful given their own history and fears","side":"R"},{"text":"Intervention: graded behavioural experiments for the child","side":"L"},{"text":"Intervention: work with the interactional sequence in the room","side":"R"},{"text":"Ask who else in the wider system is invested in the child staying safe","side":"R"}],"teach":"What the systemic lens adds here is that the parent is not an obstacle to the child's treatment but a participant in a loop that makes sense from their position. What it can overlook is the specific mechanism — accommodation blocking disconfirmation — that CBT names precisely, and the individual's internal experience. Cardiff, UCL and UEA all ask for a formulation from a second, non-CBT model; this pair is the highest-frequency version of that question.","precision":"Linear causality asks what caused what; circular causality describes a self-maintaining recursive sequence.","difficulty":4,"time":120,"context":null,"source":null},{"id":"c_audit_eval_res","kind":"contrast","concepts":["service_evaluation"],"level":"discriminate","stem":"Sort each description into the right governance category.","left":"Audit / service evaluation","right":"Research","probes":[{"text":"Compares current practice against an existing standard","side":"L"},{"text":"Aims to produce generalisable new knowledge","side":"R"},{"text":"Requires NHS Research Ethics Committee review","side":"R"},{"text":"Asks how well this service is doing what it already intends to do","side":"L"},{"text":"Allocates people to conditions to test a hypothesis","side":"R"},{"text":"Uses data already collected in routine care","side":"L"},{"text":"Findings are intended to transfer beyond this service","side":"R"},{"text":"Registered through local clinical governance","side":"L"}],"teach":"This distinction is examinable because it is a real decision trainees must make. The test is intent: are you measuring against an existing standard or describing your own service (audit/evaluation), or generating knowledge intended to transfer (research)? Note that the distinction governs the governance route, not the rigour — a service evaluation should still be methodologically sound, and calling something an evaluation to avoid ethics review is a governance breach.","difficulty":3,"time":95,"context":null,"source":null,"precision":null},{"id":"c_rtm_effect","kind":"contrast","concepts":["regression_to_mean","natural_history","control_group"],"level":"discriminate","stem":"A service selects the 20 most distressed people on its waiting list, offers a workshop, and finds scores significantly improved at follow-up. Sort each statement.","left":"Explains the improvement WITHOUT the workshop working","right":"Requires the workshop to have worked","probes":[{"text":"Those selected for extreme scores regress toward the mean on retest","side":"L"},{"text":"Part of the original extremity was measurement error and transient state","side":"L"},{"text":"Many conditions remit without intervention over the same period","side":"L"},{"text":"Being offered help raised expectancy of improvement","side":"L"},{"text":"Repeated completion of the measure changes how people respond","side":"L"},{"text":"The specific skills taught produced the change","side":"R"},{"text":"The change exceeded that seen in a matched untreated comparison","side":"R"}],"teach":"Selecting on an extreme score guarantees apparent improvement — this is arithmetic, not psychology. Six of these seven alternatives are available to any uncontrolled pre-post evaluation, which is why the design cannot support a claim that the intervention worked. In interview the strong move is not to list these but to say what would settle it: a comparison group selected the same way and measured the same way.","precision":"Regression to the mean is created by selection on extremity, not by the passage of time.","difficulty":4,"time":110,"context":null,"source":null},{"id":"c_capacity_mha","kind":"contrast","concepts":["mca","mha","capacity"],"level":"discriminate","stem":"Sort each situation into the legal framework that primarily applies.","left":"Mental Capacity Act","right":"Mental Health Act","probes":[{"text":"A man with advanced dementia cannot weigh a decision about a feeding tube","side":"L"},{"text":"A woman with psychosis is detained for assessment of her mental disorder","side":"R"},{"text":"Deciding where someone who lacks capacity should live, in their best interests","side":"L"},{"text":"Treatment for mental disorder given against the wishes of a person with capacity","side":"R"},{"text":"An unwise but capacitous decision to leave hospital against advice","side":"L"},{"text":"Continuous supervision and control of a person who lacks capacity, not free to leave","side":"L"},{"text":"Section 117 aftercare following discharge from treatment detention","side":"R"}],"teach":"The dividing line: the MCA is about decision-making ability, and only engages where capacity is absent; the MHA is about detention and treatment for mental disorder, and can apply to someone who retains capacity. Two precision traps interviewers use — an unwise decision is not evidence of incapacity, and capacity is decision-specific and time-specific rather than a global status.","precision":"MCA engages on absence of capacity. MHA engages on mental disorder and risk, capacity notwithstanding.","difficulty":4,"time":105,"context":null,"source":null},{"id":"c_equity","kind":"contrast","concepts":["equity_equality","access_inequality"],"level":"discriminate","stem":"Sort each service response.","left":"Equality (same for all)","right":"Equity (according to need)","probes":[{"text":"Every referral is offered the same six-session package","side":"L"},{"text":"Interpreter time is funded so appointment length is genuinely comparable","side":"R"},{"text":"The leaflet is translated into the eight most common local languages","side":"R"},{"text":"Appointments are offered 9–5 to everyone equally","side":"L"},{"text":"Evening slots are protected for people who cannot take unpaid leave","side":"R"},{"text":"The same self-referral website is available to the whole borough","side":"L"},{"text":"Outreach clinics are placed in the two most deprived wards","side":"R"}],"teach":"The examinable line: offering an identical service to unequal starting positions preserves the inequality and calls it fairness. Every item in the left column is defensible and none is neutral in effect. The strong candidate names the mechanism — who is actually excluded by this arrangement, and what does that predict about who reaches us.","difficulty":3,"time":90,"context":null,"source":null,"precision":null},{"id":"l_1","kind":"ladder","concepts":["test_selection","ttest_paired","clinical_significance"],"level":"transfer","stem":"Your service runs an eight-week CBT group for social anxiety. Everyone completes the SPIN (a continuous symptom measure) at session one and at session eight. There is no comparison group. The service manager asks you whether the group works.","rungs":[{"q":"What is the outcome variable's type?","options":[{"id":"a","text":"Continuous","correct":true,"why":"SPIN total is a continuous score."},{"id":"b","text":"Categorical","correct":false,"why":"Not a category — it is a total score."},{"id":"c","text":"Ordinal only","correct":false,"why":"Treated as continuous by convention and by the measure's construction."}]},{"q":"How many measurement occasions, and from whom?","options":[{"id":"a","text":"Two occasions, same people","correct":true,"why":"Pre and post from each participant."},{"id":"b","text":"Two independent groups","correct":false,"why":"There is only one group here."},{"id":"c","text":"Three or more occasions","correct":false,"why":"Only session one and session eight."}]},{"q":"So are the observations independent or related?","options":[{"id":"a","text":"Related — each person contributes both scores","correct":true,"why":"This is what makes the comparison paired."},{"id":"b","text":"Independent — different scores are different data points","correct":false,"why":"The two scores come from the same person and are correlated."}]},{"q":"Which test answers 'did scores change?'","options":[{"id":"a","text":"Paired-samples t-test","correct":true,"why":"Two related measurements on a continuous outcome."},{"id":"b","text":"Independent-samples t-test","correct":false,"why":"Would treat the same people as two separate groups."},{"id":"c","text":"Repeated-measures ANOVA","correct":false,"why":"Defensible with three or more occasions; unnecessary for two."},{"id":"d","text":"Chi-square","correct":false,"why":"For categorical data."}]},{"q":"What can a significant result establish?","options":[{"id":"a","text":"That scores changed more than would be expected by chance","correct":true,"why":"That is all the design supports."},{"id":"b","text":"That the CBT group caused the improvement","correct":false,"why":"No comparator: regression to the mean, natural history and expectancy are all live."},{"id":"c","text":"That the change matters clinically","correct":false,"why":"That requires reliable change or an MCID, not a p-value."}]}],"answer":"Paired-samples t-test — with the finding reported as 'scores improved' and explicitly not as 'the group worked'.","teach":"The statistics here are the easy part; the answer that distinguishes candidates is the last rung. An uncontrolled pre-post design cannot separate the intervention from regression to the mean, natural history, expectancy or repeated testing. Say so, then say what you would add — a waiting-list comparison, a benchmarked comparison against published effect sizes, or reliable change indices at the individual level — and you have given a research-supervisor answer rather than a student one.","difficulty":2,"time":180,"context":null,"source":null,"precision":null},{"id":"l_2","kind":"ladder","concepts":["test_selection","interaction","rm_anova","itt"],"level":"transfer","stem":"A CAMHS service pilots a new parent-led anxiety intervention. Forty families are randomised to the new intervention or to the standard clinician-led pathway. Child anxiety (a continuous measure) is collected at baseline, at end of treatment, and at three-month follow-up. Six families in the new arm and two in the standard arm drop out before the end of treatment.","rungs":[{"q":"What is the primary question the design is built to answer?","options":[{"id":"a","text":"Did the two arms change differently over time?","correct":true,"why":"Randomisation to two arms with repeated measurement."},{"id":"b","text":"Did anxiety fall overall?","correct":false,"why":"True but uninformative — both arms would be expected to fall."},{"id":"c","text":"Which families improved most?","correct":false,"why":"A secondary, exploratory question."}]},{"q":"How many factors, and of what kind?","options":[{"id":"a","text":"Two: group (between-subjects) and time (within-subjects)","correct":true,"why":"A mixed design."},{"id":"b","text":"One: time","correct":false,"why":"Ignores the randomisation, which is the point of the study."},{"id":"c","text":"Two, both between-subjects","correct":false,"why":"Time is measured within the same families."}]},{"q":"Which term tests the study's actual question?","options":[{"id":"a","text":"The group × time interaction","correct":true,"why":"Differential change is always an interaction."},{"id":"b","text":"The main effect of time","correct":false,"why":"Both arms improving would produce this."},{"id":"c","text":"The main effect of group","correct":false,"why":"Could reflect a baseline imbalance."}]},{"q":"How should the eight dropouts be handled?","options":[{"id":"a","text":"Intention-to-treat, analysing families in the arm they were randomised to","correct":true,"why":"Preserves randomisation and estimates the effect of offering the intervention."},{"id":"b","text":"Analyse only families who completed","correct":false,"why":"Per-protocol: breaks randomisation and typically flatters the intervention."},{"id":"c","text":"Exclude them and note it in the limitations","correct":false,"why":"Same problem, with the bias acknowledged but not addressed."}]},{"q":"What does the differential attrition itself tell you?","options":[{"id":"a","text":"It is a finding about acceptability, not only a nuisance","correct":true,"why":"Three times the dropout in the new arm is data about whether families can tolerate it."},{"id":"b","text":"Nothing, provided the analysis is ITT","correct":false,"why":"ITT handles the estimate; it does not make the pattern uninteresting."},{"id":"c","text":"That the new intervention is ineffective","correct":false,"why":"It speaks to acceptability, not efficacy."}]}],"answer":"Mixed (2 × 3) ANOVA — or a linear mixed model, which handles missing occasions better — with the group × time interaction as the primary term, analysed by intention to treat.","teach":"Two moves lift this answer. First, naming the interaction as the test of the actual question rather than reporting main effects. Second, treating differential attrition as a finding: in a pilot, whether families can tolerate the intervention is arguably more important than the effect estimate, because a pilot exists to establish feasibility and acceptability, not efficacy. If you want the advanced version, mention that a linear mixed model uses all available data under a missing-at-random assumption rather than discarding incomplete cases.","difficulty":4,"time":240,"context":null,"source":null,"precision":null},{"id":"l_3","kind":"ladder","concepts":["test_selection","chi_square","variable_types","absolute_relative_risk"],"level":"transfer","stem":"You are evaluating whether a new opt-out booking system changes whether people attend their first appointment. You have 600 referrals from the six months before the change and 640 from the six months after. For each referral you know whether the person attended, did not attend, or cancelled in advance.","rungs":[{"q":"What kind of outcome variable is 'attended / DNA / cancelled'?","options":[{"id":"a","text":"Categorical with three unordered levels","correct":true,"why":"Nominal categories, not a quantity."},{"id":"b","text":"Ordinal","correct":false,"why":"There is no inherent rank order among these three."},{"id":"c","text":"Continuous","correct":false,"why":"It is not a measured quantity."}]},{"q":"What kind of comparison is being made?","options":[{"id":"a","text":"Two independent groups of referrals, before and after","correct":true,"why":"Different referrals in each period."},{"id":"b","text":"Paired — the same people before and after","correct":false,"why":"These are different referrals."},{"id":"c","text":"One group measured twice","correct":false,"why":"Same error."}]},{"q":"Which test fits?","options":[{"id":"a","text":"Chi-square test of association","correct":true,"why":"Categorical outcome by categorical group, independent observations."},{"id":"b","text":"Independent-samples t-test","correct":false,"why":"Requires a continuous outcome."},{"id":"c","text":"McNemar's test","correct":false,"why":"For paired categorical data — the right answer if the same people were followed."},{"id":"d","text":"Correlation","correct":false,"why":"Not a test of association between two nominal variables here."}]},{"q":"What is the main threat to concluding the system caused the change?","options":[{"id":"a","text":"Anything else that changed between the two periods","correct":true,"why":"A before-and-after design is confounded with time — staffing, season, referral criteria, publicity."},{"id":"b","text":"The sample is too small","correct":false,"why":"1,240 referrals is ample for this comparison."},{"id":"c","text":"Chi-square is not powerful enough","correct":false,"why":"Power is not the limiting issue here."}]},{"q":"Beyond significance, what should you report?","options":[{"id":"a","text":"The absolute difference in attendance rates, and what it means in appointments","correct":true,"why":"Absolute change drives service relevance and is what a manager can act on."},{"id":"b","text":"Only the p-value","correct":false,"why":"With 1,240 referrals, trivial differences reach significance."},{"id":"c","text":"The relative risk alone","correct":false,"why":"Relative figures can look dramatic on a small base rate."}]}],"answer":"Chi-square test of association, reported with absolute attendance rates and the difference in appointments per year — and framed as a service evaluation with a time-confounded design, not a trial.","teach":"Notice what makes this an interview answer rather than a statistics answer: the design is a before-and-after comparison, so the intervention is completely confounded with time. Everything else that changed in those six months rides along with the result. Say that, propose what would strengthen it — a stepped-wedge rollout across teams, or an interrupted time series with multiple pre-change data points — and translate the effect into appointments recovered per year, because that is the currency in which the finding will be used.","difficulty":4,"time":240,"context":null,"source":null,"precision":null},{"id":"l_4","kind":"ladder","concepts":["qualitative_designs","epistemology","saturation","reflexivity"],"level":"transfer","stem":"You want to understand why young Black men in your locality disengage from the early intervention in psychosis service after one or two appointments. Routine data show the differential clearly; nobody knows why.","rungs":[{"q":"What kind of question is this?","options":[{"id":"a","text":"Exploratory — about meaning and experience","correct":true,"why":"The 'why' here concerns how disengagement is experienced and made sense of."},{"id":"b","text":"Confirmatory — testing a stated hypothesis","correct":false,"why":"No candidate mechanism is specified."},{"id":"c","text":"Descriptive — how many disengage","correct":false,"why":"Already known from routine data."}]},{"q":"Which methodology fits best?","options":[{"id":"a","text":"Reflexive thematic analysis across accounts","correct":true,"why":"Patterns of meaning across a group, allowing a diverse sample and a service-relevant output."},{"id":"b","text":"IPA","correct":false,"why":"Defensible, but IPA requires a homogeneous sample and yields idiographic depth rather than service-level patterns."},{"id":"c","text":"Grounded theory","correct":false,"why":"Appropriate only if you intend to generate a theory with theoretical sampling to saturation."},{"id":"d","text":"A survey with open comment boxes","correct":false,"why":"Will not reach the accounts of people who have already left."}]},{"q":"What epistemological position should you state?","options":[{"id":"a","text":"Critical realist — real experiences and real structures, accessed through interpretation","correct":true,"why":"Coherent with claiming that racism has real effects while treating accounts as interpreted."},{"id":"b","text":"Naive realist — the interviews reveal the truth directly","correct":false,"why":"Incoherent with interpretative analysis."},{"id":"c","text":"Radical constructionist","correct":false,"why":"Defensible, but sits awkwardly with making service recommendations about real differentials."}]},{"q":"What is the most serious threat to the credibility of this study?","options":[{"id":"a","text":"Who conducts the interviews, and the power relations in the encounter","correct":true,"why":"A service clinician asking why people left the service will get a curated answer."},{"id":"b","text":"The sample size","correct":false,"why":"Qualitative adequacy is about richness and information power, not n."},{"id":"c","text":"Lack of a control group","correct":false,"why":"Not a relevant concept for this design."}]},{"q":"How should reflexivity be handled?","options":[{"id":"a","text":"Documented systematically — positionality, reflexive journal, team discussion of interpretations","correct":true,"why":"Evidenced, not declared."},{"id":"b","text":"A sentence in the limitations acknowledging the researcher's background","correct":false,"why":"The most common weak version."},{"id":"c","text":"By the researcher striving to be objective","correct":false,"why":"Incoherent with a qualitative epistemology."}]}],"answer":"Reflexive thematic analysis from a critical realist position, with peer or community interviewers, purposive sampling for information power, a documented reflexive process, and co-production with people who have used the service.","teach":"The examinable insight is that the method is not the hard part — the power relations in data collection are. If the service asks people why they left the service, the design has built the answer into the encounter. Proposing peer researchers or community-based interviewers, and co-producing the topic guide, shows you understand that qualitative rigour is about the conditions of production, not just the analysis. Note too that 'saturation' is a grounded theory concept that sits uneasily in reflexive TA — using it loosely is a precision error interviewers notice.","difficulty":5,"time":270,"context":null,"source":null,"precision":null}]},"written":{"version":1,"exercises":[{"id":"birm2014","title":"Mindfulness for Crohn's Disease","course":"Birmingham","year":2014,"minutes":60,"totalMarks":44,"provenance":"Transcribed from the Birmingham ClinPsyD written exercise 2014, supplied WITH ITS OFFICIAL MARKING SCHEME. Every rubric point below is a marker's bullet with its official weighting.","brief":"You have the study description and results tables below. Answer all six questions. Marks are unequal — questions 5 and 3 carry the most.","stimulus":[{"t":"h","v":"Mindfulness Group Intervention for people with Crohn's Disease: a pilot study"},{"t":"p","v":"Crohn's disease is a long-term condition, affecting all age groups, that causes inflammation of the lining of the digestive system. Inflammation can affect any part of the digestive system, and common symptoms include: diarrhoea; severe abdominal pain; fatigue; unintended weight loss; blood and mucus in the stools."},{"t":"p","v":"People with Crohn's disease can go for long periods without symptoms, or with very mild symptoms. This is known as remission. However, remission can be followed by periods where symptoms flare up. The condition is managed by changes to the diet, including eating a low fibre diet, although this is not helpful for all people with the condition. Medication, such as steroids, is often prescribed during a flare up, and surgery to remove damaged parts of the gut is common. The cyclical nature of the disease and the potential severity of symptoms mean that for some, managing the condition can be challenging."},{"t":"p","v":"Gastroenterologists recognise the psychosocial implications of Crohn's Disease and have been working with clinical psychologists to develop a group intervention for adults struggling to manage the condition. In a recent study, a group intervention was developed based on the principles of Mindfulness (e.g. Kabat-Zinn, 1990), which included 6 sessions lasting 90 minutes each, over 12 weeks. It covered psycho-education, breathing, meditation, mindful activity and using mindfulness to cope with negative experiences."},{"t":"p","v":"Adult patients with severe Crohn's disease were assigned to either a mindfulness group (MFG; N = 24) or a “treatment as usual” condition (TAU; N = 24). Patients attending the group were assessed before the group commenced (time 1) and at the end of the 6 sessions (time 2). The TAU patients were assessed on the same measures at similar time points."},{"t":"p","v":"Mindfulness was measured using the Mindful Attention Awareness Scale (MAAS); mood was measured using the Depression, Anxiety & Stress Scale (DASS); and quality of life was measured using the newly developed Crohn's Disease Questionnaire (CrDQ; Howard 2014). The CrDQ was adapted for this study from the existing Coeliac Disease Questionnaire (CDQ; Hauser et al., 2007). As the CrDQ was a new measure, the researchers explored this for internal reliability using Cronbach's alpha."},{"t":"table","caption":"Table 1 — Cronbach's alpha for each measure","head":["Measure","α"],"rows":[["DASS",".87"],["MAAS",".85"],["CrDQ",".40"]]},{"t":"table","caption":"Table 2 — Mean scores and t values for DASS, Mindfulness Group","head":["","Time 1 (n=24)","Time 2 (n=15)","t1 vs t2"],"rows":[["Depression","3.33","3.85","t = 4.78"],["Anxiety","4.05","2.45","t = 6.19*"],["Stress","4.63","2.12","t = 5.59*"],["Total","12.01","8.42","t = 5.75**"]],"note":"Higher scores indicate poorer well-being; * p<0.05; ** p<0.01"},{"t":"table","caption":"Table 3 — Mean scores and t values for DASS, TAU condition","head":["","Time 1 (n=24)","Time 2 (n=20)","t1 vs t2"],"rows":[["Depression","4.52","4.72","t = 4.41"],["Anxiety","5.63","3.15","t = 6.69*"],["Stress","5.86","6.33","t = 4.24"],["Total","16.01","14.2","t = 5.16"]],"note":"Higher scores indicate poorer well-being; * p<0.05; ** p<0.01"},{"t":"table","caption":"Table 4 — Mean scores for all measures, and t values comparing groups at each time point","head":["","T1 MFG","T1 TAU","t","T2 MFG","T2 TAU","t"],"rows":[["n","24","24","","15","20",""],["DASS total","12.01","16.01","6.19**","8.42","14.20","5.68*"],["MAAS total","2.34","2.03","8.50","8.23","3.00","7.54**"],["CrDQ total","13.71","15.02","5.56","14.50","16.50","4.97"]],"note":"MAAS: higher = better mindfulness & self-compassion. CrDQ: higher = better quality of life. * p<0.05; ** p<0.01"}],"questions":[{"id":"q1","marks":7,"prompt":"From the information provided about Crohn's Disease, what do you think the main psychosocial issues are for people with Crohn's Disease, and how might people feel as a result of this diagnosis and its management?","guidance":"The marking scheme is explicit: a list of practical considerations scores nothing. Each point must connect a feature of the condition to a psychosocial consequence AND to how the person might feel.","rubric":[{"id":"r1","text":"Diagnosis of a long-term condition → issues around acceptance and self-esteem","weight":1,"cues":["long[- ]?term|chronic|lifelong|life.?long","accept|adjust|identity|self.?esteem|self.?worth"],"tier":"core"},{"id":"r2","text":"Unpredictability / cyclical nature → loss of control, anxiety (especially social), low mood, anger, frustration","weight":1,"cues":["unpredictab|cyclical|flare|uncertain|fluctuat","control|anxiet|anxious|frustrat|anger|helpless|hypervigil"],"tier":"core"},{"id":"r3","text":"Dietary self-management → social anxiety away from home, avoidance of eating out, loss of social life, temptation and loss of control","weight":1,"cues":["diet|food|eating|low fibre|meal","social|eat(ing)? out|restaurant|isolat|avoid"],"tier":"core"},{"id":"r4","text":"Medication / steroid side effects → weight gain, body image, self-esteem; non-adherence → poorer symptom control","weight":1,"cues":["steroid|medication|drug","side.?effect|weight gain|body image|appearance|adherence|complian"],"tier":"core"},{"id":"r5","text":"Impact on work and home life → loss of roles, reduced quality of life, effect on mood and self-esteem","weight":1,"cues":["work|employ|job|home life|role","loss|role|quality of life|identity|financ|mood"],"tier":"core"},{"id":"r6","text":"Managing unpleasant symptoms (e.g. proximity to a toilet) → anxiety away from home, avoidance, social isolation","weight":1,"cues":["toilet|incontinen|diarrhoea|urgency|accident","anxiet|avoid|isolat|embarrass|shame|humiliat"],"tier":"core"},{"id":"r7","text":"Poor pain control → low mood, inability to work or exercise, further low mood, weight gain, poor self-esteem","weight":1,"cues":["pain|fatigue|tired","mood|depress|exercise|activity|withdraw"],"tier":"core"}],"traps":[{"cues":["^(?![\\s\\S]*(feel|felt|emotion|mood|anxiet|shame|anger|frustrat|distress|embarrass))"],"msg":"The scheme requires you to say how the person might FEEL. Points that name only a practical consequence do not score."},{"cues":["\\bdiagnos(is|e)d? with (depression|anxiety)\\b"],"msg":"Careful — the question asks about psychosocial issues and feelings, not about assigning a psychiatric diagnosis."}],"model":"Crohn's is a long-term, relapsing condition, so the first psychosocial task is one of adjustment: people face an identity shift from healthy to chronically ill, which commonly threatens self-esteem and provokes grief for a previous self. Because remission and flare-up alternate unpredictably, people cannot plan; that unpredictability tends to generate a sense of lost control, anticipatory anxiety and frustration, and for some a hypervigilance to bodily sensation that amplifies distress. Dietary management adds a social dimension: restricting food makes eating out and shared meals difficult, so people may begin to avoid social occasions, with consequent isolation and low mood, alongside the frustration of watching others eat freely and the guilt that follows breaking the diet. Steroid treatment carries visible side effects such as weight gain and changes in appearance, which can affect body image and self-esteem, and may lead some people to take medication inconsistently and so lose symptom control. Symptoms themselves are stigmatising and hard to talk about; needing to be near a toilet generates anxiety away from home, embarrassment and shame, and avoidance of work, travel and social contact. Pain and fatigue limit activity and employment, which removes valued roles and reinforces low mood, and for some raises financial worry. Across all of these, the common emotional threads are anxiety, shame and embarrassment, anger and frustration at the unpredictability, and low mood arising from cumulative loss of role and social contact."},{"id":"q2","marks":8,"prompt":"From the data and statistical analysis available, what can you conclude about any changes WITHIN groups?","guidance":"Read Tables 2 and 3 only. Within-group means: time 1 compared with time 2, inside each condition separately. Note which t values carry asterisks.","rubric":[{"id":"r1","text":"MF group: significant improvement in anxiety","weight":1,"cues":["(mindful|mfg|mf group|intervention group)[\\s\\S]{0,160}anxiet|anxiet[\\s\\S]{0,80}(significan|improv)"],"tier":"core"},{"id":"r2","text":"MF group: significant improvement in stress","weight":1,"cues":["stress[\\s\\S]{0,80}(significan|improv|reduc|fell|decreas)"],"tier":"core"},{"id":"r3","text":"MF group: significant improvement in overall DASS total","weight":1,"cues":["(total|overall)[\\s\\S]{0,80}(significan|improv|reduc)"],"tier":"core"},{"id":"r4","text":"MF group: NO significant change in depression","weight":1,"cues":["depress[\\s\\S]{0,90}(no |not |non.?signif|did not|unchanged|failed)"],"tier":"core"},{"id":"r5","text":"Attrition in MF group: 24 → 15, so 9 dropped out; OR attrition much higher in MFG than TAU; OR the resulting bias (any one such comment scores the single point)","weight":1,"cues":["(24|twenty.?four)[\\s\\S]{0,40}(15|fifteen)","\\b9\\b[\\s\\S]{0,40}(drop|withdrew|left|lost)","attrit","drop.?out|dropped out"],"tier":"core"},{"id":"r6","text":"TAU group: significant improvement in anxiety","weight":1,"cues":["(tau|treatment as usual|control)[\\s\\S]{0,160}anxiet"],"tier":"core"},{"id":"r7","text":"TAU group: no significant change in depression or stress","weight":1,"cues":["(tau|control)[\\s\\S]{0,200}(depress|stress)[\\s\\S]{0,80}(no |not |non.?signif|unchanged)"],"tier":"core"},{"id":"r8","text":"TAU group: no significant change in DASS total; and TAU attrition 24 → 20 (4 lost), with possible bias","weight":1,"cues":["(20|twenty)[\\s\\S]{0,40}(tau|control)","\\b4\\b[\\s\\S]{0,40}(drop|lost|withdrew)","(tau|control)[\\s\\S]{0,120}(total)[\\s\\S]{0,60}(no|not|non.?signif)"],"tier":"core"}],"traps":[{"cues":["between (the )?groups?|compared (the |to )?tau (with|to|and) (the )?mindful"],"msg":"This question is about WITHIN-group change only. Between-group comparison is question 3 — material placed under the wrong question is not credited."},{"cues":["\\bproves?\\b|\\bshows? that mindfulness works\\b|\\bcaused\\b"],"msg":"Overclaiming. Within-group change in an uncontrolled comparison cannot establish that the intervention caused anything."}],"model":"Within the mindfulness group, anxiety and stress both improved significantly between time 1 and time 2, as did the DASS total score, but depression did not change significantly — indeed the depression mean rose slightly, from 3.33 to 3.85. Within the TAU condition, anxiety also improved significantly, while depression, stress and the DASS total did not. Two observations qualify all of this. First, the means are computed on different numbers of people at each time point: the mindfulness group falls from 24 to 15, so nine participants are unaccounted for, while TAU falls only from 24 to 20. The attrition is therefore both substantial and markedly unequal across conditions. Second, that pattern makes the within-group figures difficult to interpret, because the 15 people contributing to the time 2 mean are not the same sample as the 24 who contributed at time 1. Those who left may have been faring worse and found the intervention too demanding, in which case the apparent improvement is partly a selection artefact; alternatively they may have improved quickly and stopped attending, which would understate the benefit. Either way, the time 2 mean describes a self-selected subgroup, and the improvement in anxiety seen in both arms should also caution us that change over time here is not specific to mindfulness."},{"id":"q3","marks":7,"prompt":"From the data and statistical analysis available, what can you conclude about any differences BETWEEN groups?","guidance":"Table 4. Look at baseline as well as follow-up — the marking scheme rewards noticing what was already true before the intervention began.","rubric":[{"id":"r1","text":"Caution in interpreting between-group differences because the study is under-powered, which can inflate sample means","weight":1,"cues":["under.?power|small sample|insufficient(ly)? power|lack of power|low power|not powered"],"tier":"core"},{"id":"r2","text":"The groups already differed on DASS total at time 1 — TAU were more symptomatic / the intervention was given to a less symptomatic group (one point only, even if both stated)","weight":1,"cues":["(baseline|time 1|t1|outset|start)[\\s\\S]{0,140}(differ|not (equivalent|comparable|matched)|higher|worse|more (symptomatic|distress|stress))","(12\\.01|16\\.01)[\\s\\S]{0,60}(differ|higher|baseline)"],"tier":"core"},{"id":"r3","text":"TAU showed more depression than the MF group at time 2","weight":1,"cues":["(time 2|t2|post|follow.?up)[\\s\\S]{0,140}depress"],"tier":"core"},{"id":"r4","text":"Both groups decreased in DASS symptom severity, but significantly so only for the mindfulness group","weight":1,"cues":["both (groups?|arms?|conditions?)[\\s\\S]{0,120}(decreas|reduc|improv|fell)"],"tier":"core"},{"id":"r5","text":"The groups were comparable at baseline on the other two measures (MAAS and CrDQ)","weight":1,"cues":["(maas|craq|crdq|mindfulness (score|measure)|quality of life)[\\s\\S]{0,120}(comparable|no (significant )?difference|similar|equivalent)[\\s\\S]{0,60}(baseline|time 1|t1)","(baseline|time 1|t1)[\\s\\S]{0,120}(maas|crdq)[\\s\\S]{0,80}(comparable|no (significant )?difference|similar)"],"tier":"core"},{"id":"r6","text":"The MF group showed greater mindfulness than TAU at time 2","weight":1,"cues":["(maas|mindfulness)[\\s\\S]{0,140}(time 2|t2|post|greater|higher|increas)"],"tier":"core"},{"id":"r7","text":"There was no difference between groups on quality of life at time 2","weight":1,"cues":["(quality of life|crdq|qol)[\\s\\S]{0,140}(no (significant )?difference|not signif|unchanged|no effect)"],"tier":"core"}],"traps":[{"cues":["randomis|randomiz"],"msg":"The stimulus says patients were 'assigned' — it never says randomly. Assuming randomisation is the error that makes the baseline difference invisible to you."}],"model":"The first thing to establish is that the groups were not equivalent at the outset. On DASS total the TAU group scored 16.01 against the mindfulness group's 12.01, a significant difference at time 1, so the intervention was delivered to a group that was already less symptomatic. Since the paper says patients were 'assigned' rather than randomly allocated, this baseline imbalance may be systematic. On the other two measures, MAAS and CrDQ, the groups were comparable at baseline. At time 2 the mindfulness group scored lower on DASS total and specifically showed less depression than TAU, and showed significantly greater mindfulness on the MAAS. There was no significant between-group difference in quality of life at time 2. Both groups decreased in symptom severity over the period, but the decrease reached significance only in the mindfulness condition. All of these comparisons must be read cautiously, because with 15 and 20 participants at follow-up the study is clearly under-powered, and among under-powered comparisons those that do reach significance systematically overstate the size of the effect. Taken together, a difference at time 2 between two groups that already differed at time 1, in a small sample with unequal attrition, cannot be attributed to the intervention."},{"id":"q4","marks":6,"prompt":"Now summarise the main conclusions from the study. What do the results tell us about the mindfulness intervention?","guidance":"The marking note is unusually direct: 'We can't really conclude very much from the data about the usefulness of the Mindfulness group, so award points when the candidate demonstrates that they understand this point.'","rubric":[{"id":"r1","text":"The improvement in MAAS scores suggests the group did succeed in teaching mindfulness","weight":1,"cues":["(maas|mindfulness (score|increas|improv))[\\s\\S]{0,140}(learn|taught|acquir|did increase|improved|suggests? the (group|intervention))"],"tier":"core"},{"id":"r2","text":"The high attrition rate suggests the intervention may not be well suited to everyone with Crohn's disease","weight":1,"cues":["attrit|drop.?out","(not (well )?suited|acceptab|toleran|suit(able)? for (all|everyone)|may not suit)"],"tier":"core"},{"id":"r3","text":"Although MFG appeared to do better on mood, the apparent improvement could simply reflect the different baseline scores","weight":1,"cues":["baseline|time 1|t1|started (lower|less)","(could|may|might) (simply |just )?(be|reflect|be because|be due)"],"tier":"core"},{"id":"r4","text":"Any improvement must be read in the context of attrition bias — those who left may have been unsuited and unimproved; fewer left TAU, suggesting TAU may be more acceptable","weight":1,"cues":["(bias|those who (dropped|left)|selection)[\\s\\S]{0,200}(improv|unsuit|worse)","tau[\\s\\S]{0,120}(more acceptab|better tolerated|fewer (drop|left))"],"tier":"advanced"},{"id":"r5","text":"Neither condition affected quality of life — but this may be because the CrDQ has poor internal reliability (α = .40), so the measure cannot be trusted (half marks if the reliability point is omitted)","weight":1,"cues":[["quality of life|crdq","\\.40|alpha|reliab"]],"tier":"core"},{"id":"r6","text":"We cannot say anything with certainty about the relationship between mindfulness, mood and quality of life","weight":1,"cues":["cannot (say|conclude|be certain)|no firm conclusion|little can be concluded|tentative|cautious"],"tier":"core"}],"traps":[{"cues":["the (intervention|group|mindfulness) (was |is )?(effective|works|helped)(?![\\s\\S]{0,80}(cannot|but|however|caution))"],"msg":"The marking note warns explicitly against this. Concluding the intervention worked is the single most costly error on this question."}],"model":"The clearest finding is that the group succeeded in teaching what it set out to teach: MAAS scores rose in the mindfulness condition and were significantly higher than TAU at time 2, so participants did become more mindful. Beyond that, very little can be concluded. The mindfulness group appeared to do better on mood, but they also began less symptomatic than TAU, so the time 2 difference may simply carry forward the time 1 difference. Nine of 24 participants left the mindfulness group, against four of 24 in TAU, which is itself a finding: it suggests the intervention may not be acceptable or suitable for everyone with Crohn's disease, and that TAU was better tolerated. It also means any apparent benefit is confounded with who chose to stay, since those who left may have been the people least suited to and least helped by the approach. Neither condition showed an effect on quality of life, but that null result cannot be interpreted, because the CrDQ has a Cronbach's alpha of .40 — well below acceptable — so the measure lacks the internal reliability required to detect change at all. Overall, this is a pilot that establishes the intervention can be delivered and does teach mindfulness, while telling us almost nothing reliable about whether it improves mood or quality of life."},{"id":"q5","marks":11,"prompt":"Bearing in mind this pilot study has a number of weaknesses, how would you build on this if you could design a follow-on study?","guidance":"The marking note is explicit: a list of weaknesses scores nothing. Each point requires a SOLUTION, with the limitation stated or clearly implied by the solution.","rubric":[{"id":"r1","text":"No control for non-specific factors — add an appropriate placebo / active comparator","weight":1,"cues":[["(control|comparator|placebo|active|attention.?matched|befriend)","(add|include|use|introduc|employ)"]],"tier":"core"},{"id":"r2","text":"A qualitative study to understand acceptability of the intervention and adjust the protocol (only credited with a rationale)","weight":1,"cues":[["qualitative|interview|focus group","acceptab|experience|why|understand|adjust|protocol"]],"tier":"core"},{"id":"r3","text":"Acknowledge attrition at each stage, or address recruitment and use an appropriate analysis for missing data","weight":1,"cues":["missing data|imputation|multiple imputation|intention.?to.?treat|itt|consort|flow (diagram|chart)|account for (drop|attrition)"],"tier":"core"},{"id":"r4","text":"Recognise this is essentially a feasibility study — a larger definitive trial would use intention-to-treat analysis","weight":1,"cues":["feasibilit|definitive trial|fully powered|full trial|scale up|larger (rct|trial)"],"tier":"core"},{"id":"r5","text":"Recruit a larger sample","weight":1,"cues":["larger sample|bigger sample|increase (the )?sample|more participants|power calculation|a priori power"],"tier":"core"},{"id":"r6","text":"Randomly allocate, so that groups should not differ at baseline","weight":1,"cues":[["random(ly|is|iz)","(allocat|assign|group|baseline)"]],"tier":"core"},{"id":"r7","text":"In a larger study, monitor and measure treatment fidelity","weight":1,"cues":["fidelit|adherence to (the )?protocol|treatment integrity|manualis|supervis(ion|ed) of (the )?(therapist|facilitator)"],"tier":"core"},{"id":"r8","text":"No measure of Crohn's severity — measure it to ensure groups are matched","weight":1,"cues":[["severit|disease activity|symptom (level|burden)|flare|medical","match|measur|control|stratif|baseline"]],"tier":"core"},{"id":"r9","text":"The CrDQ has low α — find a more suitable QoL measure, or validate it further in another pilot","weight":1,"cues":[["crdq|quality of life measure|qol measure|\\.40|reliab","(different|another|alternative|better|validated|psychometric|validate|develop)"]],"tier":"core"},{"id":"r10","text":"No follow-up — add one to establish whether improvements are maintained","weight":1,"cues":["follow.?up|maintenance|maintained|longer.?term|3.month|6.month|durability"],"tier":"core"},{"id":"r11","text":"Blind outcome assessment — separate the people collecting the data from those running the group","weight":1,"cues":["blind|independent assessor|separate (the )?(researcher|assessor|data collect)|masked"],"tier":"core"}],"traps":[{"cues":["^(?![\\s\\S]*(would|could|should|add|include|use|recruit|random|measur|blind|follow))"],"msg":"The marker is instructed not to credit limitations without solutions. Every point needs a 'so I would…'."}],"model":"I would design a definitive randomised controlled trial, treating this study as the feasibility work it effectively is. Because the current design cannot separate mindfulness from attention, time and expectancy, I would add an active comparator matched for contact time and credibility — a structured support group, for instance — rather than TAU alone. Participants would be randomly allocated, which should remove the baseline imbalance in DASS scores that makes the present findings uninterpretable, and I would stratify on disease severity, which this study did not measure at all; without it we cannot know that the groups were comparable on the thing most likely to drive both mood and quality of life. Sample size would be set by an a priori power calculation based on the smallest difference that would matter clinically, with inflation for the attrition rate observed here. Given that nine of 24 participants left the mindfulness arm, I would first run a qualitative study of acceptability — interviewing both completers and, importantly, those who withdrew — so that the protocol could be adapted before scaling, since a trial of an intervention people will not attend answers the wrong question. In the trial itself, attrition would be reported at every stage on a CONSORT flow diagram, the primary analysis would be intention-to-treat, and missing data would be handled by multiple imputation rather than by dropping cases. Treatment fidelity would be monitored through recorded sessions rated against a manual. The CrDQ should not be used as it stands with an alpha of .40; I would either select an already-validated quality of life measure for inflammatory bowel disease or complete proper psychometric development of the CrDQ first. Outcome assessment would be conducted by researchers blind to allocation and independent of the people facilitating the groups. Finally, I would add follow-up at three and six months, because a pilot that measures only at the end of treatment cannot tell us whether anything is maintained."},{"id":"q6","marks":5,"prompt":"What are the main ethical issues arising from the current study, or from a future improved study?","guidance":"The marking note is emphatic: generic answers such as anonymising data or obtaining ethics approval score nothing. Only issues specific to THIS study are credited.","rubric":[{"id":"r1","text":"Allocating people to a placebo or control condition may deprive them of a needed intervention","weight":1,"cues":[["placebo|control (group|condition|arm)|waiting.?list|randomis","deprive|withhold|denied|not receiv|miss out"]],"tier":"core"},{"id":"r2","text":"What if people are already receiving an intervention — do you stop it, or recruit only newly diagnosed people?","weight":1,"cues":[["already (receiving|having|in)|existing (treatment|therapy)|concurrent|newly diagnosed","stop|withdraw|exclud|recruit"]],"tier":"core"},{"id":"r3","text":"What if someone in the placebo group deteriorates — do you withdraw them, and at what point?","weight":1,"cues":[["deteriorat|worsen|gets worse|decline","withdraw|remove|stopping rule|criteria|take them out"]],"tier":"core"},{"id":"r4","text":"The measures themselves could cause distress","weight":1,"cues":[["measure|questionnaire|dass|assessment|item","distress|upset|burden|intrusive|discomfort"]],"tier":"core"},{"id":"r5","text":"Participants may be depressed and therefore at risk of suicidal ideation — this needs assessing, with support offered","weight":1,"cues":[["suicid|risk|self.?harm|safeguard","assess|protocol|support|refer|pathway"]],"tier":"core"}],"traps":[{"cues":["anonymis|anonymiz|confidentialit|data protection|gdpr|store(d)? securely|ethics (committee |board )?approval|informed consent form"],"msg":"The marking note names these explicitly as non-scoring. They apply to any study — the question asks what is ethically particular about THIS one."}],"model":"The ethical issues specific to this design begin with the comparator. If a future trial randomises people to a placebo or attention control, some will be knowingly allocated to a condition expected to be inert while they are struggling to manage a painful, unpredictable illness — which requires justification through genuine equipoise, and a clear offer of the intervention at the end of the trial. Related to this, many people with severe Crohn's will already be receiving psychological or psychiatric input; asking them to stop in order to enter a trial is not acceptable, so the protocol has to decide between recruiting only newly diagnosed or currently untreated participants, at some cost to generalisability, and permitting concurrent treatment and measuring it. There must also be a pre-specified rule for what happens if a participant in the control condition deteriorates — what threshold triggers withdrawal from the study and referral into care, and who monitors it — because without one that judgement falls to whoever notices. The measures themselves carry burden: the DASS asks directly about hopelessness and low mood, and completing it repeatedly can be distressing for someone whose illness is flaring. Since the sample is selected for difficulty coping with a chronic condition, a meaningful proportion may experience suicidal thoughts, so there needs to be a risk protocol specifying how responses are reviewed, by whom, within what timeframe, and what the route to support is — not simply a debrief sheet."}],"debrief":"Two structural lessons carry beyond this paper. First, the marking scheme awards points for CONSEQUENCES, not observations: on Q1 a psychosocial issue only scores when linked to a feeling, and on Q5 a limitation only scores when paired with a solution. Second, the study is designed so that the correct overall answer is 'we cannot conclude much' — and the markers are told to reward candidates who see this. Under time pressure the instinct is to find something positive to say about the intervention. Resisting that instinct is what the exercise is testing."},{"id":"birm2018","title":"Intensive Interaction in profound learning disability","course":"Birmingham","year":2018,"minutes":60,"totalMarks":24,"provenance":"Real Birmingham pre-selection written test, 2018 intake. The questions and instructions are verbatim. No official marking scheme was supplied with this paper, so the rubric points below are reconstructed from the question wording and its explicit marking instructions — treat them as a strong guide rather than the marker's own list.","brief":"Answer all four questions. The paper's own instructions apply: write in full sentences, not notes; marks are capped at the number of issues requested, so more issues will not earn more marks; and you are marked on written presentation as well as content.","stimulus":[{"t":"h","v":"Intensive Interaction for people with profound learning disability"},{"t":"p","v":"Intensive Interaction is a therapeutic approach for promoting social interaction in individuals with severe communication impairments. The therapist or carer observes what the person is doing, tries to understand the focus and motivation of the behaviour, and then 'joins in' by using the same movements, vocalisations and direction of eye gaze. The approach is inspired by observational research on parent-baby interactions. Matching the behaviours is thought to enable the person to recognise the therapist's behaviour as a response to their own, laying the foundation for mutual interaction."},{"t":"p","v":"Mainwaring and Wilson (2015) evaluated Intensive Interaction with 10 individuals with profound learning disability and no apparent language ability, attending an adult day centre. The purpose and nature of the research was explained to staff in an oral presentation. Staff were asked at the end of the meeting to nominate suitable people to take part, and to sign a form indicating that they consented to the participation of the person they had nominated."},{"t":"p","v":"The intervention consisted of a single 30-minute session with each participant. One of the researchers spent the first 5 minutes observing the participant, then over the next 25 minutes remained within 1 metre of the participant and within their field of vision, implementing Intensive Interaction. Videos were made of the sessions. One of the researchers coded participant behaviour: eye gaze (at the communication partner or away); bodily orientation (towards the partner or away); emotional valence (negative or positive; neutral was not coded). For each variable the percentage of time in a 5-minute period was calculated."},{"t":"p","v":"To evaluate effectiveness, time spent in the first 5 minutes was compared with the last 5 minutes, and for each participant and variable it was determined whether there was an increase in social interaction, or whether time spent was the same or had declined. A general z-test was used to calculate whether the percentage of participants showing an increase was significantly above chance. It was assumed 50% would show an increase by chance, and alpha was set at .05. Someone not otherwise involved coded 10% of the videos: Cohen's kappa was 0.64 for eye gaze, 0.59 for body orientation and 0.32 for emotional valence."},{"t":"table","caption":"Table 1 — Patterns of change between the first and last 5 minutes","head":["Variable","Increase","Decrease or no change","z and p (two-tailed)"],"rows":[["Eye gaze","9","0","z = 2.530; p = .020"],["Bodily orientation","8","1","z = 1.897; p = .056"],["Emotional valence","6","4","z = 0.632; p = .527"]]}],"questions":[{"id":"q1","marks":6,"prompt":"What do you think were the methodological limitations of the study? In your answer, (a) state what the limitation is and (b) explain why it creates difficulties in drawing conclusions. Confine your answer to the THREE issues you consider most relevant.","guidance":"The paper states you get fewer marks for stating a limitation without explaining how it limits conclusions, that marks are capped at three issues, and that comments on the value or rationale of the therapy itself score nothing.","rubric":[{"id":"r1","text":"No control condition — change over 30 minutes cannot be separated from the effects of any adult's sustained one-to-one attention, or from habituation to the researcher's presence","weight":3,"cues":[["(no|lack of|absence of|without)[\\s\\S]{0,40}(control|comparison|comparator)","attention|presence|any (adult|person)|non.?specific|habituat|settl"]],"tier":"core"},{"id":"r2","text":"The person delivering the intervention also coded the outcome — unblinded assessment by an invested researcher creates detection bias","weight":3,"cues":[["(same|one of the) researcher[\\s\\S]{0,80}(cod|rat|assess)|coded by (the|one)|not blind|unblind|blind","bias|invest|expect|influenc|objectiv"]],"tier":"core"},{"id":"r3","text":"Only 10% of videos were double-coded, and kappa for emotional valence was 0.32 — poor agreement means that variable is not reliably measured, so its null result is uninterpretable","weight":3,"cues":[["kappa|inter.?rater|0?\\.32|10%|reliab","poor|low|unreliab|uninterpret|cannot (trust|interpret)|weak"]],"tier":"core"},{"id":"r4","text":"A single 30-minute session with no follow-up — within-session change says nothing about durable learning or generalisation beyond the researcher","weight":3,"cues":[["single session|one session|30.?minute|no follow.?up|only one","generalis|generaliz|maintain|durab|lasting|beyond|transfer"]],"tier":"core"},{"id":"r5","text":"Sample of 10, recruited by staff nomination from one day centre — selection is non-random and the sample is unrepresentative","weight":3,"cues":[["(nominat|staff (chose|selected)|one (day )?centre|sample of (10|ten)|small sample)","select(ion)? bias|represent|generalis|not random|skew"]],"tier":"core"},{"id":"r6","text":"Dichotomising continuous percentage-of-time data into 'increase' vs 'no increase' discards magnitude and statistical power","weight":3,"cues":[["dichotom|binary|increase (or|vs)|categoris|reduc(ing|ed) (the )?data","magnitude|information|power|how much|size"]],"tier":"advanced"}],"traps":[{"cues":["the (therapy|approach|intervention) (is|seems|may be) (a )?(good|valuable|useful|questionable|poor)"],"msg":"The paper says explicitly that no marks are awarded for opinions about the rationale for the therapy or its potential value. This is a methodology question."},{"cues":["^(?![\\s\\S]*(because|which means|so that|therefore|this means|as a result|so we cannot))"],"msg":"Marks require part (b) — WHY the limitation restricts the conclusions. A list of limitations scores at the bottom of the range."}],"model":"The most serious limitation is the absence of any control condition. Behaviour in the last five minutes is compared with behaviour in the first five minutes of the same session, so any increase in eye gaze is equally consistent with the participant habituating to an unfamiliar adult sitting a metre away, or responding to sustained one-to-one attention of any kind. Since the study offers no condition in which an adult is present without delivering Intensive Interaction, nothing in the design distinguishes the specific technique from ordinary attentive presence, which is precisely the claim the study wants to make. Second, one of the researchers delivering the intervention also coded the outcome from the videos. That researcher knew which phase of the session each clip came from and had an investment in the result, and the outcome — whether a glance counts as gaze 'at the partner' — requires exactly the kind of borderline judgement that expectation influences. Only 10% of the videos were independently coded, which is too small a proportion to detect systematic drift, and the agreement obtained was itself weak: a kappa of 0.32 for emotional valence is poor, so the non-significant result for that variable cannot be interpreted as evidence of no change when the measurement is this unreliable. Third, the study measures a single 30-minute session with no follow-up and no measurement outside the session with the researcher. Even taking the eye gaze finding at face value, it shows only that behaviour shifted within one interaction with one person; it says nothing about whether anything was learned, whether it persisted, or whether it generalised to the care staff and family members who would actually deliver the approach — which is the only outcome with clinical meaning for this client group."},{"id":"q2","marks":6,"prompt":"In one or two sentences, write a brief summary of the results as they might appear in an abstract. Then: what limitations were there in the way the authors decided to ANALYSE the data? State the limitation and explain why it creates difficulties for interpretation. Confine your answer to TWO limitations.","guidance":"Two tasks. The summary must be accurate and compressed — note that only eye gaze reached significance. Then two ANALYSIS limitations, not design limitations.","rubric":[{"id":"r1","text":"Accurate summary: eye gaze increased significantly; bodily orientation did not (p = .056); emotional valence did not (p = .527)","weight":3,"cues":[["eye gaze","signific"],["(\\.056|orientation)","(not|non).?signific|did not"]],"tier":"core"},{"id":"r2","text":"Dichotomising the continuous percentage data into increase / no-increase throws away the magnitude of change — a one-second and a ten-minute increase count identically","weight":3,"cues":[["dichotom|binary|categoris|increase (vs|or) (no|decrease)|percentage.{0,30}(reduc|convert)","magnitude|how much|size|information|discard|lost"]],"tier":"core"},{"id":"r3","text":"Only the first and last 5 minutes were used, discarding the middle 20 minutes of data","weight":3,"cues":[["first (and|&) last|middle|20 minutes|only.{0,30}(5|five) minutes","discard|ignor|wast|not used|lost"]],"tier":"core"},{"id":"r4","text":"Three tests conducted with no correction for multiple comparisons — with alpha at .05 across three outcomes the family-wise error rate is inflated, and eye gaze at p = .020 is the only survivor","weight":3,"cues":[["multiple (comparison|test)|three (tests|analyses)|bonferroni|correct(ion|ed) for|family.?wise","inflat|type (i|1) error|false positive|adjust"]],"tier":"advanced"},{"id":"r5","text":"The denominators differ (9, 9 and 10) because participants showing no change appear to have been dropped from some analyses — unexplained and inconsistent","weight":3,"cues":[["\\b9\\b[\\s\\S]{0,60}\\b10\\b|denominator|(number|n) (of participants )?(differ|vary|inconsistent)|9 (rather|instead) than 10"]],"tier":"advanced"},{"id":"r6","text":"Treating p = .056 as a failure and p = .020 as a success reifies an arbitrary threshold on evidence that is nearly identical","weight":3,"cues":[["\\.056|arbitrar|threshold|cut.?off|dichotomous (thinking|decision)|just (above|missed)","similar|nearly|almost|little difference|arbitrar"]],"tier":"advanced"}],"traps":[{"cues":["(no control|blinding|sample size|recruitment|nomination)"],"msg":"These are design limitations — they belong in question 1. This question asks specifically about the ANALYSIS."}],"model":"Summary: across ten adults with profound learning disability, a single session of Intensive Interaction was associated with a significant increase in eye gaze towards the communication partner between the first and last five minutes (z = 2.53, p = .020), while increases in bodily orientation (p = .056) and positive emotional valence (p = .527) did not reach significance. The first analytic limitation is the decision to dichotomise. The authors calculated percentage of time — a continuous, informative measure — and then reduced it to a binary judgement of whether each participant increased or did not. A participant who gazed at the partner for one second longer is counted identically to one who gazed for four minutes longer, so the analysis discards the magnitude of change entirely, throws away statistical power, and leaves us unable to say whether the significant eye gaze result reflects a clinically meaningful shift or a trivial one. The second is the absence of any correction for multiple comparisons. Three tests were run at alpha = .05, which raises the probability of at least one false positive to roughly 14%, and eye gaze at p = .020 is the only result to cross the threshold. Under even a simple Bonferroni adjustment it would not survive. Since no primary outcome was pre-specified, we cannot distinguish a real effect on gaze from the expected consequence of testing three outcomes and reporting the one that reached significance."},{"id":"q3","marks":6,"prompt":"(a) What ethical concerns do you have about the process of gaining consent in this study? State your concern and explain how you would address it. (b) The researchers conducted no assessment of the risk of adverse outcomes. What potential risks needed to be assessed, and how could they have been minimised? Confine part (b) to the ONE risk you consider most relevant.","guidance":"Note the participants have profound learning disability and no apparent language ability, and that STAFF nominated them and signed the consent form.","rubric":[{"id":"r1","text":"Staff cannot consent on behalf of an adult — for adults lacking capacity in England and Wales the Mental Capacity Act route requires a consultee, not a proxy signature from a day centre worker","weight":3,"cues":[["staff (cannot|can't|are not|should not|have no)|proxy|on behalf|consultee|mental capacity act|\\bmca\\b","consent|legal|authoris|entitled"]],"tier":"core"},{"id":"r2","text":"No assessment of the participants' own capacity, and no attempt to seek assent or to support communication of a decision — capacity is decision-specific and must be assessed, not assumed absent from diagnosis","weight":3,"cues":[["capacity|assent|decision.?specific|presum","assess|not assum|support|communicat|accessible"]],"tier":"core"},{"id":"r3","text":"Consent was sought at the end of a presentation promoting the research, from staff in a dependent relationship with the researchers — this compromises voluntariness","weight":3,"cues":[["end of (the )?(meeting|presentation)|pressure|on the spot|immediate|time to (consider|think)|voluntar","presur|pressur|coerc|volunt|reflect|consider"]],"tier":"advanced"},{"id":"r4","text":"No indication that families, carers or an independent advocate were involved in the decision","weight":3,"cues":["famil|next of kin|carer|advocate|imca|relative"],"tier":"advanced"},{"id":"r5","text":"Addressed by: MCA consultee process, individual capacity assessment with accessible information, ongoing behavioural assent monitored throughout, family and advocate consultation, and time to decide","weight":3,"cues":[["consultee|capacity assessment|accessible (information|format)|easy read|ongoing (assent|consent)|withdraw","would|should|address|process|procedure"]],"tier":"core"},{"id":"r6","text":"(b) Risk of distress: an unfamiliar adult sits within one metre, in the participant's field of vision, and mirrors their movements for 25 minutes; a person with no verbal means of objecting may find this intrusive or frightening and be unable to say so","weight":3,"cues":[["distress|frighten|intrusi|threat|invad|personal space|1 metre|one metre|close|uncomfortab","cannot (say|communicate|object|tell)|no (verbal|language|way)|unable to"]],"tier":"core"},{"id":"r7","text":"(b) Minimised by: pre-agreed behavioural indicators of distress defined with people who know the person, a stopping rule, a familiar person present, and staged approach with monitoring","weight":3,"cues":[["stopping rule|withdraw|stop the session|indicator|sign(s)? of distress|familiar (person|staff)|baseline|know the person|graded|staged"]],"tier":"core"}],"traps":[{"cues":["(gdpr|data protection|anonymis|store(d)? securely|password)(?![\\s\\S]{0,120}(capacity|consent|assent))"],"msg":"Generic data handling is not the ethical issue this study raises. The issue is that non-verbal adults were entered into research on a staff member's signature."},{"cues":["they (signed|gave) (a )?consent form(?![\\s\\S]{0,100}(cannot|not valid|no legal|proxy))"],"msg":"A signed form is not consent. Ask who signed it, on what authority, and whether the participant was assessed at all."}],"model":"The consent process is the most serious problem in the study. Participants were adults with profound learning disability and no apparent language ability, and the people who consented to their participation were day centre staff who had been asked to nominate them at the end of a presentation about the research. In England and Wales no adult can consent on behalf of another adult: where an adult may lack capacity to decide about research, the Mental Capacity Act requires the researcher to assess capacity for that specific decision, to take all practicable steps to support the person to decide including accessible and non-verbal formats, and where capacity is genuinely absent to consult a personal consultee — usually a family member or someone who knows the person well in an unpaid capacity — about what the person's wishes and feelings would likely have been. A staff signature on a nomination form satisfies none of this. There is also no evidence any capacity assessment was attempted, so incapacity appears to have been inferred from diagnosis, which is precisely what the Act prohibits. The circumstances compound this: staff were asked to decide immediately, at the end of a meeting held to promote the study, with no time to consider and an implicit expectation of cooperation, which undermines voluntariness even as a consultee decision. I would address this by assessing each person's capacity individually with accessible materials, consulting family members and, where there is no appropriate person, an independent advocate, allowing time for consideration away from the presentation, and treating consent as ongoing rather than a single event, with behavioural assent monitored throughout. On risk: the intervention places an unfamiliar researcher within one metre of the participant, inside their field of vision, mirroring their movements and vocalisations for 25 minutes. For someone who cannot say no, that is a plausible source of distress — the proximity may be experienced as intrusive or threatening, and mirroring may be confusing or mocking rather than attuned. The study assessed this risk not at all, and coded emotional valence only as an outcome, with poor reliability. I would minimise it by agreeing individualised behavioural indicators of distress in advance with the people who know the person best, establishing an explicit stopping rule applied by an observer rather than by the person delivering the intervention, having a familiar member of staff present, and building up contact gradually rather than beginning with 25 minutes."},{"id":"q4","marks":6,"prompt":"Suppose you were working with someone with profound learning disability and the benefits of more social interaction with her family were highlighted by your assessment. What issues would you consider in deciding whether to use Intensive Interaction? Confine your answer to the THREE issues you consider most relevant.","guidance":"This is a clinical decision question, not a critique. You are being asked how a psychologist reasons from a weak evidence base to a decision about one person.","rubric":[{"id":"r1","text":"The evidence base is weak — but absence of strong evidence is not evidence of absence, and for this population the alternative evidence-based options are few, so the decision is proportionate rather than dictated by the literature","weight":3,"cues":[["evidence (base|is)|weak|limited (evidence|research)|poor(ly)? (evidenced|researched)","not evidence of absence|few alternatives|proportionate|does not mean|still|nevertheless|balanc"]],"tier":"core"},{"id":"r2","text":"Whether the approach fits this person — her sensory profile, tolerance of proximity, existing communication repertoire, history of trauma or aversive experience of close contact","weight":3,"cues":[["sensor|proximity|close|touch|tolerat|individual|this (person|woman)|her (profile|preference|history)|trauma|autis"]],"tier":"core"},{"id":"r3","text":"Who delivers it — the goal is interaction with FAMILY, so the family must be trained, supported and willing; an intervention delivered only by the psychologist does not meet the identified need","weight":3,"cues":[["famil","train|deliver|teach|support|coach|carry out|who (does|delivers|implements)"]],"tier":"core"},{"id":"r4","text":"Consent and assent — capacity assessment, best interests decision under the MCA, ongoing behavioural assent, and the least restrictive alternative","weight":3,"cues":[["capacity|consent|assent|best interest|\\bmca\\b|least restrictive"]],"tier":"core"},{"id":"r5","text":"How you would know whether it is working for HER — individualised, repeated, ideally single-case measurement (multiple baseline) rather than reliance on group findings","weight":3,"cues":[["single.?case|multiple baseline|baseline|repeated measure|monitor|evaluat|outcome|measure","individual|her|this person|idiographic|n.?of.?1"]],"tier":"advanced"},{"id":"r6","text":"Alternatives considered — other communication approaches (objects of reference, PECS, Talking Mats, augmentative communication), and the possibility of environmental or staff-level change","weight":3,"cues":["alternativ|other (approach|option|intervention)|pecs|objects of reference|talking mats|augmentative|makaton|communication (aid|passport)"],"tier":"advanced"},{"id":"r7","text":"Values and rights — whose goal is more social interaction, and does she show any sign of wanting it; the risk of imposing a normative goal on a person who cannot dissent","weight":3,"cues":[["whose (goal|aim|agenda)|want|prefer|impos|normative|right|choice|her (view|wish)"]],"tier":"advanced"}],"traps":[{"cues":["^(?![\\s\\S]*(famil))"],"msg":"The question specifies that the benefit identified was interaction with her FAMILY. An answer that never mentions the family has not answered the question asked."}],"model":"The first issue is what the evidence actually supports. The published work on Intensive Interaction, includ
