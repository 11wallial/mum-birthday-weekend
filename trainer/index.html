ing this study, is methodologically weak, so I could not tell the family that it is established as effective. But weak evidence is not evidence of ineffectiveness, and for someone with profound learning disability and no language the range of alternatives with better evidence is very small; refusing on evidential grounds alone would leave the identified need unaddressed. So I would treat the decision as a proportionate one made under uncertainty, and be explicit with the family that this is what we are doing. The second issue is fit with this particular person. Intensive Interaction requires close physical proximity and mirroring, so I would want to know her sensory profile, how she responds to people entering her space, whether there is any history of aversive or frightening close contact, and what communicative behaviour she already has, since the approach builds on her existing repertoire rather than teaching a new one. If proximity is aversive for her, the intervention is not neutral. The third issue is who delivers it and how I would know if it is working. The assessment identified benefit from interaction with her family, not with me, so the intervention has to be something the family can learn, sustain and adapt — which makes their willingness, confidence and capacity to do it part of the clinical decision rather than a practical detail. Alongside that I would set up individualised measurement before starting: an agreed baseline of specific behaviours over several sessions, then repeated measurement across settings, ideally in a multiple baseline design, so that the decision to continue rests on evidence about her rather than on a group finding from ten other people. I would also want the capacity and best interests position documented, with assent monitored behaviourally throughout, and a clear agreement about what would make us stop."}],"debrief":"This paper rewards discipline more than knowledge. It caps the number of issues, so a fourth point is wasted effort; it demands the explanation as well as the limitation, so half your marks live in the word 'because'; and it explicitly refuses marks for opinions about the therapy's value in Q1. The candidates who do badly here are usually the ones who knew the most and could not stop writing."},{"id":"abstract2016","title":"Structured abstract: alcohol feedback in A&E","course":"Surrey & Canterbury Christ Church","year":2016,"minutes":25,"totalMarks":15,"provenance":"Real Surrey/CCCU selection written test 2016, Part 2 (Written Communication). The task and study text are verbatim; rubric points are reconstructed from the stated sub-headings and the study content.","brief":"Write a succinct structured abstract of the study below, using the sub-headings Background, Methods, Results, Conclusions. Do not copy sentences verbatim from the description — copied sentences score nothing. This part assesses your ability to extract, interpret and summarise, and is marked separately with its own threshold.","stimulus":[{"t":"h","v":"Impact of health consequences feedback on patients' acceptance of advice about alcohol consumption"},{"t":"note","v":"Patton R, Crawford MJ & Touquet R. (2003), Emergency Medicine Journal, 20: 451–452"},{"t":"p","v":"The effects of excessive alcohol consumption are well reported and include liver disease, suicide, and accidents. Recent research has highlighted the increased level of alcohol consumption among patients reporting to the accident and emergency (A&E) department. Programmes of Screening and Brief Intervention (SBI) based in the A&E department may reduce levels of drinking among participating patients; however, no matter how effective an intervention may be, it is reliant upon the willingness of a patient to accept it."},{"t":"p","v":"Patients reporting to the A&E department at St Mary's hospital are routinely screened for hazardous drinking using the Paddington Alcohol Test (PAT). Those who screen positive are offered advice about their drinking. At the start of the recruitment phase of a separate randomised controlled trial, it was observed that fewer patients were accepting advice than had been anticipated. Action was therefore taken to increase the proportion of patients who would accept help."},{"t":"p","v":"METHODS. This brief report is a retrospective analysis of a sample of patients who presented to the A&E department and screened positive on the PAT. During a 12 week period between March and June 2001, senior house officers (SHOs) trained to implement a screening and brief intervention protocol identified patients aged 18 and over who were hazardous drinkers. Male patients were PAT positive if drinking eight or more units on one or more occasions per week; for women the limit was six units. Any patient stating their visit was related to alcohol consumption was also deemed PAT positive."},{"t":"p","v":"For the first six weeks SHOs were instructed to screen patients and offer help to those who were PAT positive (control period). After six weeks the SHOs received a brief training session that emphasised making a link between screening positive and potential health consequences (feedback period), by saying “you are drinking at a level that is harmful to your health”, and then offering advice. Patients' sex, age, and level of alcohol consumed in a single session were recorded together with willingness to accept advice. Local research ethics committee approval was given for the project of which this study forms a part."},{"t":"p","v":"RESULTS. Altogether 281 patients were PAT positive. They were predominantly male (77%) with an average age of 44.4 years, and a mean of 21.8 units consumed in a single session. There were no significant differences between the control and feedback periods on these variables. On average 64% of patients accepted advice during the feedback period compared with 52.1% during the control period (χ² = 3.99, df = 1, p < 0.05)."},{"t":"p","v":"DISCUSSION. The provision of simple feedback by doctors was associated with a 22.8% increase in the proportion of patients willing to accept brief advice. In a typical A&E department we estimate this could lead to an additional 350 patients per year accepting help and advice to reduce their drinking. While we cannot rule out the possibility that changes other than the introduction of simple feedback were responsible for this increase, the timing of the increase suggests that this is the most probable explanation."}],"questions":[{"id":"q1","marks":15,"prompt":"Write a structured abstract using the sub-headings Background, Methods, Results, Conclusions.","guidance":"Aim for roughly 200–250 words. Each section must carry its own weight: background states the problem and the gap, methods gives design, setting, sample, measure and comparison, results gives the numbers, conclusions state what follows AND what the design cannot support.","rubric":[["b1","BACKGROUND: brief intervention works only if patients accept it — acceptance is the identified problem",1,[["accept","(brief intervention|advice|help|sbi)"]],"core"],["b2","BACKGROUND: sets the A&E screening context (PAT / hazardous drinking)",1,["a&e|accident and emergency|emergency department|screen"],"core"],["m1","METHODS: identifies the design as retrospective, and as a before-and-after comparison of two consecutive periods",1,[["retrospectiv|before.?and.?after|before and after|two periods|sequential|non.?randomis"]],"core"],["m2","METHODS: setting and sample — 281 PAT-positive adults at one London A&E over 12 weeks",1,[["281|12 week|twelve week","a&e|hospital|department"]],"core"],["m3","METHODS: the manipulation — six weeks of usual practice, then SHO training to add an explicit health-consequences statement before offering advice",1,[["six week|6 week|first half|second","train|feedback|health consequence|harmful to your health"]],"core"],["m4","METHODS: outcome — proportion of patients accepting advice",1,[["(proportion|percentage|rate|number)[\\s\\S]{0,40}accept|accept[\\s\\S]{0,30}(advice|help)"]],"core"],["r1","RESULTS: 64% accepted in the feedback period vs 52.1% in the control period",2,[["64","52"]],"core"],["r2","RESULTS: reports the test and significance (χ² = 3.99, df = 1, p < .05)",1,[["chi|χ|3\\.99|p ?[<=] ?\\.?0?5"]],"core"],["r3","RESULTS: notes groups did not differ on age, sex or units consumed",1,[["no (significant )?difference|did not differ|comparable|similar","age|sex|units|demographic"]],"advanced"],["c1","CONCLUSIONS: adding an explicit health-consequences statement was associated with greater acceptance of advice",2,[["associat|linked|accompanied","accept"]],"core"],["c2","CONCLUSIONS: states the causal limitation — an uncontrolled before-and-after design cannot exclude concurrent change (SHO experience, seasonality, secular trend)",2,[["cannot|causal|confound|other (change|factor)|secular|season|experience|maturation|temporal|not randomis"]],"core"],["c3","CONCLUSIONS: notes the practical implication (potential additional patients accepting help per year)",1,[["350|per year|annually|implication|service"]],"advanced"]],"traps":[[["randomised controlled trial|\\brct\\b(?![\\s\\S]{0,60}(separate|different|another))"],"This study is NOT the RCT. The RCT is mentioned as a separate trial being run in the same department; this brief report is a retrospective before-and-after analysis. Calling it an RCT is a comprehension error that would be heavily penalised."],[["22\\.8% (increase|more) (of |in )?patients accepted"],"Careful with the 22.8% figure — it is a RELATIVE increase (52.1 → 64). The absolute increase is about 12 percentage points. Reporting the relative figure as though it were absolute overstates the finding."],[["caused|proves|demonstrates that feedback"],"Overclaiming causation from a before-and-after design."]],"model":"Background: Screening and brief intervention for hazardous drinking in emergency departments can reduce consumption, but its impact depends on patients agreeing to accept advice, and acceptance rates in practice were lower than anticipated. This study examined whether explicitly linking a positive screen to health consequences increased the proportion of patients who accepted advice.\n\nMethods: Retrospective analysis of consecutive patients aged 18 and over attending a London emergency department over 12 weeks in 2001 who screened positive for hazardous drinking on the Paddington Alcohol Test (n = 281). The study compared two consecutive six-week periods. During the first, senior house officers screened patients and offered help as usual. Before the second, they received brief training emphasising an explicit statement that the patient was drinking at a level harmful to their health, delivered before the offer of advice. The outcome was the proportion of PAT-positive patients accepting advice; age, sex and units consumed in a single session were also recorded.\n\nResults: Patients were predominantly male (77%), mean age 44.4 years, consuming a mean of 21.8 units per session, with no significant differences between periods on these variables. Acceptance of advice rose from 52.1% during the control period to 64% during the feedback period (χ² = 3.99, df = 1, p < .05), an absolute increase of approximately 12 percentage points.\n\nConclusions: Adding a brief explicit statement about health consequences was associated with a higher proportion of patients accepting advice, and the authors estimate this could correspond to around 350 additional patients accepting help annually in a typical department. Because the design compared two consecutive periods without randomisation or a concurrent control, the increase cannot be attributed to the feedback with confidence; growing clinician experience, seasonal variation and other concurrent changes remain plausible alternative explanations. A randomised or stepped-wedge evaluation would be needed to establish the effect."}],"debrief":"Abstract-writing is a selection task because it tests compression under constraint — exactly what a case summary, a referral letter and an interview answer all require. Two habits transfer. Give every section a job and do not let one leak into another. And put the design limitation in the conclusions rather than leaving it implied: the marker cannot award you a point for a caveat you were privately aware of."},{"id":"cardiff2016","title":"Indirect working in an intellectual disability service","course":"Cardiff","year":2016,"minutes":30,"totalMarks":20,"provenance":"Real Cardiff written test task, 2016. The scenario and the four prompts the paper suggested candidates address are verbatim from the recalled paper; the rubric is reconstructed. Cardiff's written task is followed in interview by 'with reference to the written test — what values underpinned your answers?', so write it as something you can defend aloud.","brief":"You have 30 minutes. Answer ONE scenario. The paper suggested including: the Welsh context, cost-benefit, assessment and evaluation, and ethics.","stimulus":[{"t":"h","v":"Scenario 1"},{"t":"p","v":"You are a psychologist in an intellectual disabilities residential care home. Discuss three ways in which you could help service users that DO NOT involve one-to-one interventions."},{"t":"h","v":"Scenario 2"},{"t":"p","v":"You are a psychologist in a young person's inpatient unit. Discuss three ways in which you could help service users that DO NOT involve one-to-one interventions."},{"t":"note","v":"Things the paper suggested including: the Welsh context; cost-benefit; assessment and evaluation; ethics."}],"questions":[{"id":"q1","marks":20,"prompt":"Choose one scenario. Set out three ways you could help service users that do not involve one-to-one intervention. For each, say what psychological thinking underpins it, how you would evaluate it, and what it costs and saves.","guidance":"The constraint is the question. 'Not one-to-one' is asking whether you understand that the psychologist's leverage in a residential or inpatient setting lies mostly in the system, not the therapy room. Three developed routes beat six listed ones.","rubric":[["r1","Staff training — with a stated psychological rationale (e.g. attributions about behaviour, emotional labour, burnout) rather than training as a generic good",3,[["train|teach|workshop|upskill","staff|team|carer|support worker"]],"core"],["r2","Team formulation / consultation — shifting staff attributions and reducing blame, with the mechanism named",3,[["team formulation|formulation (meeting|session|with (the )?(team|staff))|consultation|reflective practice (group|session)"]],"core"],["r3","Environmental, systemic or PBS-informed change — antecedent-level work, structure, predictability, meaningful activity, reduction of restrictive practice",3,[["environment|antecedent|positive behaviour support|\\bpbs\\b|routine|structure|activity|restrictive practice|sensory"]],"core"],["r4","Group intervention or peer-led work delivered by others under supervision",2,[["group (work|intervention|programme|session)|peer (support|led)|psychoeducation group"]],"advanced"],["r5","Evaluation is specified — what data, collected when, compared with what (not merely 'I would evaluate it')",3,[["(measure|data|outcome|audit|baseline|incident|before and after|pre.?post|single.?case|multiple baseline)","(evaluat|monitor|review|compare)"]],"core"],["r6","Cost-benefit is addressed concretely — psychologist time is the scarce resource, and indirect work multiplies reach across a whole staff group and outlasts your post",2,[["cost|resourc|time|capacity|reach|scale|value|sustainab|efficien","staff|whole (home|unit|team)|many|multipl|beyond"]],"core"],["r7","Welsh context is engaged specifically — e.g. the Welsh language, the Social Services and Well-being (Wales) Act, Welsh Government mental health strategy, rurality and travel, distinct NHS Wales structures",3,["welsh|wales|cymraeg|cymru|social services and well.?being|rural|bilingual|welsh language|active offer"],"core"],["r8","Ethics engaged specifically — consent and capacity in a residential setting, restrictive practice and least restriction, power imbalance, whose goals are being served",3,[["consent|capacity|restrictive|least restrict|power|coerc|rights|whose (goal|interest)|dignity|choice"]],"core"],["r9","Service users or families are involved in designing what is offered, not only receiving it",2,[["co.?produc|involve|consult|service user|resident|family|carer","design|shape|decide|plan|ask"]],"advanced"],["r10","The answer names an underlying value or principle it could defend aloud in interview",2,["value|principle|belief|underpin|commit|stance|because I (think|believe)"],"advanced"]],"traps":[[["(individual|1:1|one.to.one|one to one) (therapy|session|work|intervention)(?![\\s\\S]{0,80}(not|instead|rather|avoid|beyond))"],"The question explicitly excludes one-to-one work. Proposing it — even as one of three — loses the point and suggests you did not read the constraint."],[["^(?![\\s\\S]*(wales|welsh|cymru))"],"Cardiff asks about the Welsh context in the written task and in interview. An answer with nothing specific about Wales leaves marks on the table at a Welsh course."]],"model":"In a residential intellectual disability service the psychologist is one person among a staff team who provide care around the clock, so most of the psychological work available to me is indirect. I would prioritise three routes.\n\nFirst, regular team formulation. Behaviour that services describe as challenging is usually met with explanatory attributions — that the person is attention-seeking, or manipulative, or that this is 'just their autism' — and those attributions drive how staff respond, which in turn maintains the behaviour. A facilitated formulation session builds a shared account of what the behaviour communicates and what function it serves, and the evidence suggests the reliable effect is on staff attributions, emotional responses and confidence rather than immediately on the person. I would evaluate it accordingly: brief attribution and confidence measures before and three months after, alongside incident records and restrictive practice data, rather than expecting behaviour change to appear on its own.\n\nSecond, antecedent-level environmental work informed by positive behaviour support. Rather than responding to incidents, I would carry out functional assessment across the home and then work on predictability of routine, communication systems, meaningful daily activity and sensory environment. This is where the largest effects in this population usually sit, and it reaches every resident rather than the one on my caseload. Evaluation would be a multiple-baseline design across settings or individuals, using incident frequency and, importantly, quality of life and engagement measures — because a reduction in incidents achieved by restricting someone's life is not a good outcome.\n\nThird, staff training and reflective practice as a standing arrangement rather than a one-off. Care staff in this setting are low-paid, high-turnover and exposed to distressing behaviour with little space to think about it, and burnout predicts exactly the depersonalised responding that escalates incidents. I would run a monthly reflective group, evaluating through staff turnover and sickness data as well as validated burnout measures, since these are the outcomes the organisation will act on.\n\nCost-benefit runs through all three. My time is the scarce resource: an hour spent in a formulation meeting with eight staff shapes care delivered across every shift, and it persists after my post is funded elsewhere, whereas an hour of one-to-one therapy reaches one person once. The trade-off, which I would be honest about, is that indirect work has a longer lag to visible outcome and is harder to attribute.\n\nThe Welsh context shapes delivery. The Social Services and Well-being (Wales) Act places well-being and voice at the centre of care and gives carers a statutory right to assessment, which strengthens the case for family and staff involvement. The Welsh language matters: for many people with an intellectual disability, particularly older residents in Welsh-speaking communities, Welsh is their first and sometimes only language, and the Active Offer means provision in Welsh should not depend on the person asking. Rurality also matters practically — in a dispersed service, consultation and training models travel better than weekly individual appointments.\n\nEthically, the central issue is that everything I have described happens to people rather than with them. Residents may lack capacity to consent to a change in the environment, and the MCA framework of best interests and least restriction applies. There is a real risk of the service's goals — fewer incidents, easier shifts — substituting for the residents' own, so I would want residents and families involved in setting the outcomes we measure, and I would treat any reduction in restrictive practice as a primary outcome rather than a side effect. The value underpinning all three choices is that the environment, not the person, is usually the appropriate target of change."}],"debrief":"Cardiff follows this task in interview with 'what values underpinned your answers?'. Write it so that you could answer that in one sentence — and if you cannot, the answer has not committed to anything. The highest-scoring version of this task is not the one that lists the most options; it is the one that explains why indirect work is the right choice in a setting where you are one person among many."},{"id":"southwales2015","title":"Reflective letter: witnessing a colleague","course":"South Wales","year":2015,"minutes":40,"totalMarks":20,"provenance":"Real South Wales written task, 2015, verbatim scenario and prompts. Rubric reconstructed. South Wales followed this in interview with 'what do you think the written task was trying to assess?' — a question worth having an answer to.","brief":"Write the reflective letter your supervisor has asked for. Address the headings given. You are writing to your supervisor, in advance of supervision — the register is professional and reflective, not a formal incident report.","stimulus":[{"t":"p","v":"You are a health care worker working in an adolescent forensic unit and you witness your manager taking money from one of the service users. They did not see you. The service user involved has seemed a bit low lately. You usually get on well with your manager, but you sometimes feel a bit uncomfortable in his presence. You have briefly spoken about the incident with your supervisor and he/she has asked you to write a reflective letter detailing what you would like to discuss in your upcoming supervision."},{"t":"note","v":"Focus on: your dilemma; why is this a priority; any professional / personal issues; what do you want from supervision; any other issue."}],"questions":[{"id":"q1","marks":20,"prompt":"Write the reflective letter.","guidance":"Two failure modes here. One is to write a procedural incident report with no interior life. The other is to write pure feeling with no action. The task assesses whether you can hold both — and whether the safeguarding of a young person survives your discomfort about your manager.","rubric":[["r1","Names the safeguarding dimension explicitly — a young person in a forensic unit, dependent, possibly unaware, and low in mood; this is potential abuse of a vulnerable person, not a workplace disagreement",3,[["safeguard|abuse|vulnerab|exploit|protect","young person|service user|adolescent|child|resident"]],"core"],["r2","Recognises the power imbalance — the person taking money holds authority over both the young person and over you",2,[["power|authorit|senior|manag|hierarch|imbalance|position"]],"core"],["r3","States that action is required regardless of certainty — raising a concern is a referral for assessment, not an accusation requiring proof",2,[["(do not|don't|not) (have to|need to) (be certain|prove|know)|not an accusation|report(ing)? (a )?concern|threshold|raise (it|a concern)|duty"]],"core"],["r4","Identifies the dilemma honestly — loyalty, the good working relationship, fear of consequences for oneself, doubt about what was seen",3,[["dilemma|loyal|conflict|torn|difficult|fear|worried|consequence|career|doubt|unsure|might have (mis)?(seen|understood)"]],"core"],["r5","Reflects on the pre-existing discomfort in the manager's presence, and considers what that might mean — including that it might be data, and might be bias",3,[["uncomfortab|unease|discomfort","what (that|this) (mean|tell|says)|bias|prejudg|data|inform|noticed before|already"]],"advanced"],["r6","Notes what has already been done and what happens next — escalation route named (safeguarding lead, whistleblowing / Freedom to Speak Up, local procedure)",3,[["safeguarding lead|whistleblow|freedom to speak up|policy|procedure|escalat|report to|senior manager|designated"]],"core"],["r7","Considers the service user directly — their low mood, whether it may be connected, whether and how they should be spoken to, and their right to be heard",2,[["(low|mood|distress|withdraw)[\\s\\S]{0,120}(connect|related|linked|might|wonder)","(speak|talk|ask|listen) (to|with) (them|the (service user|young person))"]],"core"],["r8","Makes a specific ask of supervision — not 'support' in general but named questions: what is the threshold, what is my role, what do I do about the working relationship afterwards",3,[["(want|ask|hoping|help me|need) [\\s\\S]{0,120}(supervis|you)","\\?|whether|what (should|do) I|how (do|should) I|advice on|think through"]],"core"],["r9","Records the facts separately and contemporaneously — what was seen, when, where, in factual terms",2,[["record|document|written down|notes|contemporaneous|factual|date and time"]],"advanced"],["r10","Distinguishes fact from interpretation — what was actually observed versus what was inferred",2,[["what I (actually )?saw|fact|interpret|assum|infer|could have been|may (have )?(been|meant)|do not know why"]],"advanced"]],"traps":[[["^(?![\\s\\S]*(safeguard|abuse|protect|vulnerab|report|escalat|lead|policy))"],"A letter that processes the emotional dilemma without ever arriving at protective action has failed the task. The reflection has to lead somewhere."],[["(confront|speak to|approach) (him|my manager|the manager)(?![\\s\\S]{0,140}(supervis|safeguard|advice|first|before|policy))"],"Confronting the manager directly first is a common and costly answer: it risks the evidence, the young person and yourself. The route is the safeguarding lead and supervision."],[["(wait|see if it happens again|monitor|keep an eye)(?![\\s\\S]{0,100}(but|however|alongside|while also|meanwhile))"],"Waiting to see if it recurs leaves a young person unprotected in the meantime and is not a defensible position afterwards."],[["\\b(certain|sure|definitely) (that )?(he|she|they) (stole|took)"],"You saw an act; you do not know its meaning or its authorisation. Reporting a concern accurately means describing what you observed, not asserting a conclusion."]],"model":"Dear [supervisor],\n\nThank you for suggesting I write this before we meet. Setting it down has helped me separate what I actually saw from what I have been telling myself about it, and I want to use our session well.\n\nWhat I saw: on [date], in [location], I saw [manager] take money from [service user]'s [wallet/locker/bag]. I do not think he saw me. I have written a factual account with the date, time and place, and kept it separately. I want to be careful here, because I have noticed how quickly my account slides from what I observed into what I assume it meant. I saw money being taken. I do not know whether there was some arrangement I am unaware of, and I do not know what he intended. What I do know is that I saw enough to be concerned, and that my uncertainty about the meaning is not a reason to stay silent.\n\nWhy this is a priority. The person involved is a young person in a forensic inpatient unit. He is detained, dependent on staff for almost everything, and structurally in the weakest position in this building. If money is being taken from him, that is potential financial abuse of a vulnerable young person, and it falls under safeguarding rather than under workplace conduct. He has also seemed low recently. I do not want to over-interpret that — there are many reasons a young person on this unit might be low — but I cannot honestly say I have not wondered whether the two are connected, and I think that possibility raises the urgency rather than lowering it. My understanding is that raising a safeguarding concern is a referral for assessment, not an accusation, and that the threshold is concern rather than proof. That has helped me, because most of my hesitation has been organised around not being certain enough.\n\nThe dilemma, honestly. I get on well with [manager]. He has been good to me, he has more experience than me, and he is senior to me — which means he has influence over my working life, my references and my future in this service. I have found myself constructing reasons why I might have misunderstood, and I think I need to name that as avoidance rather than as caution. There is also something I want to bring that is less comfortable. I have felt uneasy in his presence for a while, before any of this. I have two thoughts about that and I cannot tell which is right. One is that I may have been noticing something I could not articulate, and that the unease is information. The other is that my unease may now be shaping how I read what I saw, and that I could be building a case against someone I already found difficult. I do not think I can settle that alone, and it is one of the things I most want your help with.\n\nWhat I have done and what I understand happens next. I have not spoken to [manager]. I considered it, and decided against it: it could compromise any subsequent enquiry, it could place the young person at greater risk, and given the power difference I do not think it is my conversation to have. I have written my factual account. I understand that the next step is to raise this with the safeguarding lead, and that because the concern is about a manager, the escalation route needs to go outside his line of management — I would like to check I have that right. I am also aware of the Freedom to Speak Up route if I feel it is not taken seriously.\n\nWhat I would like from supervision. Specifically: (1) Have I correctly identified the escalation route, given that the concern is about a manager? (2) What is my role in relation to the young person — should I be speaking with him at all, and if so about what, or would that compromise the enquiry? He has a right to be heard about something that happened to him, and I do not want him to become invisible in a process about adults. (3) How do I hold my working relationship with [manager] while this is looked into, given that I will be on shift with him? (4) Help me test whether my prior discomfort is informing or distorting my judgement. And (5) I would find it useful to think about my own support, because I have been sleeping badly since, and I would rather say that now than discover it in a month.\n\nOne further issue. If money has been taken from one young person, I do not know that it has not happened to others, and several residents here have no family contact and no one to notice. I think that is worth raising as a question about the unit, separately from the question about one individual.\n\nWith thanks,\n[name]"}],"debrief":"South Wales asks in interview what the written task was assessing. The honest answer: whether the pull of loyalty, hierarchy and self-protection deflects you from a safeguarding duty, and whether you can be reflective without becoming paralysed. Notice the structure of the model answer — it separates observation from inference, states the discomfort rather than resolving it prematurely, and still arrives at a concrete next step. That is the shape of a strong reflective answer in any interview."}]},"interview":{"version":1,"themes":[{"id":"research_own","label":"Your own research","why":"The single most frequent question in the entire corpus — it appears at Cardiff, Birmingham, Coventry, Glasgow, Exeter, Plymouth and Southampton, in every year sampled. Several courses ask you to present it for 5–10 minutes before questioning. Assume you will be asked this everywhere, and that the follow-ups are where the marks are.","mode":"3min","concepts":["scientist_practitioner","test_selection","external_validity","reflective_practice"],"listen":[{"text":"States the research QUESTION in one sentence — not the topic area","cues":["question was|aimed to (test|examine|establish)|asked whether|investigated whether"],"tier":"core"},{"text":"Gives the rationale: what gap or clinical problem made it worth doing","cues":["gap|nobody had|little (research|evidence)|because|clinical(ly)? (problem|relevant)|mattered"],"tier":"core"},{"text":"Names the design precisely AND says why that design followed from the question","cues":["design","because|so that|in order to|which allowed"],"tier":"core"},{"text":"Sample: who, how recruited, how many — and what that implies for the claim","cues":["particip|sample|recruit|\\bn ?= ?\\d"],"tier":"core"},{"text":"Measures: what they were and why those ones (psychometrics, not convenience)","cues":["measure|questionnaire|scale|interview schedule","chose|because|validated|reliab"],"tier":"core"},{"text":"Analysis named with a reason, not just a label","cues":["(t.?test|anova|regression|chi|thematic|ipa|correlat|mixed model)","because|since|as the|appropriate"],"tier":"core"},{"text":"Findings given with direction and magnitude — not only 'it was significant'","cues":["(increas|decreas|higher|lower|larger|smaller|effect size|\\bd ?=|mean)"],"tier":"core"},{"text":"Limitations SPECIFIC to this study, not a generic list","cues":["limitation|weakness|caveat"],"tier":"core"},{"text":"What you would do differently, with the reason — and ideally how you would operationalise it","cues":["differently|next time|would have|in hindsight|would change"],"tier":"core"},{"text":"Theory: what underpinned it, or what it implies theoretically","cues":["theor|model|framework|conceptual"],"tier":"advanced"},{"text":"A reflexive layer: what it taught you about being a researcher, or about being a scientist-practitioner in the NHS","cues":["learn|taught me|realis|scientist.?practitioner|reflect"],"tier":"advanced"},{"text":"Connects to clinical practice or service context","cues":["clinic|practice|service|patient|NHS"],"tier":"advanced"}],"followups":["What was your independent variable and your dependent variable?","What statistics did you use, and why those?","What would you have done if the assumptions of that test were not met?","What were the theoretical implications of the findings?","How would you extend this research?","What would you do differently, and how would you operationalise that change?","In what way would that have improved the research?","Remind me — when in your career did you complete this?","What was the biggest threat to the validity of your conclusions?"],"failure":"Narrating the project chronologically — 'so first we recruited, then we ran it, then we analysed' — and running out of time before reaching limitations or reflection. The panel already assumes you can describe what you did; they are testing whether you can evaluate it.","shape":"Question → why it mattered → design and why → sample → measures → analysis → what you found (with direction and size) → what it genuinely supports → what it does not → what you would change and why. Aim to reach limitations inside 90 seconds, because that is where every follow-up lives. Have one sentence ready for 'what does this mean theoretically' — Exeter's service user panellist asked exactly that."},{"id":"research_design","label":"Designing a study on the spot","why":"Every course in the corpus does this. Birmingham gave a written version (evaluating CBT for CYP anxiety), Cardiff asked about rising young male suicide in rural areas, Glasgow gave a substance-use vignette, Exeter asked about parental intervention and child anxiety, Coventry asked for a systematic review method, Plymouth gave two vignettes under exam conditions. The content varies; the reasoning chain does not.","mode":"3min","concepts":["test_selection","rct","qualitative_designs","ethics_approval","coproduction","service_evaluation"],"listen":[{"text":"Clarifies or states the question before proposing a method","cues":["(first|start|begin)[\\s\\S]{0,80}(question|clarify|what (we|I) (want|are) (to )?(know|answer))|depends (on )?what"],"tier":"core"},{"text":"Says who they would consult first — service users, clinicians, the team, existing data","cues":["consult|involve|talk to|ask|stakeholder|service user|co.?produc|patient and public"],"tier":"core"},{"text":"Chooses qualitative or quantitative FROM the question rather than by preference","cues":["(qualitative|quantitative|mixed)","because|since|as the question|depends|given that"],"tier":"core"},{"text":"Names the design and its comparator","cues":["(rct|randomis|cohort|cross.?sectional|longitudinal|case.?control|single.?case|feasibilit|survey|thematic|ipa|grounded)"],"tier":"core"},{"text":"Specifies outcome measures and why","cues":["(measure|outcome|instrument|scale)","validated|because|primary outcome"],"tier":"core"},{"text":"Addresses sample and recruitment realistically, including who will be missed","cues":["(recruit|sampl|access|hard to reach|who (we|I) (would )?miss|representat)"],"tier":"core"},{"text":"Names ethical considerations specific to THIS question","cues":["ethic|consent|capacity|distress|risk|safeguard|vulnerab"],"tier":"core"},{"text":"Says what the design can and cannot establish","cues":["(cannot|can't|would not|unable to) (say|establish|conclude|prove)|causal|only tells us"],"tier":"core"},{"text":"Anticipates feasibility — time, funding, access, attrition","cues":["feasib|realistic|resource|time|fund|attrition|drop"],"tier":"advanced"},{"text":"Says how findings would be communicated and to whom","cues":["disseminat|communicat|feed back|report|publish|share"],"tier":"advanced"}],"followups":["What sample size would you use, and how did you arrive at that?","What are the ethical considerations?","What are the limitations of that approach?","How would you communicate your results?","What if you already had your hypothesis — how would that change the design?","What would you do if you could not recruit enough people?","How would you know if it had been effective or ineffective?","How would you ensure the study was worthwhile?"],"failure":"Naming a method in the first sentence. 'I'd do an RCT' before establishing what the question is, who cares about it, and whether the intervention is even ready to be trialled. The strongest candidates spend their first fifteen seconds on the question, not the method.","shape":"Question → who I'd consult → what kind of knowledge this needs → design and comparator → outcome and measures → sample and who gets missed → ethics specific to this → what it can and cannot show → how it gets used. Say 'it depends on what we want to know' and then say what it depends on — that is the answer, not a dodge."},{"id":"critical_appraisal","label":"Appraising a paper or abstract handed to you","why":"Coventry handed candidates an RCT abstract with 1–2 minutes to read; Birmingham circulated a journal article a month ahead and built the academic interview on it; Birmingham 2019 asked how you would establish the scientific merit of an RCT. Several courses ask about a paper that influenced you.","mode":"3min","concepts":["risk_of_bias","external_validity","effect_size","control_group","attrition","quality_appraisal"],"listen":[{"text":"Works to a systematic order rather than hunting for flaws at random","cues":["(first|start|begin|then|next|order|systematic|framework)"],"tier":"core"},{"text":"Population and recruitment — who is in it, who is missing","cues":["(sampl|particip|recruit|inclusion|exclusion|who was)"],"tier":"core"},{"text":"Design and comparator — what was it compared against","cues":["(comparator|control|tau|waitlist|active|placebo|compared (to|with))"],"tier":"core"},{"text":"Measurement — are the outcomes valid, reliable, blind-assessed, and is the primary one pre-specified","cues":["(measure|outcome|blind|reliab|valid|primary outcome|self.?report)"],"tier":"core"},{"text":"Attrition and missing data","cues":["(attrit|drop|lost to follow|missing|itt|intention.?to.?treat|completed)"],"tier":"core"},{"text":"Analysis and effect — reports magnitude and precision, not only significance","cues":["(effect size|confidence interval|\\bci\\b|magnitude|\\bd ?=|how large)"],"tier":"core"},{"text":"Generalisability — to whom does this actually apply","cues":["generalis|generaliz|applic|transfer|represent|our (population|service)"],"tier":"core"},{"text":"Lands on what the study genuinely allows us to conclude, rather than a list of faults","cues":["(so (we|what)|therefore|allows us to|can conclude|bottom line|overall|on balance|genuinely)"],"tier":"core"},{"text":"Says what would change the conclusion, or what the next study should do","cues":["(would need|next step|to establish|would strengthen|would want)"],"tier":"advanced"},{"text":"Notes something the study does well — appraisal is not prosecution","cues":["(strength|well done|good|credit|to their credit|robust)"],"tier":"advanced"}],"followups":["What are the strengths of this study?","What can you tell us about the effect size?","Something about parametric versus non-parametric data…","How would you measure the quality of the literature?","How would you find out the scientific merit of an RCT for a psychological therapy?","Would you change your practice on the basis of this?","What would you need to see before you did?"],"failure":"Producing an unstructured list of complaints. Every candidate can say 'small sample, no control group'. The distinguishing move is landing on what the study DOES support, and saying what would settle the question.","shape":"Population → recruitment → design → comparator → measurement → blinding → attrition → analysis → effect and precision → generalisability → conclusion. Then one sentence: 'so what this genuinely supports is X, and what it does not support is Y.' Say one thing the study does well before you list the problems."},{"id":"systematic_review","label":"Designing a systematic review","why":"Coventry 2018 asked how you would conduct a systematic review of mindfulness-based interventions for anxiety, then how you would measure the quality of the literature. Glasgow's substance-use vignette also offered a review as one route.","mode":"3min","concepts":["systematic_review","prisma","quality_appraisal","meta_analysis","publication_bias"],"listen":[{"text":"Frames a specific answerable question, ideally with a structure such as PICO","cues":["\\bpico\\b|population|intervention|comparator|outcome|specific question|answerable"],"tier":"core"},{"text":"Protocol written and registered in advance (PROSPERO)","cues":["protocol|prospero|register|pre.?specif|a priori"],"tier":"core"},{"text":"Search strategy: databases, terms, grey literature, reference chaining","cues":["(database|medline|psycinfo|embase|cochrane|search (term|strateg)|grey literature|hand search|reference)"],"tier":"core"},{"text":"Explicit inclusion and exclusion criteria","cues":["(inclusion|exclusion|eligib|criteria)"],"tier":"core"},{"text":"Screening in duplicate with a process for disagreement","cues":["(two|second|dual|independent|duplicate) (reviewer|rater|screen)|kappa|disagree|third reviewer"],"tier":"core"},{"text":"Quality appraisal with a named tool","cues":["(casp|cochrane|rob ?2|grade|jadad|quality (appraisal|assessment)|risk of bias)"],"tier":"core"},{"text":"Synthesis: meta-analysis only if the studies are similar enough; otherwise narrative","cues":["(meta.?analys|narrative synthesis|heterogen|i.?2|pool)"],"tier":"core"},{"text":"Publication bias considered","cues":["publication bias|funnel|file drawer|grey literature|unpublished"],"tier":"advanced"},{"text":"PRISMA reporting and flow diagram","cues":["prisma|flow (diagram|chart)"],"tier":"advanced"}],"followups":["How would you measure the quality of the literature?","What would you do if the studies were too different to pool?","How would you handle unpublished studies?","What if you found only three studies?"],"failure":"Describing a thorough literature review and calling it systematic. The word 'systematic' means reproducible: another researcher following your protocol should reach the same set of papers.","shape":"Question (PICO) → registered protocol → search across named databases plus grey literature → explicit criteria → duplicate screening with disagreement process → quality appraisal with a named tool → synthesis appropriate to heterogeneity → publication bias → PRISMA. One sentence on why each step exists beats naming all nine."},{"id":"model_switch","label":"Formulating with a second, different model","why":"The highest-stakes question in the corpus, and the one candidates report being caught by. Birmingham 2019 asked candidates to name a model, and ONLY THEN told them the second part required formulating with a DIFFERENT one — 'this caught us all out'. Cardiff asks it in both 2012 and 2013. Plymouth and Southampton ask for the theory and its critiques. Your confirmed courses all use clinical vignettes, so assume it.","mode":"3min","concepts":["formulation","cbt_model","systemic","act","circular_causality","hypothesis_testing"],"listen":[{"text":"Names the second model precisely rather than gesturing at it","cues":["(systemic|\\bact\\b|acceptance and commitment|\\bdbt\\b|dialectical|\\bcft\\b|compassion|psychodynamic|narrative|\\bcat\\b|ptmf|attachment)"],"tier":"core"},{"text":"States the model's core explanatory principle before applying it","cues":["(the (idea|principle|premise)|this model (says|holds|proposes)|works on the basis|central to)"],"tier":"core"},{"text":"Applies it to THIS person's material, not in the abstract","cues":["(for (him|her|them|this (person|client|man|woman))|in (his|her|their) case|specifically)"],"tier":"core"},{"text":"Identifies a different maintaining mechanism from the one the first model named","cues":["(maintain|keeps? (it|this) going|perpetuat|cycle|loop|function)"],"tier":"core"},{"text":"Says what the second lens ILLUMINATES that the first missed","cues":["(adds|illuminat|brings|reveals|makes visible|what (this|the systemic|the act) lens|highlights|foreground)"],"tier":"core"},{"text":"Says what the second lens OVERLOOKS or risks losing","cues":["(overlook|miss|lose|risk|limitation|downside|less good at|does not (capture|address))"],"tier":"core"},{"text":"Derives an intervention that FOLLOWS from the formulation, not from preference","cues":["(would follow|therefore|so the intervention|which suggests|leads to|because the formulation)"],"tier":"core"},{"text":"Holds it as a hypothesis, and says how it would be shared and tested with the person","cues":["(hypothes|share|collaborat|test|check (with|out)|together|wonder)"],"tier":"core"},{"text":"Explicitly compares: same person, two accounts, and what governs the choice between them","cues":["(whereas|by contrast|compared (to|with)|the difference|whereas the (cbt|first)|choosing between)"],"tier":"advanced"}],"followups":["Now formulate the same client using a different model.","What does that model illuminate that the first one did not?","What might it overlook?","What intervention would follow from that formulation?","What would make this formulation less plausible?","What would you expect to see if your formulation were correct?","Is there anything else that could have affected this work?","What are the critiques of that theory?"],"failure":"Having only one model with any depth. Candidates give a fluent CBT formulation and then produce a thin systemic or psychodynamic gesture — 'I'd also think about the family' — with no mechanism. The second model must do explanatory work, not decorative work.","shape":"Prepare ONE clinical case you can formulate genuinely from three angles: CBT, one relational/contextual model (systemic is the most examinable), and one third-wave model (ACT). For each: core principle → what maintains the problem on this account → what intervention follows → what this lens adds → what it loses. Then rehearse the Birmingham trap: give your best model first, assuming you will be required to abandon it."},{"id":"clinical_case","label":"A piece of clinical work you have done","why":"Asked at Southampton (2012, 2013, 2015), Plymouth 2013, Cardiff, Birmingham 2018. Usually followed by theory, then critiques of the theory, then what you would do differently. The TIPS document from a successful candidate is emphatic: know your formulation, and know how you built it WITH the client.","mode":"3min","concepts":["formulation","cbt_model","therapeutic_alliance","supervision","reflective_practice","hypothesis_testing"],"listen":[{"text":"Sets the scene economically — who, setting, referral question, in two or three sentences","cues":["(referred|referral|presented|working (in|with)|setting|service)"],"tier":"core"},{"text":"States what YOU did, with your role and level of supervision clear","cues":["(I |my role|under (the )?supervision|supervised by|I was)"],"tier":"core"},{"text":"The formulation is described as shared and provisional — built WITH the person","cues":["(shared|collaborat|together|we (developed|drew|built)|hypothesis|hypothesis(ed|ised)|with (him|her|them))"],"tier":"core"},{"text":"The intervention follows from the hypothesised mechanism, not from the client's preference alone","cues":["(because|followed from|given that|since the formulation|targeted|the mechanism)"],"tier":"core"},{"text":"Names the theory or model underpinning the work","cues":["(cbt|cognitive|behavioural|systemic|act|dbt|psychodynamic|attachment|model|theory)"],"tier":"core"},{"text":"Reports the outcome honestly, including where it did not work","cues":["(did not|didn't|partially|mixed|stuck|no change|less well|struggled)"],"tier":"core"},{"text":"Reflects: what went well, what you would do differently, what you learned","cues":["(reflect|would (do )?differently|learned|in hindsight|looking back)"],"tier":"core"},{"text":"Names how supervision shaped the work","cues":["supervis"],"tier":"core"},{"text":"Can critique the model itself, not just their own delivery of it","cues":["(critique|limitation of (the|this) (model|approach)|criticis|does not account)"],"tier":"advanced"},{"text":"Language is psychological and non-pathologising throughout","cues":["(wonder|hypothes|might|seemed|understandab|made sense|given (his|her|their))"],"tier":"advanced"}],"followups":["What psychological theory is this linked to?","What are the critiques of that theory?","How did you plan the intervention?","Were there any hurdles?","What would you do differently?","Is there anything else that could have affected this work?","You've been seeing this client for some time and are starting to feel stuck. What factors might you consider?"],"failure":"Two failures. First, the intervention justified by preference — 'I used CBT because the client wanted a practical approach' — rather than by mechanism. Second, a case that went perfectly, which reads as either unreflective or untrue.","shape":"Choose a case that did NOT go smoothly. Referral → what you understood was happening and how you built that understanding with them → what followed from it → what happened → what you would change. Use 'we hypothesised', 'we shared', 'collaboratively' — the TIPS document from a successful candidate flags these words specifically. Then be able to critique the model you used, not only your own performance."},{"id":"risk_live","label":"Risk arriving in the room","why":"Birmingham 2018: a client messages you on social media saying they feel suicidal. Exeter 2012: a teenage client's mother rings to say he has disappeared, possibly with an 'irresponsible' uncle, and he is due to see you later. Cardiff: a carer rings about a husband with a stroke who is not eating or drinking. These are graded for process, not for a correct answer.","mode":"3min","concepts":["risk_assessment","suicide_risk","safety_plan","confidentiality","social_media_boundary","escalation"],"listen":[{"text":"Establishes immediate safety first, before anything procedural","cues":["(immediate|right now|first|safety|are they safe|where (are|is) (they|he|she)|now)"],"tier":"core"},{"text":"Asks specifically rather than generally — ideation, intent, plan, means, timeframe","cues":["(intent|plan|means|when|how|thoughts of|specific)"],"tier":"core"},{"text":"Recognises the channel or frame issue and addresses it","cues":["(social media|not (a|the) (right|appropriate|safe) (channel|route|medium)|boundar|frame|not monitored|out of hours)"],"tier":"core"},{"text":"Does not act alone — names supervision, duty, crisis team or the wider system","cues":["(supervis|duty|crisis|team|on.?call|escalat|discuss with|senior|colleague)"],"tier":"core"},{"text":"Considers confidentiality and its limits, and what would be shared with whom","cues":["confidential|share|disclos|need to know|inform"],"tier":"core"},{"text":"Thinks about the person's experience, not only the procedure","cues":["(they must|frightening|distress|how (they|he|she) (feel|might)|desperate|reaching out|what it took)"],"tier":"core"},{"text":"Documents and follows up — including what happens in the next session about the frame","cues":["(document|record|write|next session|follow.?up|revisit|come back to)"],"tier":"core"},{"text":"Distinguishes risk assessment from risk prediction","cues":["(cannot predict|not (a )?prediction|formulat|circumstances (under )?which|when risk)"],"tier":"advanced"},{"text":"Notes what is unknown and what they would need to find out","cues":["(I (would )?(want|need) to know|unknown|unclear|would ask|more information)"],"tier":"advanced"}],"followups":["What if they don't answer the phone?","What if they tell you not to tell anyone?","The client says they will disengage if you contact anyone. What now?","What would you document?","How would this affect the next session?","How would you feel?"],"failure":"Jumping to procedure without the person, or to empathy without the safety. Also: promising confidentiality you cannot keep, or contacting everyone without thinking about the therapeutic cost.","shape":"Immediate safety → specific enquiry → what I can and cannot do through this channel → who I involve and when → what I say about confidentiality → document → what I do with the frame afterwards. Say out loud that risk assessment is not prediction: what you are doing is formulating the circumstances under which risk rises, and planning for those."},{"id":"ethics_clash","label":"A clash of ethics or values","why":"Plymouth 2014 and Southampton 2015 both ask for a time you felt there was a clash of ethical interests. Exeter 2013 gives a graded assisted-suicide scenario with escalating information. South Wales set the witnessed-theft written task. Cardiff asks 'you can help 4 people at 80%, or 8 people at 40% — discuss'.","mode":"3min","concepts":["confidentiality","capacity","safeguarding","escalation","supervision","documentation","positive_risk"],"listen":[{"text":"Identifies WHICH principles are in tension, by name","cues":["(autonomy|beneficen|non.?malefic|justice|confidential|capacity|consent|duty|competing|tension between)"],"tier":"core"},{"text":"Does not collapse the dilemma prematurely into one right answer","cues":["(both|on the one hand|tension|difficult|not (straightforward|simple)|competing|no (easy|clear) answer)"],"tier":"core"},{"text":"Considers the perspectives of each party affected","cues":["(for (the|them|him|her)|from (their|his|her) (point of view|perspective)|the (client|family|colleague|team))"],"tier":"core"},{"text":"Names the relevant framework or legal instrument where one applies","cues":["(bps|hcpc|code of (ethics|conduct)|mental (capacity|health) act|safeguard|policy|law|legal)"],"tier":"core"},{"text":"Takes it to supervision or consultation rather than deciding alone","cues":["supervis|consult|discuss with|senior|team|advice|not (alone|on my own)"],"tier":"core"},{"text":"Arrives at a proportionate action — reflection leads somewhere","cues":["(I would|the action|what I('d| would) do|next step|so I)"],"tier":"core"},{"text":"Documents the reasoning, including options rejected","cues":["(document|record|written|note|rationale|reasoning)"],"tier":"advanced"},{"text":"Acknowledges what remains unresolved or uncomfortable afterwards","cues":["(still|remain|uncomfortab|not (fully )?resolved|sat with|difficult afterwards|would stay with)"],"tier":"advanced"}],"followups":["What did you learn from this situation?","What are the issues for you? For your colleague? For the client?","The client's sister turns up angry and wants to make a complaint about you. What would you do? How would you feel?","What if your supervisor disagreed with you?","What would you do if the service told you not to pursue it?"],"failure":"Resolving the dilemma in the first sentence. If you knew immediately what to do, it was not an ethical dilemma — it was a procedure. The panel wants to see you hold the tension before you act.","shape":"Name the competing principles → say who is affected and how → say what makes it genuinely hard → name the framework and the person I would consult → state the proportionate action → say what remains unresolved. Exeter's version escalates: expect new information designed to destabilise your first answer, and treat revising your position as strength rather than as being caught out."},{"id":"stuck","label":"Feeling stuck, or out of your depth","why":"Birmingham 2018: you've been seeing a client for some time and are starting to feel stuck — what factors might you consider? Coventry 2018: talk about a time you felt out of your depth. Exeter: how do you experience and manage stress.","mode":"3min","concepts":["therapeutic_alliance","rupture_repair","formulation","use_of_self","supervision","context"],"listen":[{"text":"Treats stuckness as information about the work rather than as personal failure","cues":["(information|tells (me|us)|data|meaningful|says something|understand(able)?|not (a )?failure)"],"tier":"core"},{"text":"Revisits the formulation — is the hypothesis wrong, or incomplete","cues":["(formulation|hypothes|re.?formulat|revisit|might have missed|wrong (about|model))"],"tier":"core"},{"text":"Considers the alliance — rupture, unspoken disagreement about goals or tasks","cues":["(alliance|relationship|rupture|goal|task|agreement|unspoken|between us)"],"tier":"core"},{"text":"Considers what is outside the room — the system, the family, material circumstances","cues":["(system|family|context|housing|financ|work|outside|wider|social)"],"tier":"core"},{"text":"Uses their own response as data","cues":["(my (own )?(response|reaction|feeling)|countertransference|what (it|this) evokes|I notice(d)? (in|that) (myself|I))"],"tier":"core"},{"text":"Asks the client directly","cues":["(ask (them|him|her)|raise it|name it|talk about it with|check (with|out) (them|him|her)|be curious with)"],"tier":"core"},{"text":"Takes it to supervision","cues":["supervis"],"tier":"core"},{"text":"Considers that the intervention may be wrong, or the timing, or that the person may not want this now","cues":["(wrong (model|approach|intervention)|different (approach|model)|timing|might not want|readiness|pause|stop)"],"tier":"advanced"}],"followups":["What if the client says everything is fine?","What if supervision does not help?","How would you know when to stop the work?","How did you manage this? What skills did you need?"],"failure":"Listing techniques you would try. Stuckness is rarely solved by a new technique; it is usually a signal about the formulation, the alliance, or something outside the room.","shape":"Stuck is data → check the formulation → check the alliance and ask them directly → look outside the room → use my own reaction → supervision → consider that the model or the timing may be wrong. Notice that the answer moves outward from the technique to the relationship to the system."},{"id":"engagement","label":"Engaging someone who is hard to reach","why":"Southampton 2013: how would you build a relationship with someone who is silent? Cardiff 2013: how would you engage with a service user, and what barriers might you encounter? South Wales: it can be distressing for people to come and see a clinical psychologist — how would you handle other people's distress?","mode":"3min","concepts":["therapeutic_alliance","power_relations","cultural_humility","access_inequality","validation"],"listen":[{"text":"Starts from curiosity about the meaning of the behaviour rather than from technique","cues":["(why|what (might|does) (it|silence|this) mean|curious|wonder|understand(able)?|makes sense)"],"tier":"core"},{"text":"Considers what the person may be protecting themselves from","cues":["(protect|safe|risk|frighten|been (hurt|let down)|previous experience|history)"],"tier":"core"},{"text":"Names the power and institutional context of the encounter","cues":["(power|referred by|not (their|his|her) choice|statutory|institution|who sent|why (they are|he is|she is) here)"],"tier":"core"},{"text":"Adapts the frame — pace, setting, length, medium, who else is present","cues":["(pace|slow|shorter|setting|walk|different room|home|online|someone (else|with)|activity)"],"tier":"core"},{"text":"Considers structural and practical barriers","cues":["(transport|cost|childcare|work|language|interpret|literacy|access|time of day)"],"tier":"core"},{"text":"Tolerates the silence or the non-engagement without filling it anxiously","cues":["(tolerate|sit with|not (rush|fill|push)|space|allow|patience|silence (is|can))"],"tier":"core"},{"text":"Names it directly and collaboratively with the person","cues":["(name it|say (to them|out loud)|check (with|out)|ask (them|him|her) (what|how)|be open about)"],"tier":"advanced"},{"text":"Reflects on their own contribution to the difficulty","cues":["(my (own )?(part|contribution|manner|assumption)|what I (might be|am) doing|am I)"],"tier":"advanced"}],"followups":["What barriers and problems might you encounter?","What if they still do not speak in the third session?","A clinician interprets a patient's disengagement as poor motivation. What alternative explanations would you consider?","How would you make sure I trusted you?"],"failure":"Producing a list of rapport techniques. The strong answer starts from 'what might this silence be doing for them?' and stays there before it moves to what the clinician does.","shape":"What might this mean for them → what are they protecting → what does the institutional context add → what I would change about the frame → what practical barriers exist → what I would name openly → what my own part might be. Cardiff's 2016 phrasing — 'how would you make sure I trusted you?' — is asked BY a carer on the panel, so answer it to them, not about them."},{"id":"formulation_layperson","label":"Explaining a formulation to a lay audience","why":"Coventry 2018's written exercise: after watching a ten-minute therapy session, 'write out a formulation of the client's difficulties that a layman would understand'. This tests whether you can hold psychological precision and plain language at once.","mode":"3min","concepts":["formulation","maintenance_cycle","five_ps","validation","power_relations"],"listen":[{"text":"Uses the person's own words and idiom where possible","cues":["(her words|his words|as (she|he) (put|said|described)|in (their|her|his) (own )?(words|terms))"],"tier":"core"},{"text":"Explains mechanism, not just a list of factors","cues":["(because|which (then|means)|leads to|feeds back|keeps|so that|the more.{0,40}the more)"],"tier":"core"},{"text":"No jargon, or jargon immediately unpacked","cues":["(in other words|that is|which means|what I mean by)"],"tier":"core"},{"text":"Includes what makes sense about the person's response — it is understandable, not irrational","cues":["(makes sense|understandab|given (what|everything)|no wonder|anyone (would|might)|not (irrational|mad|strange))"],"tier":"core"},{"text":"Names a maintaining cycle in ordinary language","cues":["(cycle|loop|vicious|the more.{0,50}the more|keeps (it|this) going|feeds)"],"tier":"core"},{"text":"Includes strengths and what has helped","cues":["(strength|resource|managed|coped|helped|what (works|has worked)|despite)"],"tier":"core"},{"text":"Is offered tentatively as something to check, not delivered as a verdict","cues":["(does that fit|wonder|might|seems|check|tell me if|my sense|would that)"],"tier":"core"},{"text":"Points toward what could change, and why","cues":["(change|different|if (we|you)|might help|way (out|forward)|break the cycle)"],"tier":"advanced"}],"followups":["What do you think the client is feeling or experiencing?","What do you think the therapist is feeling or experiencing?","How would you check this with the client?","What would you do if she disagreed with your formulation?"],"failure":"Translating jargon into simpler jargon. 'Your negative automatic thoughts are maintaining a cycle of avoidance' is not lay language. Also: producing a list of the 5 Ps with no mechanism connecting them.","shape":"Start from what happened to them → what they came to expect or believe → what they do to cope → why that makes complete sense → how it keeps the problem going → what they have that helps → what could change. Then: 'does that fit with how it feels from the inside?' Write it as if reading it aloud to the person."},{"id":"reflective_personal","label":"Reflective and personal questions","why":"Resilience (Exeter 2011, 2012), a challenging experience (Plymouth 2013), criticism you disagreed with (Exeter 2011), a disagreement with a colleague (Cardiff 2016), a 360 appraisal (Coventry 2018), feedback you received (Southampton 2013), how your experiences shaped you (Birmingham 2018, 2019). This is where you are already strong — the risk is generic delivery, not lack of insight.","mode":"3min","concepts":["reflective_practice","use_of_self","supervision","rupture_repair"],"listen":[{"text":"Gives a SPECIFIC episode, not a general disposition","cues":["(there was (a|one)|last (year|month)|I remember|on one occasion|a client|a colleague|specifically|for example)"],"tier":"core"},{"text":"Names the actual feeling, not a professionalised version of it","cues":["(I felt|I was (angry|frightened|ashamed|embarrassed|defensive|hurt|anxious|out of my depth)|it stung|I dreaded)"],"tier":"core"},{"text":"Owns a genuine contribution to the problem","cues":["(my (own )?(part|contribution|fault|mistake|error)|I (had|was) (assumed|missed|avoided|got (it|this) wrong)|I contributed)"],"tier":"core"},{"text":"Names the assumption they were making","cues":["(assum|took for granted|I thought that|my belief|expected)"],"tier":"core"},{"text":"Says what someone else saw that they had not","cues":["(supervisor (said|pointed|noticed)|colleague (said|told)|they saw|pointed out|feedback (was|said)|someone else)"],"tier":"core"},{"text":"Describes a BEHAVIOURAL change, not just an insight","cues":["(since then I|now I|I (started|changed|began|stopped)|I do (it )?differently|next time I)"],"tier":"core"},{"text":"Distinguishes intention from impact","cues":["(intended|meant to|impact|how it landed|came across|effect on (them|her|him))"],"tier":"advanced"},{"text":"Leaves something genuinely unresolved","cues":["(still|not sure|remain|don't (fully )?know|continue to (find|struggle)|ongoing)"],"tier":"advanced"}],"followups":["What did you learn from it?","What would you do now?","What did your supervisor see that you had not?","What if it happened again tomorrow?","Talk about a time your resilience was LOW.","If you received a 360-degree appraisal from your colleagues and supervisor, what would it say?"],"failure":"The polished redemption arc: difficulty, learning, resolution, moral. Panels hear forty of these a day. The second failure is answering the negative version — 'a time your resilience was low', 'what would the appraisal say' — with a disguised strength.","shape":"Specific episode → what I actually felt → what I assumed → what I contributed → what someone else saw → what I did differently afterwards → what is still unresolved. Prepare the NEGATIVE versions deliberately: a time resilience was low, criticism that was fair, what colleagues would say you find difficult. Those are the questions that separate candidates, and they cannot be answered with a strength in disguise."},{"id":"supervision_use","label":"Using supervision","why":"Southampton 2015 asks directly for an example of appropriate use of clinical supervision. South Wales asks the difference between a supervisor and a mentor. Almost every clinical answer should route through supervision at some point.","mode":"3min","concepts":["supervision","reflective_practice","escalation","documentation"],"listen":[{"text":"Brings difficult material rather than a summary of successes","cues":["(difficult|stuck|worried|mistake|uncomfortab|did not know|struggling|got (it )?wrong|uncertain)"],"tier":"core"},{"text":"Names a specific instance, with what they took and why","cues":["(I took|I brought|I raised|I asked (about|whether))"],"tier":"core"},{"text":"Shows supervision changing something","cues":["(changed|different|after that|as a result|shifted|I then|realised)"],"tier":"core"},{"text":"Recognises supervision's normative function — safety and accountability, not only support","cues":["(safe|accountab|responsib|governance|oversight|patient safety|check)"],"tier":"advanced"},{"text":"Distinguishes supervision from line management or from therapy","cues":["(not (line )?management|not therapy|different (from|to)|whereas (a )?(mentor|manager))"],"tier":"advanced"},{"text":"Shows they can disagree with a supervisor and manage it","cues":["(disagree|different view|I thought|challenged|pushed back)"],"tier":"advanced"}],"followups":["What is the difference between having a supervisor and a mentor?","What would you do if you disagreed with your supervisor?","What would you do if supervision was not available?","What makes supervision unsafe?"],"failure":"Describing supervision as a place you report on cases and receive reassurance. The examinable insight is that supervision has a normative function — it is part of how services keep people safe.","shape":"One specific instance of taking something difficult → why I took THAT → what shifted → what I did differently. Have ready: the three functions (normative, formative, restorative), and what you would do if you disagreed with your supervisor."},{"id":"professional_identity","label":"What clinical psychology is for","why":"Cardiff role-plays a psychologist joining a new learning disability MDT and asks what the psychologist brings. Glasgow asks the key skills and knowledge needed. South Wales asks what skills a clinical psychologist needs and how you demonstrate your value. The Clinical Application Tips document is explicit: understand the wider role, not just therapy.","mode":"3min","concepts":["mdt","consultation","team_formulation","leadership","scientist_practitioner","formulation"],"listen":[{"text":"Names contributions beyond direct therapy","cues":["(consultation|supervis|research|evaluation|teaching|training|leadership|service (development|design)|systems|audit|indirect)"],"tier":"core"},{"text":"Puts formulation at the centre as the distinctive contribution","cues":["formulat"],"tier":"core"},{"text":"Names the scientist-practitioner or evidence-appraisal contribution","cues":["(scientist.?practitioner|evidence|appraise|research skills|critical)"],"tier":"core"},{"text":"Avoids constructing a hierarchy over other professions","cues":["(alongside|with colleagues|complement|other professions (also|bring)|not (better|superior)|shared)"],"tier":"core"},{"text":"Acknowledges limits of the profession honestly","cues":["(limit|cannot|not (always|the answer)|risk of|criticis|weakness of)"],"tier":"core"},{"text":"Attends to the psychological process of the team as well as the patient","cues":["(team (dynamic|process|anxiety)|containment|reflective (practice|space)|staff (support|wellbeing)|splitting|parallel)"],"tier":"advanced"},{"text":"Grounds it in a concrete example","cues":["(for example|in my (role|post)|when I|I have)"],"tier":"advanced"}],"followups":["What would the clinical psychologist bring to this team?","How do you demonstrate your value?","What can clinical psychology offer for university students with stress?","How might a clinical psychologist support someone with physical health problems?","What are the limitations in the literature on that?","What is the clinical psychologist's role in integrating care?"],"failure":"Answering as though clinical psychology is individual therapy plus an interest in research. The corpus is full of questions about indirect work, consultation, teams and leadership, and Cardiff's non-1:1 written task makes the point explicitly.","shape":"Formulation as the distinctive contribution → applied to individuals, to teams, and to services → plus evidence appraisal, evaluation, consultation, training, supervision and leadership → held alongside other professions rather than above them → with an honest limit. Ground each claim in one concrete example."},{"id":"leadership","label":"Leadership","why":"Exeter asks in 2011 and 2012 what leadership is and what skills it needs; Coventry 2018 asks which qualities you have and which you would need to work on. The Clinical Application Tips document says flatly: 'Leadership is a huge area on courses! Definitely mention this.'","mode":"3min","concepts":["leadership","service_development","mdt","advocacy","reflective_practice"],"listen":[{"text":"Defines leadership as influence rather than authority","cues":["(influence|without (formal )?authority|not (about )?(being in charge|position|hierarchy|management)|anyone can)"],"tier":"core"},{"text":"Names concrete leadership behaviours","cues":["(advocat|develop(ing)? others|model|set (the )?(tone|standard)|challeng|speak up|convene|shape|hold (a )?vision)"],"tier":"core"},{"text":"Links it to psychological skills specifically — process, containment, formulation of systems","cues":["(process|containment|reflective|systems|formulation|psychological (thinking|mind))"],"tier":"core"},{"text":"Identifies a genuine developmental need in themselves","cues":["(I (would )?(need|struggle|find (it )?(hard|difficult))|less (confident|good)|develop|work on|not (yet )?(strong|comfortable))"],"tier":"core"},{"text":"Gives an example of having influenced something","cues":["(for example|I (led|changed|set up|proposed|persuaded|influenced))"],"tier":"core"},{"text":"Distinguishes leadership from management explicitly","cues":["(management|manager)","(different|whereas|not the same|distinct)"],"tier":"advanced"},{"text":"Acknowledges the risk of psychologists claiming leadership over other professions","cues":["(risk|careful|not (over|above)|other professions|humility|assume)"],"tier":"advanced"}],"followups":["Which of these do you have, and what would you need to work on in training?","Do you want to be a leader?","Have you influenced somebody? Talk about a time you influenced somebody.","What is the difference between leadership and management?"],"failure":"Describing leadership as seniority, or claiming leadership qualities without a single instance of having exercised them. Also: naming a fake development need ('I take on too much').","shape":"Influence rather than authority → the specific behaviours → what psychology contributes that is distinctive (attention to process, containment, formulating systems) → one real example of influencing something → one genuine limitation with what you are doing about it."},{"id":"service_user","label":"Service user and carer involvement","why":"Cardiff foregrounds this more than any other course in the corpus — 2012 and 2013 both have multiple questions, and service users and carers sit on panels at Cardiff, Exeter, Southampton, Glasgow and Coventry, asking their own questions. Expect to be asked BY a service user or carer.","mode":"3min","concepts":["coproduction","service_user_involvement","carers","power_relations","equity_equality"],"listen":[{"text":"Distinguishes involvement from co-production — who holds power over what","cues":["(co.?produc|power|from the (start|beginning|outset)|token|who decides|shar(e|ing) power)"],"tier":"core"},{"text":"Names concrete domains: selection, teaching, service design, research, governance","cues":["(selection|interview|teach|train|curriculum|design|research|governance|recruit)"],"tier":"core"},{"text":"States a genuine difficulty honestly rather than only benefits","cues":["(difficult|challenge|risk|tension|not (always )?easy|cost|burden|tokenis|pay|unpaid)"],"tier":"core"},{"text":"Addresses payment, support and accessibility","cues":["(paid|payment|remunerat|expenses|support|accessib|training for)"],"tier":"advanced"},{"text":"Recognises that involvement changes what is ASKED, not only what is answered","cues":["(question|agenda|what we ask|frame|priorit|different (question|things))"],"tier":"advanced"},{"text":"Attends to whose voices get selected and who is left out","cues":["(whose|which (people|voices)|left out|not represent|articulate|already engaged|seldom heard)"],"tier":"advanced"}],"followups":["What are the benefits and difficulties of having service users involved in services, service design or clinical training?","What are your beliefs and values about service user involvement?","What are the advantages of involving a service user in training?","What can a clinical psychologist do to support a carer?","Who can clinical psychology support more — service users or carers?","How would you show me you respected and valued my viewpoint?"],"failure":"Unqualified enthusiasm. 'It's really important and brings the service user voice' is what everybody says. Naming a real difficulty — tokenism, unpaid labour, selecting for the most articulate — is what distinguishes a considered position from a rehearsed one.","shape":"Involvement sits on a spectrum from consultation to co-production, and the question is always who holds power over the decision → concrete domains → a genuine difficulty → payment and support as the test of whether it is real → whose voices get selected. If a service user or carer asks you, answer TO them."},{"id":"policy_context","label":"Policy, austerity and the NHS","why":"Glasgow 2018 asks about a government policy and its impact; South Wales asks what clinical psychology can do in the face of austerity; Exeter 2012 asks about the Health and Social Care Bill; Cardiff asks how England and Wales differ. Plymouth asked candidates to read the Berwick report in advance. The TIPS document says plainly: read the Guardian.","mode":"3min","concepts":["social_determinants","access_inequality","stepped_care","community_framework","leadership","equity_equality"],"listen":[{"text":"Names a specific policy or document rather than gesturing at 'cuts'","cues":["(long term plan|community mental health framework|talking therapies|iapt|berwick|francis|marmot|social services and well.?being|health and social care|act|strategy|nice)"],"tier":"core"},{"text":"Explains the mechanism by which it reaches clinical work","cues":["(means that|so that|leads to|results in|in practice|on the ground|for clinicians|the effect (is|of))"],"tier":"core"},{"text":"Names who is most affected","cues":["(most affected|deprived|poorest|inequalit|those who|harde
